{# Normalize directory URLs when a static host serves index.html without a redirect. #}
{% extends "base.html" %}

{% block site_meta %}
  {% if page and (not page.url or page.url.endswith("/")) %}
    <script id="uc-directory-url">
      if (!window.location.pathname.endsWith("/") &&
          !window.location.pathname.endsWith("/index.html")) {
        window.history.replaceState(
          window.history.state,
          "",
          window.location.pathname + "/" + window.location.search + window.location.hash
        );
      }
    </script>
  {% endif %}
  {{ super() }}
{% endblock %}
