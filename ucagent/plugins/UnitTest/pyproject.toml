[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucagent-unittest"
version = "0.1.0"
description = "UnitTest chip verification workflow for UCAgent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "XS-MLVP", email = "unitychip@bosc.ac.cn"},
]
dependencies = [
    "UCAgent",
]

[project.entry-points."ucagent.plugins"]
unittest = "unit_test.plugin:get_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unit_test = [
    "workflows/*.yaml",
    "lang/**/*.json",
    "Guide_Doc/*.md",
    "templates/**/*",
    "skills/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]
