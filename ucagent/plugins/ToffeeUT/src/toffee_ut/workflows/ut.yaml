  skill_list:
  - ext/toffee-ut/traceability-and-implementation
  force_use_skill: false
  stage:
  - name: coverage_group_creation
    desc: 按行为族创建功能覆盖组
    task:
    - 在 {OUT}/testbenches/{TB}/coverage.py 或同名包按真实行为建立 CoverGroupDef，说明各组对应要求与观察对象；简单 DUT 不为凑目录创建空组。
    - 目标采用本任务约定，辅助自检组显式 capture=False；已有全局 DUT 覆盖组可以复用，但不能混入模型或设施自检取得的覆盖信用。
    skill_list:
    - ext/toffee-ut/behavior-equivalence
