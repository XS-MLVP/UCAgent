      dut: '{DUT}'
  - name: fixture_integration_gate
    clss: ToffeeUTChecker
    args:
      phase: fixture
      project: '{OUT}'
      dut: '{DUT}'
  skill_list:
  - ext/toffee-ut/package-layout
