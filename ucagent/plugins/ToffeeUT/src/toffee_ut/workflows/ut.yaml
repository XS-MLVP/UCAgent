    - name: implemente_function_checks_in_batch
      desc: 分批检查功能覆盖点
      task:
      - 按 Check 当前批次逐项核对 {DESIGN_SPEC} 中 checkpoints 到 coverage 实现和拟用采样入口的关联，修复缺 ID、缺定义或缺采样代码；不手写完成计数。
      - 本阶段通过只说明代码关联已核对；随后在环境自检和真实用例中检查实际采样、字段比较及完成义务，不能用字符串出现或 .sample 名称替代执行证据。
      reference_files:
      - Guide_Doc/ut-coverage.md
      checker:
      - name: coverage_checks_gate
        clss: ToffeeUTBatchChecker
        args:
          phase: coverage_checks
          project: '{OUT}'
          dut: '{DUT}'
- name: test_environment_implementation
  desc: 事务环境与自检
  task:
  - 按子阶段接通端口、唯一驱动、相关通道采样、根 env fixture 和必要自检；Mock 与人工复核仅在本任务已启用时执行，不自行增加外部系统或迁移工程。
  - 设施自检验证当前交互和比较链，不替代后续 DUT 功能场景；发现合法域或独立答案不明时回补规格，不能按 actual 修改预期。
  skill_list:
  - ext/toffee-ut/package-layout
  force_use_skill: false
  stage:
  - name: human_check_env_specification
    desc: 人工复核环境合同
    task:
    - 仅在本阶段已启用时，依据 {DESIGN_SPEC} 和 {VERIFICATION_SPEC} 向人工专家说明合法域、驱动/采样所有权、独立判据与未决项。
    - 按 Guide_Doc/ut-stages.md 在 {OUT}/docs/reviews/{DUT}-stage-evidence.md 记录 env_spec_review 的实际来源与意见，再等待真实人工批准；不能将自评当作批准。
    reference_files:
    - Guide_Doc/ut-stages.md
    checker:
    - name: env_spec_review_gate
      clss: ToffeeUTChecker
      args:
        phase: env_spec_review
        project: '{OUT}'
        dut: '{DUT}'
    - name: human_approval
      clss: HumanChecker
    skip: true
  - name: bundle_wrapper_design
    desc: Bundle 端口映射和所有权
    task:
    - 针对本次真实导出端口实现 Bundle 的字段、方向、位宽和所有权核对；缺字段、重复驱动或 claim 冲突应报错，不静默补零。
    - 复用已有正确绑定，发现观察不足时回查 {DESIGN_SPEC}；不为满足代码形状复制 shared 实现或擅自扩大导出接口，合法接入被检查拒绝时保留证据并报告。
    skill_list:
    - ext/toffee-ut/package-layout
    - ext/toffee-ut/observation-precision
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: bundle_gate
      clss: ToffeeUTChecker
      args:
        phase: bundle
        project: '{OUT}'
        dut: '{DUT}'
  - name: mock_design_and_implementation
    desc: 上游替身设计与实现
    task:
    - 仅在 Mock 已启用且合同确需外部 producer/consumer 时实现最小替身；在既有环境说明中写清合法编码、许可、历史与责任边界，区分生产可达和端口压力。
    - 不复制整套上游工程，也不将未确认的替身行为作为独立正确答案；资料不足回补规格，后续 Mock 自检再验证其已约定行为。
    skill_list:
    - ext/toffee-ut/legal-stimulus
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: mock_gate
      clss: ToffeeUTChecker
      args:
        phase: mock
        project: '{OUT}'
        dut: '{DUT}'
    skip: true
  - name: mock_fixture_implementation
    desc: 上游替身 fixture
    task:
    - 在 {OUT}/conftest.py 注册当前 Mock fixture，可引用按职责组织的实现；按用例隔离状态，核对初始化、时钟所有权和异常清理。
    - 此阶段只完成装配，不把 fixture 能创建等同 Mock 语义正确；组件行为由后续独立自检核对。
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: mock_fixture_gate
      clss: ToffeeUTChecker
      args:
        phase: mock_fixture
        project: '{OUT}'
        dut: '{DUT}'
    skip: true
  - name: mock_functional_test
    desc: 上游替身自检
    task:
    - 用 @pytest.mark.selftest 和 @pytest.mark.mockcheck 分类真实组件自检；合法控制及预期拒绝的单错误控制均应正确 PASS，不能以 setup error 代替目标检查。
    - 完成逐组件子阶段后核对本轮 Mock 节点及其比较位置，修复替身错误；这些结果不计作 DUT 功能通过，不因组件自检而运行尚未完成的全量场景。
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: mock_tests_gate
      clss: ToffeeUTChecker
      args:
        phase: mock_tests
        project: '{OUT}'
        dut: '{DUT}'
    stage:
    - name: test_mock_components_in_batch
      desc: 逐组件完成 Mock 自检
      task:
      - 按 Check 返回的当前 Mock 组件批次，用 RunToffee(targets=[...]) 执行对应 mockcheck 自检；节点与组件名称保持可追溯，依据真实结果推进。
      - 某组件失败先修该实现或测试，重跑受影响节点；不存在所需组件时报告配置/任务冲突，不制造无关自检或手填进度。
      reference_files:
      - Guide_Doc/ut-stages.md
      checker:
      - name: mock_batch_gate
        clss: ToffeeUTBatchChecker
        args:
          phase: mock_batch
          project: '{OUT}'
          dut: '{DUT}'
      skip: true
    skip: true
  - name: env_fixture_implementation
    desc: 事务环境 fixture 和 checker
    task:
    - 在 {OUT}/conftest.py 注册 env，按当前 testbench 的环境入口装配驱动、监视和独立比较；简单接口按合法求值检查，不强造异步队列或重复生命周期实现。
    - 按合同核对实际接受、首个有效响应、相关通道同沿快照和身份/完成义务；有 Execution 时只保留一个推进者，不额外 Step，也不在收尾时 reset 或补响应清债。
    - 设施实现与采样检查写在现有代码和必要注释中；合法域或 expected 不明确就回补规格，正负自检留到下一子阶段，不声称仅靠文件或类名已证明运行语义。
    skill_list:
    - ext/toffee-ut/checker-and-runtime
    - ext/toffee-ut/independent-oracle
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: environment_gate
      clss: ToffeeUTChecker
      args:
        phase: environment_impl
        project: '{OUT}'
        dut: '{DUT}'
  - name: evaluate_env_fixture
    desc: 环境设施的正负自检
    task:
    - 对关键采样、比较和完成路径编写 @pytest.mark.selftest 与 @pytest.mark.envcheck 自检；合法控制通过，单错误控制在约定检查点被预期识别，自检整体仍应 PASS。
    - 用 RunToffee 定向执行这些节点并核对实际检查位置，保留正文首错和独立清理错误；标记或一个普通 PASS 不能替代正负控制。修设施后重跑相关自检，不给每条功能要求额外生成一套故障实验。
    skill_list:
    - ext/toffee-ut/checker-and-runtime
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: env_selftest_gate
      clss: ToffeeUTChecker
      args:
        phase: env_selftest
        project: '{OUT}'
        dut: '{DUT}'
  - name: human_check_env_implementation
    desc: 人工复核环境实现
    task:
    - 仅在已启用时，向人工专家展示 env 关键代码、实际采样/比较位置及合法和单错误控制原件。
    - 在 {OUT}/docs/reviews/{DUT}-stage-evidence.md 记录 env_review 的当前来源与意见，等待实际批准；专家要求返修时修对应实现和受影响自检，不只补评语。
    reference_files:
    - Guide_Doc/ut-stages.md
    checker:
    - name: env_review_gate
      clss: ToffeeUTChecker
      args:
        phase: env_review
        project: '{OUT}'
        dut: '{DUT}'
    - name: human_approval
      clss: HumanChecker
    skip: true
- name: basic_api_implementation
