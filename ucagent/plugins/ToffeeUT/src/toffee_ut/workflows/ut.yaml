  - RTL、参数或导出接口变化时先请求按既有配方重建，再运行测试；仅有新运行记录不证明旧原生包已更新。不能覆盖已有包或删除历史失败日志来取得通过，构建证据冲突时报告阻塞。
  reference_files:
