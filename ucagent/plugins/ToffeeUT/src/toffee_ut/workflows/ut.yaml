- name: basic_api_functional_test
  desc: 基础事务 API 的 DUT 功能测试
  task:
  - 为已实现事务 API 编写 @pytest.mark.api 的真实 DUT 场景并关联已有 scenario；用 RunToffee 定向执行，核对实际接受、首个合同响应、独立比较和有界收尾。
  - 输入、时序、fixture、API 或判据错误先修复并复验；正确用例暴露设计违约时保留 FAIL，在 {OUT}/docs/bugs/open 按 Guide_Doc/ut-results.md 记录当前 run/nodeid、依据和下一动作。
  - 验收接受 PASS，或满足 Guide_Doc/ut-stages.md 功能失败证据条件的当前 RTL FAIL；后者须有场景对应的 confirmed 要求、当前 open 问题、逐节点有效 WaveInfo 收据与分析及本 DUT 的 native 构建身份，已知空模板不能借问题记录获得实现信用。证据不足或设施错误仍须处理，不能删除 api 标记、改成自检、放宽 expected 或跳过阶段来推进；定向 API 验收不额外要求完整回归或覆盖达标。
  skill_list:
  - ext/toffee-ut/checker-and-runtime
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-environment.md
  - Guide_Doc/ut-results.md
  checker:
  - name: api_tests_gate
    clss: ToffeeUTChecker
    args:
      phase: api_tests
      project: '{OUT}'
      dut: '{DUT}'
- name: create_test_case_templates
  desc: 逐场景用例模板
  task:
  - 根据 {VERIFICATION_SPEC} 为各 active 场景在已登记测试路径建立有意义的入口，关联真实 scenario ID，并描述合法刺激、独立预期和完成条件；已有正确实现只核对关联，不重写。
  - 新的未实现模板保留 assert False, "Not implemented" 以防意外 PASS；本阶段只建模板，后续批量实现再移除占位，不以模板 collection 或占位失败作为 DUT 功能证据。
  - 实现验收不接受只含立即 pytest.fail、assert False 或 raise AssertionError 的空体；注册 native fixture 或把问题改为 unconfirmed 不能替代实际场景实现。合法场景执行后暴露的真实 FAIL 则保留原判定和证据。
  skill_list:
  - ext/toffee-ut/traceability-and-implementation
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-contracts.md
  - '{VERIFICATION_SPEC}'
  checker:
  - name: templates_gate
    clss: ToffeeUTChecker
    args:
      phase: templates
      project: '{OUT}'
      dut: '{DUT}'
- name: comprehensive_verification_and_bug_analysis
  desc: 全面验证与失败归因
  task:
  - 分批子阶段完成后，按全量 active 场景对账；只重新核对新增、删除、变更和受影响场景的合法刺激、独立 expected、真实字段比较和结束义务，不将原生注册或场景标签单独当作检查有效的证明。
  - 执行前核对已有回执的输入、构建、选择范围和 seed；已有当前有效完整签名则复用，不重复全量运行。定向结果占用当前指针时，用明确的归档 run 读取有效证据，不手改签名或 latest.json。原门禁确需新全量时，合批后用 RunToffee() 执行完整选择；按批前全量预期对账变更、退化、未证项及旧失败，保留原始结果。
  - 设施错误返修对应环境、模型或测试并复验；疑似设计失败按 Guide_Doc/ut-results.md 记录当前证据和未决原因，不能提前宣称缺少核验证据的 RTL 根因已确认。
  reference_files:
  - Guide_Doc/ut-results.md
  - '{VERIFICATION_SPEC}'
  checker:
  - name: comprehensive_run_gate
    clss: ToffeeUTChecker
    args:
      phase: comprehensive
      project: '{OUT}'
      dut: '{DUT}'
  skill_list:
  - ext/toffee-ut/triage-and-evidence
  force_use_skill: false
  stage:
  - name: test_case_implementation_in_batch
    desc: 按场景批量实现真实用例
    task:
    - 按 Check 当前 scenario 批次逐项实现合法前态、输入、独立预期、实际比较与完成义务，再移除该用例的未实现占位；不让一个节点的 PASS 替代未执行的结果域。
    - 收齐同类场景，先列受影响节点及全量预期，再用 RunToffee(targets=[...]) 定向执行这批并保留精确 nodeid 和实际结果；新增行为或观察限制只同步受影响的规格和覆盖定义。
    - 目录、源码字符串或自检不能代替本 DUT 执行；全量回归留给父阶段，不为每个批次重复完整仿真，也不手填进度。
    skill_list:
    - ext/toffee-ut/traceability-and-implementation
    - ext/toffee-ut/legal-stimulus
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-results.md
    checker:
    - name: case_batch_gate
      clss: ToffeeUTBatchChecker
      args:
        phase: case_batch
        project: '{OUT}'
        dut: '{DUT}'
- name: refine_test_cases_based_on_functional_points
  desc: 按功能点补充测试
  task:
  - 从 {DESIGN_SPEC} 的要求/checkpoints 与 {VERIFICATION_SPEC} 的场景反查当前节点、合法输入、观察/比较位置及禁止副作用；优先补缺失的必验行为，不因覆盖比例高而停止审查。
  - 代码或受验合同改变时，把同类问题按独立判据合批，定向复验受影响场景；如原门禁要求新的当前完整运行，待批次稳定后一次签发。已有当前有效完整运行或只修审阅时不另跑。
  - 按 Guide_Doc/ut-stages.md 在 {OUT}/docs/reviews/{DUT}-stage-evidence.md 写 refine_tests，关联当前 run、实际来源及哈希，说明断言和完成义务复核；保留仍未验证的项，不用一句“已复核”代替证据。
  skill_list:
  - ext/toffee-ut/traceability-and-implementation
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-results.md
  - Guide_Doc/ut-stages.md
  - '{DESIGN_SPEC}'
  - '{VERIFICATION_SPEC}'
  checker:
  - name: refine_tests_gate
    clss: ToffeeUTChecker
    args:
      phase: refine_tests
      project: '{OUT}'
      dut: '{DUT}'
- name: static_bug_validation
  desc: 静态候选动态验证
  task:
  - 逐项复核 {OUT}/docs/reviews/{DUT}-static-review.md 的候选；核对合法可达性、独立要求和现有原件，只对能区分假设且确有必要的项安排定向实验，不要求全部候选额外全量仿真。
  - unconfirmed 写清缺失证据与下一实验；ruled-out 引用实际反证，out-of-domain 说明依据和承接。声称做过动态实验时给真实 run/nodeid，不能靠换标签或一句评语消除残余。
  - 声称 rtl 根因已确认时，调用 WaveInfo 获取对应真实失败节点的信号窗口，按 Guide_Doc/ut-waveform.md 为候选记录 requirement、run、nodeids 和 waveform_evidence；证据不足不能改标签冒充完成。
  skill_list:
  - ext/toffee-ut/triage-and-evidence
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-static-review.md
  - Guide_Doc/ut-waveform.md
  checker:
  - name: static_validation_gate
    clss: ToffeeUTChecker
    args:
      phase: static_validation
      project: '{OUT}'
      dut: '{DUT}'
- name: line_coverage_analysis_and_improvement
  desc: 原生行覆盖复盘与补缺
  task:
  - 本阶段默认启用；用 CoverageInfo 读取当前有效运行的原生行覆盖与零命中，缺数据报告具体采集阻塞，不自动跳过或写 100%；分支/toggle 分别查看，不能从行覆盖推断它们已验收。
  - 按 Guide_Doc/ut-coverage.md 和 Guide_Doc/ut-stages.md 在 {OUT}/docs/reviews/{DUT}-stage-evidence.md 记录全部已采集metric零点的 uncovered、gap/justified 与独立reason；物理行逐条，branch/toggle可用CoverageInfo的view=groups分页目录给出的显式source-line组。组理由必须适用于每个instance/bit，否则保留gap或拆精确point；多构建逐条写build，不允许遗漏或重叠。
  - 同类缺口合批，先核对合法激励、独立判据与已有回执，再列全量预期（预期命中、不得回零、仍缺证据）。只有精确节点的当前签名定向命中声明的目标点且保住本批受影响的既有点，才可带 coverage_batch 调 RunToffee 签发新全量；没命中先查刺激、观察或判据。纯审阅复用原件；没有可比基线或确实只能全量验证时，说明具体原因请操作者决定，不绕过预检或门禁。
  - 同构建的两份签名全量按原生点双向对账（新增命中与回零分列），对审阅只复核变动和受影响的审阅条目，保留仍适用的未变处置。无法证明影响范围时扩大复核，不沿用失效理由。当轮所有已采集零点仍须通过原审计，不以登记 gap 代替关闭，也不自动要求所有行 100%。
  - 有 StageWork 时，不要被 Checker 报出的第一处缺口卡住。用 CoverageInfo 等查看其他组，先做有独立判据的项目；私有策略等缺规格的项目保持 gap，另记精确问题。对无需新仿真的记录修正也要收尾复查。任务范围内、不依赖该缺口的波形分析和失败归档可先做，后续阶段不得绕过检查提前记为通过。
  - 原生覆盖报出 `coverage_gaps` 且未核对点为 0 只证明审阅已登记。把有合法刺激和独立 expected 的剩余组单列为执行项，明确节点、判据和复核方式；只挂起与缺失规格/权限直接相关的组。已有能区别假设的结果可直接核对，不能仅为了交接把仍有下一步的组并入人等待项。
  skill_list:
  - ext/toffee-ut/closure-and-residuals
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-coverage.md
  checker:
  - name: line_coverage_gate
    clss: ToffeeUTChecker
    args:
      phase: line_coverage
      project: '{OUT}'
      dut: '{DUT}'
- name: generate_random_test_cases
  desc: 有约束的随机场景
  task:
  - 根据 {VERIFICATION_SPEC} 逐场景判断随机是否增加输入、历史或组合空间；在现有 stage-evidence.md 的 random.strategies 使用 tested 或有 reason 的 not-applicable，不为简单可穷举或不适用行为强造随机测试。
  - 适用时用 @pytest.mark.random 分类真实 DUT 节点，通过 RunToffee(seed=...) 定向执行并关联 scenario、nodeid 和当前运行；核对实际 fixture 种子接线，请求值与声明一致仍不单独证明原生采用该 seed。
  - 随机暴露真实 FAIL 时保留原判定和问题记录；满足 Guide_Doc/ut-stages.md 的功能失败证据条件且角色、场景、native 和 seed 均匹配时可作为 tested 验收，不改为 PASS。未确认、缺证据或设施错误仍阻塞，不换绿节点、伪造 tested 或写“不适用”掩盖失败。随机不能代替缺少的独立 expected 或关键定向组合。
  skill_list:
  - ext/toffee-ut/behavior-equivalence
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-coverage.md
  - Guide_Doc/ut-stages.md
  - Guide_Doc/ut-results.md
  - '{VERIFICATION_SPEC}'
  checker:
  - name: random_gate
    clss: ToffeeUTChecker
    args:
      phase: random
      project: '{OUT}'
      dut: '{DUT}'
- name: verification_review_and_summary
  desc: 综合复核与残余
  task:
  - 对当前工件依次调用 UTProject(action="audit", phase="groups")、UTProject(action="audit", phase="checkpoints") 和 UTProject(action="audit", phase="refine")；有输入文档时再核对 line_map，修复后期增删要求造成的引用遗漏，不把早期通过当作当前关系仍正确。
  - 按全量范围对账需求、场景矩阵、实际比较、静态候选、功能覆盖目标和已启用的原生覆盖审阅。未受影响且证据仍有效的条目直接引用，只重新复核变动及受影响项；未确认依据、观察限制、必验 gap 或设施自检失败必须持续披露，登记残余不等于完成硬件验收。
  - 在 {OUT}/docs/reviews/{DUT}-stage-evidence.md 记录 review 的当前 run、实际来源及哈希、观察和下一动作；核对前面复核是否仍对应当前运行，代码未变化且已有有效完整原件时不重复仿真。
  - 若真实缺口与自动汇总结论不一致，保留两侧证据并报告冲突，不能删项、降低目标、修改生成统计或用 Check 通过替代原任务的退出条件。
  skill_list:
  - ext/toffee-ut/closure-and-residuals
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-results.md
  - Guide_Doc/ut-contracts.md
  - Guide_Doc/ut-stages.md
  - '{DESIGN_SPEC}'
  - '{VERIFICATION_SPEC}'
  checker:
  - name: review_gate
    clss: ToffeeUTChecker
    args:
      phase: review
      project: '{OUT}'
      dut: '{DUT}'
- name: record_and_report_bugs
  desc: 缺陷记录和交付
  task:
  - 对账当前有效完整运行与 open/closed 问题，保留历史原义；调用 UTProject(action="summary") 更新 {OUT}/docs/README.md 的生成摘要，不手写 PASS 计数或覆盖结果。
  - 在生成摘要块之外说明本任务的实际验收范围、已知 gap、覆盖是否要求/采集/复核、设施状态及下一步；自动摘要未体现的缺口不能静默消失，也不能把原始 FAIL 改成 PASS。
  - 有证据的 FAIL 或 INCOMPLETE 仅按原任务允许的交付范围如实报告；若要求硬件通过或 RTL 根因确认而尚未达到，明确未达成及阻塞，不以完成报告冒充完成该目标。
  - 有 StageWork 时，交付之后新做的验证也要用本轮回执核对；不得拿旧报告的覆盖审阅证明新全量已复核。交接前分别记录当前回执、可独立完成的修正、需要负责人答复的问题。遇到覆盖复核引用旧回执时先修审阅再交接，不因其他项目缺协议定义而暂停这项工作。
  skill_list:
  - ext/toffee-ut/triage-and-evidence
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-results.md
  - Guide_Doc/ut-waveform.md
  checker:
  - name: final_gate
    clss: ToffeeUTChecker
    args:
      phase: final
      project: '{OUT}'
      dut: '{DUT}'
  output_files:
  - '{OUT}/docs/README.md'
