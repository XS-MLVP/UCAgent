  task:
  - 依据 {DESIGN_SPEC} 和 {VERIFICATION_SPEC} 实现功能覆盖定义与采样接口，保持 checkpoint、场景和覆盖项可追溯；不把定义完整或 bin 命中当作实际比较。
  - 子阶段完成后核对覆盖定义、ID 和采样代码的关联；后续环境和真实用例阶段再核验采样路径确实执行。观察或行为定义不足时回补对应规格，不为本阶段提前宣称运行通过。
  reference_files:
  - Guide_Doc/ut-coverage.md
  checker:
  - name: coverage_integration_gate
