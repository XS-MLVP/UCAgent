      args:
        phase: coverage_groups
        project: '{OUT}'
        dut: '{DUT}'
  - name: coverage_point_implementation
    desc: 功能 bin 与真实采样点
    task:
    - 实现 CoverPointDef/Bin 及必要交叉，在现有规格或 coverage 注释中关联 checkpoint、合法激励、采样相位、有效条件与比较位置；只建立本合同适用的结果域。
    - 核对 goal、命中门槛、weight、ignore 和交叉范围的含义；修订错误覆盖模型须说明依据与影响，不能为获取绿色结果删项或降低目标。
    skill_list:
    - ext/toffee-ut/traceability-and-implementation
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-coverage.md
