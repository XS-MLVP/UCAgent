  task:
  - 在 {OUT}/conftest.py 注册或复用独立答案入口，保证逐用例状态隔离与清理，不要求模型实现全部搬到根文件。
  - 用 @pytest.mark.selftest 与 @pytest.mark.modelcheck 定向验证关键已知样本和区分性控制；自检应 PASS 且不计 DUT 覆盖，普通带标记的 PASS 不能证明 oracle 独立。
