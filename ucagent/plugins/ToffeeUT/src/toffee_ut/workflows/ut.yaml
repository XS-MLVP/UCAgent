output: ut_project
template: null
call_time_out: 3660
manager_tools: [RunToffee]
loop_settings:
  autonomous_stage_work: true
  max_stalled_rounds: 2
runtime_options:
  ut_task: ""
  ut_task_stages: null
  ut_document_mode: auto
  ut_documents: null
  ut_rtl_dirs: null
  ut_dut_package: null
  ut_workers: 1
  ut_timeout: 1200
  ut_reference_model: false
  ut_mock_components: false
  ut_line_coverage: true
  ut_coverage_batch_preflight: true
  ut_human_env_spec_review: false
  ut_human_env_review: false
write_dirs: ['{OUT}']
un_write_dirs: ['{GUIDE_DOC}', inputs, '{DUT}_RTL', .ucagent/toffee_ut.key]
tools:
  ignore_tools: [WorkDiff, WorkCommit, RunBashCommand]
  selected_tools: []
guide_doc:
  enable: true
  core_copy_policy:
    default_action: ignore
    retain: []
    override: []
    ignore: []
  plugin_copy_policy:
    default_action: retain
    retain: []
    ignore: []
skill:
  general_skill_list:
    - ext/toffee-ut/requirements-boundary
    - ext/toffee-ut/observation-precision
    - ext/toffee-ut/behavior-equivalence
    - ext/toffee-ut/traceability-and-implementation
    - ext/toffee-ut/closure-and-residuals
    - ext/toffee-ut/package-layout
    - ext/toffee-ut/legal-stimulus
    - ext/toffee-ut/independent-oracle
    - ext/toffee-ut/checker-and-runtime
    - ext/toffee-ut/triage-and-evidence
    - ext/toffee-ut/verification-completeness
    - ext/toffee-ut/rtl-verification-soundness
    - ext/toffee-ut/ucv4xs-workflow
mission:
  name: '{DUT} Toffee UT'
  prompt:
    system: |
      你负责 {DUT} 的真实 RTL 单元验证。先调用 CurrentTips，按阶段读取参考文件。
      本次任务数据：{UT_TASK}。当前选择范围：{UT_TASK_SCOPE}。明确选择阶段时，只处理本次目标和所选节点；未涉及阶段不是已完成或通过，局部任务结束不表示完整 DUT 验收。
      选择父阶段包含其已启用子阶段；只选择子阶段不执行父阶段汇总检查或无关兄弟任务。缺少必要前提时说明依赖和影响，请用户确认补做或报告阻塞，不暗中扩展范围，也不放松所选阶段的检查。
      工程位于 {OUT}，testbenches/{TB}/ 下按 env、transactions、model、checker、coverage、tests 区分职责；简单职责用单文件，真正跨 DUT 复用时才建 shared。沿用已登记工程的路径、fixture 和构建配方，不为整理目录重写正确实现。
      docs/spec/design 保存设计要求和来源，docs/spec/verification 保存场景、独立判据、完成义务和未证明范围；问题归 docs/bugs/open 或 closed，真实运行归 results。
      当前输入准备路径为 {DOCUMENT_MODE}。有文档时核对版本与缺口，不为符合 RTL 擅改要求；没有文档时从源码与上下游补建候选规格，区分 confirmed/inferred/open。仅从 RTL 推断的结果不能成为独立正确性证明。
      设计阶段定义要求、检查方案和未决项；实现阶段接通环境、判据与采样；执行和复核阶段才核对实际节点及同轮证据。不要提前宣称未执行场景已通过，也不要为前阶段验收另建演示 DUT。
      资料盘点、建骨架、编译、测试和汇总由 UTProject、BuildToffeeDUT、RunToffee 执行，不用 Skill 脚本重复实现。不能用临时测试修改文档或伪造报告。
      按 Guide_Doc/ut-methods.md 选择当前问题的方法；Skill 可用时选用相关方法，不必每轮全读。不可用或被禁用时，直接按本阶段任务与 Guide_Doc 完成相同要求，不停止、不降低验收。Skill 和待审参考不授权扩大任务、改变覆盖目标、启用被跳过阶段或执行升级迁移。
      测试只描述事务场景；优先复用 Toffee 的 Driver、Monitor、Scoreboard 和覆盖能力，明确采样、独立 expected 和结束义务，不把目录完整、bin 命中、退出码 0 当作设计正确。
      覆盖目标按本任务约定执行，不默认要求所有指标 100%；缺口要区分缺要求、缺用例、缺观察或有依据的不适用。不得靠删 bin、降低 goal、缩小交叉或扩大排除范围取得绿色结果；必要修订须说明依据和影响，涉及验收范围变化时请用户确认。
      已实现测试不得保留 assert False 占位或放宽断言掩盖失败。验证设施错误先修复；合法输入下真实设计失败保留 FAIL 并归因。已执行但依据不足可用 uncertain；未运行或不可观察的范围在规格中写明，不能冒充 PASS。
      发现缺口先定位应修的规格、环境、模型或用例；需要返回时先用 Status 确认已到达且未跳过的阶段索引，再用 GoToStage。返回不代表旧结果已自动作废或重验；按变更影响重新审计对应工件。
      增量处理：先以已验签的完整运行为基线，列出新增、删除、修改及受影响依赖（要求、场景、共享设施和证据绑定）。只改、只复查变动和受影响项；未变部分复用仍有效的证据。只改审阅时局部修正条目并核对引用和哈希，不重跑；没有有效基线时不能推定未查项通过。
      同类合批：把能用同一判据核对的改动合批。开跑前在现有阶段日志或待办里写清适用全量数据的预期，分应变项、不得退化项、仍未知项，保留旧失败和未证范围；不只挑容易通过的节点。定向结果只证明受影响子集，未变项对照有效基线，不能拼成新全量。影响范围不能证明或正式门禁需要新完整签名时，合并已稳定的同类改动后再跑一次完整选择。
      证据维护：同一证据引用同一原件，按回执 run、精确 nodeid、波形窗口或来源路径及已有哈希定位。已有结论且依据和适用范围未变时，直接引用，不重复分析或抄录。迭代只维护一份当前审阅和清单，在原条目记录变更、依据与残余，不逐轮另存副本。
      已签发回执、原始波形、失败证据和已交付报告不可覆盖或删除。若更新会使正式绑定、交付或必要复原所引用的版本不可取回，优先引用已有可验证的历史；确无可用历史时，只留一份能按哈希定位的原件。同一内容不在日志、清单和报告间重复归档，正式留存要求不变。
      Python 环境、模型、用例或覆盖定义改变后按批复验受影响测试；RTL、参数或原生构建输入改变时先按既有配方重建。正式 Check/Complete、签名、覆盖目标、人工审批与硬件验收仍按原要求执行；复杂配方没有可用执行入口时交操作者处理。
      失败定位用 WaveInfo 查看真实节点、信号及时间窗口，按 Guide_Doc/ut-waveform.md 引用观察并解释根因；CoverageInfo 查询本轮原生覆盖与缺口。读取工具不自动重跑，不改变时钟或引脚写入方式。
      每阶段按 Check 诊断修复，记录 SetCurrentStageJournal，再用 Complete 推进。有效完整运行可直接复核，不因读了 Skill 或重复 Check 而重跑。工具受限或正确 FAIL 被验收阻塞时保留证据并报告，不跳过或放宽检查。
      最终按原任务区分验证报告交付与硬件验收。FAIL/INCOMPLETE 不因工作流结束而变成 PASS；必验缺口未解决、要求的根因未确认时不得宣称目标已达成，也不能仅登记为残余就自行豁免。
      单 Agent 循环中若有 StageWork 工具，先查现有证据，把同一阶段可独立处理的事分开登记。ready 写实际下一步和完成条件；done 写核对过的回执、波形、覆盖或规格位置；human 只记确实缺少的外部规格、权限或明确决定，说明谁需要给什么、影响哪一项。不要因为其中一项缺资料就停下；先执行其他项，不要只列计划。
      每轮先看 StageWork(show)，用签名证据确定改动和受影响范围，按同类批次推进。已做完的事不重复登记；同一问题没进展就换办法，不能继续原样 Check 或重跑。报告可先写，但退出或交给人之前，用 StageWork(review) 说明核对过哪些范围、还有哪些真要负责人提供输入。此工具不改变 Check、Complete、覆盖目标或报告结论。
      StageWork 的空待办不是验收。只要本轮产生新全量，在 StageWork(review)、退出或交给人之前，都要用 UTProject(action="audit", phase="line_coverage") 核对当前全量对应的原生覆盖审阅（仅限已启用且已到达的原生覆盖阶段）。review_stale、selector_mismatch 或可处理的 review_incomplete 属于验证侧工作，先登记 ready，复用当前签名回执处理变动及受影响条目，再过原审计。按证据维护规则更新当前审阅并保持旧报告可追溯，不为每个 run 复制整份审阅。只改审阅不重跑；仍有真实 gap 时保留原判，把有独立依据的项和确实需要负责人提供依据的项分开。
      StageWork(review) 前不只看已登记的列表：对照当前签名回执的 Checker 诊断、缺口清单和设施首错，沿用仍有效的核对结论，只补新增、变动及遗漏，拆出仍可执行的工作并登记 ready。缺口清单写完可以标清单项 done，不能同时给其中未执行的补测销项。有独立依据的对照与合法激励不等另一条私有规格。驱动、监控、采样相位、判据或工件读锁的问题不是缺 DUT 规格；能用已有证据修正的登记 ready，暂时无法推进且没有具体外部输入的登记 stalled 并换办法（如用已签名波形、缩小窗口、改为串行），不要改成 human。核对已有 human 项时逐项指出必需的外部材料或决定；若新证据表明其实是验证设施问题，把那一项改回可执行，不改其他真实依赖。
      原生覆盖或交付阶段的交接前，按 Guide_Doc/ut-coverage.md 把当前签名全量、原生审阅哈希和逐项依据写入 handoff-inventory.md（文件名带 DUT）。有可做事项应执行而非仅登记；清单与 StageWork 对账，但不改阶段门禁或报告结论。
    tips:
      always:
        - 先查看实际工具结果，再决定下一步；不要凭文件名或历史 PASS 推断当前证据。
      random: []
stage:
- name: requirement_analysis_and_planning
  desc: 验证规划与实际输入盘点
  task:
  - 读取 Guide_Doc/ut-project.md，调用 UTProject(action="inspect") 和 UTProject(action="scaffold")；核对 {OUT}/results/input_inventory.json 中的真实资料、RTL、DUT 映射和工程入口，不覆盖已有文件。
  - 在 {DESIGN_SPEC} 正文明确本次 DUT、参数/版本、责任边界、主要风险、覆盖目标和退出约定；区分要求硬件通过还是允许披露未完成范围的报告交付，未明确的关键条件请用户确认。
  - 本阶段完成输入准备和范围约定，不提前编写全量用例或声称已验证；设计依据、行为分组和场景由后续独立阶段逐步补全。
  skill_list:
  - ext/toffee-ut/requirements-boundary
  - ext/toffee-ut/closure-and-residuals
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-project.md
  - Guide_Doc/ut-contracts.md
  checker:
  - name: requirements_gate
    clss: ToffeeUTChecker
    args:
      phase: requirements
      project: '{OUT}'
      dut: '{DUT}'
  output_files:
  - '{OUT}/results/input_inventory.json'
  - '{DESIGN_SPEC}'
- name: dut_function_understanding
  desc: DUT 功能与端口理解
  task:
  - 对照真实 RTL、适用资料和已有端口说明，在 {DESIGN_SPEC} 的 requirements 中写清行为、合法前提、观察、时序及独立来源；资料不足保持 inferred/open 并注明下一步。
  - 核对时钟/复位、输入输出方向、位宽和上下游责任；没有握手或时钟的 DUT 不虚构对应义务，缺观察字段不能按现有端口改小要求。
  - 此阶段形成可供分组和检查点设计使用的功能理解，不要求已运行 DUT；后续发现来源、合法域或观察不足时回补本规格并同步受影响场景。
  skill_list:
  - ext/toffee-ut/requirements-boundary
  - ext/toffee-ut/observation-precision
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-contracts.md
  - '{DESIGN_SPEC}'
  checker:
  - name: dut_gate
    clss: ToffeeUTChecker
    args:
      phase: dut
      project: '{OUT}'
      dut: '{DUT}'
- name: functional_specification_analysis
  desc: 功能组、检查点与逐行追溯
  task:
  - 按四个子阶段依次完成行为分组、功能定义、检查点方案和来源逐行追溯；统一维护 {DESIGN_SPEC}，不从已有用例反推功能全集，也不在此阶段要求运行结果。
  - 子阶段完成后核对要求、behavior_groups、checkpoints 和适用的来源映射；新增或拆分要求时同步引用，不通过重新合并独立行为来消掉缺项。
  - 无输入文档时不制造逐行映射；有资料但范围或语义不清时保留缺口，不能一律 IGNORE。结构检查通过仍需自行核对每项关联的语义。
  reference_files:
  - Guide_Doc/ut-stages.md
  - '{DESIGN_SPEC}'
  output_files:
  - '{DESIGN_SPEC}'
  checker:
  - name: specification_analysis_gate
    clss: ToffeeUTChecker
    args:
      phase: line_map
      project: '{OUT}'
      dut: '{DUT}'
  skill_list:
  - ext/toffee-ut/requirements-boundary
  force_use_skill: false
  stage:
  - name: dut_function_grouping
    desc: 行为族与来源归属
    task:
    - 在 {DESIGN_SPEC} 的 behavior_groups 中列真实行为族、来源、本层责任及 requirements 引用；覆盖现有要求，未分类来源明确留项，不能用“其他”掩盖遗漏。
    - 本阶段只建立分组与责任，不定义具体激励代码；发现缺要求时先回补 requirements，再调用 Check 核对归属。
    skill_list:
    - ext/toffee-ut/requirements-boundary
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-contracts.md
    checker:
    - name: groups_gate
      clss: ToffeeUTChecker
      args:
        phase: groups
        project: '{OUT}'
        dut: '{DUT}'
  - name: function_point_definition
    desc: 独立要求与可观察功能点
    task:
    - 在 {DESIGN_SPEC} 逐条澄清 requirements 的行为、合法前提、可观察结果、时序和来源；按可独立判定的承诺拆分，端口名或已有 TC 不替代功能定义。
    - 为这些功能点补齐当前 checkpoints 格式所需的初稿；这里只确定拟激励、拟观察与拟比较，下一子阶段再细化检查方案，不提前要求实际采样或运行。
    skill_list:
    - ext/toffee-ut/requirements-boundary
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-contracts.md
    checker:
    - name: points_gate
      clss: ToffeeUTChecker
      args:
        phase: points
        project: '{OUT}'
        dut: '{DUT}'
  - name: check_point_design
    desc: 实际字段、比较器和完成义务
    task:
    - 细化 {DESIGN_SPEC} 中具有唯一 ID 的 checkpoints；为关联要求明确合法刺激、观察字段与有效相位、独立比较规则和必要的完成义务。
    - 将方案与真实端口及独立语义对照；无法观察或尚无独立判据的部分保留未决项，后续在 {VERIFICATION_SPEC} 中安排场景或范围处置，不以设计方案冒充 checked。
    skill_list:
    - ext/toffee-ut/observation-precision
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-contracts.md
    checker:
    - name: checkpoints_gate
      clss: ToffeeUTChecker
      args:
        phase: checkpoints
        project: '{OUT}'
        dut: '{DUT}'
  - name: functional_line_mapping_gap_analysis
    desc: 逐行审阅来源规格
    task:
    - 仅对 {OUT}/results/input_inventory.json 盘点的原始资料建立 {OUT}/docs/spec/verification/{DUT}-line-map.md；按 Guide_Doc/ut-stages.md 的当前格式覆盖非空物理行，每个区间不超过 100 行，功能内容关联 checkpoint，IGNORE 给具体理由。
    - 按 Check 返回的批次读取来源并核对哈希；资料变化先刷新盘点并重审受影响映射，不修改或重排原文以迁就行号。
    - 一行含多个独立承诺时核对它们均已进入要求和检查方案，并在正文说明当前映射的代表关系；物理行有处置不证明所有子承诺都已实现或验证。
    reference_files:
    - Guide_Doc/ut-stages.md
    checker:
    - name: line_map_gate
      clss: ToffeeUTBatchChecker
      args:
        phase: line_map
        project: '{OUT}'
        dut: '{DUT}'
- name: functional_specification_refine
  desc: 边界与等价类细化
  task:
  - 根据 {DESIGN_SPEC} 在 {VERIFICATION_SPEC} 维护 scenarios 和 behavior_matrix；为适用行为补合法边界、历史、响应结果、独立 oracle 与 completion，大空间说明定向或抽样理由，不要求全笛卡尔积。
  - 结构化矩阵使用 planned/gap/na/out-of-domain；planned 是计划而非 PASS，其他状态写清 reason。场景按 active/deferred/out-of-domain 处置，每条要求都要有场景或明确范围承接。
  - 此阶段不填写尚未执行的 pass/fail；实际结果由后续同轮运行和报告给出。独立判据或观察不足时保留 gap，不为追覆盖率扩大非法激励或删掉难验行为。
  skill_list:
  - ext/toffee-ut/behavior-equivalence
  - ext/toffee-ut/independent-oracle
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-contracts.md
  - '{DESIGN_SPEC}'
  - '{VERIFICATION_SPEC}'
  checker:
  - name: refine_gate
    clss: ToffeeUTChecker
    args:
      phase: refine
      project: '{OUT}'
      dut: '{DUT}'
- name: static_bug_analysis
  desc: RTL 静态候选分析
  task:
  - 对照 {DESIGN_SPEC} 按 Check 批次逐个审阅真实 RTL 文件的控制、状态、位宽和时序；在 {OUT}/docs/reviews/{DUT}-static-review.md 记录每份来源哈希、分析和可证伪候选。
  - 候选只说明怀疑、合法触发条件与后续实验，不在本阶段声称动态确认；没有候选时保留真实逐源审阅，不能制造 Bug 或波形占位。
  skill_list:
  - ext/toffee-ut/observation-precision
  force_use_skill: false
  reference_files:
  - Guide_Doc/ut-static-review.md
  - '{DESIGN_SPEC}'
  checker:
  - name: static_gate
    clss: ToffeeUTBatchChecker
    args:
      phase: static
      project: '{OUT}'
      dut: '{DUT}'
  output_files:
  - '{OUT}/docs/reviews/{DUT}-static-review.md'
- name: dut_wrapper_implementation
