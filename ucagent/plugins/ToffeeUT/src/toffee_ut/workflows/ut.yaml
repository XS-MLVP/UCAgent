    desc: 真实原生 DUT 构造器
    task:
    - 核对 {OUT}/dut/{DUT}/__init__.py 的真实导出类、top 与本次 RTL/参数；优先复用当前有效构建，只有本次实际简单 RTL 需要新包时才调用 BuildToffeeDUT。
    - 复杂配方或已有包需要重建但没有可用执行入口时，列明输入变化和所需产物，请操作者处理；不要另造演示工程、覆盖现有包或把结构检查当作 RTL 与原生输出一致的证明。
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: wrapper_gate
      clss: ToffeeUTChecker
      args:
        phase: wrapper
        project: '{OUT}'
        dut: '{DUT}'
  - name: pytest_fixture_dut_implementation
    desc: 真实 DUT fixture 的注册与收尾
    task:
    - 在 {OUT}/conftest.py 保留唯一 fixture 注册入口，可复用已有 fixture 实现；核对真实 DUT 的创建、toffee_register_dut 登记、时钟/复位所有权和正常/异常路径 Finish。
    - 新构造路径将请求 seed 传给原生构造器；沿用既有 fixture 时核对真实接线，不能只记录请求值便宣称原生 seed 已生效。此阶段不提前运行尚未实现的全部场景。
    skill_list:
    - ext/toffee-ut/checker-and-runtime
    force_use_skill: false
    reference_files:
    - Guide_Doc/ut-environment.md
    checker:
    - name: fixture_gate
      clss: ToffeeUTChecker
      args:
        phase: fixture
        project: '{OUT}'
        dut: '{DUT}'
- name: coverage_model_implementation
