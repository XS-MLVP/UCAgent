  - 根据 {VERIFICATION_SPEC} 为后续基础 API 测试确定最小合法事务与独立判据；关闭可选模型阶段也不能取消独立 expected，简单固定答案或性质可以承担该职责。
  - 本阶段实现接口，不运行尚未实现的全部功能模板；发现 producer 或终态合同不清时回补规格，不延长等待或缩小比较范围掩盖问题。
  skill_list:
