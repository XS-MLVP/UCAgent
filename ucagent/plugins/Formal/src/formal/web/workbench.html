<!-- FlowCanvas task shell adapted from its project, conversation and detail panes. -->
<aside class="fc-left" aria-label="任务导航">
  <nav class="activity-bar fc-rail" aria-label="左侧面板">
    <div class="brand-home"></div>
    <div class="project-navigation">
      <button type="button" class="nav-button" data-left="template" aria-label="验证模板" title="验证模板"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg></button>
      <button type="button" class="nav-button" data-left="suggestions" aria-label="LLM 建议" title="LLM 建议"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c0 5-2.5 7.5-7.5 7.5 5 0 7.5 2.5 7.5 7.5 0-5 2.5-7.5 7.5-7.5-5 0-7.5-2.5-7.5-7.5ZM4 16v5m-2.5-2.5h5M20 16v4m-2-2h4"/></svg></button>
      <button type="button" class="nav-button" data-left="files" aria-label="Worktree" title="Worktree 文件树"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Zm0 2h18"/></svg></button>
    </div>
  </nav>
  <section class="pane project-pane fc-left-content" aria-labelledby="fc-project-heading">
    <header class="pane-header project-header fc-project-brand"><span class="project-brand">UC<span class="brand-accent">Agent</span> FlowCanvas</span></header>
    <div class="project-kicker fc-project"><span class="fc-project-mark" aria-hidden="true">◇</span><span data-fc-project-name></span><span class="formal-tag fc-project-tag">Formal</span></div>
    <h2 id="fc-project-heading">验证模板</h2>
    <div class="fc-template">
      <p class="fc-empty">等待工作流写入功能组、功能点和检查点。</p>
    </div>
    <nav class="fc-stage-review-list" aria-label="已运行阶段" hidden></nav>
    <div class="fc-files" hidden></div>
  </section>
</aside>

<aside id="fc-right-pane" class="pane detail-pane fc-right" aria-label="任务状态与工具">
  <div class="fc-right-tabs">
    <div class="detail-page-tabs" role="tablist" aria-label="右侧面板">
      <div class="fc-workflow-tab">
        <button type="button" class="detail-page-tab active" id="fc-tab-workflow" role="tab" aria-controls="fc-panel-workflow" aria-selected="true" aria-describedby="runtime-status-badge">工作流</button>
      </div>
      <button type="button" class="detail-page-tab" id="fc-tab-output" role="tab" aria-controls="fc-panel-output" aria-selected="false" tabindex="-1">输出</button>
      <button type="button" class="detail-page-tab" id="fc-tab-coverage" role="tab" aria-controls="fc-panel-coverage" aria-selected="false" tabindex="-1">覆盖率</button>
    </div>
  </div>
  <div id="fc-panel-workflow" class="fc-workflow" role="tabpanel" aria-labelledby="fc-tab-workflow"></div>
  <div id="fc-panel-output" class="fc-output" role="tabpanel" aria-labelledby="fc-tab-output" hidden></div>
  <section id="fc-panel-coverage" class="fc-coverage" role="tabpanel" aria-labelledby="fc-tab-coverage" hidden>
    <h2>形式化覆盖率</h2>
    <p class="fc-empty"></p>
  </section>
  <details class="fc-tool-dock">
    <summary><span>工具</span><span class="fc-tool-dock-count">UCAgent</span></summary>
  </details>
</aside>

<div class="fc-tool-toolbar">
  <nav class="fc-tool-categories" aria-label="工具类别"></nav>
</div>

<p class="fc-workflow-project"></p>
<span class="center-title fc-center-title">任务概览</span>
<button type="button" class="fc-return-overview" hidden>回到任务概览</button>
<section class="fc-task-overview" aria-labelledby="fc-task-title" hidden>
  <article class="fc-task-sheet">
    <header>
      <h1 id="fc-task-title" tabindex="-1">正在连接任务…</h1>
      <div class="fc-task-meta">
        <span data-task-status role="status"></span>
        <button type="button" data-task-progress hidden></button>
      </div>
      <dl class="fc-task-facts">
        <div><dt>验证模块</dt><dd data-task-module></dd></div>
        <div><dt>Agent 后端</dt><dd data-task-backend></dd></div>
        <div><dt>求解器</dt><dd data-task-solver></dd></div>
        <div><dt>任务累计用时</dt><dd data-task-elapsed></dd></div>
      </dl>
    </header>
    <section class="fc-task-stage" aria-labelledby="fc-current-stage" hidden>
      <p class="fc-kicker" data-stage-number>当前阶段</p>
      <h2 id="fc-current-stage"></h2>
      <div class="fc-task-meta">
        <span data-stage-elapsed></span>
        <span data-stage-last-activity></span>
      </div>
      <h3>本阶段目标</h3>
      <p data-stage-objective></p>
      <button type="button" data-stage-review hidden>查看阶段审阅</button>
    </section>
    <section class="fc-task-section" aria-labelledby="fc-recent-activity">
      <h3 id="fc-recent-activity">最近活动</h3>
      <div data-task-activity></div>
    </section>
    <section class="fc-task-section" aria-labelledby="fc-recent-artifacts">
      <h3 id="fc-recent-artifacts">最近产物</h3>
      <div data-task-artifacts></div>
    </section>
  </article>
</section>
<button type="button" class="icon-button detail-toggle fc-toggle-right" aria-controls="fc-right-pane" aria-label="切换右侧栏" title="切换右侧栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/><path class="sidebar-fill fc-sidebar-fill" d="M15 5h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3Z"/></svg></button>
<div class="fc-quote-tools" hidden>
  <button type="button" class="fc-quote-action">添加到对话</button>
  <form class="fc-quote-editor" role="dialog" aria-label="引用评论" hidden>
    <textarea rows="1" aria-label="添加可选评论" placeholder="添加可选评论…"></textarea>
    <button type="button" aria-label="取消引用" title="取消引用">×</button>
    <button type="submit" class="fc-quote-confirm" aria-label="确认引用" title="确认引用">✓</button>
  </form>
</div>
<div class="fc-chat">
  <div class="fc-chat-split" tabindex="0" role="separator" aria-orientation="horizontal" aria-label="调整已发消息区域高度" aria-controls="fc-sent"></div>
  <details class="fc-history">
    <summary>已发消息 · 0</summary>
    <div id="fc-sent" class="fc-sent" tabindex="0"></div>
  </details>
  <div class="fc-chat-quotes" role="group" aria-label="待发送的引用" hidden>
    <p class="fc-quote-count" role="status" hidden></p>
    <div class="fc-quote-cards"></div>
  </div>
  <template class="fc-chat-quote-template">
    <section class="ai-task-surface ai-task-sent fc-chat-quote" role="group" aria-label="引用原文">
      <div class="ai-task-heading">
        <strong class="ai-task-title">“ 引用原文</strong>
        <span class="ai-task-run-status"></span>
        <button type="button" aria-label="移除引用" title="移除引用">×</button>
      </div>
      <div class="fc-quote-content">
        <p class="ai-task-objective"></p>
        <blockquote class="ai-task-requirements" tabindex="0"></blockquote>
        <p class="fc-quote-comment" hidden></p>
      </div>
    </section>
  </template>
  <div class="composer fc-composer">
    <footer class="composer-footer fc-composer-footer">
      <div class="composer-selectors composer-right fc-composer-actions"></div>
    </footer>
  </div>
</div>

<section id="coverage-task-popover" class="ai-action-dialog ai-task-surface" role="dialog" aria-labelledby="coverage-task-title" popover>
  <header>
    <strong id="coverage-task-title"></strong>
    <button type="button" class="targets-close" aria-label="关闭 AI 任务">×</button>
  </header>
  <form class="targets-dialog-content">
    <p class="ai-task-objective"></p>
    <div class="ai-design-scope"></div>
    <label class="targets-field"><textarea rows="2" maxlength="2000" aria-label="具体要求（可选）"></textarea></label>
    <p class="coverage-task-error" role="status"></p>
    <footer><button type="submit" class="targets-primary ai-task-send">发送 <span aria-hidden="true">↑</span></button></footer>
  </form>
</section>
