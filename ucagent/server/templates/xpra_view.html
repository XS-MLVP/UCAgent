<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Application · UCAgent</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101722;color:#e6edf7}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{min-height:66px;display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid #29374b;background:#151e2b}.identity{flex:1;min-width:0}.brand{font-size:10px;letter-spacing:.16em;color:#91a6c1;margin-bottom:4px}.identity strong{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{display:flex;align-items:center;gap:7px;color:#a7b8d0;font-size:12px;white-space:nowrap}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#e9b766}.status[data-state=connected]:before{background:#62d6ab}.status[data-state=error]:before{background:#ed8994}nav{display:flex;gap:8px;align-items:center}button,select,a.action{font:inherit;font-size:12px;color:#dce7f7;background:#1d2b3e;border:1px solid #34465e;border-radius:6px;padding:8px 12px;text-decoration:none;cursor:pointer}button:hover,select:hover,a.action:hover{border-color:#8dbaff;background:#263950}select{max-width:180px}button:disabled{opacity:.5;cursor:wait}main{position:relative;flex:1;min-height:0;background:#101722}iframe{position:absolute;width:100%;height:100%;border:0}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101722;z-index:2}#overlay[hidden]{display:none}.card{width:min(460px,90vw);padding:32px;text-align:center}.mark{width:42px;height:42px;display:grid;place-items:center;margin:0 auto 22px;border:1px solid #34465e;border-radius:12px;color:#a5caff;font-size:22px}.spinner{display:block;width:20px;height:20px;border:2px solid #34465e;border-top-color:#91beff;border-radius:50%;animation:spin 1s linear infinite}.card h1{font-size:20px;margin:0 0 12px}.card p{color:#a4b5cd;line-height:1.7;white-space:pre-wrap;margin:0}#retry-label{font-size:12px;color:#91beff;margin-top:18px}footer{padding:7px 22px;background:#151e2b;border-top:1px solid #29374b;color:#91a6c1;font-size:11px;display:flex;justify-content:space-between;gap:12px}#hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){header{padding:10px 12px;gap:10px;flex-wrap:wrap}.identity{min-width:45%}nav{width:100%}footer{padding:7px 12px}.status{margin-left:auto}}
#take-back{margin-top:22px;background:#263f60;border-color:#82b8ff}#exit{color:#ffc1c7;border-color:#8b4753;background:#3c2530}#exit:hover{border-color:#ed8994;background:#522d39}
</style>
</head>
<body>
<header><div class="identity"><div class="brand">UCAGENT / APPLICATIONS</div><strong id="title">Opening application</strong></div><span id="status" class="status" data-state="connecting" aria-live="polite">Verifying session</span><nav><select id="windows" aria-label="Application windows" hidden></select><button id="reconnect" type="button">Reconnect</button><button id="fullscreen" type="button">Full screen</button><a id="manager" class="action">Sessions</a><button id="exit" type="button" title="Stop the application and delete this session">Exit</button></nav></header>
<main id="viewport"><iframe id="display" title="Application display" allow="clipboard-read; clipboard-write; fullscreen"></iframe><div id="overlay"><div class="card"><div id="mark" class="mark"><span class="spinner"></span></div><h1 id="heading">Opening your application</h1><p id="message" role="status">Verifying access and connecting to the session…</p><p id="retry-label"></p><button id="take-back" type="button" hidden>Take back</button></div></div></main>
<footer><span id="hint">The application keeps running when you close this page.</span><span>UCAgent Xpra</span></footer>
<script>
"use strict";
const sessionPath=location.pathname.replace(/\/view\/?$/,""),root=sessionPath.replace(/\/sessions\/[^/]+$/,"")+"/";
const frame=document.querySelector("#display"),status=document.querySelector("#status"),overlay=document.querySelector("#overlay");
let generation=0,retries=0,retryTimer=null,connectTimer=null,connecting=false,stopped=false,everConnected=false,checking=false,exiting=false;
document.querySelector("#manager").href=root;
function state(label,kind="connecting"){status.textContent=label;status.dataset.state=kind;}
function notice(title,message,error=false){document.querySelector("#take-back").hidden=true;overlay.hidden=false;document.querySelector("#heading").textContent=title;document.querySelector("#message").textContent=message;document.querySelector("#mark").replaceChildren();if(error)document.querySelector("#mark").textContent="!";else{const spinner=document.createElement("span");spinner.className="spinner";document.querySelector("#mark").append(spinner);}}
function cancelRetry(){clearTimeout(retryTimer);clearTimeout(connectTimer);retryTimer=null;connectTimer=null;document.querySelector("#retry-label").textContent="";}
function unavailable(message,action){stopped=true;connecting=false;generation++;cancelRetry();frame.removeAttribute("src");state("Unavailable","error");notice("Session unavailable",[message,action].filter(Boolean).join("\n"),true);}
async function request(path,options={}){
const response=await fetch(path,{credentials:"same-origin",cache:"no-store",signal:AbortSignal.timeout(10000),...options});
const data=response.status===204?{}:await response.json().catch(()=>({detail:{message:"The service returned an unreadable response."}}));
if(!response.ok){const d=data.detail||{};const error=new Error(d.message||(response.status===401?"Your CMD or Master login is required.":"Cannot reach this session."));error.action=d.next_action||(response.status===401?"Open Sessions and sign in using this service's credentials.":"Check the service, then select Reconnect.");error.status=response.status;error.permanent=[401,403,404].includes(response.status);throw error;}return data;
}
async function session(){const data=await request(sessionPath);if(exiting)return data;document.querySelector("#title").textContent=data.name;document.title=data.name+" · UCAgent";const retention=data.idle_timeout===-1?"Closing this page keeps the application running.":`The application exits after ${data.idle_timeout}s without a connected client.`;document.querySelector("#hint").textContent=(data.mode==="console"?"Click the terminal to type. ":"")+retention;if(data.status!=="running"){const error=new Error(data.last_error?.message||"This session is "+data.status+".");error.action=data.last_error?.next_action||"Return to Sessions to inspect logs or start a new application.";error.permanent=true;throw error;}return data;}
function disconnected(reason,retryable=true,takenOver=false){if(stopped||retryTimer)return;if(takenOver){stopped=true;connecting=false;generation++;cancelRetry();frame.removeAttribute("src");document.querySelector("#windows").hidden=true;state("Taken over","error");notice("Session opened in another client","Another browser or tab now controls this session. Your application is still running. Select Take back to reconnect here and disconnect the other client.",true);document.querySelector("#take-back").hidden=false;return;}if(!retryable){cancelRetry();stopped=true;connecting=false;frame.removeAttribute("src");state("Disconnected","error");notice("Connection closed",reason+"\nReturn to Sessions to inspect the application, or select Reconnect when ready.",true);return;}clearTimeout(connectTimer);connectTimer=null;connecting=false;state("Connection interrupted");notice("Reconnecting to your application",reason||"The connection was interrupted. Your application is still running.");if(retries>=5){state("Disconnected","error");notice("Unable to reconnect","Check the service connection, then select Reconnect. You can also inspect this session in Sessions.",true);return;}const delay=Math.min(1000*2**retries,10000);retries++;document.querySelector("#retry-label").textContent=`Retry ${retries} / 5 in ${delay/1000}s`;retryTimer=setTimeout(()=>{retryTimer=null;open(false);},delay);}
async function open(manual=true){if(connecting||exiting)return;cancelRetry();if(manual)retries=0;stopped=false;connecting=true;const current=++generation;state(everConnected?"Reconnecting":"Verifying session");notice(everConnected?"Reconnecting to your application":"Opening your application","Verifying access and connecting to the session…");try{const data=await session();if(current!==generation)return;await request(sessionPath+"/connect",{method:"POST"});if(current!==generation)return;state("Connecting");frame.dataset.mode=data.mode;connectTimer=setTimeout(()=>disconnected("The display did not respond in time. Retrying the connection…"),30000);frame.src=sessionPath+"/client/display.html?attempt="+current;}catch(error){if(current!==generation)return;connecting=false;if(error.permanent)unavailable(error.message,error.action);else disconnected(error.message);}}
window.addEventListener("message",event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.source!=="ucagent-xpra")return;const data=event.data;if(stopped||Number(data.attempt)!==generation)return;if(data.type==="windows"){const menu=document.querySelector("#windows");menu.replaceChildren();const placeholder=document.createElement("option");placeholder.value="";placeholder.textContent="Windows ("+data.windows.length+")";menu.append(placeholder);for(const win of data.windows){const option=document.createElement("option");option.value=win.id;option.textContent=win.title||"Application window";menu.append(option);}menu.hidden=!data.windows.length;}else if(data.type==="connected"){connecting=false;everConnected=true;retries=0;cancelRetry();overlay.hidden=true;state("Connected","connected");frame.focus();}else if(data.type==="progress"){state("Connecting");document.querySelector("#message").textContent=data.message;}else if(data.type==="closed"){disconnected(data.message,data.retryable!==false,data.takenOver===true);}else if(data.type==="error"){cancelRetry();connecting=false;state("Display unavailable","error");notice("Unable to open the display",data.message,true);}});
document.querySelector("#windows").onchange=event=>{frame.contentWindow.postMessage({source:"ucagent-xpra-view",type:"focus",id:Number(event.target.value)},location.origin);event.target.value="";frame.focus();};
document.querySelector("#reconnect").onclick=()=>{connecting=false;open();};
document.querySelector("#take-back").onclick=()=>open();
document.querySelector("#exit").onclick=async()=>{
if(exiting||!confirm(`Stop the application and delete session “${document.querySelector("#title").textContent}”? This closes it for all connected viewers.`))return;
// Invalidate pending attempts before deleting so late replies cannot reconnect.
exiting=true;stopped=true;connecting=false;generation++;cancelRetry();frame.removeAttribute("src");document.querySelector("#windows").hidden=true;
const button=document.querySelector("#exit"),reconnect=document.querySelector("#reconnect");button.disabled=true;reconnect.disabled=true;button.textContent="Exiting…";state("Closing session");notice("Closing your application","Stopping the application and removing its session…");
try{await request(sessionPath,{method:"DELETE"});location.assign(root);}catch(error){if(error.status===404){location.assign(root);return;}exiting=false;button.disabled=false;reconnect.disabled=false;button.textContent="Exit";state("Exit failed","error");notice("Unable to close the session",[error.message,error.action||"Try Exit again, or return to Sessions to check its status."].join("\n"),true);}
};
document.querySelector("#fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(error){document.querySelector("#hint").textContent="Full screen is unavailable in this browser.";}};
window.addEventListener("online",()=>{if(!stopped&&status.dataset.state!=="connected"){connecting=false;open();}});
setInterval(async()=>{if(document.hidden||stopped||checking)return;checking=true;try{await session();}catch(error){if(!stopped){if(error.permanent)unavailable(error.message,error.action);else if(!connecting)disconnected(error.message);}}finally{checking=false;}},5000);
open();
</script>
</body>
</html>
