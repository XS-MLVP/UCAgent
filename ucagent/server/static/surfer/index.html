<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <title>Surfer</title>

    <script src="deep-link.js"></script>
    <script src="fst-fallback.js"></script>
    <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->
        <script type="module">
        let deepLink;
        try {
            deepLink = window.UCAgentSurferDeepLink.prepareLocation(window.location, window.history);
            await window.UCAgentSurferFstFallback.prepareWaveform(
                window.location,
                window.history,
                {onProgress: window.on_ucagent_wave_progress}
            );
        } catch (error) {
            deepLink = null;
            window.hide_ucagent_wave_progress();
            window.on_surfer_error("UCAgent 波形准备失败：" + error.message);
        }
        if (deepLink) {
            try {
                const surfer = await import('./surfer.js');
                await surfer.default({module_or_path: './surfer_bg.wasm'});
                window.inject_message = surfer.inject_message;
                window.id_of_name = surfer.id_of_name;
                window.draw_text_arrow = surfer.draw_text_arrow;
                await window.UCAgentSurferDeepLink.applyWhenReady(
                    deepLink.payload,
                    {inject_message: surfer.inject_message, id_of_name: surfer.id_of_name}
                );
                window.hide_ucagent_wave_progress();
                /*SURFER_SETUP_HOOKS*/
            } catch (error) {
                window.hide_ucagent_wave_progress();
                window.on_surfer_error(error.message || "波形加载失败或目标信号不可用");
            }
        }
    </script>
    
    <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
    <base href="./" />


    <script>
        let ucagentWaveProgressState = null;
        let ucagentWaveProgressListenerInstalled = false;

        function render_ucagent_wave_progress() {
            const container = document.getElementById("ucagent_wave_progress");
            if (!container || !ucagentWaveProgressState) return;
            const state = ucagentWaveProgressState;
            container.style.display = "block";
            document.getElementById("ucagent_wave_progress_message").textContent = state.message;
            document.getElementById("ucagent_wave_progress_percent").textContent = state.percent + "%";
            const progressBar = document.getElementById("ucagent_wave_progress_bar");
            progressBar.style.width = state.percent + "%";
            progressBar.setAttribute("aria-valuenow", String(state.percent));
        }

        function on_ucagent_wave_progress(state) {
            ucagentWaveProgressState = state;
            render_ucagent_wave_progress();
            if (!document.getElementById("ucagent_wave_progress") && !ucagentWaveProgressListenerInstalled) {
                ucagentWaveProgressListenerInstalled = true;
                window.addEventListener("DOMContentLoaded", render_ucagent_wave_progress, {once: true});
            }
        }

        function hide_ucagent_wave_progress() {
            const container = document.getElementById("ucagent_wave_progress");
            if (container) container.style.display = "none";
        }

        window.on_ucagent_wave_progress = on_ucagent_wave_progress;
        window.hide_ucagent_wave_progress = hide_ucagent_wave_progress;

        function on_surfer_error(msg) {
            console.log("Setting error message")
            document.getElementById("error_message").textContent = msg
            document.getElementById("error_container").style.display = "block"
        }
        window.on_surfer_error = on_surfer_error;
    </script>


    
    
    

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #909090;
        }

        @media (prefers-color-scheme: dark) {
            body {
                /* Dark mode background color for what is not covered by the egui canvas,
                or where the egui canvas is translucent. */
                background: #404040;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error_container {
            padding: 1em;
            border-radius: 0.5em;
            margin: 0px auto;
            max-width: 980px;
            color: #ffffff;
            background-color: black;
            position: relative;
            height: 90%;
            overflow: scroll;
        }

        #error_container a {
            color: #ff9999;
        }

        #error_message {
            overflow: scroll;
            white-space: break-spaces;
        }

        #ucagent_wave_progress {
            display: none;
            position: fixed;
            z-index: 20;
            width: min(520px, calc(100% - 48px));
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 22px;
            border-radius: 8px;
            color: #f0f0f0;
            background: rgba(24, 24, 28, 0.94);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
            font-family: Ubuntu-Light, Helvetica, sans-serif;
        }

        #ucagent_wave_progress_header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 16px;
        }

        #ucagent_wave_progress_track {
            height: 10px;
            overflow: hidden;
            border-radius: 5px;
            background: #4a4a50;
        }

        #ucagent_wave_progress_bar {
            width: 0;
            height: 100%;
            border-radius: 5px;
            background: #65d6a5;
            transition: width 120ms linear;
        }
    </style>
<link rel="modulepreload" href="./surfer.js" crossorigin="anonymous" integrity="sha384-IYc9u4reXVdgjhaLLFA9APJSpAtmPhjb+mJu3o4THV1OKffzqkIi7tl170GNPkME"><link rel="preload" href="./surfer_bg.wasm" crossorigin="anonymous" integrity="sha384-hQs7vZkAoEMkJ1QEXadgWoB5I3TveYJUxyzay32kwunflYABQhkraTq7Wp4tHdJM" as="fetch" type="application/wasm"></head>

<body>
    <!-- The WASM code will resize the canvas dynamically -->
    <!-- the id is hardcoded in main.rs . so, make sure both match. -->
    <canvas id="the_canvas_id"></canvas>

    <div id="ucagent_wave_progress" role="status" aria-live="polite">
        <div id="ucagent_wave_progress_header">
            <span id="ucagent_wave_progress_message">正在准备波形</span>
            <span id="ucagent_wave_progress_percent">0%</span>
        </div>
        <div id="ucagent_wave_progress_track">
            <div id="ucagent_wave_progress_bar" role="progressbar"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
    </div>

    <div id="error_container" style="display: none;">
        <h1>Sorry, Surfer crashed 🔥</h1>
        <p>
            Something caused Surfer to crash. Please report the error on
            <a href="https://gitlab.com/surfer-project/surfer/-/issues/new">
                gitlab
            </a>
        </p>
        <p>
            Any report is appreciated, but it is extra helpful if you can attach the waveform that caused
            the crash and/or the steps to reproduce the crash.
        </p>
        <h3>
            Backtrace:
        </h3>
        <div class="error_container">
            <!-- This is filled in by javascript -->
            <code id="error_message"></code>
        </div>
    </div>

    <!-- Register the message listener system -->
    <script src="integration.js"></script>
    <script>
        register_message_listener()
    </script>

    <!--Register Service Worker. this will cache the wasm / js scripts for offline use (for PWA functionality). -->
    <!-- Force refresh (Ctrl + F5) to load the latest files instead of cached files  -->
    <script>
        // We disable caching during development so that we always view the latest version.
        if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>

</html>
