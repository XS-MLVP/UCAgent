# Adder experience overlay.
# Checked-in DUT overlays may describe verification dimensions, but must not
# contain oracle values, known failures, root causes, or prior-run evidence.
include:
  - general.yaml

# Enable Adder experience extraction only from this overlay.
# Runtime stage 23 -> default.yaml stage[12] create_test_case_templates.
# Runtime stage 24 -> default.yaml stage[13].stage[0] test_case_implementation_in_batch.
# Runtime stage 25 -> default.yaml stage[13] comprehensive_verification_and_bug_analysis.
stage[12].experience-hook: true
stage[13].stage[0].experience-hook: true
stage[13].experience-hook: true
