# IntegerDivider experience overlay.
# Checked-in DUT overlays may describe verification dimensions, but must not
# contain oracle values, known failures, root causes, or prior-run evidence.

include:
  - general.yaml

stage[12].experience-hook: true
stage[13].stage[0].experience-hook: true
stage[13].experience-hook: true

stage[13].stage[0].task: "+模块专属验证维度：依据当前工作区中的规格、接口和权威指令语义，独立推导各运算模式的结果，不得直接使用语言内置运算、已有断言或 DUT 实现作为 oracle。测试应覆盖符号组合、正常与规格定义的特殊输入类别、连续请求和不同结果选择；驱动与采样必须遵循本次接口的握手、忙闲和有效条件。"
stage[13].task: "+分析本模块失败时，先从当前工作区资料独立推导预期，再核对运算模式、输入与输出的位宽及符号解释、reference model、握手等待和采样时机。只有这些验证条件均正确且归一到规格定义的表示后仍稳定不符，才记录为 DUT Bug。"
stage[17].task: "+生成本模块随机或连续场景时，先依据当前工作区规格建立独立 reference model，再覆盖操作模式、输入类别、请求序列与结果选择的组合。每次操作按接口契约完成驱动和采样，断言前按规格统一位宽与符号表示；不得嵌入历史失败向量或固定答案。"

experience:
  candidate_failure_hints+:
    - id: integerdivider_current_spec_result_alignment
      priority: 76
      stages: ["test_case_implementation_in_batch", "comprehensive_verification_and_bug_analysis", "refine_test_cases_based_on_functional_points", "random_test_generation_and_execution"]
      match_scope: ["focused", "full"]
      checkers:
        - "UnityChipCheckerBatchTestsImplementation"
        - "UnityChipCheckerTestCase"
        - "RandomTestCasesChecker"
      regex:
        - "(?i)(?:div|quotient|remainder|商|余数).*(?:mismatch|failed|error|不一致)|(?:mismatch|failed|error|不一致).*(?:div|quotient|remainder|商|余数)"
      hint: "这类运算结果失败应先依据当前工作区规格独立推导本次输入的预期，再核对操作模式、位宽、符号解释、握手和采样时机；不得直接采用语言内置运算、已有 expected 或 DUT 结果作为 oracle。"
