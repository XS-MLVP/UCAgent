include:
  - general.yaml

stage[12].experience-hook: true
stage[13].stage[0].experience-hook: true
stage[13].experience-hook: true

experience:
  candidate_failure_hints+:
    - id: alu754_ieee_special_values_and_encoding
      priority: 74
      stages: ["test_case_implementation_in_batch", "comprehensive_verification_and_bug_analysis", "refine_test_cases_based_on_functional_points", "static_bug_validation"]
      match_scope: ["focused", "full"]
      checkers:
        - "UnityChipCheckerBatchTestsImplementation"
        - "UnityChipCheckerTestCase"
        - "UnityChipCheckerStaticBugValidation"
      patterns:
        - "FG-MUL/FC-MUL-SPECIAL"
        - "FG-MUL/FC-MUL-OVERFLOW"
        - "FG-ADD/FC-ADD-SPECIAL"
        - "FG-ADD/FC-ADD-OVERFLOW"
      hint: "ALU754 的特殊值或溢出用例失败时，先按 IEEE-754 语义建立独立的位级 reference，并分别核对结果编码与状态标志。不要因某个 flag 符合预期就放宽 result 断言，也不要为通过当前用例反向修改 expected；只有 reference、采样时机和输入分类均已校准后仍稳定失败，才记录为 DUT bug。"
      source:
        kind: log_reviewed
        evidence:
          - "ALU754 日志中，特殊值和溢出类失败同时涉及结果编码与状态标志，不能只检查其中一项。"
