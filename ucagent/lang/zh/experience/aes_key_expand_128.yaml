# AES key expansion experience overlay.
# Checked-in DUT overlays may describe verification dimensions, but must not
# contain oracle values, known failures, root causes, or prior-run evidence.
include:
  - general.yaml

stage[12].experience-hook: true
stage[13].stage[0].experience-hook: true
stage[13].experience-hook: true

stage[13].stage[0].task: "+模块专属验证维度：依据当前工作区中的规格、接口与实现，独立推导密钥扩展各操作模式的输入输出关系、状态推进、数据排列和可观察时机。reference model 必须独立实现规范语义，不得复用 DUT 实现、已有断言、历史运行结论或固定答案；测试应覆盖单步、连续操作、边界输入以及控制状态转换。"
stage[13].task: "+分析本模块失败时，逐项核对当前工作区规格、独立 reference model、输入编码、状态推进、采样时机和 FG/FC/CK 归属。只有测试预期可从本次输入资料独立推导，且验证基础设施正确后仍稳定违反规格，才记录为 DUT Bug。"

experience:
  candidate_failure_hints+:
    - id: aes_current_spec_state_alignment
      priority: 76
      stages: ["test_case_implementation_in_batch", "comprehensive_verification_and_bug_analysis", "refine_test_cases_based_on_functional_points"]
      match_scope: ["focused", "full"]
      checkers:
        - "UnityChipCheckerTestCase"
        - "UnityChipCheckerBatchTestsImplementation"
      regex:
        - "(?i)(?:round|key.?expan|state).*(?:mismatch|failed|error)|(?:mismatch|failed|error).*(?:round|key.?expan|state)"
      hint: "这类状态或轮次相关失败应先依据当前工作区规格独立列出输入、状态推进和观察时机，再让 reference model 与同一事务序列对齐；不得复用已有 expected、历史结论或 DUT 实现来消除差异。"
