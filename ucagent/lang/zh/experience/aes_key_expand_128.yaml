include:
  - general.yaml

stage[12].experience-hook: true
stage[13].stage[0].experience-hook: true
stage[13].experience-hook: true

stage[13].stage[0].task: "+可参考经验：本阶段优先校准 mark_function 的 FG/FC/CK 归属关系，再判断 DUT 缺陷。若出现 `Invalid key ...`、`No bin matched for pattern ...` 或 coverage 相关异常，先对照 functions_and_checks.md 与 coverage_def 核对当前测试所挂的 FG/FC/CK 是否属于同一层级和同一功能点，不要在映射未对齐时就把失败写进 bug_analysis。若 checker 报 `remaining tests`，先完成当前批次列出的测试和必要 helper，再回头处理真实失败。"
stage[13].task: "+可参考经验：综合验证与缺陷分析阶段，先把当前 failed pytest nodeid 分成两类：测试/API/env/coverage 映射问题，以及真实 DUT 失败。像 env.Step 返回值假设错误、轮密钥期望轮次写错、mark_function 归属错误这类先修测试或映射，不要直接记为 DUT bug；只有在测试实现、reference model 和 coverage 映射都校准后仍稳定失败的用例，才写入 bug_analysis 对应 CK/BG。"

experience:
  candidate_failure_hints+:
    - id: aes_round_state_reference_timing
      priority: 66
      stages: ["test_case_implementation_in_batch", "comprehensive_verification_and_bug_analysis", "refine_test_cases_based_on_functional_points"]
      checkers:
        - "UnityChipCheckerTestCase"
        - "UnityChipCheckerBatchTestsImplementation"
      patterns:
        - "FG-API/FC-READ-ROUNDS"
        - "FG-EXPAND/FC-MULTI-ROUND"
      hint: "当轮次读回或多轮扩展测试出现稳定的输出错位时，先确认 load/expand/step 后实际读到的是哪个时钟边沿更新的寄存器状态，并让 reference model 模拟同样的时钟推进、非阻塞寄存器更新和轮次计数；先修正读回时机或模型状态对齐，再判断 DUT 算法缺陷，不要只为消除当前差异改 RTL 或硬编码期望轮次。"
      source:
        kind: log_reviewed
        evidence:
          - "AES 日志中多个轮次和输出读回用例呈现一致状态错位；按 RTL 时钟边沿和寄存器更新语义调整参考模型后，相关字节序验证用例通过。"
