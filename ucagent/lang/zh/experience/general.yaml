    - id: template_tests_must_fail_not_implemented
      priority: 38
      stages: ["21"]
      checkers:
        - "UnityChipCheckerTestTemplate"
      patterns:
        - "Template functions should contain 'Not implemented' messages"
        - "Test templates must include 'assert False, \"Not implemented\"'"
        - "Not all test functions"
        - "are properly failing"
      regex:
        - "Template functions should contain '+Not implemented'+ messages"
        - "Test templates must include '+assert False, \"Not implemented\"'+"
      hint: "checker 报告命中测试模板缺少 Not implemented 失败语义时，先把当前阶段当作模板创建阶段，而不是 DUT/API/mock 调试阶段。先区分报告点名的 pytest test_* 函数是真正待实现的模板，还是历史遗留的 fixture/API 自检：真正模板保留/补语义正确且已定义的 mark_function，主体只写 TODO/步骤注释，并以 assert False, \"Not implemented\" 结束；不应参与模板阶段的内部 fixture 自检，应改为非 test_ helper 名称或移出 pytest 发现范围，不要为保留其通过状态而伪造 mark_function，也不要创建 coverage_def 中不存在的 FG/FC/CK。checker 明确豁免的 API 测试可以保留，但进入后续测试阶段前仍须拥有语义正确、真实存在的 mark_function。不要实现真实断言、不要访问真实 DUT，也不要在本阶段修 mock/xsp/fixture/getEvent/TEST_get_u64_step_func。修完后立即 Check/Complete。"
      source:
        kind: log_reviewed
        evidence:
          - "模板阶段中，已通过的 fixture 自检同时违反模板失败语义和 checkpoint 标记要求；将其从 test_* 重命名为 fixture_* 后，后续批量实现阶段的未标记测试数变为 0。"
          - "已通过的环境自检被 pytest/checker 当作功能测试后，改为明确的 fixture/check helper 并移出功能测试发现范围，未标记测试数归零。"

    - id: unmarked_test_functions
      priority: 40
      stages: ["20", "21", "22", "23", "24", "27"]
      checkers:
        - "UnityChipCheckerDutApiTest"
        - "UnityChipCheckerTestTemplate"
        - "UnityChipCheckerBatchTestsImplementation"

        - "UnityChipCheckerTestCase"

      patterns:

        - "[Unmarked Test Functions]"

        - "not associated with any checkpoint"

        - "without correct check point marks"

      regex:

        - "test_function_with_no_check_point_mark: [1-9][0-9]*"

      hint: "checker 报告命中 Unmarked Test Functions 时，逐个处理报告点名的 test_* 函数：若是有效测试，在函数开头用 env.dut.fc_cover['FG'].mark_function('FC', test_func, ['CK']) 关联当前文档中存在且语义匹配的 CK；其中 test_func 必须传当前函数的可调用对象，普通函数传 test_xxx，类方法传 self.test_xxx，不要传字符串或 self.test_xxx.__name__。若只是 helper/env/调试函数，改成非 test_ 名称。不要给无关测试硬塞 CK。"



