# SD TX FIFO experience overlay.
# Checked-in DUT overlays may describe verification dimensions, but must not
# contain oracle values, known failures, root causes, or prior-run evidence.
include:
  - general.yaml

stage[12].experience-hook: true
stage[13].stage[0].experience-hook: true
stage[13].experience-hook: true

stage[13].stage[0].task: "+模块专属验证维度：依据当前工作区中的规格、接口和 RTL，独立推导队列顺序、容量边界、读写接受条件、状态量和数据可观察时机。reference model 应按实际被接口接受的事务逐步更新，并覆盖空满转换、指针环绕、连续及并发读写；不得复制 DUT 表达式、已有断言、历史失败序列或固定答案。"
stage[13].task: "+分析本模块失败时，先从当前工作区资料独立推导预期，再逐拍核对实际接受的读写事务、参考队列状态、边界条件、驱动顺序和采样边沿。接口对数据与状态的观察语义必须由本次规格和实现证据确认；只有验证链路正确后仍稳定违反规格，才记录为 DUT Bug。"
stage[15].task: "+验证本模块静态候选时，依据当前工作区规格设计最小动态测试，并记录每拍输入、握手、参考状态和观察时机。预期必须由独立模型推导；只有动态结果在相同事务与采样语义下稳定违反规格，才建立动态 Bug 链接。"

experience:
  candidate_failure_hints+:
    - id: sd_tx_fifo_current_contract_queue_alignment
      priority: 76
      stages: ["test_case_implementation_in_batch", "comprehensive_verification_and_bug_analysis", "refine_test_cases_based_on_functional_points", "static_bug_validation", "verification_review_and_summary"]
      match_scope: ["focused", "full"]
      checkers:
        - "UnityChipCheckerBatchTestsImplementation"
        - "UnityChipCheckerTestCase"
        - "UnityChipCheckerStaticBugValidation"
      regex:
        - "(?i)(?:fifo|queue|empty|full|occupancy|读|写).*(?:mismatch|failed|error|timeout|不一致)|(?:mismatch|failed|error|timeout|不一致).*(?:fifo|queue|empty|full|occupancy|读|写)"
      hint: "这类队列数据或状态失败应先依据当前工作区接口契约独立维护参考事务序列，并按实际被接受的读写操作逐拍核对状态和观察时机；不得复制 DUT 表达式、已有 expected 或历史序列来判断正确性。"
