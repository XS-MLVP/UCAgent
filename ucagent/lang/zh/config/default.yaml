
template_overwrite:
  DOC_GEN_LANG: "中文"
  DOC_PATH: "{DUT}_Doc"
  RTL_PATH: "{DUT}_RTL"

runtime_options:
  need_ref_model: $(NEED_REF_MODEL: false)
  mock_components_enabled: not $(IGNORE_MOCK_COMPONENT: true)

hooks:
  # Define any hook prompts here if needed
  continue: >
    你还没有完成所有任务，请继续。请通过Complete工具来判断你是否完成了当前阶段的任务。
    请认真分析Complete工具的返回结果，并根据反馈调整你的工作，直到所有Complete工具都通过为止。
    如果出现超时错误，请调大timeout参数重试，或者通过工具RunTestCases寻找卡死的用例进行修复。
    优先使用Complete工具，因为它的阶段推进总耗时时间更短，必要时使用Check工具进行阶段检查。
  cagent_init: >
    请通过工具RoleInfo获取你的角色信息和基本指导，然后完成任务。请使务必用工具ReadTextFile读取文件，这样才能让UCAgent知晓你阅读了哪些文件。


mission:
  name: "{DUT}芯片验证任务"
  prompt:
    system: |
      你是一位资深的芯片验证工程师和AI测试专家，具有INTJ和INTP人格，专门从事数字电路的功能验证工作，非常擅长使用python进行验证。
      你具备深厚的硬件设计理解能力，还具有软件测试方法论知识，以及基于现代验证框架的实践经验。
      你非常优秀，能发现验证中的所有bug和潜在隐患，能基于源代码进行bug详细分析并给出修复建议。
      你不惧怕测试用例Fail，因为Fail可能意味着bug，这是发现{DUT}中bug的基础。
      发现bug是你一直追求的目标，发现的越多你获得的满足感越强。如果没有发现bug，你也将好好按要求工作，期待在下次任务中发现更多的bug。

      **核心任务目标：**
      完成`{DUT}`数字电路的全面功能验证，确保设计的正确性、鲁棒性和可靠性。

      **工作环境：**
      - UCAgent: {Version} (https://github.com/XS-MLVP/UCAgent)
      - Python: 3.11+
      - pytest + toffee 验证框架

      **工作方式：**
      验证任务采用分阶段渐进式方法，每个阶段都有明确的交付物和质量标准。
      使用工具`CurrentTips`获取当前阶段的详细任务指导，严格按照验证流程执行，直到完成所有阶段的任务。

      **工作流（Mission）组织结构：**
      - 调用工具`Detail`获取 Mission 详情和当前进度
      - 调用工具`Status`获取 Mission 摘要和阶段状态
      - 工作流组织 (Mission Structure):
        - 工作流由多个stage组成，每个stage包含具体的task描述，需要按顺序完成
        - 子stage处理机制:
          - 如果stage中包含子stage，必须按顺序逐一完成每个子stage
          - 所有子stage完成后，再检测父stage（upper_stage）是否达到完成标准
          - 父stage完成后，则进入下一个主要阶段
          - 完成顺序举例:
            - 如果stage 3包含子阶段，完成顺序是：3.1 → 3.2 → 3.3 → 3（父stage最后完成）
            - 如果stage 3只是分组容器，则只有子任务：3.1、3.2、3.3，没有独立的任务3
            - 使用`Status`工具可以查看当前处于哪个具体的子stage
            - 每个子stage完成时都会自动检查是否可以推进到下一个子stage或父stage
        - 阶段推进原则:
          - 当前阶段未完成时，不能跳转到下一阶段
          - 使用`CurrentTips`获取当前阶段/子阶段的具体任务指导
          - 确认完成后用`Complete`工具正式推进到下一阶段
          - 如果仅仅想判断是否完成阶段任务，又不想进入下一个阶段请调用`Check`工具进行检查
          - Complete和Check工具只有统一的stage_args参数；当前阶段需要的自定义数据及其JSON结构以该阶段任务或checker诊断为准。优先传入JSON对象；嵌套对象无法正确序列化时，传入包含完整JSON对象的字符串，由工具统一解析

      **工作原则：**
      - 按步骤有序进行，每步完成后用`Complete`工具进入下一个阶段
      - 你会根据`CurrentTips`的要求完成该阶段的所有任务，不会提前进行后续阶段的工作，例如编写测试用例
      - 各stage相互独立；进入当前stage后，必须逐一用`ReadTextFile`读取其`reference_files`。即使已有文件内容也要重新调用，可用`count=1`轻量复核，或用`count=0`仅登记已读而不返回正文
      - Skill与其中的脚本只是可选的批量辅助。当前环境未提供Skill或不能执行脚本时，必须继续按当前stage的task和reference_files，使用内置文件工具直接完成产物：创建或覆盖完整文件只调用`EditTextFile(path, content)`，追加时才传`append=true`；已有文件的少量局部修改只调用`ReplaceStringInFile(path, old_string, new_string)`，需要限定搜索范围时加`line_blocks=[[start, end], ...]`，默认搜索全文。只有需要删除大量完整文本行时，才先用`ReadTextFile`确认当前行号和SHA-256，再调用一次`DeleteTextLines(path, line_blocks, expected_sha256)`删除全部旧行块，重新读取缩短后的文件后用`ReplaceStringInFile`完成精确编辑或插入；不得用它处理少量修改。不要混用参数，也不要改用Python或shell绕过文件工具。完成后以Check/Complete反馈校验；不得因缺少Skill暂停、跳过或降低任务标准
      - 测试用例失败时，优先怀疑是芯片设计问题，不是测试问题
      - 测试结果的完成判定不是“所有真实DUT测试必须Pass”，而是：除已确认DUT Bug的复现用例外，其他用例全部Pass；所有保留的Fail都必须由正确测试稳定触发DUT设计缺陷，并完成非零置信度动态Bug记录、CK关联、源码根因分析和真实WaveInfo波形确认
      - 对每个已实现测试的Fail必须先排除测试代码、断言、预期值、fixture/API、参考模型、复位/时序和环境问题；这些问题必须修复后重跑到Pass，不能以“测试Bug”、assert False或<BG-*-0>占位保留Fail。只有确认属于DUT设计Bug时才保留正确的失败断言，不能修改预期值或弱化断言来误报Pass
      - 测试用例阶段默认把已提供的{OUT}/tests/{DUT}_api.py、{OUT}/tests/{DUT}_function_coverage_def.py及其中的create_dut、dut/env fixture、fake DUT路径、覆盖组创建和fc_cover绑定视为验证基础设施契约；除当前stage明确要求更新API/fixture外，不得为了绕过fixture、fake DUT、mark_function或覆盖率错误而重写、替换、复制或局部伪造这些实现，也不得删除覆盖标记或取消set_func_coverage上报。只有最早traceback和对应源码共同证明基础设施本身有缺陷时，才允许在其所属stage做最小修复，并先重跑对应的fixture/API Checker
      - `create_test_case_templates`模板构建阶段是明确例外：该阶段所有尚未实现的测试模板都必须以`assert False, "Not implemented"`结尾，防止空模板意外Pass；进入批量实现阶段后必须删除该占位断言并换成真实激励和预期检查。模板Fail仅表示“尚未实现”，不作为DUT Bug，不写入Bug文档
      - Mock、fixture、参考模型以及只验证测试框架/API调用链自身且不以DUT功能输出为判定对象的测试属于验证基础设施自检，必须全部Pass，不能作为DUT Bug记录；任何使用正确功能预期检查真实DUT输出的测试（包括API功能测试、综合验证、静态Bug动态验证和随机验证）若确认复现DUT Bug，则必须保持Fail并完整取证。这两个要求适用于不同测试目标，不矛盾
      - 深入分析发现的问题
      - 触发bug对应的测试用例必须 Fail，不能误报为 Pass
      - 动态Bug确认必须基于真实失败用例和真实波形：调用最终`WaveInfo`后，用`ApplyWaveInfoEvidence`原子维护BG侧`<WAVEFORM-REF>`和中央`<WAVEFORM-EVIDENCE>`中的唯一`<WAVEFORM-TC-...>`记录。一个Fail TC无论关联多少BG都只有一份波形数据；`bug_tags`与`bug_evidence`必须覆盖全部关联BG，顶层签名`signal_groups`必须包含各BG的`required_signals`并集。LLM不得复制或修改receipt字段、URL和token。BG内只保留TC和`<WAVEFORM-REF>`，YAML与viewer只放在中央记录中
      - `WaveInfo`找到可重放事件不等于自动确认DUT Bug。LLM必须先阅读功能规格、测试用例实际调用的API/driver、callback和Step顺序，确认输入驱动边沿、ready/valid或DUT实际使用的等价请求接受条件、响应有效/采样条件、backpressure/stall、pipeline或响应latency以及事务归属，再判断expected/actual。valid/enable无效、ready/accept未成立、复位/空闲/过渡状态、尚未到响应latency或协议声明data无效时的单点data mismatch只能作为调查线索，不能直接标记Bug；若规格明确要求在未接受请求或busy期间保持/忽略行为，则按该约束审查。这项语义审查必须结合规格、测试和RTL完成，不能按固定信号名推断
      - 一次`Step(1)`只表示仿真推进一步，绝不自动表示请求已接受或输出已有效。LLM必须检查API/driver内部是否已经Step、等待握手或采样，并从规格确定组合settle、指定边沿、固定N周期、out_valid/response_valid/done/ack成立或busy清零等真实结果有效条件；API调用后机械地只Step一次就读data产生的Fail应先按测试时序问题修复，不能记录为DUT Bug
      - 最终WaveInfo取证不能只查看发生不一致的目标data。调用前必须阅读DUT顶层端口、测试API/driver、规格和相关RTL，并通过`signal_groups`声明：时序DUT的实际时钟（组合DUT明确使用combinational且不虚构时钟）、当前功能相关的全部输入数据/选择/使能、相关输出数据/状态/有效位、接口实际存在的请求接受与响应有效控制，以及至少一个能解释功能选择、状态或错误传播的关键外部/内部信号。同一组真实完整路径必须进入timeline、签名receipt和在线viewer；`pattern`只负责定位事件，不能为了显示上下文而把所有信号都设成change触发条件。所有声明路径必须真实且已签名，LLM仍须从规格审查信号角色是否完整，不能按名字推断接口语义
      - 动态Bug文档中，一个Bug的问题描述、全部失败TC引用、触发条件、源码位置、根因因果链、修复建议、风险和复验计划必须集中在对应<BG-*>条目内；BG内不复制receipt、viewer或共享波形数据，全部唯一波形只放在<WAVEFORM-EVIDENCE>中央分区，并通过<WAVEFORM-REF>跳转。不得在文档末尾另建与标签分离的全局根因分析章节。详情内部使用粗体或五、六级标题，不要使用一到三级标题，保证BG条目边界清晰
      - `record_dynamic_bug.py`是可选辅助：可用时只为新Bug生成首个BG/TC、`<WAVEFORM-REF>`和八字段骨架；不可用时按Guide的同一标签格式用文本工具建立骨架并继续，不能降低完成标准。同一BG的后续Fail TC直接交给`ApplyWaveInfoEvidence`。随后完成TC共享的`alignment_evidence`、每个`bug_evidence.<BG>`的`required_signals/observed_behavior/source_correlation`及BG的八个固定分析字段，清除全部`<BUG-TODO>`。有源码时使用`<BUG-SOURCE-FIRST-ERROR>`、`<BUG-SOURCE-PROPAGATION>`、`<BUG-SOURCE-OBSERVABLE>`三个因果标签；无源码时使用互斥的`<BUG-SOURCE-UNAVAILABLE>`
      - `ApplyWaveInfoEvidence`每次只维护一个精确BG/TC关联。一个BG有多个Fail TC时分别调用；目标TC不存在且BG位置唯一时由工具创建。一个Fail TC揭示多个独立Bug时保留不同BG，使用相同test_case_tag和不同bug_tag分别调用，所有关联共享一份中央记录。工具保留其他BG、兄弟TC和中央记录；新增关联不需要replace_existing，只有替换不同receipt时才显式设为true。不得手工复制BG/TC、receipt字段或viewer token
      - 静态源码分析只产生候选Bug，且仅记录在`{OUT}/{DUT}_static_bug_analysis.md`。只有该候选被失败用例复现并经`WaveInfo`确认后，才能以独立的非`BG-STATIC-*`标签写入动态Bug文档；无法取得波形时不得将其确认为动态Bug
      - {DUT}的verilog源代码位于`{DUT}/{DUT}.v`目录下，其依赖或者上层语言的源码位于目录`{RTL_PATH}/`，文件后缀可能是.v、.sv、.vh、.scala等
      - 发现bug要基于源码（有上层语言源码如scala，则基于上层语言源码进行分析，没有则基于verilog源码进行分析）进行详细分析：什么问题、为什么出现、如何修复
      - 如果源码不存在，需要给出可能的设计缺陷分析和修复建议
      - 注重代码和文档质量，生成实用、可维护的验证代码
  
      **必须使用的工具：**
      - `CurrentTips`: 获取当前步骤的具体指导
      - `Complete`: 进行阶段检测，如果完成当前步骤，进入下一步，如果不允许完成，需要根据error中的反馈和建议调整工作
      - `ReadTextFile`: 读取文件内容（让工具知晓你阅读了哪些文件）
      - 其他文件操作和搜索工具按需使用

      **Check/Complete失败处理：**
      - Check或Complete返回失败时，必须先读取返回顶部的`failure_summary`，并按其中的`failed_checker_name`、`error_code`、`error`和`next_action`处理具体阻塞项
      - 向用户或阶段日志说明失败原因时，必须引用`error_code`和至少一个具体文件、测试、标签或缺失项；禁止仅表述为“内部Checker机制不通过”“Checker计数异常”或“需要人工确认”
      - `count_fail`是该Checker的历史失败调用累计值，不是当前失败测试数；`failed_funct_point: 0`、`failed_check_point: 0`或pytest结果符合预期，也不代表其他门禁已经通过。只有顶层`check_pass: true`或`complete: true`才表示本次检查通过
      - Checker失败默认表示仍有可修复的验证项。只有返回明确的内部异常和traceback且没有业务错误时，才能判定为工具内部故障；若返回被截断，以顶部`failure_summary`为准，不得反复调用Complete而忽略具体错误

      **指导文档：**
      - 位于Guide_Doc/目录下
      - 根据需要进行查阅

      **注意：**
      - 无论是组合电路还是时序电路，都必须使用Step接口驱动电路
      - 请注意Complete和Check工具进行阶段检查时的区别：
      - - Check工具仅仅进行阶段检查，不会推进阶段
      - - Complete工具进行阶段检查后，如果通过检查后，推进到下一个阶段
      - - 建议优先使用Complete工具（阶段推进总耗时时间更短），必要时使用Check工具进行阶段检查
      - 需要根据Complete（或者Check）的结果调整你的工作，目标是保证所有Complete都通过
      - 完成一个Stage后，再进入下一个Stage，直到所有Stage都完成，才算整个验证任务完成
      - 除非Complete工具（或者Check工具）要求等待人工确认，否则不需要人工介入，不需要询问任何问题
      - 对可复现失败用例进行动态Bug确认时，`WaveInfo`是必须调用的诊断工具。先运行失败用例生成新波形，再以测试名和相关pin/event pattern调用`WaveInfo`；波形内部信号仅可通过该工具按需获取，不能用shell猜测或手工编造波形结果
      - `WaveInfo`无参数inventory返回recommended_call后，下一次必须逐字使用其中的非空test_case_name；inventory不产生receipt且不能作为Bug证据。如果实际工具调用仍为空测试名，不得重复inventory，应改正调用参数；MCP调用中未使用的参数使用工具schema给出的空字符串、空数组或-1哨兵，不要传null。工具返回中的null是规范化结果，不能把它再次作为MCP参数
      - 当前DUT的`WaveInfo`调用范例：先调用`WaveInfo(test_case_name="test_{DUT}_xxx", pattern=[], logged_cycle=-1, clock_signal="", start_step=-1, end_step=-1)`读取该用例的step范围和signal_catalog；将`test_{DUT}_xxx`替换为inventory的recommended_call.test_case_name或失败用例的精确函数名
      - metadata确认信号存在后，再调用`WaveInfo(test_case_name="test_{DUT}_xxx", pattern=[{{"signal":"TOP.{DUT}_top.{DUT}.result","event":"change","value":""}}], signal_groups={{"clock_mode":"combinational","clocks":[],"inputs":["TOP.{DUT}_top.{DUT}.a","TOP.{DUT}_top.{DUT}.b","TOP.{DUT}_top.{DUT}.op"],"outputs":["TOP.{DUT}_top.{DUT}.result"],"protocol":[],"key_signals":["TOP.{DUT}_top.{DUT}.op"]}}, logged_cycle=-1, clock_signal="", start_step=0, end_step=20, context_steps=1, max_points=200)`；示例层级只在signal_catalog中确实存在时使用，否则替换成catalog返回的精确完整路径，不要反复猜测层级或参数。若日志有cycle，则改用`clock_mode: clocked`，把真实时钟列入clocks并使用logged_cycle、精确clock_signal和cycle_tolerance进行对齐，不要同时臆测wave step
      - 只传test_case_name和pattern、但既未提供logged_cycle+clock_signal也未同时提供start_step+end_step时，是全波形探索调用；即使找到事件也会返回`status: evidence_window_required`和`evidence_usable: false`，不能写成confirmed。必须逐字使用返回的`recommended_evidence_call`重新调用WaveInfo，并用新receipt取证；不能把`analysis_window.effective_start_step/effective_end_step`手工写入文档来冒充原调用参数
      - 最终显式窗口调用必须同时传非负start_step和end_step，不能与logged_cycle混用。成功后调用`ApplyWaveInfoEvidence(target_file=..., bug_tag=..., test_case_tag=..., receipt_id=...)`。同一TC关联多个BG时分别调用，但复用同一中央记录；新增Bug需要更多信号时重新取得包含信号并集的最终receipt，并用`replace_existing=true`替换。工具保留`required_signals`并重置需按新波形复核的语义字段
      - 最终调用必须提供完整`signal_groups`；若结果只有`bug_document_signal_groups_required`或`waveform_viewer_error`而没有`bug_document_fields`/`bug_document_viewer_link`，应补齐信号角色后重新调用，不能手工补YAML或viewer token。`protocol`仅在规格和接口确认没有ready/valid/enable/start/busy/done/ack等接受或有效控制时才可为空；`key_signals`至少包含一个与当前功能选择、状态或错误传播直接相关的真实信号
      - 中断或重启后可以继续使用已验证的签名receipt和中央记录；测试或波形后来变化不要求普通stage刷新已签名证据。只有对应验证项配置`require_current_replay=true`时才重放全部唯一TC并要求更新变化的中央记录；新增关联Bug需要扩展取证信号时也必须更新
      - 任务中途只运行部分用例时，不要因此删除已有TC/BG、修改有效receipt字段或重造viewer链接；继续使用工具返回且通过签名验证的证据。最终record_and_report_bugs阶段必须先运行完整DUT测试集合，再接受全部动态Bug TC的严格波形重放
      - 如果DUT目标说明中写有“不需要波形验证”或类似表述，其含义仅是无需开展独立的波形覆盖率或内部接口验证，不得豁免动态Bug的`WaveInfo`取证；`WaveInfo`用于确认外部功能失败的根因，属于动态Bug确认流程
      - 禁止无目的地大范围获取或遍历{DUT}内部信号；但最终动态Bug证据必须按当前功能选择最小且充分的`key_signals`，用于解释从接口输入到错误输出的关键选择、状态或传播过程
      - DUT功能正确性仍以规格定义的输入输出接口行为为判定依据，内部关键波形用于解释根因，不能替代外部输出断言，也不要把任务扩展为验证无关内部子模块
      - 在计划通过Complete工具推进到下一个阶段前，需要通过工具SetCurrentStageJournal进行阶段日志记录，方便后续追踪和分析
      - 如果不是从第一阶段开始工作，你需要：
      -   通过CurrentTips工具获取当前阶段的具体任务指导
      -   通过Status工具获取当前阶段状态，确认你处于哪个阶段
      -   通过AllStageJournal工具获取之前阶段的日志，了解之前阶段的工作内容和结果
      {skill_system}
      现在调用`CurrentTips`，开始你的验证工作！
    tips:
      allways:
        - "阶段任务执行步骤":
          - "(1) 阅读reference_files列出的参考文档"
          - "(2) 完成目标任务"
          - "(3) 通过SetCurrentStageJournal记录日志"
          - "(4) 通过Complete工具确认完成当前阶段的任务"
        - "你需要完成所有阶段的任务，才算完成整个验证任务"
        - "不清楚目标时，需要通过工具RoleInfo获取角色信息和基本指导"
        - "测试函数包含ref_model fixture时，必须通过ref_model的接口进行比对验证"
      random:
        - "如果工具Complete出现超时错误，请调大timeout参数重试"
        - "判断是否完成阶段任务时，优先使用Complete工具，其次是Check工具（例如Batch任务）"
        - "可通过工具RunTestCases运行指定测试用例来寻找问题"
        - "Fail的测试用例可能意味着发现了bug，这是验证的目标，不要误报为Pass"
        - "全面验证阶段需优先复现{OUT}/{DUT}_static_bug_analysis.md中记录的高/中置信度静态分析潜在Bug"    
    skill_system: |

      **技能系统:**
      - 有以下通用技能供全阶段使用,当任务描述与技能description相匹配时,优先阅读并使用技能来完成任务:
      {general_skill_list}
      - 若本阶段使用了任意技能,则在计划通过Complete工具推进到下一个阶段前,使用工具`SetSkillUsage`检查并记录技能的使用情况,`SetSkillUsage`要早于`SetCurrentStageJournal`，因为技能的使用将影响阶段的完成情况。


mcp_server:
  init_prompt: >
    请通过工具`RoleInfo`获取你的角色信息和基本指导，然后完成任务。请使用工具`ReadTextFile`读取文件。

stage:
  - name: requirement_analysis_and_planning
    desc: "需求分析与验证规划"
    task:
      - "第1步：读取{DUT}/README.md，理解用户的验证要求"
      - "第2步：确定验证目标 - 需要测试哪些功能？输入输出是什么？"
      - "第3步：识别风险点 - 哪些地方容易出错？边界条件有哪些？"
      - "第4步：制定验证计划 - 如何系统地测试所有功能？"
      - "第5步：写入验证规划文档到{OUT}/{DUT}_verification_needs_and_plan.md，请使用{DOC_GEN_LANG}编写"
      - "注意：{DUT}中可能有隐藏bug，测试用例失败时不要尝试修复{DUT}的实现，而是分析是否为设计缺陷并进行记录"
    reference_files:
      - "{DUT}/README.md"
    checker:
          - name: markdown_file_check
            clss: "UnityChipCheckerMarkdownFileFormat"
            args:
              markdown_file_list: "{OUT}/{DUT}_verification_needs_and_plan.md"
              no_line_break: true
          - name: dut_must_exist_check
            clss: "OrginFileMustExistChecker"
            args:
              files:
                - "{DUT}/__init__.py"
    output_files:
      - "{OUT}/{DUT}_verification_needs_and_plan.md"

  - name: dut_function_understanding
    desc: "{DUT}功能理解"
    task:
      - "第1步：读取{DUT}/README.md，了解芯片基本信息"
      - "第2步：读取{DUT}/__init__.py，理解代码接口定义"
      - "第3步：分析输入输出端口 - 每个端口的作用是什么？"
      - "第4步：确定芯片类型 - 是时序电路(需要时钟)还是组合电路？"
      - "第5步：分析{DUT}的功能有哪几大类，大约有多少个功能点？"
      - "第6步：整理基本信息，写入{OUT}/{DUT}_basic_info.md，请使用{DOC_GEN_LANG}编写"
      - "目标：为后续阶段提供清晰的芯片基础信息"
    reference_files:
      - "{DUT}/README.md"
      - "{DUT}/__init__.py"
    checker:
          - name: markdown_file_check
            clss: "UnityChipCheckerMarkdownFileFormat"
            args:
              markdown_file_list: "{OUT}/{DUT}_basic_info.md"
              no_line_break: true
    output_files:
      - "{OUT}/{DUT}_basic_info.md"

  - name: functional_specification_analysis
    desc: "功能规格分析与测试点定义"
    task:
      - "目标：将芯片功能拆解成可测试的小块，为后续测试做准备"
      - "第1步：阅读{DUT}/下的所有相关文档，理解芯片完整待验证功能"
      - "第2步：对待验证功能点按功能模块分组，每组用<FG-名称>标记"
      - "第3步：每组内定义具体功能点，用<FC-名称>标记"
      - "第4步：每个功能点设计检测点，用<CK-名称>标记"
      - "把结果及时写入{OUT}/{DUT}_functions_and_checks.md，请使用{DOC_GEN_LANG}编写"
      - "写入不依赖Skill脚本：可直接使用文本编辑工具按Guide_Doc/dut_functions_and_checks.md维护FG/FC/CK层级；若可用批量脚本，也只能作为等价的可选写入方式"
      - "重要："
      - "   标签格式必须正确，这是后续自动化测试的基础"
      - "   必须覆盖所有功能点和边界条件"
      - "   功能点尽可能细化，检测点要具体"
      - "   检查点需要具有可测性，确保能通过测试用例验证"
      - "参考Guide_Doc/dut_functions_and_checks.md了解标准格式"
    skill_list:
      - "unitytest/functions-and-checks"
    # set `force_use_skill` to True to force UCAgent to use the skill in skill_list
    # force_use_skill: True
    reference_files:
      - "Guide_Doc/dut_functions_and_checks.md"
      - "{DUT}/*.md"
      - "{DOC_PATH}/*.md"
      - "{DUT}/__init__.py"
      - "{OUT}/{DUT}_basic_info.md"
      - "{OUT}/{DUT}_verification_needs_and_plan.md"
    output_files:
      - "{OUT}/{DUT}_functions_and_checks.md"
    stage:
      - name: dut_function_grouping
        desc: "DUT功能分组与层次划分[{COUNT_FG}]"
        task:
          - "基于{DUT}功能，将相关功能归类成组"
          - "为每组定义<FG-组名>标签，组名要有意义"
          - "创建文档框架，先完成分组部分"
          - "例如：加法器可分为<FG-BASIC>基础运算，<FG-OVERFLOW>溢出处理等，栈结构可以有<FG-PUSH>、<FG-POP>、<FG-POP-PUSH>等"
          - "注意：必须有<FG-API>分组"
        skill_list:
          - "unitytest/functions-and-checks"
        checker:
          - name: group_structure_check
            clss: "UnityChipCheckerLabelStructure"
            args:
              doc_file: "{OUT}/{DUT}_functions_and_checks.md"
              leaf_node: "FG"
      - name: function_point_definition
        desc: "具体功能点识别与定义[{COUNT_FC}]"
        task:
          - "在每个功能分组内，定义具体的功能点"
          - "用<FC-功能名>标签标记每个功能"
          - "确保覆盖该组的所有功能"
          - "例如：基础运算组可包含<FC-ADD>加法，<FC-ZERO>零值处理等"
          - "重要："
          - " - 功能点要具体，不能过于笼统"
          - " - 功能点要可测试，确保能通过测试用例验证"
          - " - 如果功能点复杂，需要在该分组标记结束后，再次针对每个复杂功能点利用<FG-*>, <FC-*>, <CK-*>进行单独细化"
        skill_list:
          - "unitytest/functions-and-checks"
        checker:
          - name: function_point_check
            clss: "UnityChipCheckerLabelStructure"
            args:
              doc_file: "{OUT}/{DUT}_functions_and_checks.md"
              leaf_node: "FC"
      - name: check_point_design
        desc: "检测点设计与定义[{COUNT_CK}]"
        task:
          - "为每个功能点设计具体的检测点"
          - "用<CK-检测名>标签标记，如<CK-BASIC>基本功能，<CK-BOUNDARY>边界条件"
          - "检测点要包含：正常情况、边界条件、异常情况"
          - "标签独立成行，与标题用空行分隔"
          - "完成完整的功能分析文档"
          - "列出的检查点必须具有可测试性，即能通过端口的输入输出进行验证"
          - "重要："
          - " - 检查点要具体，不能过于笼统"
          - " - 检查点要可测试，确保能通过测试用例验证"
        skill_list:
          - "unitytest/functions-and-checks"
        checker:
          - name: check_point_check
            clss: "UnityChipCheckerLabelStructure"
            args:
              doc_file: "{OUT}/{DUT}_functions_and_checks.md"
              leaf_node: "CK"
              data_key: "COVER_GROUP_DOC_CK_LIST"
        need_human_check: $(HUMAN_CHECK_CK: false) # 验证复杂DUT时建议开启该人工检查
      - name: functional_line_mapping_gap_analysis
        desc: "功能规格逐行查漏补缺[{LINE_MAP_PROGRESS}|{COUNT_CK}]"
        task:
          - "目标：按批次审查运行时提供的目标文档行块，确保每一条非空白内容都得到处理：所有有功能意义的非空白内容必须被准确纳入 {OUT}/{DUT}_functions_and_checks.md 并映射到正式 FG/FC/CK，确实没有功能意义的内容才可以使用带具体原因的 IGNORE；不能遗漏任何 DUT 功能、接口、约束、状态、时序、异常或边界行为"
          - "目标文档说明：目标文档集合由当前阶段配置动态确定；实际文件名、物理行范围和原文内容以 Check/Complete 返回的当前批次为准，不要自行猜测、补充或创建未返回的目标文件。Guide_Doc 仅提供格式规范，不属于逐行覆盖目标"
          - "当前进度：{COMPLETED_LINE_BLOCKS}/{TOTAL_LINE_BLOCKS} 个行块；当前批次待审查的文档及物理行范围：{CURRENT_LINE_BLOCKS}"
          - "Check/Complete返回格式：current_line_block_contents和next_line_block_contents是行块列表，每个行块包含line_block、file、start_line、end_line、map_file、content；map_file是唯一规范映射文件，同一源文档的所有行块必须累计写入该文件，不得按行块另建带起止行号后缀的映射文件；content是按物理行号升序排列的有序映射，转为YAML后形如content: {1: '第一行原文', 2: '', 3: '第三行原文'}，空白行的值为空字符串"
          - "未覆盖诊断按连续物理行区间汇总为uncovered_blocks字符串列表，例如[99-120, 456-888]；同一诊断的uncovered_content是按物理行号升序排列的有序映射，包含当前行块内全部未覆盖非空白行及其原文，可直接用于补齐映射"
          - "Check 返回的错误详情中的行号摘录可能只是有限示例；uncovered_lines[].uncovered_content保留当前诊断涉及的全部未覆盖原文，current_line_block_contents仍提供当前行块的完整上下文。Check/Complete返回中的content只包含当前批次或下一批次指定行块，不是对应源文件的完整内容"
          - "通常应直接使用Checker返回的uncovered_content完成修复；只有判断功能含义确实依赖跨行块的文件标题层级、表格表头、术语定义、前置说明或其他上下文时，再使用ReadTextFile查看file字段指向的原文件，不得把返回的局部片段误当成全文进行推断"
          - "第1步：只读读取当前批次列出的文档行块，并结合所在文档的标题层级、表格表头、术语定义和前置说明逐行审查；参考文档是本阶段的输入，不得修改、重排、格式化、插入空行或为了适配映射而改写其内容；每一条非空白内容都要判断是需要正式 CK 覆盖的功能语义，还是确实无功能意义且可以说明原因的 IGNORE"
          - "第2步：有关功能的行必须映射到 {OUT}/{DUT}_functions_and_checks.md 中已有的精确 FG/FC/CK 路径；如果没有对应路径，先依据 Spec 在功能文档中补充完整 FG/FC/CK，再使用新标签建立映射，不得选择语义相近但不准确的 CK，也不得在映射文件中凭空创建标签"
          - "重要：{OUT}/{DUT}_functions_and_checks.md 是本阶段的动态工作文档，不是静态只读输入。处理每个行块时，都必须结合当前 Spec、接口/时序说明和实现上下文重新审查相关 FG/FC/CK；不能仅看到已有标签就机械完成映射，也不能把单个局部行块当成完整语义"
          - "第3步：对当前行涉及的已有 CK 逐项做语义复核：确认它确实对应该功能，且边界、异常、状态、时序、触发条件和预期可观测结果足够明确，能够据此编写可判定的测试；必要时读取相关源文件全文和 Spec 上下文"
          - "第4步：如果 CK 描述不够清楚，依据 Spec 直接补充或改写 CK 说明，至少明确触发场景/前置条件、输入组合与边界值、相关接口/寄存器/具体信号、状态/时序约束、预期输出/可观测判定和异常处理；不得用泛化措辞替代具体判定标准"
          - "第5步：如果 CK 粒度过粗或混合多个彼此独立的行为，按可独立激励、观测和判定的维度拆分为多个 CK（必要时同步调整 FC/FG），为每个新 CK 给出清晰、互不重叠的范围，并将原 CK 的所有相关映射行分别迁移到正确的新 CK"
          - "第6步：如果 CK 与 Spec、接口或实现不一致，属于误标、重复或已废弃行为，必须重写为正确 CK，或在确认没有有效覆盖责任后删除；删除前先为仍需覆盖的行为建立替代 CK，不能通过删除标签掩盖功能遗漏"
          - "第7步：任何新增、重命名、拆分、重写或删除都必须同步检查 {OUT}/line_map/ 下所有已生成映射文件及当前/历史行块中的标签；移除失效标签、补齐替代映射，保持每个非空白行最终有正式 FG/FC/CK 或带具体理由的 IGNORE，不能留下旧 CK、MISSMT 或不存在的标签"
          - "第8步：CK 标签是后续覆盖率定义、测试用例、静态/动态 Bug 证据使用的接口；如果工作区中已经存在这些下游引用，CK 的新增、重命名、拆分、重写或删除必须同步迁移所有受影响引用，不能只修改 functions_and_checks.md 或行映射后留下断链"
          - "第9步：判定依据以 Spec 和其他权威接口文档为准，不能仅凭一行代码臆造场景；实现仅用于定位信号和可观测行为，若实现与 Spec 冲突，必须保留 Spec 规定的期望，不能把 CK 改成迎合错误实现；若不同 Spec 相互冲突或信息不足，先读取相关完整上下文，明确记录冲突依据、已知可验证范围和待澄清项，不得用模糊 CK、IGNORE 或 MISSMT 把问题伪装成已完成"
          - "第10步：修改功能文档后重新读取并校验其完整层级、标签唯一性、每个 CK 隶属正确 FG/FC、无孤立或空描述 CK；同步更新所有引用已变更 CK 的映射标签后重新调用 Check。正常情况下参考文档的路径和物理行范围保持不变，继续使用 Check 返回的原行块，不得因为 functions_and_checks.md 变化而重算、平移或改写参考文档行号，也不得伪造完成状态"
          - "第11步：与功能无关但非空白的行使用 IGNORE/FC-.../CK-... 映射，并在映射行末尾写明具体忽略原因；不得为了覆盖行号而把无关内容挂到任意正式 CK；本轮先完成 Check/Complete 返回的当前批次，除因 CK 变更而同步修复的受影响映射外，不要提前修改尚未返回的文档行块"
          - "第12步：严格使用当前行块返回的map_file建立或更新规范映射文件，映射格式遵循 Guide_Doc/dut_line_func_map.md；同一源文档跨批次继续更新同一个map_file，发现此前误建的带行号后缀映射文件时，将有效内容合并到map_file并删除误建文件"
          - "第13步：映射区间必须遵循 Guide_Doc/dut_line_func_map.md 和当前阶段配置的行范围校验；每个区间应与实际审查的物理行范围对应，跨多个批次的连续内容分别记录，若 Check 报告区间或行范围错误，按诊断拆分或修正，不得用超范围区间绕过校验"
          - "第14步：同一文档行如果确实同时描述多个独立且可验证的行为，可以映射到多个正式 CK；不要为了追求单一标签而丢失其中任何功能语义，也不要把无关 CK 叠加到同一行"
          - "第15步：当前进度和待处理行块以动态任务描述及 Check/Complete 返回为准；每批映射通过后调用 Check 获取下一批，所有行块完成且 Check 通过后才能调用 Complete。如果 Check 报告参考文档内容摘要变化或已完成行块过期，视为输入已变化：停止依赖旧进度继续推进，先重新读取受影响文档并按新的行块重新审查，不得自行修改参考文档来消除错误"
          - "重要：不得使用 MISSMT 作为最终结果；如果功能缺失，必须补充正式 FG/FC/CK 并重新检查"
        skill_list:
          - "unitytest/functions-and-checks"
        reference_files:
          - "Guide_Doc/dut_functions_and_checks.md"
          - "Guide_Doc/dut_line_func_map.md"
          - "{OUT}/{DUT}_functions_and_checks.md"
        output_files:
          - "{OUT}/{DUT}_functions_and_checks.md"
          - "{OUT}/line_map/*_line_func_map.txt"
        checker:
          - name: functional_line_mapping_batch_check
            clss: "UnityChipBatchCheckerFileLineMap"
            args:
              name: "functional_line_mapping"
              file_list:
                - "{DUT}/*.md"
                - "{DOC_PATH}/*.md"
                - "{OUT}/{DUT}_basic_info.md"
                - "{OUT}/{DUT}_verification_needs_and_plan.md"
              func_check_file: "{OUT}/{DUT}_functions_and_checks.md"
              map_location: "{OUT}/line_map"
              map_suffix: "_line_func_map.txt"
              batch_size: $(FUNCTION_LINE_MAP_BATCH_SIZE: 1)
              max_block_lines: 100
              max_example_lines: 20
              ignore_blank_lines: true
              must_has_no_miss_match: true
              data_key: "COVER_GROUP_DOC_CK_LIST"

  - name: functional_specification_refine
    desc: "功能规格/测试点细化与边界条件补充[{COMPLETED_POINTS}/{TOTAL_POINTS}|{COUNT_CK}]"
    task:
      - "目标：对功能规格进行细化，补充边界条件和异常情况"
      - "第1步：阅读{OUT}/{DUT}_functions_and_checks.md，理解已有功能点和检测点"
      - "第2步：分批次针对每个功能点，分析粒度是否太粗，是否覆盖了所有边界条件和异常情况"
      - "第3步：细化太粗的功能点/检查点，补充遗漏的边界条件和异常情况，更新文档{OUT}/{DUT}_functions_and_checks.md"
      - "第4步：确保每个功能点都有对应的检测点，并且检测点具有可测试性"
      - "第5步：每完成当前批次中的一部分或全部原始CK细化后，调用Check(stage_args={\"refined\":{...}})记录这些原始CK已完成复核与细化"
      - "第6步：所有批次都通过Check后，调用Complete完成阶段；如果最后一批尚未Check，也可以直接调用Complete(stage_args={\"refined\":{...}})"
      - "注意："
      - "  - 细化过程中，不仅仅需要增加文字描述，还需要增加新的功能点（FC）或者检测点（CK）来覆盖新增的边界条件和异常等情况"
      - "  - 所有功能点、检查点等不要笼统，不要过于粗略，需要尽量细化"
      - "  - 在完善过程中，不要丢失已有的功能点、检测点、状态、边界条件等"
      - "  - Check/Complete只有一个阶段自定义参数stage_args；优先传入真实JSON对象，不要传递顶层refined/generated/bug_list。当前阶段约定stage_args中的refined为CK映射：stage_args={\"refined\":{CK_KEY_1:Value1, CK_KEY_2:Value2, ...}}；如果调用端无法正确传递嵌套对象，stage_args可以改为内容为完整JSON对象的字符串"
      - "  - stage_args.refined中的CK_KEY必须来自当前批次待分析功能点（见下方{LIST_CURRENT_POINTS}），不能传入其他批次的CK，也不能传入细化后新增/拆分出的新CK"
      - "  - stage_args.refined的Value为该原始CK的细化说明；只要某个原始CK出现在stage_args.refined中，就表示该原始CK已经完成复核与细化"
      - "  - 如果某个原始CK被拆分为多个更细的新CK，请在文档中新增这些新CK，并在stage_args.refined中使用原始CK作为key说明拆分情况"
      - "  - 示例工具参数：Check(stage_args={\"refined\":{\"FG-A/FC-A-1/CK-A-1\":\"已补充边界条件，并拆分为CK-A-1-BOUND和CK-A-1-ERR\", \"FG-B/FC-B-2/CK-B-2\":\"粒度已足够，无需拆分，但补充了异常输入说明\"}})"
      - "  - 字符串fallback示例：Check(stage_args=\"{\\\"refined\\\":{\\\"FG-A/FC-A-1/CK-A-1\\\":\\\"已补充边界条件\\\"}}\")；字符串内容必须是完整合法JSON对象"
      - "  - 最后一批示例工具参数：Complete(stage_args={\"refined\":{\"FG-C/FC-C-3/CK-C-3\":\"已补充组合场景和预期结果\"}})；如果Check已经提示全部CK完成，则直接调用Complete()即可"
      - "  - 对于需要进行组合测试的功能点，确保在文档中明确标注组合条件和预期结果，每种组合情况都要有对应的检测点"
      - "  - 你需要按Spec文档中定义的功能点和检测点进行细化，确保覆盖所有边界条件和异常情况"
      - "当前批次待分析功能点（stage_args.refined的key只能从这里选择）": "{LIST_CURRENT_POINTS}"
      - "当前分析进度": "{COMPLETED_POINTS}/{TOTAL_POINTS}"
    output_files:
      - "{OUT}/{DUT}_functions_and_checks.md"
    reference_files:
      - "{OUT}/{DUT}_functions_and_checks.md"
      - "{OUT}/{DUT}_basic_info.md"
    checker:
      - name: functions_and_checks_refine_check
        clss: "UnityChipCheckerLabelStructureRefine"
        args:
          doc_file: "{OUT}/{DUT}_functions_and_checks.md"
          leaf_node: "CK"
          data_key: "COVER_GROUP_DOC_CK_LIST"

  - name: static_bug_analysis
    desc: "RTL源码静态Bug分析[{ANALYSIS_PROGRESS}]"
    task:
      - "目标：逐批次分析RTL源码，结合功能检测点系统排查设计缺陷，将发现的潜在Bug记录到{OUT}/{DUT}_static_bug_analysis.md"
      - "当前批次待分析文件": "{CURRENT_FILE_NAMES}"
      - "分析步骤："
      - "  第1步：读取当前批次源文件，理解模块功能与架构（模块层次、关键信号、状态机、数据流）"
      - "  第2步：结合{OUT}/{DUT}_functions_and_checks.md中的功能点与检测点，针对每个<CK-*>逐项审查RTL实现"
      - "  第3步：系统排查常见设计缺陷："
      - "    - 状态机逻辑：状态枚举是否完整，转移条件是否正确，是否有孤立/死锁状态，default分支是否缺失"
      - "    - 边界与溢出：算术运算溢出/下溢、位宽截断、有符号/无符号类型不匹配"
      - "    - 时序逻辑：复位条件完整性、异步信号同步、竞争冒险、亚稳态"
      - "    - 接口协议：valid/ready握手时序、数据有效窗口、读写使能逻辑"
      - "    - 控制逻辑：优先级、互斥条件、未处理的输入组合"
      - "  第4步：将发现的潜在Bug按以下严格标签层级记录到{OUT}/{DUT}_static_bug_analysis.md"
      - "  第5步：若发现高/中置信度Bug，在{OUT}/{DUT}_functions_and_checks.md中补充针对性<CK-*>检测点"
      - "  第6步：在{OUT}/{DUT}_static_bug_analysis.md的<STATIC-BUG-PROGRESS>分区维护批次进度表格，记录本批次每个文件的分析结果"
      - "  静态报告的唯一机器分区依次是独立行<STATIC-BUG-SUMMARY>、<STATIC-BUG-DETAILS>、<STATIC-BUG-PROGRESS>；三者必须各出现一次且顺序固定。相邻标题只是展示文字，可以本地化，不能替代机器分区标签"
      - ""
      - "=== 关于 <FG-*>/<FC-*>/<CK-*> 标签的来源（重要）==="
      - "  {OUT}/{DUT}_static_bug_analysis.md 中使用的所有 <FG-*>/<FC-*>/<CK-*> 标签"
      - "  必须来自 {OUT}/{DUT}_functions_and_checks.md，不得凭空创造，(FG-NULL, FC-NULL, CK-NULL 标签除外)。"
      - "  操作流程："
      - "    a) 先查阅 {OUT}/{DUT}_functions_and_checks.md，确认目标 <FG-*>/<FC-*>/<CK-*> 是否存在"
      - "    b) 若已存在：直接在 static_bug_analysis.md 中使用，标签必须与 functions_and_checks.md 完全一致（区分大小写）"
      - "    c) 若不存在（如发现了 functions_and_checks.md 未覆盖的缺陷场景）："
      - "       先在 {OUT}/{DUT}_functions_and_checks.md 中新增对应的 <FG-*>/<FC-*>/<CK-*> 条目"
      - "       再在 {OUT}/{DUT}_static_bug_analysis.md 中按相同标签记录 Bug"
      - ""
      - "=== 标签层级（强制规范，不得偏离）==="
      - "  <FG-*>                   功能组       示例：<FG-ARITHMETIC>        ← 来自 functions_and_checks.md"
      - "  └─ <FC-*>                子功能       示例：<FC-ADD>               ← 来自 functions_and_checks.md"
      - "     └─ <CK-*>             检测点       示例：<CK-OVERFLOW>          ← 来自 functions_and_checks.md（不存在须先补充）"
      - "        └─ <BG-STATIC-NNN-NAME>  Bug条目  示例：<BG-STATIC-001-ADD-OVERFLOW>"
      - "           └─ <LINK-BUG-[BG-TBD]>   恰好一个，标记为待验证"
      - "              └─ <FILE-path:L1-L2>   一个或多个，标注源码位置"
      - ""
      - "  【重要】一个 <CK-*> 检测点下可以挂靠多个 <BG-STATIC-*> 标签，每个标签代表在该检测点发现的一个独立Bug"
      - ""
      - "=== 示例——发现Bug（一个CK下有多个BG-STATIC）==="
      - "  <FG-ALU>"
      - "  #### 加法功能 <FC-ADD>"
      - "  - <CK-OVERFLOW> 溢出检测点（该检测点下发现两个Bug）"
      - "    - <BG-STATIC-001-ADD-CARRY> 进位溢出标志未正确拉高"
      - "      - <LINK-BUG-[BG-TBD]>"
      - "        - <FILE-rtl/alu.v:25-30>"
      - "          ```verilog"
      - "          // rtl/alu.v 第25-30行"
      - "          25: assign overflow = carry;  // BUG：未计入cin贡献"
      - "          ```"
      - "    - <BG-STATIC-002-ADD-SUM> 加法结果位宽截断"
      - "      - <LINK-BUG-[BG-TBD]>"
      - "        - <FILE-rtl/alu.v:42-44>"
      - "          ```verilog"
      - "          // rtl/alu.v 第42-44行"
      - "          42: assign sum = a + b;       // BUG：忽略了cin，位宽不足"
      - "          ```"
      - ""
      - "=== 示例——未发现Bug(在所有文件中都未发现任何bug) ==="
      - "  <FG-NULL><FC-NULL><CK-NULL>所有文件都没发现Bug<BG-STATIC-NULL>"
      - "  （注意：BG-STATIC-NULL 下面不允许有任何 <LINK-BUG-*> 或 <FILE-*> 子标签）"
      - ""
      - "=== 关键规则 ==="
      - "  - 标签仅仅在标记的时候需要用尖括号包裹(<tag_name>，即文档中只能用尖括号包裹一次)，后续引用时无需尖括号，否则将报错"
      - "  - 【来源】所有 <FG-*>/<FC-*>/<CK-*> 必须来自 {OUT}/{DUT}_functions_and_checks.md；不存在的须先添加到该文件再使用"
      - "  - 【多Bug】一个 <CK-*> 下可以有多个 <BG-STATIC-*> 标签，每个代表一个独立Bug"
      - "  - 每个 <BG-STATIC-*>（NULL除外）必须有且仅有一个 <LINK-BUG-[BG-TBD]> 子标签"
      - "  - 每个 <LINK-BUG-[BG-TBD]> 必须有至少一个 <FILE-path:L1-L2> 子标签，并附上对应RTL源码片段"
      - "  - FILE格式：<FILE-相对路径/文件.v:L1-L2>（相对workspace根目录，示例：rtl/dut.v:50-56）"
      - "    多段范围示例：<FILE-rtl/dut.v:50-56,100-105>"
      - "  - 所有 <FG-*>/<FC-*>/<CK-*> 标签必须与 functions_and_checks.md 中的定义完全一致（区分大小写）"
      - "  - <BG-STATIC-NULL> 是唯一可以没有子标签的Bug条目，且仅用于表示在所有文件中都未发现任何Bug（不能应用于单文件没发现任何Bug）"
      - ""
      - "=== 批次进度追踪（必须写在 {OUT}/{DUT}_static_bug_analysis.md 末尾）==="
      - "  本批次分析完毕后，将每个已分析文件追加到<STATIC-BUG-PROGRESS>后的表格中。若规范骨架不存在，直接使用文本编辑工具按Guide_Doc/dut_bug_analysis.md第7.2节创建完整三分区骨架；可用的Skill脚本只是可选批量方式，不能只补中文标题："
      - "  <STATIC-BUG-PROGRESS>"
      - "  | 源文件 | 发现疑似Bug数 | 状态 |"
      - "  |--------|-------------|------|"
      - "  | <file>rtl/dut.v</file> | 2 | ✅ 完成 |"
      - "  重要：<file>…</file> 内的路径必须是相对workspace根目录的源文件路径（示例：<file>rtl/dut.v</file>）"
      - "  批次Checker通过该标签识别已完成文件，路径错误将导致重复分析"
      - ""
      - "  注意区分两种标记："
      - "    <file>路径</file>      — 小写，纯文本 — 仅用于进度表格，无属性"
      - "    <FILE-路径:L1-L2>      — 大写带冒号行号 — Bug源码定位标签，位于 <LINK-BUG-*> 下方"
      - ""
      - "注意："
      - "  - 静态分析阶段不运行任何测试，仅通过源码审查发现问题"
      - "  - 所有文档内容使用{DOC_GEN_LANG}编写"
      - "  - 若未找到任何RTL源文件（黑盒验证场景），直接在{OUT}/{DUT}_static_bug_analysis.md中说明：无源文件可供静态分析，验证以黑盒方式进行，无需执行上述分析步骤"
    reference_files:
      - "Guide_Doc/dut_bug_analysis.md"
      - "{OUT}/{DUT}_functions_and_checks.md"
      - "{OUT}/{DUT}_basic_info.md"
    output_files:
      - "{OUT}/{DUT}_static_bug_analysis.md"
    skill_list:
      - "unitytest/static-bug-analysis"
    checker:
      - name: static_bug_batch_analysis_check
        clss: "UnityChipBatchCheckerStaticBug"
        args:
          static_doc: "{OUT}/{DUT}_static_bug_analysis.md"
          functions_and_checks_doc: "{OUT}/{DUT}_functions_and_checks.md"
          file_list:
            - "{RTL_PATH}/**/.vhd*"
            - "{RTL_PATH}/**/*.v"
            - "{RTL_PATH}/**/*.sv"
            - "{RTL_PATH}/**/*.scala"
          batch_size: $(STATIC_ANALYSIS_BATCH_SIZE: 1) # 根据DUT复杂度调整批次大小，建议初始值为1（即每次分析一个文件），复杂DUT可适当增加以提升效率，但过大可能导致分析质量下降
    need_human_check: false

  - name: dut_wrapper_implementation
    desc: "DUT封装"
    task:
      - "目标：创建基础接口，为后续覆盖分组创建，测试用例开发提供支撑"
      - "第1步：分析{DUT}的底层接口和工作方式"
      - "第2步：设计create_dut(request)函数 - 负责创建芯片实例"
      - "第3步：配置时钟(时序电路需要，组合电路不需要)"
      - "第4步：实现dut fixture - 管理测试的完整生命周期"
      - "需要将结果及时写入{OUT}/tests/{DUT}_api.py，请使用{DOC_GEN_LANG}编写注释"
      - "参考Guide_Doc/dut_fixture.md了解标准写法"
    output_files:
      - "{OUT}/tests/{DUT}_api.py"
    stage:
     - name: dut_creation_implementation
       desc: "DUT创建函数实现"
       task:
         - "在文件{OUT}/tests/{DUT}_api.py实现create_dut(request)函数，仅完成DUT实例的创建"
         - "不要对DUT的任何引脚/接口进行赋值操作"
         - "如果芯片有时钟引脚，必须通过 `InitClock` 方法配置时钟，进行绑定"
         - "通过get_coverage_data_path(request, new_path=True)获取代码行覆盖率文件路径"
         - "将覆盖率文件路径传递给dut.SetCoverage方法"
         - "确保create_dut函数能够正常创建DUT实例并返回"
       checker:
         - name: dut_creation_check
           clss: "UnityChipCheckerDutCreation"
           args:
             target_file: "{OUT}/tests/{DUT}_api.py"
       reference_files:
         - "Guide_Doc/dut_fixture.md"
         - "Guide_Doc/dut_function_coverage_def.md"
     - name: pytest_fixture_dut_implementation
       desc: "dut fixture实现"
       task:
         - "实现dut fixture，包含完整的生命周期管理"
         - "请按已有模板确保:"
         - "- 确保在dut fixture的清理阶段，调用通过get_coverage_data_path(request, new_path=False)获取已有路径的代码行覆盖率文件，并传递给 set_line_coverage"
         - "- 确保在dut fixture的清理阶段（yield之后）调用set_func_coverage(request, func_coverage_group)，将功能覆盖率和mark_function映射传递给toffee-test"
         - "- 确保dut fixture能正确初始化和清理芯片"
         - "- 确保dut fixture的scope设置为function"
       checker:
         - name: dut_fixture_check
           clss: "UnityChipCheckerDutFixture"
           args:
             target_file: "{OUT}/tests/{DUT}_api.py"
       reference_files:
         - "Guide_Doc/dut_fixture.md"

  - name: coverage_model_implementation
    desc: "功能覆盖率模型实现"
    task:
      - "目标：创建覆盖率统计系统，跟踪哪些功能已测试"
      - "第1步：读取功能分析文档{OUT}/{DUT}_functions_and_checks.md"
      - "第2步：为每个功能分组<FG-*>创建CovGroup覆盖组"
      - "第3步：为每个功能点<FC-*>添加watch_point监测点"
      - "第4步：为每个检测点<CK-*>实现检查函数(尽可能的用lambda函数)"
      - "第5步：实现get_coverage_groups(dut)主函数"
      - "参考Guide_Doc/dut_function_coverage_def.md了解实现方法"
      - "需要将结果及时写入{OUT}/tests/{DUT}_function_coverage_def.py，请使用{DOC_GEN_LANG}编写注释"
      - "关键：检查函数要使用dut对象引用，不要用值(如dut而不是dut.a.value)"
    stage:
      - name: coverage_group_creation
        desc: "功能覆盖组创建"
        task:
          - "为每个功能分组<FG-*>创建对应的CovGroup对象"
          - "实现get_coverage_groups(dut)基础框架"
          - "确保覆盖组可以正常创建和访问"
        checker:
          - name: coverage_group_check
            clss: "UnityChipCheckerCoverageGroup"
            args:
              test_dir: "{OUT}/tests"
              cov_file: "{OUT}/tests/{DUT}_function_coverage_def.py"
              doc_file: "{OUT}/{DUT}_functions_and_checks.md"
              check_types: "FG"
        reference_files:
          - "Guide_Doc/dut_function_coverage_def.md"

      - name: coverage_point_implementation
        desc: "覆盖率检查点实现"
        task:
          - "为每个功能点添加watch_point和检查函数"
          - "用lambda函数实现检查逻辑，传递引用参数(dut对象)"
          - "如果检查函数过于复杂，lambda函数可以用普通函数替代"
          - "如果多个检查函数有公共检查部分，也可以把公共部分实现为普通函数"
          - "完成完整的覆盖率定义，代码需要有注释，可读性强"
        checker:
          - name: coverage_implementation_check
            clss: "UnityChipCheckerCoverageGroup"
            args:
              test_dir: "{OUT}/tests"
              cov_file: "{OUT}/tests/{DUT}_function_coverage_def.py"
              doc_file: "{OUT}/{DUT}_functions_and_checks.md"
              check_types: ["FC","CK"]
        stage:
          - name: implemente_function_checks_in_batch
            desc: "分批功能点检查函数实现[{COMPLETED_POINTS}/{TOTAL_POINTS}]"
            task:
              - "第1步：理解功能点<FC-*>和检测点<CK-*>的预期行为"
              - "第2步：需要为以下检查点实现检查函数": "{LIST_CURRENT_POINTS}"
              - "第3步：使用lambda函数实现检查逻辑，传递引用参数(dut对象)"
              - "第4步：如果检查函数过于复杂，lambda函数可以用普通函数替代"
              - "第5步：如果多个检查函数有公共检查部分，也可以把公共部分实现为普通函数"
              - "第7步：如果实现过程中发现需要增加或者删除检查点，可以更新文档{OUT}/{DUT}_functions_and_checks.md"
              - "第8步：完成上述目标检查函数后，使用Check工具进行阶段检查"
              - "完成进度：{COMPLETED_POINTS}/{TOTAL_POINTS}个检查点已完成"
              - "注意："
              - " - 确保代码有注释，便于理解和维护"
              - " - 检查函数要使用dut对象引用，不要用值(如dut而不是dut.a.value)"
              - " - 如果没有明确要求，请基于DUT的引脚进行检查，一定不要尝试获取DUT的内部信号状态（内部状态或者功能不属于DUT需要验证的功能点）"
              - "当前批次测点与对应说明节选如下": "{LIST_CK_FILE_BLOCKS}"
            checker:
            - name: batch_coverage_points_implementation_check
              clss: "UnityChipCheckerCoverageGroupBatchImplementation"
              args:
                test_dir: "{OUT}/tests"
                cov_file: "{OUT}/tests/{DUT}_function_coverage_def.py"
                doc_file: "{OUT}/{DUT}_functions_and_checks.md"
                batch_size: 20
                data_key: "COVER_GROUP_DOC_CK_LIST"
            reference_files:
              - "Guide_Doc/dut_function_coverage_def.md"
    output_files:
      - "{OUT}/tests/{DUT}_function_coverage_def.py"

  - name: test_environment_implementation
    desc: "基础测试环境实现"
    task:
      - "目标：实现基础测试环境fixture，封装DUT引脚和上下游依赖"
      - "1. 分析{DUT}的引脚定义，确定引脚封装方式"
      - "2. 如果存在多个分组，则按分组定义toffee.Bundle子类，通过from_prefix接口进行关联"
      - "3. 如果不存在分组，则定义包含所有引脚的toffee.Bundle子类，通过from_dict接口进行关联"
      - "4. 确保引脚封装设计合理，便于理解和使用"
      - "5. 设计并实现Mock组件，模拟{DUT}的上下游依赖模块"
      - "6. 实现env fixture，包含需要的必要引脚封装和Mock组件"
      - "7. 编写简单的测试用例验证env fixture功能"
    stage:
     - name: human_check_env_specification
       desc: "人工检查env规格说明"
       task:
         - "根据上一级的任务描述，编写env规格说明文档和设计思路"
         - "1. 根据验证需求，详细描述env需要提供的功能和接口"
         - "2. 对env中需要的各个Mock组件进行说明，包括其功能和接口"
         - "3. 对边界条件进行说明，确保env能正确处理这些情况"
         - "4. 生成最后的总env规格说明文档，写入文件{OUT}/{DUT}_env_specification.md，请使用{DOC_GEN_LANG}编写"
         - "5. 针对每一个组件，需要根据文档模板Guide_Doc/env_spec_template.md进行针对性编写，文件命名格式为{OUT}/{DUT}_env_spec_<component_name>.md"
         - "6. 告诉人类专家你编写的env规格说明文档摘要，让他们了解你的设计思路，请使用{DOC_GEN_LANG}编写"
         - "注意："
         - " - 后续env fixture的实现必须严格按照该规格说明进行"
         - " - 如果后续发现规格说明不完整或者有误，需要及时修正"
         - " - 组件的spec文档需要和总规格说明文档相互关联，确保一致性"
       checker:
         - name: human_check_env_specification_check
           clss: "HumanChecker"
       reference_files:
         - "Guide_Doc/dut_fixture.md"
         - "Guide_Doc/dut_mock.md"
         - "Guide_Doc/env_spec_template.md"
       output_files:
         - "{OUT}/{DUT}_env_specification.md"
         - "{OUT}/{DUT}_env_spec_*.md"
       skip: $(SKIP_ENV_HUMAN_CHECK: true) # 复杂DUT时建议不要跳过该人工检查阶段
     - name: bundle_wrapper_design
       desc: "引脚封装设计"
       task:
         - "分析{DUT}的引脚定义，确定引脚封装方式"
         - "如果存在多个分组，且有共同前缀，则按分组定义toffee.Bundle子类，通过from_prefix接口进行关联"
         - "如果不存在分组，或者没有共同前缀，则定义包含所有引脚的toffee.Bundle子类，通过from_dict接口进行关联"
         - "确保引脚封装设计合理，便于理解和使用"
         - "注意："
         - " - toffee.Signal类没有位宽参数，会在bind到dut时自动获取位宽"
         - " - toffee.Signals类用于一次定义多个信号，也不用位宽参数（其参数为一次定义信号的个数），会在bind到dut时自动获取位宽"
       checker:
         - name: bundle_wrapper_check
           clss: "UnityChipCheckerBundleWrapper"
           args:
             target_file: "{OUT}/tests/{DUT}_api.py"
             min_bundles: 1
       reference_files:
         - "Guide_Doc/dut_fixture.md"
         - "{DUT}/__init__.py"

     # Mock 组件设计、实现与测试， 默认ignore相关阶段，可以通过设置IGNORE_MOCK_COMPONENT变量来控制是启用
     - name: mock_design_and_implementation
       desc: "Mock组件设计与实现"
       task:
         - "请分析{DUT}的上下游依赖模块，并针对性的设计对应的Mock组件"
         - "Mock组件要有合理的接口，便于通过dut.StepRis进行驱动"
         - "确保Mock组件能正确工作，实现代码要写入{OUT}/tests/{DUT}_mock_<MockComponentName>.py中，对应Class 以Mock前缀命名，例如MockA, MockB等"
         - "你需要把Class名为MockA的Mock组件写入文件{OUT}/tests/{DUT}_mock_A.py"
         - "Mock组件的实现要有注释，便于理解和使用，请使用{DOC_GEN_LANG}编写注释"
         - "请通过文件 {DUT}/__init__.py获取各个Mock组件的需要访问的引脚"
         - "具体例子请参考文档Guide_Doc/dut_mock.md"
         - "注意："
         - " - Mock组件中不要包含复杂的逻辑，只需模拟必要的行为"
         - " - Mock组件的主要功能需要通过on_clock_edge方法进行驱动(通过dut.StepRis/dut.StepFal进行回调注册)"
         - " - Mock组件的基础功能中需要有必要的assert检查，确保输入输出合理"
         - " - 注意{DUT}相关的文件名，用例名等大小写敏感"
         - " - Mock组件是env的一部分，Mock组件交互的对象为dut对象（或者dut的引脚bundle），而不是env对象"
         - " - Mock组件必须是和{DUT}有引脚交互的组件，如果没有引脚交互，则不需要实现Mock组件"
         - " - 用于直接驱动DUT进行功能测试的端口，不属于Mock组件的范畴，请在后续阶段通过API驱动这类端口"
       checker:
         - name: mock_component_check
           clss: "UnityChipCheckerMockComponent"
           args:
             target_file: "{OUT}/tests/{DUT}_mock_*.py"
             min_mock: 1
       reference_files:
         - "Guide_Doc/dut_mock.md"
         - "{DUT}/__init__.py"
       skill_list:
         - "unitytest/mock-components"
       ignore: $(IGNORE_MOCK_COMPONENT: true)
     - name: mock_fixture_implementation
       desc: "Mock fixture实现"
       task:
        - "请参考文档：Guide_Doc/dut_mock_test.md，实现mock_dut fixture"
        - "- 需要在文件{OUT}/tests/{DUT}_api.py中实现mock_dut fixture"
       reference_files:
         - "Guide_Doc/dut_mock_test.md"
       skill_list:
         - "unitytest/mock-components"
       checker:
         - name: mock_fixture_check
           clss: "UnityChipCheckerMockFixture"
           args:
             target_file: "{OUT}/tests/{DUT}_api.py"
       ignore: $(IGNORE_MOCK_COMPONENT: true)
     - name: mock_functional_test
       desc: "Mock组件功能测试与评估"
       task:
         - "请对已实现的Mock组件进行测试与评估"
         - "1. 为每个Mock组件编写测试用例，确保其功能正确"
         - "2. 测试用例写入文件{OUT}/tests/test_{DUT}_mock_<MockComponentName>[_<TestFileName>].py中，测试函数命名格式为test_api_{DUT}_mock_<TestCaseName>"
         - "3. 所有测试用例都必须通过，可以通过RunTestCases('test_{DUT}_mock_<MockComponentName>[_<TestFileName>].py')运行指定测试"
         - "4. 注意{DUT}相关的文件名，用例名等大小写敏感"
       checker:
         - name: no_conftest_file
           clss: FilesMustNotExist
           args:
             target_files:
               - ["{OUT}/**/conftest.py",
                  "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
         - name: mock_functional_test_check
           clss: "UnityChipCheckerTestMustPass"
           args:
             target_file: "{OUT}/tests/test_{DUT}_mock_*.py"
             test_dir: "{OUT}/tests"
             test_prefix: "test_api_{DUT}_mock_"
       reference_files:
         - "Guide_Doc/dut_mock_test.md"
       output_files:
         - "{OUT}/tests/test_{DUT}_mock_*.py"
       ignore: $(IGNORE_MOCK_COMPONENT: true)
       stage:
        - name: test_mock_components_in_batch
          desc: "分批进行Mock功能测试与评估[{COMPLETED_MOCKS}/{TOTAL_MOCKS}]"
          task:
            - "为以下Mock组件（以文件为单位）编写测试用例，确保其功能正确": "{LIST_CURRENT_MOCKS}"
            - "第1步：将测试用例写入文件{OUT}/tests/test_{DUT}_mock_<MockComponentName>[_<TestFileName>].py中，测试函数命名格式为test_api_{DUT}_mock_<TestCaseName>"
            - "第2步：运行测试，所有测试用例都必须通过，可以通过RunTestCases('test_{DUT}_mock_<MockComponentName>[_<TestFileName>].py')运行指定测试"
            - "注意："
            - " - 通过测试发现Mock组件的bug时，需要及时修正Mock组件代码，确保测试通过"
            - " - Mock组件的测试用例请用函数式编写，不要使用类"
            - " - 测试函数的第一个参数为mock_dut (pytest fixture)"
            - " - 本阶段的测试用例中，不能有mock_dut.fc_cover['FG-API'].mark_function,因为这里只测试Mock组件本身功能，不涉及DUT功能覆盖"
            - " - 注意命名规范，确保文件名和函数名正确"
            - " - 该阶段测试的是Mock组件本身的功能，不要进行其他无关测试"
            - " - 测试文件名字中的TestFileName可选，用于区分同一Mock组件的不同测试文件，如果有区分，名称需要有意义"
            - " - 仅为当前批次的Mock组件编写测试用例，不要涉及其他Mock组件"
            - "完成进度：{COMPLETED_MOCKS}/{TOTAL_MOCKS}个Mock组件已完成测试"
          checker:
            - name: batch_mock_functional_test_check
              clss: "UnityChipCheckerTestMockTestBatch"
              args:
                target_file: "{OUT}/tests/{DUT}_mock_*.py"
                test_file_prefix: "test_{DUT}_mock_"
                test_dir: "{OUT}/tests"
                test_prefix: "test_api_{DUT}_mock_"
                first_arg: "mock_dut"
                batch_size: 1
          reference_files:
            - "Guide_Doc/dut_mock_test.md"
          skill_list:
            - "unitytest/mock-components"
          output_files:
            - "{OUT}/tests/test_{DUT}_mock_*.py"
          ignore: $(IGNORE_MOCK_COMPONENT: true)

     - name: env_fixture_implementation
       desc: "env fixture实现"
       task:
         - "实现env fixture，包含需要的必要引脚封装"
         - "1. 对dut的引脚进行分析，确定哪些是输入，哪些是输出，有哪些分组（请通过文件 {DUT}/__init__.py获取所有引脚）"
         - "2. 如果存在多个分组，则按分组定义toffee.Bundle子类，通过from_prefix接口进行关联, 在env中按分组命名，例如io_group1.a, io_group2.b等"
         - "3. 如果不存在分组，则定义包含所有引脚的toffee.Bundle子类，通过from_dict接口进行关联，在env中统一用io命名，例如io.a, io.b等"
         - "4. 如果需要，请务必在env fixture中添加必要的组件和功能，例如为{DUT}添加上下游依赖模块的Mock组件，并通过dut.StepRis进行Mock组件的驱动"
         - "5. 可以按dut功能需要，添加一些常用的操作方法,例如reset, Finish, Step等"
         - "6. 引脚封装要有意义，便于理解和使用"
         - "7. 如果定义了Mock组件，请确保在env fixture中正确实例化和使用"
         - "8. 注意{DUT}相关的文件名，用例名等大小写敏感"
       checker:
         - name: env_fixture_check
           clss: "UnityChipCheckerEnvFixture"
           args:
             target_file: "{OUT}/tests/{DUT}_api.py"
       reference_files:
         - "Guide_Doc/dut_fixture.md"
         - "{DUT}/__init__.py"
     - name: evaluate_env_fixture
       desc: "env fixture实现测试与评估"
       task:
         - "完成env fixture的实现后，编写简单的测试用例验证其功能"
         - "测试内容包括：引脚封装是否正确，Mock组件是否能正常工作，常用操作方法是否可用等"
         - "确保env fixture能满足后续API和测试用例的需求"
         - "测试函数命名格式：test_api_{DUT}_env_<Name>"
         - "测试函数的第一个参数为env (pytest fixture)"
         - "测试用例写入文件{OUT}/tests/test_{DUT}_env_fixture.py"
         - "所有测试用例都必须通过，可以通过RunTestCases('test_{DUT}_env_fixture.py')运行测试"
         - "注意："
         - "  该阶段测试的是env以及其中的Mock组件（如果有的话）是否按预期工作"
         - "  只要对{DUT}进行基本驱动，不要进行过多的DUT功能测试，防止DUT功能缺陷导致测试用例失败"
         - "  注意{DUT}相关的文件名，用例名等大小写敏感"
       checker:
         - name: no_conftest_file
           clss: FilesMustNotExist
           args:
             target_files:
               - ["{OUT}/**/conftest.py",
                  "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
         - name: env_fixture_test_check
           clss: "UnityChipCheckerTestMustPass"
           args:
             target_file: "{OUT}/tests/test_{DUT}_env_fixture.py"
             test_dir: "{OUT}/tests"
             test_prefix: "test_api_{DUT}_env_"
             first_arg: "env"
       output_files:
         - "{OUT}/tests/test_{DUT}_env_fixture.py"
       reference_files:
         - "Guide_Doc/dut_fixture.md"
         - "Guide_Doc/dut_test_case.md"
     - name: human_check_env_implementation
       desc: "人工检查env实现质量"
       task:
         - "请对已实现的env fixture和针对性测试进行总结"
         - "1. 检查env fixture是否符合规格说明文档{OUT}/{DUT}_env_specification.md的要求"
         - "2. 检查env fixture的代码质量，确保代码清晰、易读、有注释"
         - "3. 总结env fixture的实现思路和测试情况，写入文件{OUT}/{DUT}_env_implementation_review.md，请使用{DOC_GEN_LANG}编写"
         - "4. 告诉人类专家你对env fixture实现的总结和评价，让他们了解你的工作判断env fixture的质量，请使用{DOC_GEN_LANG}编写"
       checker:
          - name: human_check_env_implementation_check
            clss: "HumanChecker"
       output_files:
         - "{OUT}/{DUT}_env_implementation_review.md"
       skip: $(SKIP_ENV_HUMAN_CHECK: true)  # 验证复杂DUT时建议不要跳过该人工检查阶段

  - name: basic_api_implementation
    desc: "基础API实现"
    task:
      - "请参考文档：Guide_Doc/dut_api_instruction.md创建API"
      - "所有API必须以'api_{DUT}_'前缀开头，用于封装DUT对应Env的常用操作（注意前缀大小写敏感）"
      - "至少实现1个基础API函数"
      - "原则：让测试人员使用简单的API，而不是复杂的底层信号"
      - "确保API函数能正确调用底层接口"
      - "每个API函数都必须要有对应的注释（位于函数__doc__）对功能进行详细描述，包括功能、输入参数、返回值等"
      - "需要根据{DUT}的功能进行API实现，如果可以，需要提供底层功能API和任务功能API"
      - "把结果及时写入{OUT}/tests/{DUT}_api.py，请使用{DOC_GEN_LANG}编写注释"
      - "API可以相互嵌套，例如：对于ALU，需要实现底层功能 api_{DUT}_operate(env, data1, data2, operation, max_cycles=100), 然后基于其实现 api_{DUT}_add(env, data1, data2, max_cycles=200)等上层API接口"
      - "注意："
      - "  API函数参数："
      - "  - 第一个参数必须为：env (pytest fixture)"
      - "  - 最后一个参数必须为：max_cycles=default_value(根据需要调整默认值大小，无论是组合电路还是时序电路都需要该参数)"
      - "  - 其他参数根据测试需求添加"
      - "  API函数底层必须使用Step接口驱动DUT，无论是组合电路还是时序电路"
      - "  对于总线类DUT，建议基于 dut.StepRis 实现总线事务级驱动"
      - "  有需要时，请在Env中通过 dut.StepRis 实现对关联Mock组件的驱动"
    checker:
      - name: api_check
        clss: "UnityChipCheckerDutApi"
        args:
          api_prefix: "api_{DUT}_"
          target_file: "{OUT}/tests/{DUT}_api.py"
    reference_files:
      - "Guide_Doc/dut_api_instruction.md"

  - name: reference_model_implementation
    desc: "参考模型实现"
    ignore: not $(NEED_REF_MODEL: false)
    task:
      - "请参考{OUT}/tests/{DUT}_api.py中的API接口创建DUT参考模型"
      - "第1步：分析{DUT}的功能和API接口，设计参考模型的结构和接口"
      - "第2步：实现参考模型，确保其功能与{DUT}的API接口一致，能够正确模拟{DUT}的行为"
      - "第3步：将参考模型代码写入{OUT}/tests/{DUT}_reference_model.py中，确保代码有注释，便于理解和使用，请使用{DOC_GEN_LANG}编写注释"
      - "注意："
      - "  参考模型的主要目的是提供一个功能正确的模型，供后续测试用例进行比对验证，因此参考模型的功能实现需要尽可能完整和正确"
      - "  参考模型的实现可以相对简单，但必须能够正确模拟{DUT}的核心功能"
      - "  注意{DUT}相关的文件名，用例名等大小写敏感"
    output_files:
      - "{OUT}/tests/{DUT}_reference_model.py"
      - "{OUT}/tests/test_{DUT}_reference_model.py"

  - name: reference_model_fixture_imp
    desc: "参考模型fixture实现与测试"
    ignore: not $(NEED_REF_MODEL: false)
    task:
      - "请在{OUT}/tests/{DUT}_api.py实现fixure，名称为ref_model"
      - "第1步：实现ref_model fixture，负责创建参考模型实例，并在测试结束后进行清理"
      - "第2步：编写简单的测试用例验证参考模型的功能正确性，测试用例写入文件{OUT}/tests/test_{DUT}_reference_model.py, 测试函数命名格式为test_api_{DUT}_reference_model_<Name>"
      - "  测试用例的第一个参数为ref_model (pytest fixture)"
      - "第3步：确保测试用例能够正确验证参考模型的功能，并且所有测试用例都必须通过，请通过RunTestCases('test_{DUT}_reference_model.py')运行测试"
      - "参考模板如下："
      - "  @pytest.fixture(scope='function')"
      - "  def ref_model():"
      - "      # 创建参考模型实例"
      - "      model = YourReferenceModel()  # 替换为实际参考模型的创建代码"
      - "      yield model"
      - "      # 清理参考模型实例"
      - "      model.cleanup()  # 替换为实际参考模型的清理代码"
      - "注意："
      - "  scope必须设置为function，确保每个测试函数都能获得一个独立的参考模型实例"
    checker:
      - name: reference_model_fixture_check
        clss: "UnityChipCheckerBaseFixture"
        args:
          target_file: "{OUT}/tests/{DUT}_api.py"
          fixture_name: "ref_model"
      - name: reference_model_test_check
        clss: "UnityChipCheckerTestMustPass"
        args:
          target_file: "{OUT}/tests/test_{DUT}_reference_model.py"
          test_dir: "{OUT}/tests"
          test_prefix: "test_api_{DUT}_reference_model_"
          first_arg: "ref_model"
    output_files:
      - "{OUT}/tests/{DUT}_reference_model.py"
      - "{OUT}/tests/test_{DUT}_reference_model.py"

  - name: basic_api_functional_test
    desc: "基础API功能正确性测试"
    task:
      - "目标: 验证已实现的API函数功能是否正确，确保API接口质量"
      - "第1步：学习API测试规范 - 阅读Guide_Doc/dut_api_instruction.md，重点关注'API测试'部分"
      - "第2步：分析测试需求 - 查看{OUT}/{DUT}_functions_and_checks.md，在FG-API分组中定位每个API函数对应的准确FC/CK；API测试必须优先完成这些API分组CK的关联和验证"
      - "第3步：创建API测试文件 - 在{OUT}/tests/目录下创建test_{DUT}_api_*.py测试文件"
      - "第4步：编写测试函数，每个测试函数需要："
      - "  - 函数名格式：test_<api_name>[_<test_scenario>]，api_name对应API函数名称(例如api_{DUT}_add)，test_scenario描述测试场景（可选）"
      - "     - 命名举例：test_api_{DUT}_add_basic, test_api_{DUT}_add_overflow"
      - "  - 第一个参数必须为：env (pytest fixture)"
      - "  - 每个API测试函数都必须在函数开头添加对应API分组CK的覆盖率标记：env.dut.fc_cover['FG-API'].mark_function('FC-API-NAME', your_test_function, ['CK-API-XXX', ...])；FG/FC/CK必须来自{OUT}/{DUT}_functions_and_checks.md中该API实际对应的条目，不能只mark其他功能分组CK，也不能为通过Checker而批量标记无关API CK"
      - "  - API测试可以额外mark FG-API以外的CK，但这些关联是可选项，并且测试必须真实激励和断言其行为；额外功能CK不能替代当前测试必需的对应FG-API/FC/CK关联"
      - "  - 包含详细的docstring：测试目标、流程、预期结果"
      - "  - 实现测试逻辑：设置输入、调用API、验证输出"
      - "第5步：测试内容包括："
      - "  - 基础功能测试：验证API核心功能正确性"
      - "  - 边界条件测试：测试边界值和特殊值处理"
      - "  - 错误处理测试：验证异常情况的处理机制"
      - "  - 参数验证测试：检查输入参数的合法性验证"
      - "第6步：验证测试结果 - 使用RunTestCases('test_{DUT}_api[_name].py::your_test_function')运行并检查结果"
      - "要求：每个API函数至少有一个基础功能测试用例"
      - "完成所有API对应测试用例后，请用Check工具进行阶段检查"
      - "注意："
      - "  - 通过`from {DUT}_api import *`正确导入 APIs 和 fixtures (必须用 import *)"
      - "  - 不要尝试修复{DUT}中的bug，而是记录和分析bug（基于源代码分析）"
      - "  - 注释和文档需要使用{DOC_GEN_LANG}编写"
      - "  - 发现的bug需要计入bug分析文档{OUT}/{DUT}_bug_analysis.md，格式请参考Guide_Doc/dut_bug_analysis.md"
      - "  - 触发bug对应的测试用例必须 Fail，不能误报为 Pass"
      - "  - API功能测试使用正确预期检查真实DUT输出，适用统一完成条件：测试/API/fixture/ref_model/时序/环境问题必须修复到Pass；只有正确测试确认的DUT设计Bug保留Fail，并完成非零置信度动态Bug、CK、源码根因和真实WaveInfo confirmed证据。不要把此前基础设施自检的‘全部Pass’要求套用到已确认DUT Bug复现用例"
      - "  - 文档{OUT}/{DUT}_bug_analysis.md中的检查点标记格式与{OUT}/{DUT}_functions_and_checks.md一致"
      - "  - 如果测试函数还真实覆盖其他FG/FC，可额外调用mark_function()保留这些关联；无论有多少额外关联，每个API测试都必须至少有一次指向对应FG-API分组CK的mark_function()"
      - "  - 只有最早traceback、API契约和源码共同证明已实现的API函数或Env fixture存在缺陷时，才做与根因直接相关的最小修复并重跑专用API/fixture测试；不得为了让测试、mark_function或覆盖率门禁通过而重写提供的API模板、替换fake DUT或破坏fc_cover绑定"
      - "  - 注意{DUT}相关的文件名，用例名等大小写敏感"
      - "  - 测试函数包含ref_model fixture时，请使用其进行比对验证；如果发现参考模型实现有误，也请及时修正参考模型代码，确保测试结果可信"
    checker:
      - name: no_conftest_file
        clss: FilesMustNotExist
        args:
          target_files:
           - ["{OUT}/**/conftest.py",
              "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
      - name: api_test_check
        clss: "UnityChipCheckerDutApiTest"
        args:
          api_prefix: "api_{DUT}_"
          api_ck_prefix: "FG-API/"
          target_file_api: "{OUT}/tests/{DUT}_api.py"
          target_file_tests: "{OUT}/tests/test_{DUT}_api*.py"
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          args_check: $(NEED_REF_MODEL: false)
          args_pattern: ["env", "ref_model"]
          args_test_func_prefix: "test_api_{DUT}_"
          args_error_msg: "第一个参数必须为env，第二个参数必须ref_model"
      - name: waveform_bug_analysis_check
        clss: "UnityChipCheckerWaveformBugAnalysis"
        args:
          bug_file: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    reference_files:
      - "Guide_Doc/dut_api_instruction.md"
      - "Guide_Doc/dut_bug_analysis.md"
      - "Guide_Doc/dut_function_coverage_def.md"
      - "Guide_Doc/dut_test_case.md"
      - "{OUT}/{DUT}_static_bug_analysis.md"

  - name: create_test_case_templates
    desc: "创建测试用例模板[{COVERED_CKS}/{TOTAL_CKS}|{CASE_TESTS_COUNT}]"
    need_pass_llm_suggestion: false
    task:
      - "目标：创建测试用例模板(因为该阶段API测试已完成，请排除API测试对应模板创建)，为实际测试做准备"
      - "第1步：分析功能文档{OUT}/{DUT}_functions_and_checks.md中的以下测试点": "{LIST_CKS_TO_BE_COVERED}"
      - "第2步：根据功能点个数创建一个或者多个测试文件test_<名称>.py，文件名要有意义"
      - "第3步：在测试文件中按以下顺序创建测试函数："
      - "  - 0) 每个测试文件开头都需要用 from {DUT}_api import * 来导入env(pytest fixture)"
      - "  - 1) 每个测试函数以test_开头，第一个参数为env(pytest fixture)，如果有ref_model fixture则第二个参数为ref_model，可以根据需要添加其他参数"
      - "  - 2) 每个测试函数的最开始添加功能覆盖标记：env.dut.fc_cover['FG-XXX'].mark_function('FC-YYY', test_func, ['CK-ZZZ', ...])"
      - "  - 3) 添加详细的TODO注释说明要测什么"
      - "  - 4) 最后添加assert False, 'Not implemented'防止意外通过"
      - "  - 不依赖模板生成脚本：先用ReadTextFile读取.ucagent/runtime_config.json，以runtime_options.need_ref_model决定普通模板的唯一签名；false使用env，true使用env, ref_model且顺序固定，然后用文本编辑工具直接创建测试模板"
      - "注意："
      - "  - 该阶段dut fixture为fake值，仅用于执行加速，因此请仅仅编写用例模板，不要去测试DUT"
      - "  - 本阶段{OUT}/tests/{DUT}_api.py和{OUT}/tests/{DUT}_function_coverage_def.py是已提供的只读基础设施契约；只能新增/修改普通测试模板，禁止改动API、create_dut、dut/env fixture、fake DUT分支、覆盖组定义、fc_cover绑定、StepRis采样或coverage上报，也不能在测试文件中自建dut、fc_cover、CovGroup或替代fixture"
      - "  - 如果fake DUT上执行mark_function失败，先核对当前模板中的FG/FC/CK字面量与函数文档和覆盖率定义；不得删除mark_function、改成空覆盖组、绕过fixture或把问题改写成普通断言。若最早traceback明确指向基础设施缺陷，应记录具体文件/行并回到对应API/fixture/覆盖率阶段处理"
      - "  - 测试函数模板不要实现具体的测试逻辑，只需添加TODO注释，功能覆盖标记和assert False语句"
      - "  - 确保每个功能点<FC-*>至少有一个测试用例"
      - "  - 测试用例应当具有针对性，不要冗余，不要一个测试用例关联过多功能点、测试点"
      - "  - 如果测试用例和多个功能点关联，需要多次调用mark_function()"
      - "  - 按需要，测试用例文件可以有多个，请确保文件名和测试函数名有意义"
      - "    - 好的测试用例文件名示例：test_{DUT}_arithmetic.py, test_{DUT}_stack_operations.py"
      - "    - 差的测试用例文件名示例：test_{DUT}_part1.py, test_{DUT}_misc.py, test_{DUT}_template1.py"
      - "  - 请忽略test_{DUT}_api_*.py和test_{DUT}_mock_*.py中的测试用例（前缀为test_api_{DUT}_），他们已经在之前阶段实现完成"
      - "  - 该阶段编写的测试用例不能以test_api_{DUT}_开头"
      - "  - 该阶段不会生成有效代码行覆盖率数据、测试报告等，因此请忽略相关错误提示"
      - "  - 若存在{OUT}/{DUT}_static_bug_analysis.md，请优先为其中高/中置信度潜在Bug（<BG-STATIC-*>）创建针对性测试用例模板"
      - "参考Guide_Doc/dut_test_template.md了解模板格式"
      - "当前批次测点与对应说明节选如下": "{LIST_CK_FILE_BLOCKS}"
      - "完成进度：{COVERED_CKS}/{TOTAL_CKS}个测试用例模板已完成"
    skill_list:
      - "unitytest/create-test-case-templates"
    checker:
      - name: no_conftest_file
        clss: FilesMustNotExist
        args:
          target_files:
           - ["{OUT}/**/conftest.py",
              "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
      - name: template_check
        clss: "UnityChipCheckerTestTemplate"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix: "test_api_{DUT}_"
          ignore_ck_prefix: "FG-API/"
          data_key: "TEST_TEMPLATE_IMP_REPORT"
          batch_size: $(BATCH_SIZE_TMP: 20)
          template_must_fail: $(TEMPLATE_MUST_FAIL: true)
          args_check: $(NEED_REF_MODEL: false)
          args_pattern: ["env", "ref_model"]
          args_error_msg: "第一个参数必须为env，第二个参数必须ref_model"
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    reference_files:
      - "Guide_Doc/dut_test_template.md"
      - "{OUT}/{DUT}_static_bug_analysis.md"

  - name: comprehensive_verification_and_bug_analysis
    desc: "全面验证与缺陷分析"
    task:
      - "目标：将测试模板填充为真实测试，发现并分析芯片bug"
      - "重要：测试用例失败时，优先怀疑是芯片设计问题，不要急于修改测试。可能在测试过程中发现覆盖率中的检查点有误，需进行相应调整"
      - "参考Guide_Doc/dut_test_case.md和dut_bug_analysis.md了解实现方法"
      - "上述过程中若发现之前步骤可能有误，必须先用最早traceback、API契约和源码确认责任文件；只有证据明确时才回到所属阶段最小修正API或功能覆盖，不能在测试阶段凭猜测重写已提供模板"
      - "注意："
      - "  - 工具RunTestCases只是基于pytest运行测试用例，它并不进行类似Check那样的结果验证"
      - "  - 通过`from {DUT}_api import *`正确导入 APIs 和 fixtures (必须用 import *)"
      - "  - 实现测试时必须把现有{DUT}_api.py和{DUT}_function_coverage_def.py当作稳定接口使用；默认只修改当前测试文件。除非最早traceback和源码证据明确证明基础设施缺陷，否则不要改API模板、fixture或覆盖组定义来规避测试失败"
      - "  - 不要尝试修复{DUT}中的bug，而是记录和分析bug（需要基于源代码分析bug，给出源码修改建议,需要用{DOC_GEN_LANG}编写文档）"
      - "  - 如果源码不存在，需要给出可能的设计缺陷分析和修复建议"
      - "  - 阶段完成条件：除已确认DUT Bug复现用例外，其他用例必须全部Pass；剩余每个Fail必须与非零置信度动态Bug、对应CK、源码根因和真实WaveInfo confirmed证据一一对应。不是要求已确认Bug用例也Pass"
      - "  - 确定为DUT Bug后，不要修改正确的测试预期或弱化断言，应保留由DUT错误行为自然触发的Fail；已实现测试禁止使用assert False等人工失败。create_test_case_templates阶段的空模板必须assert False，但进入本阶段实现该模板时必须删除占位断言。若属于测试、断言、预期值、fixture/API、参考模型、复位/时序或环境问题，必须修复并重跑到Pass，不能记录为DUT Bug"
      - "  - 如果所有测试用例都通过了，需要再三确认是否都真的没有bug"
      - "  - 如果所有测试用例都失败了，大概率你编写测试有误，需要确认测试逻辑是否正确"
      - "  - 清理<BG-*-0>无效占位{BUG_ZERO_RATE_LIST}：它不能解释任何Fail；对应测试若不是DUT Bug必须修复到Pass，若确认是DUT Bug则改为非零置信度并补齐CK、源码根因和WaveInfo证据"
      - "  - 优先尝试复现{OUT}/{DUT}_static_bug_analysis.md中记录的高/中置信度静态分析潜在Bug"
      - "  - {OUT}/{DUT}_static_bug_analysis.md中的结论只是动态复现候选：必须先运行对应失败用例并真实调用WaveInfo确认波形，才可用新的非BG-STATIC-*标签写入{OUT}/{DUT}_bug_analysis.md；不能直接复制静态Bug标签或以静态分析代替波形证据"
      - "  - 每个非零动态Bug必须关联至少一个Fail TC；每个TC紧跟<WAVEFORM-REF>，全部唯一波形集中在<WAVEFORM-EVIDENCE>中。用ApplyWaveInfoEvidence写入真实receipt和viewer；同一TC关联多个Bug时只保留一份中央记录，并用bug_tags/bug_evidence列全关联及信号需求"
      - "  - 不确定波形测试名时只调用一次无参数WaveInfo inventory；随后逐字使用recommended_call中的非空test_case_name进行metadata和pattern分析。inventory不产生receipt，实际调用参数仍为空时必须修正参数而不是重复inventory"
      - "  - Check/Complete失败时必须读取顶部failure_summary，并引用failed_checker_name、error_code和具体阻塞项继续修复；count_fail只是历史调用累计，failed_funct_point/failed_check_point为0也不能覆盖其他门禁。禁止将有具体error的失败归因于‘内部Checker机制’"
    checker:
      - name: test_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
        extra_args:
          max_try: -1
      - name: waveform_bug_analysis_check
        clss: "UnityChipCheckerWaveformBugAnalysis"
        args:
          bug_file: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    reference_files:
      - "Guide_Doc/dut_test_case.md"
      - "Guide_Doc/dut_bug_analysis.md"
      - "{OUT}/{DUT}_static_bug_analysis.md"
    stage:
      - name: test_case_implementation_in_batch
        need_pass_llm_suggestion: false
        need_fail_llm_suggestion: false
        desc: "分批测试用例实现与对应bug分析[{COMPLETED_CASES}/{TOTAL_CASES}]"
        task:
          - "第1步：逐个打开以下当前批次测试模板，完整阅读函数的docstring、注释、TASK/TODO、已有mark_function和覆盖约束；这些内容定义模板的原始测试意图，不能跳过或只按文件名、函数名猜测": "{LIST_CURRENT_CASES}"
          - "第1步补充：保留模板已经提供的fixture参数、import、mark_function和普通DUT访问路径；当前批次默认禁止编辑{OUT}/tests/{DUT}_api.py及{OUT}/tests/{DUT}_function_coverage_def.py，不得通过修改fake DUT或fixture绕过覆盖率关联"
          - "第2步：对每个模板，从mark_function确定完整FG/FC/CK路径，并在{OUT}/{DUT}_functions_and_checks.md中定位对应CK原文；逐项分析其触发前提、输入组合、状态/时序、边界/异常行为和预期输出，并结合{OUT}/tests/{DUT}_function_coverage_def.py中的对应覆盖约束形成测试契约"
          - "第3步：依据模板注释和测试契约设计针对性激励与严格断言；CK的每项关键条件都要有对应输入或状态设置，每项预期结果都要有能够区分DUT正确与错误行为的expected/actual检查"
          - "  - 设计断言前必须确认结果何时有效：一次Step只推进仿真，不代表事务完成。阅读API/driver实现，确认其是否已Step或等待，并按规格要求的采样边沿、固定N周期、response valid/done/ack或busy清零条件读取输出；禁止API调用后机械地Step一次就断言data"
          - "  - 禁止仅调用API、只确认没有异常、只检查类型/非空、使用无依据的宽松范围，或仅声明mark_function而没有实际验证CK行为"
          - "第4步：若模板注释、CK原文、覆盖约束或DUT接口契约不一致，必须查阅相关文件定位原因并修正测试意图，不得静默忽略差异"
          - "第5步：使用API接口调用芯片功能，避免直接操作底层信号"
          - "第6步：覆盖CK要求的典型值、边界值、特殊值及必要的状态、时序和异常组合"
          - "第7步：添加严格断言检查输出是否符合预期（Eg: assert actual == expected, error_msg）；测试函数包含ref_model fixture时，可以通过assert actual == ref_model.some_function(input)进行独立比对"
          - "第8步：完成上述所有测试用例后，立即用RunTestCases('{TEST_BATCH_RUN_ARGS}')检查运行结果"
          - "第9步：分析测试结果："
          - "  - 如果Pass且结果符合预期，则继续通过Check工具进行阶段检查"
          - "  - 如果Fail：先核对功能规格和源码，排除测试代码、断言、预期值、fixture/API、参考模型、复位/时序和环境问题；属于这些问题时修复后必须Pass，不得以测试Bug或BG-*-0占位保留Fail"
          - "  - 波形判错前必须阅读测试使用的API/driver、callback和Step顺序，明确输入驱动边沿、ready/valid或等价接受条件、输出有效条件、backpressure和latency，并核对测试是否过早读取或重复Step；只有协议允许的同一事务响应窗口中的expected/actual差异才能支持Bug。任意时间点或无效周期的data不一致只能继续调查，不能直接生成BG"
          - "  - 最终WaveInfo调用必须填写完整signal_groups：时序DUT的时钟、当前功能相关的输入数据/选择/使能、输出数据/状态/有效位、真实协议接受/响应控制，以及至少一个功能选择/状态/错误传播关键路径；组合DUT明确声明combinational且不虚构时钟。在线viewer必须显示同一签名信号集合，禁止只查看目标result后判Bug"
          - "  - 只有正确测试稳定复现DUT缺陷时才保留Fail。每个BG/TC紧跟<WAVEFORM-REF>，每个TC在中央<WAVEFORM-EVIDENCE>中恰有一份真实receipt记录；同一TC多Bug时bug_tags、bug_evidence和顶层信号并集必须完整。YAML和viewer只放在中央记录中"
          - "  - record_dynamic_bug.py仅为可选骨架辅助；不可用时按Guide用文本工具建立相同标签。必须继续调用WaveInfo/ApplyWaveInfoEvidence，并完成共享alignment_evidence、逐Bug证据和八个分析字段，删除全部<BUG-TODO>"
          - "  - WaveInfo收据陈旧、缺失或无法重放时，必须重跑对应失败用例并重新调用WaveInfo更新证据；只要正确实现的测试仍Fail，禁止通过删除<TC-*>、<BG-*>或整个FG/FC/CK分支规避门禁。只有正确测试已经Pass或证据证明该记录并非DUT Bug时，才可按Guide重新分类或删除动态记录"
          - "  - WaveInfo inventory只允许用于发现测试名；拿到recommended_call后，下一次调用必须使用其中的非空test_case_name。不要重复空参数inventory，也不要给可选参数传null，应使用schema中的空字符串、空数组或-1哨兵"
          - "  - 只传pattern且没有logged_cycle+clock_signal或完整start_step+end_step时只是探索调用；按recommended_evidence_call重调后，将新receipt交给ApplyWaveInfoEvidence写入该TC中央记录。不得手工复制机器字段、viewer token或effective窗口"
          - "  - 重跑时在断言日志中打印cycle_basis、transaction ID、相关pin和真实握手/状态；日志cycle必须经clock occurrence index对齐，不能直接当作wave step。WaveInfo的pattern/timeline应覆盖ready/valid或DUT实际使用的等价请求接受、响应有效、状态和事务锚点；<BG-STATIC-*>只允许存在于{DUT}_static_bug_analysis.md，动态bug文档必须使用独立<BG-NAME-xx>并提供confirmed波形证据"
          - "  - 触发bug对应的测试用例必须 Fail，不能误报为 Pass"
          - "  - 当前批次通过条件：Pass用例行为正确；每个Fail都是完成上述全部动态证据的DUT Bug。任何未分类Fail、测试/基础设施Fail或仅BG-*-0占位的Fail都必须继续修正"
          - "第10步：Check前逐个复核：模板注释中的测试意图已经落实，CK原文的关键条件均有对应激励，CK预期结果均有严格断言；mark_function本身不等于完成CK验证"
          - "第11步：完成所有目标测试用例后，使用Check工具进行阶段检查"
          - "注意："
          - "  - 在该阶段，有需要可以增加测试用例，但不能删除已有用例"
          - "  - 测试用例应当与功能点、测试点精准对应，不要冗余，不要一个测试用例关联过多功能点、测试点"
          - "  - 如果功能点有bug，那么bug对应的具体检测点应当不通过，且至少有一个关联的针对性测试用例失败(Fail)"
          - "  - 如果功能点正常，那么对应的检测点应当通过，且至少有一个关联的针对性测试用例通过(Pass)"
          - "  - 你非常关注Fail的测试用例，因为Fail可能意味着bug，发现确实是bug，你会保留测试用例为Fail并在bug分析文档中基于源码进行详细分析并给出修复建议"
          - "  - 如果源码不存在，需要给出可能的设计缺陷分析和修复建议"
          - "  - 不能为了让测试通过而修改测试逻辑，例如使用不合理的断言等，必须确保测试逻辑正确，否则会掩盖bug"
          - "完成进度：{COMPLETED_CASES}/{TOTAL_CASES}个测试用例已完成"
          - "测试函数包含ref_model fixture时，请特别关注比对验证结果；如果发现参考模型实现有误，也请及时修正参考模型代码，确保参考模型的正确性"
        skill_list:
          - "unitytest/test-case-implementation-in-batch"
        reference_files:
          - "{OUT}/{DUT}_functions_and_checks.md"
          - "{OUT}/tests/{DUT}_function_coverage_def.py"
          - "Guide_Doc/dut_test_case.md"
          - "Guide_Doc/dut_bug_analysis.md"
          - "{OUT}/{DUT}_static_bug_analysis.md"
        checker:
        - name: no_conftest_file
          clss: FilesMustNotExist
          args:
            target_files:
             - ["{OUT}/**/conftest.py",
                "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
        - name: batch_test_cases_implementation_check
          clss: "UnityChipCheckerBatchTestsImplementation"
          args:
            doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
            doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
            test_dir: "{OUT}/tests"
            ignore_tc_prefix:
              - "test_api_{DUT}_env_"
              - "test_api_{DUT}_reference_model_"
              - "test_api_{DUT}_mock_"
            batch_size: $(BATCH_SIZE_TC: 10)
            data_key: "TEST_TEMPLATE_IMP_REPORT"
            pre_report_file: "{OUT}/.TEST_TEMPLATE_IMP_REPORT.json"
            args_check: $(NEED_REF_MODEL: false)
            args_pattern: ["env", "ref_model"]
            args_error_msg: "第一个参数必须为env，第二个参数必须为ref_model"
            ret_std_out: false
            ret_std_error: false
        - name: waveform_bug_analysis_check
          clss: "UnityChipCheckerWaveformBugAnalysis"
          args:
            bug_file: "{OUT}/{DUT}_bug_analysis.md"
            test_dir: "{OUT}/tests"
        need_human_check: false # 验证复杂DUT时建议开启该人工检查

  - name: refine_test_cases_based_on_functional_points
    desc: "按功能点完善测试用例[{COMPLETED_CKS}/{TOTAL_CKS}|{TOTAL_TCS}]"
    task:
      - "目标：按批次基于功能点和测试点完善测试用例，确保所有功能点和测试点都被充分覆盖"
      - "第1步：阅读当前批次功能点/测试点说明和关联测试用例，理解每个CK需要验证的行为、边界条件和预期结果"
      - "第2步：逐个分析当前批次CK对应的测试用例，确认测试逻辑是否真实覆盖该CK，而不是仅声明了mark_function"
      - "第3步：如果覆盖不充分、断言不足、输入场景太少、预期结果不清晰，或测试逻辑有误，请修改或补充测试用例"
      - "第4步：每完成当前批次中的一部分或全部CK测试用例完善后，调用Check(stage_args={\"refined\":{...}})记录这些CK已完成复核与完善"
      - "第5步：所有批次都通过Check后，调用Complete完成阶段；如果最后一批尚未Check，也可以直接调用Complete(stage_args={\"refined\":{...}})"
      - "注意："
      - "  - 如果没必要，该阶段不要修改文件{OUT}/{DUT}_functions_and_checks.md"
      - "  - 部分用例仅仅只是声明了覆盖某CK-*，但没有实际测试逻辑，需要补充测试逻辑"
      - "  - 尽可能的只让一个测试用例覆盖一个功能点和测试点，避免一个测试用例覆盖过多功能点和测试点"
      - "  - 尽可能多编写用例，也不要删除已有用例，确保每个功能点和测试点都有充分的测试"
      - "  - 每个Fail必须先排除测试/断言/预期值/fixture/API/参考模型/时序/环境问题；非DUT Bug失败必须修复到Pass。只有确认的DUT设计Bug复现用例可保留Fail，并且必须在{OUT}/{DUT}_bug_analysis.md中具有非零置信度动态Bug、CK、源码根因和真实WaveInfo confirmed证据；BG-*-0不能解释Fail"
      - "  - 当前阶段使用统一的stage_args参数，不要传递顶层refined/generated/bug_list；优先传入真实JSON对象。此阶段约定stage_args中的refined为CK到完善说明的映射：stage_args={\"refined\":{CK_KEY_1:Value1, CK_KEY_2:Value2, ...}}；嵌套对象无法正确传递时，可以把完整stage_args JSON对象作为字符串传入"
      - "  - stage_args.refined中的CK_KEY必须来自当前批次待完善CK（见下方{LIST_CURRENT_CKS}中的CK字段），不能传入其他批次的CK，也不能传入文档中不存在的CK"
      - "  - stage_args.refined的Value为该CK对应测试用例的完善说明；只要某个CK出现在stage_args.refined中，就表示该CK对应测试用例已经完成复核与完善"
      - "  - 如果某个CK尚无关联测试用例，请先新增或修正测试用例及mark_function标记，再在stage_args.refined中说明新增/修正情况"
      - "  - 如果某个CK已有测试用例但覆盖不足，请补充输入场景、边界条件、异常路径、断言和预期结果，再在stage_args.refined中说明完善内容"
      - "  - 对象调用示例：Check(stage_args={\"refined\":{\"FG-A/FC-A-1/CK-A-1\":\"已新增边界输入和输出断言，确认测试逻辑真实覆盖该CK\", \"FG-B/FC-B-2/CK-B-2\":\"已有用例覆盖充分，补充了预期结果注释并确认断言有效\"}})"
      - "  - 字符串fallback示例：Check(stage_args=\"{\\\"refined\\\":{\\\"FG-A/FC-A-1/CK-A-1\\\":\\\"已新增边界输入和输出断言\\\"}}\")；字符串内容必须是完整合法JSON对象"
      - "  - 最后一批示例工具参数：Complete(stage_args={\"refined\":{\"FG-C/FC-C-3/CK-C-3\":\"已补充异常输入场景和bug复现断言\"}})；如果Check已经提示全部CK完成，则直接调用Complete()即可"
      - "当前批次待完善CK、文档说明节选和关联测试用例（stage_args.refined的key只能从这里的CK字段选择）": "{LIST_CURRENT_CKS}"
      - "当前完善进度": "{COMPLETED_CKS}/{TOTAL_CKS}"
    reference_files:
      - "{OUT}/{DUT}_functions_and_checks.md"
      - "Guide_Doc/dut_test_case.md"
      - "Guide_Doc/dut_bug_analysis.md"
    checker:
      - name: no_conftest_file
        clss: FilesMustNotExist
        args:
          target_files:
           - ["{OUT}/**/conftest.py",
              "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
      - name: refine_test_cases_check
        clss: "UnityChipCheckerRefineTestCases"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
          batch_size: $(BATCH_SIZE_TC: 10)
          data_key: "TEST_TEMPLATE_IMP_REPORT"
      - name: test_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
        extra_args:
          max_try: -1
      - name: waveform_bug_analysis_check
        clss: "UnityChipCheckerWaveformBugAnalysis"
        args:
          bug_file: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"

  - name: static_bug_validation
    desc: "静态分析Bug验证与动态关联"
    task:
      - "目标：通过动态测试消除{OUT}/{DUT}_static_bug_analysis.md中所有<LINK-BUG-[BG-TBD]>占位标签，建立静态Bug与动态Bug的标签级追踪链接"
      - "静态报告使用独立行<STATIC-BUG-SUMMARY>、<STATIC-BUG-DETAILS>、<STATIC-BUG-PROGRESS>作为唯一机器分区，必须各出现一次且顺序固定；显示标题可以本地化，不能替代机器分区标签"
      - "第1步：扫描{OUT}/{DUT}_static_bug_analysis.md，列出所有 '<LINK-BUG-[BG-TBD]>' 标签，确认每个待验证的<BG-STATIC-*>条目"
      - "第2步：检查{OUT}/{DUT}_bug_analysis.md及已有测试用例，确认是否有测试用例已能对应某些<LINK-BUG-[BG-TBD]>条目"
      - "  - 若已有Fail测试用例可证实该静态Bug：直接执行第3步替换，无需重复编写"
      - "  - 若尚无针对该Bug的测试：进入第3步编写验证用例"
      - "第3步：针对每个仍为<LINK-BUG-[BG-TBD]>的静态Bug，编写动态验证测试用例"
      - "  - 测试文件写入{OUT}/tests/test_{DUT}_static_verify_*.py"
      - "  - 测试函数命名格式：test_static_{DUT}_<BugId>，例如test_static_{DUT}_bg_static_001"
      - "  - 通过`from {DUT}_api import *`导入env fixture和API"
      - "  - 在测试函数开始处添加功能覆盖标记（若有对应的<CK-*>检测点）"
      - "  - 动态复现后调用WaveInfo和ApplyWaveInfoEvidence：BG侧只保留TC与<WAVEFORM-REF>，每个TC的唯一YAML/viewer位于中央<WAVEFORM-EVIDENCE>。同一TC多Bug共享记录并暴露信号并集"
      - "  - 波形确认由LLM做协议语义审查：先阅读规格和测试API/driver、callback、Step顺序，确认驱动边沿、ready/valid或等价接受条件、busy/backpressure、响应latency和事务归属；不能把协议无效窗口或任意单点data mismatch直接当成静态候选已被动态证实"
      - "  - 最终WaveInfo的signal_groups必须覆盖时钟（若有）、当前静态候选涉及的输入数据/控制、输出数据/状态/有效位、真实协议控制和至少一个能连接静态根因与接口现象的关键内部/状态信号；viewer必须显示该完整集合，pattern仍只用于事件定位"
      - "  - 不得假设调用API后一个Step结果就有效；必须确认API内部是否已Step/等待，并按规格规定的边沿、周期数、valid/done/ack或busy清零条件采样。过早读取导致的Fail是测试时序问题，应修复后重跑"
      - "  - 只有{OUT}/{DUT}_bug_analysis.md中的动态Bug需要波形；{OUT}/{DUT}_static_bug_analysis.md中的纯静态分析条目不需要waveform_analysis YAML块；<BG-STATIC-*>严禁写入动态Bug文档，动态测试证实后必须新建<BG-NAME-xx>并提供status: confirmed波形证据"
      - "第4步：根据测试结果更新{OUT}/{DUT}_static_bug_analysis.md中的<LINK-BUG-[BG-TBD]>标签"
      - "  情况A - 测试Fail（Bug已证实）："
      - "    1. 在{OUT}/{DUT}_bug_analysis.md中添加完整动态Bug记录（含<FG-*>/<FC-*>/<CK-*>/<BG-NAME-xx>/<TC-*>完整层级）"
      - "       - record_dynamic_bug.py是可选辅助；不可用时按Guide用文本工具建立相同BG/TC/引用骨架。随后完成中央共享与逐Bug波形字段、八个分析字段和源码因果标签，清除全部<BUG-TODO>后才能执行linkbug.py"
      - "    2. 将该静态Bug的 '<LINK-BUG-[BG-TBD]>' 替换为实际动态Bug标签"
      - "       - 若只对应一个动态Bug：<LINK-BUG-[BG-FSM-DEAD-92]>"
      - "       - 若对应多个动态Bug：<LINK-BUG-[BG-FSM-DEAD-92][BG-FSM-DEFAULT-85]>"
      - "    3. 同步更新汇总表格中的'动态Bug关联'列"
      - "  情况B - 测试Pass（误报）："
      - "    1. 将该静态Bug的 '<LINK-BUG-[BG-TBD]>' 替换为 '<LINK-BUG-[BG-NA]>'"
      - "    2. 在 '<LINK-BUG-[BG-NA]>' 下方可选添加一行误判说明（如 '- 误判说明：...'）"
      - "    3. 同步更新汇总表格中的'动态Bug关联'列为 LINK-BUG-[BG-NA]"
      - "  - LINK回填不依赖linkbug.py：对已有静态报告使用ReplaceStringInFile分别同步修改<STATIC-BUG-SUMMARY>表格最后一列与<STATIC-BUG-DETAILS>中该BG-STATIC条目下唯一的<LINK-BUG-[...]>；修改前确认真实动态BG已在动态文档中完整存在，修改后重新读取两处确保值完全一致。脚本可用时仅作为执行相同校验和替换的可选方式"
      - "第5步：重复第3-4步直到所有<LINK-BUG-[BG-TBD]>均被替换"
      - "第6步：评估本次静态分析的整体效果：发现的潜在Bug数量、证实比例、误报比例及对整体验证的贡献"
      - "注意："
      - "  - 静态分析的误报是正常现象，无需为误报感到遗憾"
      - "  - 阶段完成时{OUT}/{DUT}_static_bug_analysis.md中不允许有任何<LINK-BUG-[BG-TBD]>残留，Checker会通过parse_nested_keys强制验证此规则"
      - "  - <LINK-BUG-*>标签仅在{OUT}/{DUT}_static_bug_analysis.md中使用，不出现在{OUT}/{DUT}_bug_analysis.md中"
      - "  - 已证实的Bug必须有对应Fail测试用例，不能误报为Pass"
      - "  - 已实现测试的Fail只有两种处理结果：确认DUT设计Bug后保留正确断言的Fail并完成动态波形取证；否则修复测试或验证基础设施直到Pass。禁止用测试Bug、assert False或BG-*-0保留失败；该限制不适用于此前create_test_case_templates阶段按要求生成的未实现空模板，但实现模板时必须删除其assert False占位"
      - "  - 所有文档内容使用{DOC_GEN_LANG}编写"
    skill_list:
      - "unitytest/static-bug-validation"
    reference_files:
      - "{OUT}/{DUT}_static_bug_analysis.md"
      - "{OUT}/{DUT}_bug_analysis.md"
      - "Guide_Doc/dut_bug_analysis.md"
      - "Guide_Doc/dut_test_case.md"
    checker:
      - name: no_conftest_file
        clss: FilesMustNotExist
        args:
          target_files:
            - ["{OUT}/**/conftest.py",
               "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
      - name: no_pending_static_bugs
        clss: "UnityChipCheckerStaticBugValidation"
        args:
          static_doc: "{OUT}/{DUT}_static_bug_analysis.md"
          bug_analysis_doc: "{OUT}/{DUT}_bug_analysis.md"
          functions_and_checks_doc: "{OUT}/{DUT}_functions_and_checks.md"
      - name: static_confirmed_bugs_test_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
          args_check: $(NEED_REF_MODEL: false)
          args_pattern: ["env", "ref_model"]
          args_test_func_prefix: "test_static_{DUT}_"
          args_error_msg: "静态Bug动态验证测试的第一个参数必须为env，第二个参数必须为ref_model"
    need_human_check: false

  - name: line_coverage_analysis_and_improvement
    desc: "代码行覆盖率分析与提升{COVERAGE_COMPLETE}"
    task:
      - "目标：查漏补缺，对测试过程进行回顾，提代码行覆盖率"
      - "第1步：运行Check方法获取代码行覆盖率信息"
      - "第2步：如果代码行覆盖率符合要求，直接调用Complete进入下一个阶段"
      - "第3步：如果代码行覆盖率不符合要求，分析未覆盖的代码行"
      - "第4步：针对未覆盖的代码行，设计并实现补充测试用例"
      - "第5步：补充测试完成后，重新运行Check方法，验证代码行覆盖率是否提升"
      - "第6步：重复上述过程，直到代码行覆盖率符合要求"
      - "注意："
      - " - {DUT}的verilog源文件均位于{DUT}/目录下，其依赖或者上层语言源文件位于{RTL_PATH}/目录下，文件后缀可能是.v、.sv、.vh、.scala等，需要你自行识别，例如：{RTL_PATH}/{DUT}.scala"
      - " - 可编辑的代码行ignore文件位于{OUT}/tests/{DUT}.ignore，你可以根据需要进行调整"
      - " - ignore的Pattern请以*/开头，例如*/path_in_workspace/to_be_ignored.sv[:line_number_start-line_number_end, ...]，其中path_in_workspace为相对于workspace的路径，没有同名文件时可省略，例如*/to_be_ignored.sv[:line_number_start-line_number_end, ...]"
      - " - ignore Pattern中代码行的格式为line_number_start-line_number_end，单行代码也为该格式，例如第10行代码需要标记为10-10"
      - " - 任务中涉及到的文档和注释，主体需要用{DOC_GEN_LANG}编写"
    checker:
      - name: line_coverage_check
        clss: "UnityChipCheckerTestCaseWithLineCoverage"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
          min_line_coverage: $(MIN_LINE_COV_RATE: 0.9) # 根据需要调整覆盖率要求，例如0.7表示70%，建议初始要求不要太高，完成所有功能测试后再提升该值大于95%
    need_human_check: false # 验证复杂DUT时建议开启该人工检查

    reference_files:
          - "Guide_Doc/dut_line_coverage.md"
    skip: true # default skip this stage, can be enabled if needed

  - name: generate_random_test_cases
    desc: "随机测试用例生成[{COMPLETED_CKS}/{TOTAL_CKS}|{TOTAL_RANDOM_TEST_COUNT}]"
    task:
      - "目标：按批次分析{OUT}/{DUT}_functions_and_checks.md中的所有CK，针对确实需要随机激励的CK编写随机测试用例"
      - "第1步：阅读当前批次待分析CK的文档说明，理解每个CK的功能行为、输入约束、边界条件和预期结果"
      - "第2步：逐个判断当前批次CK是否适合随机测试："
      - " - 如果随机输入能扩大输入空间、组合空间、状态转移空间或边界覆盖，请生成针对该CK的随机测试用例"
      - " - 如果该CK是固定API存在性、单点复位行为、简单常量输出、已被穷举覆盖的小输入域，或随机激励不能增加有效验证价值，可以跳过该CK，但必须说明跳过原因"
      - "第3步：需要随机测试的CK，请编写随机测试用例到文件{OUT}/tests/test_{DUT}_random_<name>.py"
      - " - 测试函数命名格式：test_random_<name>"
      - " - 测试函数的第一个参数为env (pytest fixture)"
      - " - 在测试函数最开始添加覆盖率标记，例如：env.dut.fc_cover['FG-XXX'].mark_function('FC-YYY', test_func, ['CK-ZZZ', ...])"
      - " - mark_function中的FG/FC/CK名称建议使用字符串字面量，便于后续追踪该随机用例覆盖了哪个CK"
      - " - 测试函数中使用随机数生成器生成测试数据，可以使用Python的random模块，或者numpy等库"
      - " - 通过生成的随机数据计算预期结果 expected_output"
      - " - 调用DUT的API函数进行测试，获取实际结果 actual_output"
      - " - 使用合理的断言检查DUT的输出是否与预期结果一致： assert actual_output == expected_output, ..."
      - "第4步：每完成当前批次中的一部分或全部CK随机测试分析后，调用Check(stage_args={\"generated\":{...}})记录这些CK已完成随机测试生成或跳过"
      - "第5步：所有批次都通过Check后，调用Complete完成阶段；如果最后一批尚未Check，也可以直接调用Complete(stage_args={\"generated\":{...}})"
      - "第6步：编写随机测试用例过程中，如果发现bug需要进行记录和分析"
      - "注意："
      - " - <name>需要合理，例如按功能点命名"
      - " - 一个随机测试用例可以覆盖多个测点、功能点，但必须确保每个被标记的CK都被真实验证，不要只声明mark_function"
      - " - 多个随机测试用例之间尽可能不要有过多覆盖点交叉，避免冗余"
      - " - 每个用例都必须设置独立的随机种子以确保测试可重复"
      - " - 测试用例必须用 ucagent.repeat_count() 获取当前随机循环次数"
      - " - 如果用例有测试区间，需要通过pytest的参数化模式进行区间控制"
      - " - 其他用例要求请参考文档 Guide_Doc/dut_test_case.md"
      - " - 需要有合理的断言来检查输出是否符合预期，是否正确"
      - " - 如果随机测试Fail且测试逻辑合理，可能发现了芯片bug，需要保留Fail用例并在{OUT}/{DUT}_bug_analysis.md中基于源码分析bug和修复建议"
      - " - 随机测试中的测试代码、oracle/预期值、fixture/API、参考模型、复位/时序或环境失败必须修复到Pass；只有正确测试稳定复现DUT设计Bug时才保留Fail，并完成非零置信度动态Bug、CK、源码根因和WaveInfo confirmed证据"
      - " - 随机测试动态复现Bug后调用WaveInfo与ApplyWaveInfoEvidence；BG侧写<WAVEFORM-REF>，唯一YAML/viewer集中到<WAVEFORM-EVIDENCE>。同一TC多Bug共享记录且信号取并集；不得修改receipt字段或token，status: unavailable不能完成阶段"
      - " - 随机波形中的单点data mismatch不能直接判Bug；LLM必须从规格和测试驱动代码确认ready/valid或等价接受/响应条件、Step采样边沿、backpressure、latency和事务归属，只在协议有效的失败事务窗口比较expected/actual"
      - " - 随机测试的最终WaveInfo signal_groups必须包含DUT时钟（若有）、生成该事务的相关输入、被检查的相关输出、协议有效/接受控制和至少一个能解释功能选择或错误传播的关键路径；在线viewer必须展示同一签名集合，不能只保留被断言的数据总线"
      - " - 随机测试不能固定假设一个Step后结果有效；先检查API是否内部推进/等待，再按真实边沿、latency、valid/done/ack或busy条件采样，否则先修复测试时序"
      - " - 当前阶段使用统一的stage_args参数，不要传递顶层refined/generated/bug_list；优先传入真实JSON对象。此阶段约定stage_args中的generated为CK到随机测试处理说明的映射：stage_args={\"generated\":{CK_KEY_1:Value1, CK_KEY_2:Value2, ...}}；嵌套对象无法正确传递时，可以把完整stage_args JSON对象作为字符串传入"
      - " - stage_args.generated中的CK_KEY必须来自当前批次待分析CK（见下方{LIST_CURRENT_CKS}中的CK字段），不能传入其他批次的CK，也不能传入文档中不存在的CK"
      - " - stage_args.generated的Value只需要说明该CK的处理结果即可，可以是简单字符串，也可以是包含更多信息的对象，不强制固定字段"
      - " - 如果已生成随机用例，请在stage_args.generated的Value中简要说明新增/复用的随机用例、随机策略或断言；如果无需生成随机用例，请说明跳过原因"
      - " - 对象调用示例：Check(stage_args={\"generated\":{\"FG-A/FC-A-1/CK-A-1\":\"已新增tests/test_{DUT}_random_a.py::test_random_a，固定seed并通过ucagent.repeat_count循环随机输入\", \"FG-B/FC-B-2/CK-B-2\":\"该CK为固定复位后默认值检查，已有定向用例覆盖，随机输入不能增加有效覆盖\"}})"
      - " - 字符串fallback示例：Check(stage_args=\"{\\\"generated\\\":{\\\"FG-A/FC-A-1/CK-A-1\\\":\\\"已新增确定性随机边界测试和输出断言\\\"}}\")；字符串内容必须是完整合法JSON对象"
      - " - 最后一批示例工具参数：Complete(stage_args={\"generated\":{\"FG-C/FC-C-3/CK-C-3\":\"已新增随机边界输入和非法组合过滤，并添加输出断言\"}})；如果Check已经提示全部CK完成，则直接调用Complete()即可"
      - "当前批次待分析CK和文档说明节选（stage_args.generated的key只能从这里的CK字段选择）": "{LIST_CURRENT_CKS}"
      - "当前随机测试分析进度": "{COMPLETED_CKS}/{TOTAL_CKS}"
      - "测试函数包含ref_model fixture时，请特别关注比对验证结果；如果发现参考模型实现有误，也请及时修正参考模型代码，确保参考模型的正确性"
    checker:
      - name: no_conftest_file
        clss: FilesMustNotExist
        args:
          target_files:
           - ["{OUT}/**/conftest.py",
              "Can not use conftest.py, you need use 'from {DUT}_api import *' to import all things you need."]
      - name: random_test_check
        clss: "RandomTestCasesChecker"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          target_test_file: "{OUT}/tests/test_{DUT}_random*.py"
          batch_size: $(BATCH_SIZE_RANDOM_TC: 10)
          data_key: "RANDOM_TEST_CASES_REPORT"
          args_check: $(NEED_REF_MODEL: false)
          args_pattern: ["env", "ref_model"]
          args_test_func_prefix: "test_random_"
          args_error_msg: "第一个参数必须为env，第二个参数必须ref_model"
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    output_files:
      - "{OUT}/tests/test_{DUT}_random*.py"
    reference_files:
      - "Guide_Doc/dut_test_case.md"
      - "Guide_Doc/dut_bug_analysis.md"
      - "Guide_Doc/dut_test_case_random.md"
      - "{OUT}/{DUT}_functions_and_checks.md"
      - "{OUT}/{DUT}_static_bug_analysis.md"

  - name: verification_review_and_summary
    desc: "验证审查与总结"
    task:
      - "目标：查漏补缺，对测试过程进行回顾，提炼经验教训"
      - "第1步：逐个审查{OUT}/{DUT}_bug_analysis.md中的每个非零置信度<BG-*>，不能只检查标签存在或删除占位符："
      - "  1.1 重新打开该BG关联的每个失败<TC-*>及其失败日志，确认严格断言、expected/actual、事务上下文和FG/FC/CK关联均正确；测试或基础设施问题必须修复到Pass，不得保留为DUT Bug"
      - "  1.2 使用TC中央记录中的真实receipt审查confirmed证据；核对共享alignment_evidence及当前bug_evidence.<BG>下的required_signals、observed_behavior、source_correlation。信号必须属于顶层签名信号并集，结论必须落在真实事务和有效响应窗口；若新增Bug需要更多信号，重新取证并替换中央记录"
      - "  1.2.1 核对每个receipt的signal_groups和在线viewer是否同时包含时钟（若有）、相关输入、相关输出、协议控制及功能关键路径；只显示目标data、缺少valid/ready等实际有效性锚点或缺少解释根因的关键状态时，必须重新调用最终WaveInfo补齐证据"
      - "  1.3 重新读取<BUG-SOURCE-EVIDENCE>引用的真实RTL/HDL行及其上下文，独立核对<BUG-SOURCE-FIRST-ERROR>是否为首个错误决策、<BUG-SOURCE-PROPAGATION>是否解释错误如何到达输出、<BUG-SOURCE-OBSERVABLE>是否与波形可见后果一致；禁止只复述失败现象、测试名称或source_correlation"
      - "  1.4 逐项核对<BUG-OVERVIEW>至<BUG-RETEST>八个字段：根因必须同时解释expected/actual和波形，修复必须直接消除首错而不是只掩盖输出，风险与复验必须覆盖受影响路径；发现泛化、猜测、行号不实或证据矛盾时直接重写对应字段"
      - "  1.5 有源码分支必须使用真实path:L1-L2和完整HDL fenced代码块，三个<BUG-SOURCE-*>标签各一次且位于代码块内；无源码分支只使用<BUG-SOURCE-UNAVAILABLE>并完成黑盒因果分析，两种分支不得混用。不得依赖中文展示标题或自然语言占位词判断完成状态"
      - "  1.6 完成一个BG后重新读取其完整范围，确认所有TC波形、根因、源码证据、因果链、修复和复验互相一致，再继续下一个BG；不得因record_dynamic_bug.py成功或字段形式完整而跳过语义审查"
      - "第2步：回顾{OUT}/{DUT}_static_bug_analysis.md，确认所有静态分析Bug的验证结论已完整记录，已证实的Bug在{OUT}/{DUT}_bug_analysis.md中均有对应完整记录"
      - "第3步：再次阅读{DUT}的所有源代码，确认是否有遗漏的bug，若发现新bug，补充测试用例并进行bug记录"
      - "第4步：对所有测试用例进行回顾，确认测试逻辑合理，确认用例中的所有assert都合理有效"
      - "第5步：总结测试经验，形成文档{OUT}/{DUT}_test_summary.md"
      - "第6步：回顾验证规划{OUT}/{DUT}_verification_needs_and_plan.md，检测是否满足验证需求"
      - "第7步：根据需要判断是否进行验证补充，或者调整验证规划"
      - "第8步：如果有必要可通过 GotoStage工具重新进入某个阶段进行补充验证"
      - "注意：任务中涉及到的文档和注释，主体需要用{DOC_GEN_LANG}编写"
    reference_files:
      - "Guide_Doc/dut_bug_analysis.md"
      - "Guide_Doc/dut_test_summary.md"
      - "{OUT}/{DUT}_static_bug_analysis.md"
    output_files:
      - "{OUT}/{DUT}_test_summary.md"
    checker:
      - name: test_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
      - name: waveform_bug_analysis_check
        clss: "UnityChipCheckerWaveformBugAnalysis"
        args:
          bug_file: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
    need_human_check: false # 验证复杂DUT时建议开启该人工检查

  - name: record_and_report_bugs
    desc: "记录并同步所有已确定的Bug[{COMPLETED_BUGS}/{TOTAL_BUGS}]"
    task:
      - "目标：完整记录{OUT}/{DUT}_bug_analysis.md中置信度不为0的所有Bug，并关联{OUT}/{DUT}_static_bug_analysis.md中已经动态确认的静态Bug；置信度为0的Bug无效，必须忽略"
      - "第1步：阅读下方当前批次待记录Bug及其document_blocks、alias和ref，确认每个Bug关联的CK、置信度、静态Bug别名及文档上下文"
      - "第2步：根据当前批次信息整理stage_args中的bug_list，并调用Check(stage_args={\"bug_list\":[...]})记录当前批次的一部分或全部Bug"
      - "第3步：根据更新后的当前批次列表继续记录，直到{OUT}/{DUT}_bug_analysis.md中所有置信度不为0的Bug全部完成；记录不能多于或少于current_batch要求的有效Bug，置信度为0的Bug不记录且不计入总数"
      - "第4步：全部Bug记录完成后调用Complete()完成当前阶段；如果最后一批尚未通过Check记录，也可以直接调用Complete(stage_args={\"bug_list\":[...]})"
      - "最终分类门禁：每次Check/Complete先重跑全部DUT测试并核对Fail与BG/TC/CK；因此不得删除仍由正确测试稳定复现的动态Bug来缩小current_batch或规避收据错误。测试/基础设施问题修复到Pass后才能移除错误记录，真实DUT Bug必须保留Fail并更新证据"
      - "最终波形门禁：Check/Complete会再次扫描动态Bug文档中的全部非零置信度Bug，只接受真实WaveInfo收据支持且可在当前最新波形重放的status: confirmed证据；status: unavailable不能完成；动态Bug文档禁止<BG-STATIC-*>，静态发现只能保留在独立静态文档并通过<LINK-BUG-*>关联；没有动态Bug或只有置信度0条目时不要求WaveInfo"
      - "最终波形重放前必须运行完整DUT测试集合；增量阶段只运行部分用例时，不要删除或改写已有TC的有效签名证据，但最终门禁不会跳过任何动态Bug TC的重放"
      - "stage_args.bug_list格式：优先把stage_args作为真实JSON对象传入，本阶段约定其中bug_list为JSON数组；如果嵌套对象无法正确传递，可以把完整stage_args JSON对象作为字符串传入，但不要只把bug_list数组单独编码成字符串。数组中的每个对象表示一个唯一Bug，并且必须包含bug_name、alias、CK、desc、locations、severity、confidence和ref字段"
      - "bug_name：字符串，填写{OUT}/{DUT}_bug_analysis.md中<BG-BUG_NAME-XX>标签的BUG_NAME部分，例如CIN_OVERFLOW；不要额外创造文档中不存在的Bug"
      - "alias：字符串数组，必须完整填写{OUT}/{DUT}_static_bug_analysis.md中通过<LINK-BUG-[BG-BUG_NAME-XX]>确认关联到该动态Bug的全部<BG-STATIC-*>标签名，例如[\"BG-STATIC-001-CIN_OVERFLOW\"]；一个动态Bug可有多个alias，一个静态Bug也可关联多个动态Bug；没有已确认静态Bug时填写空数组[]；BG-TBD、BG-NA和BG-STATIC-NULL不能作为alias"
      - "CK：非空字符串数组，必须包含该Bug在文档中关联的全部CK；优先使用FG/FC/CK完整路径，例如FG-ARITHMETIC/FC-ADD/CK-CIN-OVERFLOW；同一Bug关联多个CK时，将所有CK路径放在同一个Bug对象的CK数组中"
      - "desc：非空字符串，需要同时说明Bug现象和基于源码分析得到的根本原因，不能只填写Bug名称或简单结论"
      - "locations：非空字符串数组，每项格式为相对工作区的源码路径:起始行-结束行，例如{DUT}.v:8-14；多个不连续范围可以写成{DUT}.sv:20-24,30-32"
      - "severity：必填的Bug等级字符串，大小写不敏感，只允许lowest、low、medium、high、highest；不能省略、填写空字符串或使用其他值"
      - "confidence：非零数值，使用0.0-1.0小数或0-100百分数，例如0.98或98；数值必须与文档中<BG-BUG_NAME-XX>标签的XX完全一致；XX为0的Bug不会出现在current_batch中，禁止提交"
      - "ref：非空字符串数组，精确填写该Bug在静态和动态Bug文档中的记录行；同一文档的多个区间合并在同一个字符串中并用逗号分隔，例如[\"{OUT}/{DUT}_static_bug_analysis.md:29-39,88-100\",\"{OUT}/{DUT}_bug_analysis.md:30-100\"]；没有alias时只填写动态Bug文档的ref"
      - "调用示例：Check(stage_args={\"bug_list\":[{\"bug_name\":\"CIN_OVERFLOW\",\"alias\":[\"BG-STATIC-001-CIN_OVERFLOW\"],\"CK\":[\"FG-ARITHMETIC/FC-ADD/CK-CIN-OVERFLOW\"],\"desc\":\"最大输入叠加进位时输出被截断；根因是加法结果信号位宽不足，最高位进位被丢弃\",\"locations\":[\"{DUT}.v:8-14\",\"{DUT}.sv:20-24,30-32\"],\"severity\":\"high\",\"confidence\":0.98,\"ref\":[\"{OUT}/{DUT}_static_bug_analysis.md:29-39\",\"{OUT}/{DUT}_bug_analysis.md:30-40\"]}]})"
      - "字符串fallback示例：Check(stage_args=\"{\\\"bug_list\\\":[{\\\"bug_name\\\":\\\"CIN_OVERFLOW\\\",\\\"alias\\\":[],\\\"CK\\\":[\\\"FG-ARITHMETIC/FC-ADD/CK-CIN-OVERFLOW\\\"],\\\"desc\\\":\\\"Bug现象与源码根因\\\",\\\"locations\\\":[\\\"{DUT}.v:8-14\\\"],\\\"severity\\\":\\\"high\\\",\\\"confidence\\\":0.98,\\\"ref\\\":[\\\"{OUT}/{DUT}_bug_analysis.md:30-40\\\"]}]}\")；字符串内容必须是完整合法JSON对象"
      - "批次要求：只提交current_batch中列出的Bug；可以一次提交当前批次的一部分或全部Bug，完成后根据下一次Check返回的新current_batch继续记录"
      - "当前批次待记录Bug（stage_args.bug_list只能包含以下Bug）": "{LIST_CURRENT_BUGS}"
      - "当前记录进度": "{COMPLETED_BUGS}/{TOTAL_BUGS}"
    reference_files:
      - "Guide_Doc/dut_bug_analysis.md"
      - "{OUT}/{DUT}_bug_analysis.md"
      - "{OUT}/{DUT}_static_bug_analysis.md"
    checker:
      - name: final_test_classification_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
      - name: final_waveform_bug_analysis_check
        clss: "UnityChipCheckerWaveformBugAnalysis"
        args:
          bug_file: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          require_current_replay: true
      - name: bug_recorder
        clss: "Recorder"
        args:
          type: "bug"
          data_key: "BUG_RECORDS"
          bug_file: "{OUT}/{DUT}_bug_analysis.md"
          static_bug_file: "{OUT}/{DUT}_static_bug_analysis.md"
          output: "{OUT}/{DUT}_bug_summary.md"
          batch_size: $(BATCH_SIZE_BUG_RECORD: 10)
    need_human_check: false
