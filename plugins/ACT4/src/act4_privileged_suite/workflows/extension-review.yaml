# Existing extensions are audited without changing the input checkout.
template_overwrite:
  PROJECT: act4_extension_review
  DOC_GEN_LANG: "英文"
  ACT4_MANUAL_ROOT: "$(ACT4_MANUAL_ROOT: riscv-isa-manual)"
  ACT4_REVIEW_ROOT: "$(ACT4_REVIEW_ROOT: riscv-arch-test)"
template: ""
guide_doc:
  enable: true
  core_copy_policy:
    default_action: ignore
    retain: []
    override: []
    ignore: []
un_write_dirs: ["{GUIDE_DOC}"]
write_dirs: ["{OUT}"]
tools:
  ignore_tools: [WorkCommit]
loop_settings:
  max_stalled_rounds: 8
hooks:
  continue: >
    使用 CurrentTips、StageJournal 恢复当前阶段；环境准备仅阅读依赖清单及安装说明，独立 ISA 计划验收前不先看已有测试资产。
    计划冻结后调查资产和证据，再更新报告；
    审查完成后直接进入候选修复与报告交付。对未解决问题记录已调查内容、具体缺项、责任方和下一步，继续处理可修复项。
mission:
  name: ACT4 existing extension review
  prompt:
    tips:
      always:
        - "review_plan 仅从 ISA 设计测试；计划验收后按当前审查批次完成有来源的判断。文档编辑后普通 Check，不要重跑原生命令。"
        - "用 ACT4ReviewDocument 获取准确引文并更新结构化记录；它不能替你作语义判断。"
        - "资产审查中需要设计修复时用 ACT4ReviewDocument(action='context', finding_id='F1') 定位来源；实验通过 Check 的 experiment 参数执行，不替代正式复验。"
        - "完成所有批次并生成报告后调用 Complete；日志中记录具体未解决事项。"
      random: []
    system: >
      全面审查 {ACT4_REVIEW_ROOT} 中 {DUT} 已有的测试资产；输入可以是 riscv-arch-test 独立 clone，也可以是用户指定的本地模块资产目录，无需 Git。
      先阅读Guide_Doc/ACT4_Extension_Review_Guide.md，按其中的完整契约交付审查和修复报告。
      原始资产目录和规范输入始终只读；所有分析、命令副本、候选修复和报告写入{OUT}/{DUT}/review。不得修改 Guide_Doc、原始源码、基线快照或 checker 生成的证据。
      不依赖 Skill。review_plan 仅依据 ISA 原文和用户给定范围独立设计测试；不读已有 CTP、coverage、generator、用例、mapping、CI 或旧报告。
      独立计划冻结后才读取当前 ACT4 的文档、CI、目标配置和实际源码，不套用另一版本的命令。
      既支持 privileged 也支持 unprivileged 资产；无法适用的检查必须说明依据，不可伪报通过。
      优化不等于删除看似相似的用例：先证明义务、特权级、XLEN、配置和边界语义等价。
      能由格式、引用、条件和命令结果确定的事实先使用静态规则和真实运行证据；规范语义、遗漏、冗余等由你逐项审核，给出原文引用、推理、结论、置信度和限制，不以模板代替判断。
      资产审查时审核全部 evidence.review_tasks；AI 不能用自己的判断覆盖失败的机器结果或补造命中证据。
      编译成功、静态标签可达和真实 coverpoint 命中是三种不同证据。
      首先完成 prepare_environment；环境阶段仅阅读依赖清单和安装说明，不阅读 CTP、coverpoints、generator 或测试内容。
      后续 shell 命令先 source {OUT}/{DUT}/environment/activate.sh。公共工具复用首阶段的安装；
      独立计划完成后，在命令副本内按锁文件同步项目 Python 环境，不向原始输入安装依赖。
      开始先调用 Check，读取 environment.json 中 Questa/VCS/Xcelium 的实际探测结果。这些工具可选，不安装商业工具；缺失或许可不可用时继续审查及独立验证。
      依赖商业仿真器的 job 声明 optional_tool，generation/build/reference_model/lint 不依赖这些可选 job；未测 coverage 保留限制，不当作资产缺陷。
      无 ELF 时先执行原生测试生成、ELF 构建（含 Sail 签名和自检重编译），再执行真实测试。
      按 review_plan、review_audit、review_repair 三个阶段完成独立设计、审查、修复、复验和最终报告，自动推进。
      审查阶段冻结基线并记录修复计划；修复阶段只在 candidate 中修改 review.changes 声明的路径。
      先冻结 isa-plan.yaml，再从规范和 CTP/测试计划提取 obligations，通过 plan_items 对照全部独立计划项并追踪 coverage、generator、用例和目标配置。
      两个实现端都遗漏的义务也必须登记；独立计划不是标准答案，错误或不适用项保留 ID 并引用规范解释纠正，后续发现的义务使用空 plan_items 新增。
      assets 只放本轮实际审查的文件；共享背景放 context_files，并在 shared_assets 说明边界。
      reference_scope 为每份规范选择相关行段并解释排除部分；不能因难以审查而排除适用规则。
      按 progress-audit.json 或 progress-final.json 的当前批次推进，不反复重读整份证据与指南。
      ACT4ReviewDocument 可提取精确引文并按 ID 更新报告；仍须自己完成推理、结论和限制，不能自动填充通过或未知判断。
      分别记录问题性质 classification、诊断进度 diagnosis 和最终修复状态；不能用未修复推断问题未确认。
      缺少信息时先核查现有规范、计划、共享源码、配置和失败日志，记录 investigation 的实际动作、结果和精确引用。
      已有规范明确的行为应记实现缺口，不笼统索要规范；普通排查由 agent 继续，只有外部确实掌握的输入才请求用户帮助。
      每个 confirmed_defect 先写 repair_plan：预期行为、可区分正确/错误实现的激励和观察、资源、恢复、候选路径、验证任务、依据与下一步。
      借鉴资产生成的观察模型和资源分析，增量补齐计划、覆盖、生成器及映射，不重跑整套生成流程或覆盖已有 suite。
      新发现的问题先更新 findings、changes 和 post_assets 并校验，再实施有充分依据的修复。
      最终提供完整报告和补丁，原始仓库保持不变。
stage:
  - name: prepare_environment
    desc: 在独立 ISA 计划前准备工具环境
    task:
      - 阅读 Guide_Doc/ACT4_Environment_Guide.md，调用 Check(stage_args={"action":"probe"})。
      - 仅阅读 {ACT4_REVIEW_ROOT} 的 README 中安装段、依赖清单和 CI 安装段；不得阅读 CTP、coverpoints、testgen 或已有测试内容。仅本地资产没有依赖说明时记录缺项，不推测版本。
      - 创建 {OUT}/{DUT}/environment/plan.yaml，覆盖基础命令、uv、编译器、参考模型和 lint；依据实际版本约束填写缺失公开工具的 install。
      - 优先复用系统工具及持久化用户安装，冲突环境用 temporary；不安装商业工具。调用 Check(stage_args={"action":"prepare","timeout":3600})，阅读日志并处理可修复的错误。
      - 普通 Check 通过后 Complete，不带 action；项目特定的 Python 导入检查在 ISA 计划冻结后的命令副本执行。环境限制进入最终摘要，不降低资产审查范围。
    reference_files: ["Guide_Doc/ACT4_Environment_Guide.md"]
    checker:
      - name: act4_environment
        clss: ACT4EnvironmentChecker
        args: {environment_dir: "{OUT}/{DUT}/environment"}
  - name: review_plan
    desc: 仅依据 ISA 和用户范围独立设计验证计划，冻结后再接触已有资产
    task:
      - 第一步：读取 Guide_Doc/ACT4_Extension_Review_Guide.md section 10，调用 Check 探测可选工具。此阶段不读取既有测试资产、CI 和旧审查报告。
      - 第二步：用普通文件工具创建 {OUT}/{DUT}/review/isa-plan.yaml，填写 suite、用户给定的 target_context、ISA 原文 reference_files 和 reference_scope。
        requirements、source_reviews 先写空列表，limitations 如实说明范围或输入缺失。普通 Check 生成 isa-plan-context.json 和只读 isa-references 后提示补齐设计。
      - 第三步：仅阅读这些 ISA 来源及用户范围，为每条规则独立设计 I<number> 条目，写 requirement、applicability、stimulus、observation 和准确 basis。
        主动考虑正常行为、异常、边界值、特权级、XLEN、扩展依赖和状态切换；适用性未知时写明条件，不按已有用例决定是否需要测试。
      - 第四步：逐项填写 source_reviews，将每个来源区块映射到 requirements；无测试义务或排除部分提供来源和理由。
        可用 ACT4ReviewDocument(document='isa-plan', action='quote'/'update') 获取引文并更新自己的判断，或直接编辑同一格式；不得以工具生成结果代替设计。
      - 第五步：Check 通过后 Complete，冻结 isa-plan-accepted.json。之后才能进入资产盘点、现有计划比较与 CI 执行计划核对。
        无可用 ISA 原文时明确 limitations，允许带限制继续资产审查，不得声称完成独立语义设计或证明覆盖完整；缺失项不能凭空编造。
      - 要求：此处的计划回答“应测什么、如何触发、观察什么”，不是 scope.jobs 的命令列表；保留独立初稿以减少既有资产引导，但不能声称模型已忘记先验知识。
    reference_files: ["Guide_Doc/ACT4_Extension_Review_Guide.md"]
    checker:
      - name: review_isa_design
        clss: ACT4ReviewChecker
        args: {phase: plan, suite: "{DUT}", review_dir: "{OUT}/{DUT}/review", act4_root: "{ACT4_REVIEW_ROOT}"}
  - name: review_audit
    desc: 冻结资产与版本，全面审查并形成有证据支持的修复计划
    task:
      - 第一步：读取已验收的 isa-plan.yaml；读取 Guide_Doc/ACT4_Extension_Review_Guide.md 和 environment.json；此时才阅读输入目录 README、DeveloperGuide、
        .github/workflows、规范和该 extension 的资产，确定当前版本的审查契约与原生验证入口。
      - 第二步：盘点 {ACT4_REVIEW_ROOT} 下已有资产；Git 输入记录实际 HEAD 和 dirty 输入，本地目录记录路径和文件快照，不虚构上游提交。
        scope 中所有资产、共享背景和命令来源路径均相对于该输入目录；缺失的依赖或验证入口如实记录，不把本地验证声称为完整上游 CI。
      - 第三步：创建 {OUT}/{DUT}/review/scope.yaml，逐项填写 test_plans、coverage、generators、
        test_cases、mappings，列出所有选定 XLEN/目标配置及适用原生 CI jobs；shared_assets 写共享路径、消费者和审查边界，无共享项写 []。
      - 第四步：在 reference_files 中登记实际读取的规范/CTP/元数据文件；reference_scope 为每份文件填写
        reviewed_lines 和 excluded_reason。必须保留独立 ISA 计划的规范和原选区，可新增其他参考文件。保留完整原文，排除部分仍须核验。
      - 第五步：为公开工具配置 environment jobs 的 probe、install 和版本校验；依赖 Questa/VCS/Xcelium 的
        coverage job 用 optional_tool 声明具体工具，保留原生命令；由实际探测决定是否执行，不配置商业工具安装。
      - 第六步：为每个 target 声明 environment、generation、build、reference_model、coverage、lint 六类 lane，
        先按生成器的 XLEN/扩展条件及目标配置确认任务适用性；不适用的 lane 用 not_applicable 写明源码依据，
        不要仅更换目标名称复制另一配置的测试筛选。适用 lane 用 needs 配置依赖，填写非空 ELF、模型结果和通过/失败模式。
      - 第七步：为 CI 命令注明 workflow/文档来源、目标、工具前提和适用性；
        为构建/执行填写 diagnostics 路径与 pattern，并在 artifacts 中声明必需 CI 产物。
      - 第八步：完成 scope.yaml 后调用 Check，冻结 baseline。
        先读取 validation-plan.json，核对 ci.yaml 的启用/排除、目标配置与 run_cmd.txt。
        签名生成的 ref_model_exe 不是最终 ELF 执行器。偏离原生入口的实验必须写 diagnostic_reason，不能称为上游 CI。
        local_only lint 不等于完整 lint workflow；动态目标选择和跨 suite 回归仍须按来源说明范围。
      - 要求（资产与规范）：不存在的资产用空列表记录并作为遗漏审查；至少必须有一项现存测试资产。
        无法取得规范原文时 reference_files 写 []，后续不得把完整性和覆盖点语义审查标为通过。
      - 要求（环境）：probe 必须实测工具版本和可运行性，缺失时执行 install 并再次 probe；
        先复用首阶段准备的公共工具；install 仅用于副本内项目依赖或需要隔离的补充环境，使用 {OUT}/{DUT}/review/tools，不重复安装公共编译器和模型。
        Python 探测应确认导入的是本轮命令副本内的 ACT4 模块。不适用或安装后仍不可用也须记录理由，不能省略。
      - 要求（执行与证据）：build 必须依赖环境和 generation，并声明非空 ELF 产物；
        reference_model/coverage 的 elf_inputs 指向依赖的 build jobs。
        diagnostics 保留当前版本的签名日志、失败用例日志和诊断文件；必需 CI 产物仍写 artifacts。
        禁止用 true/echo 充当 CI。
      - 要求（基线）：冻结后不得改变原始输入。更新了仓库版本后重新读取命令、版本约束和资产，
        不能沿用另一提交的测试结论。
      - '第九步：运行 Check(stage_args={"run_commands": true})，先探测/安装/复验环境，
        再按 needs 执行生成、ELF 构建与实际测试，保存工具准备日志、ELF 数量、实际测试数量和结果。'
      - 第十步：读取 evidence-before.json、命令日志和保留的 diagnostics，核对静态诊断与执行结果；
        对失败项分析根因，提出修复建议或说明暂缓所需证据。
      - '第十一步：调用 ACT4ReviewDocument(action="initialize") 创建未完成的 review.yaml 骨架，再普通 Check 获取当前批次。'
      - 第十二步：用 ACT4ReviewDocument 的 status 查看当前 review_tasks 批次、quote 提取原文、update 按 ID 合入自己的 semantic_review.judgments；
        每批完成后普通 Check，所有缺项索引在 progress-audit.json。没有文档工具时使用普通文件工具编辑同一契约的 review.yaml；
        从 obligation_sources 的每个规范/计划区块提取 obligations，逐项映射目标配置、覆盖点和实现源码，排除项说明理由；
        每条 obligation 填 plan_items，逐项对照全部 I<number>；缺失项关联 finding，不能删除独立计划项来匹配已有资产。
        检查采样/iff、bins、cross、激励、预期结果，对重复候选比较等价义务。
      - 要求（逐点追踪）：对全部 coverpoint 建立定义、义务和用例追踪，区分 measured/static/gap/unverified。
      - 第十三步：按 Guide_Doc/ACT4_Extension_Review_Guide.md 完成 review.yaml，汇总 ACT4 规范、
        规范/计划/生成器/用例间遗漏、冗余、coverpoint 设计与实际覆盖、CI、可复现性和贡献质量的审查结果，
        填写 findings、修复提案和 post_assets。
      - 第十四步：用普通 Check 校验当前批次，全部批次和报告通过后 Complete，直接进入修复阶段。
      - 要求（真实执行）：不得因没有 ELF 而跳过构建；前置失败时后续阻塞，不运行空测试。
        模型通过数必须等于非零输入 ELF 数；构建器的 succeeded 是构建任务数，不是测试通过数。
        不得把产物缺失当作唯一根因。
      - 要求（语义审查）：八类总审查、每个 coverpoint/cross、静态告警、条件疑点及重复候选均须有判断；
        source、shared、obligation 和 finding 任务也逐项审核。同义任务可合并，但每个 task ID 只出现一次。diagnostics 区分 asset_defect、scanner_limitation、scope_mismatch、unresolved，
        保留原始结果，并引用实际源码解释依据。
      - 要求（判断依据）：basis 引用冻结源码/规范或本轮保留的日志/产物，用确切行号、逐字 quote 和 observation
        支撑 reasoning 与 conclusion。evidence_digest 使用本轮 review_digest，issues 关联 finding；
        证据不足明确写 unverified、limitation 和 next_action，不能仅批量填未知而不分析已具备的证据。
      - 要求（覆盖追踪）：static 用例须来自 testcase_links 且引用其保留源码；静态扫描无法建立的对应记 unverified。
        measured 只引用成功 coverage job 的真实产物，不能用模型运行或标签链接代替。
      - 要求（问题与提案）：每个问题含 classification、diagnosis、investigation 和修复建议；
        仅 confirmed_defect 且 repair_ready 的问题进入 changes，每个提案含确切路径、风险和复验 jobs。
        post_assets 列出修复后完整资产集合，新增/删除成员必须属于 changes 声明的路径。
        缺少必要信息时保留 finding，说明缺失信息、补齐动作和风险，不强行提出修改；changes 允许为空。
      - 要求（如实交付）：即使 CI 失败或工具缺失，也必须交付诚实报告并继续处理有依据的修复，不能隐藏缺陷。
        无问题允许 findings/changes 为空。
      - 提示：首次收集证据后，用普通 Check 校验报告。仅修改 references/discovery 或报告文字无需重跑命令，
        变更执行输入或主动复测时才调用 run_commands=true。
    reference_files: ["Guide_Doc/ACT4_Extension_Review_Guide.md"]
    checker:
      - name: review_evidence
        clss: ACT4ReviewChecker
        args: {phase: audit, suite: "{DUT}", review_dir: "{OUT}/{DUT}/review", act4_root: "{ACT4_REVIEW_ROOT}"}
  - name: review_repair
    desc: 修复有充分依据的问题，复验并交付最终报告及补丁
    task:
      - 第一步：调用 Check 准备 candidate；此时提示缺少修复后证据或 final.yaml 时，按以下步骤继续。
      - 第二步：在 candidate 中修复 review.changes 声明且有充分依据的问题；修复生成器后，用原生入口重新生成 .S。
        对尚无完整方案的 confirmed_defect，先按 repair_plan 核查已有 helper、目标能力和可观察结果，形成最小实验方案。
        依次评估 suite-local 实现、可运行子集、已有原生入口、缺失能力是否只影响验证；更新实际调查证据后再决定修复或暂缓。
        不能将“尚未编写测试”当作外部阻塞；保留未经验证的资产，不弱化正式修改的 repair_ready 要求。
        在 review.yaml 声明 experiments 后，调用 Check(stage_args={"experiment":{"action":"prepare","id":"E1"}})，
        只修改返回的实验副本和允许路径，再调用 action=run。它自动执行所选 jobs 及依赖，保留输入、日志和产物。
        查看 experiments.json 与 evidence-experiment-E1.json；对照 success_criterion 更新 investigation，不能用实验成功代替正式 candidate 的复验。
      - '第三步：用 Check(stage_args={"run_commands": true}) 重新验证，读取本轮命令日志与执行结果。'
      - 第四步：阅读 evidence-after.json，对修改的源码、受影响义务及剩余静态疑点重新进行语义审查，
        为 final.yaml 准备本轮证据。
      - 要求（修改与执行）：只编辑 review.changes 声明的 paths，不手工修改生成用例或弱化断言/coverage 掩盖缺陷；
        不得修改 CI 命令来规避失败。命令只在隔离副本中执行。
      - 要求（复核与范围）：初审判断不能替代修复后的复核。
        唯一可复用的是 reuse-final.json 列出的依赖未变记录；在 final 普通 Check 后，
        用 ACT4ReviewDocument(action='reuse', document='final', expected_sha256=当前摘要) 引用它们。
        finding/change 必须重新判断；任何源码、配置、执行结果或产物变化导致依赖不明时，保守重审，不手工复制初审结论。
        新发现的问题先更新 review.yaml 中的证据、修复计划及 post_assets，再 Check 校验；证据不足时保留待修复项。
      - 第五步：按 Guide_Doc/ACT4_Extension_Review_Guide.md 创建 final.yaml，逐项交代所有 finding 的
        fixed/deferred/not_fixed/dismissed 状态、classification、diagnosis、investigation、证据和 reason；
        未修复项填写 blocker 的具体缺项、影响、未解决原因、owner 和 next_action，需要用户协助时才写 request 与 reason_user_needed。
        stop_reason 区分 external_dependency、unfinished_work、budget_exhausted；外部阻塞必须对四种替代路径提供实际依据，不能用未完成设计冒充不可修复。
        已确认缺陷不能仅凭计划以 unfinished_work 结束：至少运行一个最小实验，或用实际来源排除一个不可执行路径；tried 关联真实 experiment_id 和结果。
        预算停止记录限额、实际用量和来源，next_action 给出可直接续跑的动作；允许诚实交付部分成果，不要求无限试错。
      - 第六步：完成 semantic_review 中全部 after.review_tasks，另逐项审核 finding:<ID> 和 change:<确切变更路径>，
        引用修改后源码并比较基线，删除项引用基线。使用 ACT4ReviewDocument(document="final") 更新记录；
        普通 Check 返回 progress-final.json 当前批次，逐批复核，不为报告缺项反复重跑验证命令。
      - 第七步：将未解决的语义疑点、推断及验证限制全部列入 remaining_risks，汇总修复前后证据、
        每个目标的 CI 结果、coverpoint 覆盖变化、精确变更和应用补丁后的复验要求；保留原有 obligation ID 和全部独立 ISA 计划项的对照，更新映射和结论。
      - 要求（摘要）：summary 用清晰的自然语言先说明检查了什么、发现什么、修复什么、还剩什么及原因；
        区分真实资产问题、扫描限制和环境限制；写明具体用户协助或无需用户输入，不以任务计数或原始日志开篇。
        每个 final finding 的 repair_progress 独立描述实施进度；有候选实现不等于验证通过。
        共享问题可用稳定 root_cause_key 关联，但各模块的适用性、修复与验证证据分别保留。
      - 第八步：调用 Check 生成 final.md 和 changes.patch，Complete 后交付完整报告和可应用补丁。
        没有可安全修复的问题时允许空补丁；已如实记录的 deferred/not_fixed 不阻止报告交付。
      - 要求（复核证据）：semantic_review 使用 after 的 review_digest。
        finding 标为 fixed 时，其复核判断必须 passed/confirmed，且关联复验 jobs 均通过。
      - 要求（结论与输入）：不得把环境限制当 DUT Bug，或把未执行 CI 标为通过；原始输入保持不变。
    reference_files: ["Guide_Doc/ACT4_Extension_Review_Guide.md"]
    checker:
      - name: review_candidate_changes
        clss: ACT4ReviewChecker
        args: {phase: repair, suite: "{DUT}", review_dir: "{OUT}/{DUT}/review", act4_root: "{ACT4_REVIEW_ROOT}"}
      - name: review_final_report
        clss: ACT4ReviewChecker
        args: {phase: final, suite: "{DUT}", review_dir: "{OUT}/{DUT}/review", act4_root: "{ACT4_REVIEW_ROOT}"}
