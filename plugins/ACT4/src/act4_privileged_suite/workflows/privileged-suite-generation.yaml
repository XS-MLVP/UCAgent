            - "{OUT}/{DUT}/references/ctp.html"
            - "{OUT}/{DUT}/references/{DUT}_ctp_raw.csv"
            - "{OUT}/{DUT}/{DUT}.csv"
            - "{OUT}/{DUT}/{DUT}_testplan.md"
            - "{OUT}/{DUT}/{DUT}_normative_rules.csv"
            - "{OUT}/{DUT}/{DUT}_coverage_intent.yaml"
            - "{OUT}/{DUT}/references/{DUT}_specification.adoc"
            - "{OUT}/{DUT}/references/{DUT}_normative_rule_defs.yaml"
            - "{OUT}/{DUT}/reports/{DUT}_ctp_reference_provenance.yaml"
            - "{OUT}/{DUT}/reports/{DUT}_manual_reference_provenance.yaml"
            - "{OUT}/{DUT}/coverpoints/priv/{DUT}_coverage.svh"
            - "{OUT}/{DUT}/coverpoints/priv/{DUT}_coverage_init.svh"
            - "{OUT}/{DUT}/reports/sheet_manual_sv_mapping.md"
            - "{OUT}/{DUT}/reports/coverage_gaps_and_conflicts.md"
