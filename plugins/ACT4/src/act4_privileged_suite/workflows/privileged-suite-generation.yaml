      - "{OUT}/{DUT}/reports/act4_norm_mapping_check/*"
      - "{OUT}/{DUT}/reports/act4_generator_check/*"
      - "{OUT}/{DUT}/reports/act4_test_asset_check/*"
      - "riscv-arch-test/coverpoints/priv/{DUT}_coverage.svh"
      - "riscv-arch-test/coverpoints/priv/{DUT}_coverage_init.svh"
      - "riscv-arch-test/coverpoints/norm/{DUT}.yaml"
      - "riscv-arch-test/generators/testgen/src/testgen/priv/extensions/{DUT}.py"
      - "riscv-arch-test/tests/priv/{DUT}/*.S"
