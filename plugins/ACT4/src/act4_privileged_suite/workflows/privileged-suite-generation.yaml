      # 必须最后执行且不落盘；最终报告及本阶段更新后的审查报告必须已写入 manifest。
      - name: act4_final_report_manifest_completeness_check
        clss: "ACT4FileManifestChecker"
        args:
          manifest_file: "{OUT}/{DUT}/reports/{DUT}_file_manifest.yaml"
          expected_suite: "{DUT}"
          act4_root: "riscv-arch-test"
          inventory_patterns:
            - "{OUT}/{DUT}/*.csv"
            - "{OUT}/{DUT}/*.md"
            - "{OUT}/{DUT}/*.adoc"
            - "{OUT}/{DUT}/*.json"
            - "{OUT}/{DUT}/*.yaml"
            - "{OUT}/{DUT}/coverpoints/**/*"
            - "{OUT}/{DUT}/reports/**/*"
            - "{OUT}/{DUT}/experimental/**/*"
            - "riscv-arch-test/coverpoints/priv/{DUT}_coverage.svh"
            - "riscv-arch-test/coverpoints/priv/{DUT}_coverage_init.svh"
            - "riscv-arch-test/coverpoints/norm/{DUT}.yaml"
            - "riscv-arch-test/generators/testgen/src/testgen/priv/extensions/{DUT}.py"
            - "riscv-arch-test/tests/priv/{DUT}/**/*"
            - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.sig"
            - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.results"
            - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.sig.log"
            - "riscv-arch-test/work_itgen_{DUT}/**/elfs/**/*.elf"
          require_contribution_set: true
