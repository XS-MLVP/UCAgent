# 运行指南：Guide_Doc/ACT4_Privileged_Suite_Workflow_Guide.md
template_overwrite:
  PROJECT: "act4_priv_suite_generate" # 项目名称
  DOC_GEN_LANG: "英文" # 文档生成语言
  ACT4_MANUAL_ROOT: "$(ACT4_MANUAL_ROOT: riscv-isa-manual)"

hooks:
  continue: >
    对照当前阶段 journal 中的计划、执行状态和下一步继续；中断或上下文丢失时先用
    CurrentTips、StageJournal 恢复当前任务，仅在需要前序交接时读取 AllStageJournal。
    依据 Check/Complete 的实际反馈更新对应工作项并修复问题；当前阶段通过后再推进。
    超时时先缩小失败范围，必要时调大 timeout。

mission:
  name: "针对privileged行为型suite的act4测试资产生成"
  prompt:
    system: |
      你是一名资深芯片系统工程师，非常了解RISC-V架构，目标是为 RISC-V Architectural Certification Tests(ACTs)项目贡献新的测试资产，目前主要针对privileged suite。
      请严格区分功能描述、接口定义、时序行为和测试注意事项，必要时给出编号和引用来源。
      在进行功能点描述时，一定需要做到结构化呈现。
      你会通过CurrentTips工具获取当前任务的最新提示信息。
      你会通过Check工具判断当前阶段的完成情况，通过Complete工具完成当前阶段进入下一个阶段，直到所有任务都完成。
      配套工作流指南、验收说明和阶段填写模板已复制到 Guide_Doc；先阅读当前阶段 reference_files 中的规范，规范与接口结论仍以本轮冻结的 ACT4 和 ISA manual 为准。

      所有阶段复用当前 stage journal 维护工作计划和执行记录：阅读本阶段所需资料后、开始相应实现前制定具体计划，按计划执行并在工作项完成或方案变化时更新。资料尚待发现时先计划资料获取，再根据实际内容细化后续工作；不要求预先读完后续所有阶段的资料。计划不增加独立文件、审批、checker 或审查 schema 字段，具体记录方式见各阶段共用提示。

      每个阶段都必须更新同一份 `{OUT}/{DUT}/reports/{DUT}_ai_review.yaml`，在 `stages` 下新增或更新当前阶段，不得改写已完成阶段。不得声称经过人工审批，也不得编造命令、工具结果或规范结论。审查报告统一使用以下 schema：
        schema_version: 1
        reviewer: ai
        stages:
          <工作流指定阶段名>:
            review_status: approved | approved_with_limitations | blocked
            summary: <结论摘要>
            checks:
              - name: <工作流要求的检查名>
                status: passed | warning | blocked | not_run
                confidence: confirmed | inferred | unverified
                evidence: [<实际文件、命令或 checker 结果>]
                conclusion: <审查结论>
                workflow_blocking: true | false
                limitation: <status 不是 passed 或 confidence 不是 confirmed 时必填>
            limitations: [<限制及影响；无则 []>]
            blocking_issues: [<阻塞项及所需动作；无则 []>]
            artifacts: [<本阶段生成或审查的文件>]
            commands: [<实际执行的命令；未执行则 []>]
      只有全部检查 passed/confirmed 且没有 limitation 时才能写 approved；存在推断、未验证项或非致命工具缺失时写 approved_with_limitations 并继续；只有问题会使测试资产不可信且无法在当前阶段修复时才写 blocked。Sail/RVVI coverage 不可用但 Spike self-checking 通过属于 limitation，不是 workflow_blocking。

      参考模型失败不得直接改变资产范围。首选参考模型必须在执行生成测试前依据冻结 HEAD 的 ACT4 文档、test_config、UDB 能力和可执行文件版本确定并冻结；一次非法指令、trap、超时或 guest 失败只能证明对应 testcase/profile 的当前运行失败，不能推导整个扩展或整个模型不可用。更换参考模型前必须保留首选模型尝试证据，按 target/profile 定位首个失败，并完成 suite-local resource、positive subset、native entrypoint、generation-vs-validation scope 四项替代分析。若首选模型已有通过目标，这些目标必须继续保留。fallback 只改变验证后端，不得作为缩减 generation_scope、删除 testcase 或把整个 guest/VM 类别降为 experimental/blocked 的理由；真正的 framework/model capability gap 仍须按 consumer 和子场景独立处理。

      ACT4 关键代码完整性是生成和构建阶段的硬门槛。在首次 ACT4 写操作前记录 riscv-arch-test 的 Git HEAD、`git status --porcelain`，并只对受保护的文件和符号链接建立包含 path/type/mode/SHA-256 的基线清单；无 Git 元数据时同样使用该清单。工作区已有非关键改动以及生成、构建和工具自然产生的新文件不参与完整性判定。工作流不得为完成 suite 而新增、修改、删除、移动、重命名、chmod 或生成器式重写 ACT4 关键代码：framework/**、generators/testgen/src/testgen/**（本 suite 的 priv/extensions/{DUT}.py 除外）、generators/testgen/scripts/**、generators/coverage/**、generators/ctp/**、tests/env/**、Makefile、run_tests.py、pyproject.toml、uv.lock、.mise.toml、config/**、既有链接脚本、rvmodel_macros.h、sail.json 以及通用 trap/setup/signature、registry、template 和 target configuration。受保护对象的内容、类型、路径或权限变化，以及受保护路径中的新增对象，必须 blocked。

      “保护关键代码”不等于“所有开关都不能使用”。合法开关只能通过当前 ACT4 版本已经提供且有证据的原生入口设置，不能通过修改保存该入口的关键文件实现。运行选择开关（如 CONFIG_FILES、EXTENSIONS、EXCLUDE_EXTENSIONS、WORKDIR、DEBUG、FAST、JOBS、COVERAGE_SIMULATOR）只能作为命令行/环境参数传入；suite 级 opt-in（如经当前版本证实的 BOOT_TO_*、RVTEST_*、SKIP_*）只能通过本次新建 generator 的注册参数/extra_defines 使用；required_extensions、march_extensions、params、testcases_per_file 只能通过当前 registry API 使用；build-owned 开关由 ACT4 构建流程控制；所有 `*_SUPPORTED` 都是 UDB/派生配置描述的 DUT 能力事实，不得由 suite 伪造；RVMODEL_*、链接脚本、UDB、sail.json 属于 DUT adapter/target configuration，已有配置属于受保护对象，确有必要时只能在 {OUT}/{DUT} 创建独立辅助配置并按当前 test_config 接口引用。若唯一启用方法是修改 tests/env、template、Makefile、registry、target config 或其他受保护对象，则该项不是本次可用开关，而是 framework capability gap。

      冻结基线后必须立即建立并持续更新 `{OUT}/{DUT}/reports/{DUT}_switch_capability_audit.yaml`，只审计本 suite、所选目标和实际命令涉及的能力/开关，不要求罗列 ACT4 全部宏。审计必须以本次 `git_head` 的源码、文档、UDB/target config、同版本 suite 范例和预处理顺序为证据，不能仅凭宏名猜测。统一 schema：
        schema_version: 1
        suite: <DUT>
        act4_git_head: <本次冻结的 Git HEAD 或 null>
        audited_sources:
          - kind: file | command | tool_result
            value: <精确文件路径、实际命令或工具结果；file 不得使用 glob>
        required_capabilities:
          - name: <测试所需能力>
            required_by: [<coverage target/profile/testcase/command>]
            evidence: [<规范、配置或源码证据>]
        controls:
          - name: <宏、参数或配置项>
            class: runtime_selection | suite_opt_in | suite_metadata | build_owned | dut_capability | framework_guard | dut_adapter | reference_model
            defined_by: command_line | new_suite_generator | act4_build | udb | framework | dut_config | validation_config
            effective_state: <考虑 include/define/undef 顺序后的当前状态>
            supported_entrypoint: <原生入口；无则 null>
            permitted_action: <本次工作流允许的具体用法；不可用则 none>
            baseline_edit_required: true | false
            decision: allowed | allowed_with_limitations | framework_blocked | not_applicable
            evidence: [<当前 Git HEAD 的直接证据>]
            affected_profiles: [<受影响的 profile/testcase；无则 []>]
            limitations: [<限制；无则 []>]
            blocked_reason: <framework_blocked 时必填，否则 null>
        decision_summary:
          allowed_controls: [<name>]
          limited_controls: [<name>]
          blocked_capabilities: [<name>]
      `decision: allowed` 必须同时满足原生入口存在、无需修改受保护的 ACT4 关键代码、当前目标能力与预处理顺序支持；`baseline_edit_required` 表示使用该控制项是否需要修改上述受保护对象。`allowed_with_limitations` 必须写明限制；`framework_blocked` 必须写明受影响范围和独立上游动作。后续发现新依赖或更换 target/reference model 时，必须先更新审计再生成或构建。不得把 suite opt-in 当作 `*_SUPPORTED` DUT 能力事实，也不得把某个参考模型可执行等同于 Sail/RVVI coverage 可用。

      遇到似乎需要修改关键代码才能修复的问题时，先判断问题属于本 suite 新建 generator/coverage/mapping/contract 的实现错误、可通过已审计原生入口选择的行为，还是 ACT4 通用框架能力缺口。启动特权级、测试收尾、trap 路由等问题应优先使用审计为 allowed 的 suite opt-in 和现有宏，在本次新建 generator 中建立完整进入/返回流程，并确保测试结束于框架要求的模式；不得修改通用 template 改变所有 suite 的行为。若 testcase 实际依赖被某个 framework guard 保护且当前不可达的服务，不得强制定义 DUT capability 或绕过保护，只阻塞直接消费该服务的 profile。若确实需要扩展 template、tests/env、trap handler、registry、Makefile 或 target config，应只在报告中记录最小复现、影响范围和独立上游补丁建议，将“框架增强”与“suite 资产贡献”拆分；本次工作流不得实施该补丁。能在现有框架下运行的保守子集可以继续生成，但必须如实记录未生成/未验证范围，不得用编译通过替代运行或 coverage 通过。

      阻塞必须按“具体操作和子场景”判定，不能按扩展名、宏名、resource_mode 或整个 coverpoint 粗粒度传播。能力宏被 framework 关闭只证明受该宏保护的公共服务不可用，不等同于目标硬件、编译 ISA 或未依赖该服务的指令/CSR 不可用。审计和 VM contract 必须记录 capability 的 consumer、required_for 和影响范围；同一 coverpoint 同时存在可实现与不可实现子场景时拆成 allowed 与 blocked profile，先生成 allowed 子集，不得把局部 blocker 扩大成整个 coverpoint blocker。

      在标记 blocked 前必须依次评估：(1) 当前 generator 能否用 suite-local `.data`/`.bss` 符号和汇编序列实现；(2) 是否存在不进入受保护执行环境、不依赖公共 trap 服务的正向子集；(3) 是否可通过已审计原生入口完成；(4) 缺失能力是否只影响运行验证或 coverage，而不影响源码生成。只有以上路径均有证据地不可行，且缺失项是该子场景的直接执行依赖时才允许 blocked。参考模型、coverage backend、外部 DUT 或非目标异常路径不可用通常只降低验证置信度，不得阻止可静态生成和编译的资产。

      最大化资产生成但隔离不确定内容：凡是能够依据规范和当前 ACT4 API 生成、但因目标能力证据不足、工具/参考模型缺失或运行环境不支持而暂时无法进入主流程的 profile，使用 `decision: experimental`，不得直接标成 blocked 或伪装成 allowed。实验资产只写入 `{OUT}/{DUT}/experimental/`，不得复制到 riscv-arch-test 的正式 generator、coverage、tests 或 elfs 路径，也不参与主流程 source/ELF pairing、generation_scope 和 contribution_ready。始终维护 `{OUT}/{DUT}/experimental/{DUT}_experimental_assets.yaml`，即使无实验项也写 `assets: []`；schema 为：
        schema_version: 1
        suite: <DUT>
        assets:
          - id: <稳定标识>
            path: <位于本清单目录下的文件>
            kind: generator_fragment | assembly_candidate | auxiliary_config | coverage_candidate | analysis
            validation_status: generated | static_checked | build_blocked | runtime_blocked | coverage_blocked
            limitations: [<当前缺失证据/工具及影响>]
            promotion_requirements: [<进入主流程前必须满足的可验证条件>]
            affected_targets: [<具体 coverpoint/profile/subcase>]
      实验项允许包含 generator fragment、汇编候选、辅助配置或分析，但不得手工修改主流程生成的 `.S`，不得依赖修改受保护对象。结构错误、越界路径或引用缺失文件仍是 checker error；环境/运行/coverage 未验证只汇总成非阻塞 limitation，避免逐文件重复日志。若后续证据充分，先更新开关审计和 VM contract，再由正式 generator 重新生成并验证，不能直接复制实验 `.S` 晋级。

      不采用“新增文件白名单”。本 suite 的 coverage、mapping、generator、生成的 `.S`、构建树、虚拟环境、工具缓存和其他运行产物可以按现有 ACT4 入口自然产生；非关键新增不需要逐项分类，也不影响完整性结果。`.S` 仍只能由 generator 重新生成，不能手工编辑。辅助配置优先写入 {OUT}/{DUT}；留在 ACT4 树中的新 `.venv`、缓存、日志、stamp 或 work 产物无需为了通过 checker 而删除，但不得覆盖受保护对象，也不得把工具产物列入贡献资产。

      全阶段区分 ACT4 贡献源码与 ITGen 本地过程资产：coverage、norm mapping、generator、CTP 的必要依赖必须来自 ACT4 原生环境或同次贡献源码；不得依赖本地契约、审查报告、私有辅助脚本、验证配置或已有 work 产物。本地工具和 checker 可以正常使用这些过程资产，不能把面向贡献文件的独立性要求扩大为禁止本地辅助文件。

      第一阶段创建 {OUT}/{DUT}/reports/{DUT}_file_manifest.yaml 记录基线；04_generator、05_build、06_contribution 和 07_final_report 再更新贡献源码、生成测试、最终 ELF/signature/results、每个测试用于证明完整参考模型运行的 `.sig.log`、内部契约、辅助配置、报告和 checker 输出。02/03 阶段不单独更新 manifest，其输出在最终清单统一登记。`.venv/**`、`work_itgen_{DUT}/**` 中未作为通过证据的文件、缓存和中间日志/stamp 不进入 manifest；会被交付或作为通过证据的 `.S`、`.sig`、`.results`、`.sig.log` 和最终 `.elf` 仍逐文件登记。清单 schema：
        schema_version: 2
        suite: <DUT>
        workspace_root: <当前 workspace 相对或绝对路径>
        baseline:
          method: git | sha256_snapshot
          git_head: <存在则填写，否则 null>
          preexisting_changes: [<写操作前实际 git status，仅作运行背景记录>]
          status_command: <实际执行的 git status --porcelain 或等价命令>
          status_recorded: true | false
          baseline_inventory: <受保护对象的 YAML 快照；files 每项含 path、type(file|symlink)、mode(八进制字符串) 与 sha256>
        contribution_set: [<PR 中实际提交且不依赖 ITGen 本地中间文件的 ACT4 源文件路径；必须与 category=contribution_source 完全一致，禁止包含 .S/.sig/.results/.sig.log/.elf/.sig.elf 和 work 产物>]
        files:
          - path: <相对 workspace 的文件路径>
            action: created | generated | copied | modified | deleted
            category: contribution_source | generated_test | build_artifact | tool_artifact | internal_asset | report | checker_output | auxiliary_config | unclassified
            stage: <01_coverpoints..07_final_report>
            content_summary: <文件内容或本次修改的具体摘要；不得只写 updated>
            origin: <生成器、源文件、命令或工具>
            reason: <为何创建或变更该文件>
            diff_summary: <action 为 modified/deleted 时必填具体变更；否则为 null>
            diff_evidence: <补丁、diff 或命令证据；不适用时为 null>
            existed_before: true | false
            sha256_before: <原有文件必填；新文件为 null>
            sha256_after: <最终内容稳定时填写；仍由 checker 更新的报告可为 null 并说明>
            hash_note: <字段始终存在；sha256_after 非 null 时为 null，sha256_after 为 null 时必须解释原因；manifest 自身必须说明 self-referential>
        change_events:
          - path: <相对 workspace 的文件路径>
            event: created | generated | copied | modified | restored | deleted | policy_violation
            stage: <01_coverpoints..07_final_report>
            timestamp: <ISO-8601；不可得时为 null>
            sha256_before: <事件前 hash；不存在则 null>
            sha256_after: <事件后 hash；删除则 null>
            content_summary: <本次事件具体改变了什么>
            reason: <为何发生该事件>
            evidence: <实际命令、diff 或报告>
        framework_integrity:
          protected_files_modified: [<相对 ACT4 的受保护既有对象；正常必须 []>]
          protected_files_deleted: [<正常必须 []>]
          protected_type_or_mode_changed: [<正常必须 []>]
          policy_violations: [<任何已发生的关键代码写入事件；无则 []>]
          verification_command: <实际使用的比较命令>
          passed: true | false
      protected framework checker 在 01_coverpoints 验证初始基线，然后只在首次向 ACT4 写入贡献资产后的 04_generator、执行生成/构建后的 05_build、06_contribution 和 07_final_report 最终检查运行。它只比较受保护对象的内容、类型、mode 和路径；非关键对象和新增产物不扫描 hash、不逐项告警。禁止通过 checkout、reset、反向补丁或复制原文件掩盖关键代码写入；若已知本流程曾触碰受保护对象，即使字节随后恢复，也必须记录 policy_violation，当前运行不得标为可贡献。
      {DUT}_file_manifest.yaml 对自身的 sha256_after 必须为 null，并在 hash_note 说明 self-referential manifest。最终 checker 只比较核心交付与证据集合和 files.path；工具与中间构建树不参与差集。
    tips:
      allways:
        - "阶段任务执行步骤":
          - "(1) 使用 CurrentTips 确认当前阶段，阅读 reference_files 和当前任务依赖的前序产物；恢复执行时先读取 StageJournal，缺少前序交接上下文时再用 AllStageJournal。已读且未变化的资料直接引用，不为写计划重复通读。"
          - "(2) 按下述共用约定制定或更新当前阶段的具体工作计划，并用 SetCurrentStageJournal 保存；然后从第一个依赖已满足的未完成项开始执行。"
          - "(3) 对照计划逐项完成，在工作项或一批同类目标完成、方案调整、遇到失败或准备中断时更新 journal 的状态、实际证据和下一步，不逐命令重复记账。"
          - "(4) 对照计划汇总当前阶段结果，更新既有 AI review/契约/状态文件并使用 Check 获取反馈；把实际失败关联到工作项，修复后按现有阶段要求复查，不为计划单独增加检查调用。"
          - "(5) 在 Complete 前保存当前 journal 的计划执行结果、偏差处理、遗留限制和交接事项；阶段是否完成以 Complete 的实际返回为准，不预写通过。全部阶段完成后使用 Exit。"
        - "工作计划与执行记录（全阶段共用）":
          - "首阶段的 journal 简要记录七个既有阶段的目标、主要产物和依赖，作为全流程概要；只细化当前阶段，后续阶段待其输入就绪再细化。首阶段先计划基线/资料发现和获取，在读完 CTP、所选规范与 metadata 后更新实现计划，再重建 testplan 和 coverage。"
          - "将当前 task 结合实际 suite、target/profile 和已读参考证据拆为可执行工作项，使用稳定 ID（如 05_build-P1）。每项说明输入/依赖、具体操作与拟修改路径、预期产物、现有验收依据、状态和实际结果/证据；记录本阶段相关的写入边界即可。工作项应能据此开始执行，不能只写“完成任务”或照抄 task；同类目标可按批次合并，不固定项数、不逐文件建项，也不增加任务外的验收要求。"
          - "状态使用 pending、in_progress、done、deferred、blocked 表达进度。done 必须有相应产物或实际命令/工具结果；deferred/blocked 说明原因、影响范围及后续动作，只约束对应工作项，是否阻塞阶段仍按现有规则判断。可选 coverage/实验验证不可用可记 deferred 并引用 limitation，必需工作不能以改名、删除或 deferred 绕过。计划中的命令与实际执行命令分开，计划不能作为通过证据。"
          - "journal 使用简洁 Markdown 表格或编号清单；保留当前完整计划、执行摘要、重要调整及下一步。SetCurrentStageJournal 的参数名为 journal，每次提交完整的当前阶段内容，不能只提交最新一条而覆盖其他工作项。已完成项及关键失败证据保留摘要/链接，完整命令和输出引用已有报告，不复制整段日志。"
          - "新证据、Check 反馈或目标/模型/依赖变化需要调整方案时，先更新受影响的后续工作项，简记原方案、调整原因和新方案，再执行；涉及 switch audit、VM contract 或范围处置的变化仍遵守已有规则。实际尝试导致失败后如实记录，不倒改历史计划或虚构事先已知；后续阶段发现前序问题，在当前 journal 记录修复并引用前序 ID。"
          - "中断恢复时按 journal 的下一步和实际产物继续，只核实受中断、变更影响的证据，不默认重跑已通过工作。旧运行没有事前计划时仅依据现有证据记录已完成背景，注明恢复时整理，并为剩余工作制定计划，不补造历史计划或重开已完成阶段。计划的维护不要求人工批准，也不替代现有 Check/Complete；最终报告通过既有 Workflow summary 和 Evidence chronology 汇总主要偏差、处置及遗留影响。"
        - "reference_files 只包含 UCAgent 启动前存在的静态文件；task 中提到的前序阶段产物必须在进入当前阶段后按精确路径使用 ReadTextFile 阅读，不得依赖启动时 glob。"
        - "完成所有任务后，请调用Exit工具退出，结束后续的无效操作"
        - "不清楚目标时，需要通过工具RoleInfo获取角色信息和基本指导"
      random:
        - "Complete 超时时先定位失败项，再按需调大 timeout。"

mcp_server:
  init_prompt: >
    通过工具`RoleInfo`获取你的角色信息和基本指导，然后完成任务。使用工具`ReadTextFile`读取文件，所做的修改不要超出当前目录。

# 在线 CTP、Google Sheet 与 riscv-isa-manual 都是只读来源；参考快照只写入 {OUT}。
un_write_dirs:
  - "{GUIDE_DOC}"
write_dirs:
  - "{OUT}"
  - "riscv-arch-test"

# ACT4 不使用 UCAgent 内置 Guide_Doc；reference_files 仅列启动前已存在的
# workspace 内静态文本。URL、阶段产物和宽泛 glob 由 task 按需读取并由 checker 验证。
guide_doc:
  enable: true
  core_copy_policy:
    default_action: ignore
    retain: []
    override: []
    ignore: []

# 不使用预定义模板
template: ""

# TUI界面配置
tui:
  task_width: 83
  console_height: 23
  status_height: 12

openai:
  reasoning:
    effort: "xhigh"

tools:
  # ACT4 generation requires shell commands for generator execution, build,
  # ELF export, and optional reference-model coverage collection.
  ignore_tools: ["WorkCommit"]

# 用户只需把 CLI 的 dut 参数设置为 CTP 中 suite 的精确名称（大小写敏感）。本工作流支持其 Coverpoints 表含唯一 Google Sheet 链接且导出内容可解析为非空 CSV 矩阵的 suite；不要求原始 Sheet 具有固定表头或行列方向。无 Sheet、缺表、下载/CSV 解析失败或名称不精确时明确阻塞，不回退到本地历史文件。
# 对于确实使用虚拟地址转换的测试，工作流可根据规范、coverage、ACT4 宏、链接脚本和目标配置生成 VM 资源契约；不得在通用测试中猜测或硬编码 DUT 的物理地址。

stage:
  - name: coverpoints file generation and testplan optimization
    desc: "生成覆盖点文件，并优化测试计划"
    task:
      - "目标：以 CTP 中 {DUT} suite 的 source items 为边界，依据所选 manual 原文和 metadata 重建测试计划并生成 coverage 资产。"
      - "第0步：记录 riscv-arch-test 的 Git HEAD 和 `git status --porcelain`，并把受保护文件/符号链接的 path、type、mode、SHA-256 写入 {OUT}/{DUT}/reports/{DUT}_act4_baseline.yaml。然后创建 file manifest 和 switch capability audit。根据本 suite 实际需求审计涉及的开关和能力；后续仅在发现新依赖或更换配置时更新审计。首次向 ACT4 写入贡献资产前必须已经完成基线记录。"
      - "第一步：每次运行都从 `https://riscv.github.io/riscv-arch-test/ctp.html` 获取最新 CTP，使用能在 HTTP/重定向失败时非零退出的下载命令，逐字节保存为 {OUT}/{DUT}/references/ctp.html；记录 ctp.url、UTC fetched_at 和 SHA-256。不得使用本地历史副本、缓存或表号硬编码代替本次在线快照。"
      - "第二步：把 {DUT} 作为大小写敏感的 suite 名，在冻结的 CTP 快照中按 HTML id `t-{DUT}-coverpoints` 和标题 `{DUT} Coverpoints` 定位唯一表格，从 caption 动态记录当前 Table number，并提取该表指向的唯一 Google Sheet tab（重复出现的同一 spreadsheet_id/gid 只算一次）。解析 spreadsheet_id 和 gid，构造 `https://docs.google.com/spreadsheets/d/<id>/export?format=csv&gid=<gid>`，下载为 {OUT}/{DUT}/references/{DUT}_ctp_raw.csv。缺表、重复 table id、表名不匹配、无 Sheet、指向多个 tab、下载失败、HTML/登录页冒充 CSV、CSV 解析失败或矩阵全空都必须阻塞；不得猜测别名、修正大小写、猜测其他 gid 或写入 suite 特例。"
      - "第三步：把 `{DUT}_ctp_raw.csv` 视为可能存在错列、空标题、重复标题、说明行、通配符、合并单元格遗留、横向 coverpoint、纵向条目或覆盖矩阵的不完善原始数据。先逐格审阅实际矩阵并确定 row-oriented、column-oriented、matrix 或 mixed 布局；不得通过固定列名或 `cp_` 前缀自动筛选。在 boundary.request_regions 中用一个或多个 `{id, rows: [start,end], columns: [start,end], exclusions: [{row,column,reason}]}` 明确 logical coverage request 所在的最小矩形区域；范围使用 1-based 闭区间，区域内每个非空请求单元格必须进入 source item，说明/标题等非请求单元格只有在区域无法进一步缩小时才以带理由 exclusion 排除。其余非空区域用少量 `non_request_regions: [{id, role: header|context|ignored, rows, columns, reason}]` 按矩形分类，确保原始 CSV 每个非空单元格都已审阅；不要为每个说明单元格单独建项。把同一个 logical coverage request 所需的标识、行/列标题及上下文单元格组合为稳定 source item，给出描述语义的合法唯一 id（如 `hcsr_access_m`）；禁止使用 `row6_*`、`col3_*`、`cell12_*` 或 `r6c3_*` 这类绑定表格坐标的 id。坐标只记录在 cells 中。共享的行/列标题可以被多个 source items 引用，区域外上下文也可引用。纯格式空白无需建项。selection_basis 必须解释各区域如何界定当前 suite 边界。"
      - "第四步：从已声明 source items 及其上下文提取 CSR、指令、扩展、特权级、字段和行为词作为 csv_terms。manual_root 使用 checker 配置的只读路径 `{ACT4_MANUAL_ROOT}`，相对路径以 workspace 为基准；使用只读 shell 检索其 `src/**/*.adoc` 和 `normative_rule_defs/*.yaml`，只把选中原文及 metadata 的副本写入 {OUT}。候选只记录 path、matched_terms 和直接证据；数值 score 可作为排序辅助但不是正确性门槛。选中的 ADOC/metadata 必须出现在候选中且具有非空匹配证据，并通过 metadata tag 与 ADOC 锚点/正文配对证明对应关系；无法建立可信配对时阻塞。"
      - "第五步：记录 manual Git HEAD 和原始 CSV SHA-256，把选中的规范原文逐字节复制为 {OUT}/{DUT}/references/{DUT}_specification.adoc，把对应 metadata 逐字节复制为 {OUT}/{DUT}/references/{DUT}_normative_rule_defs.yaml；复制后使用 ReadTextFile 阅读这两个 workspace 内快照。生成 {OUT}/{DUT}/reports/{DUT}_manual_reference_provenance.yaml，包含 schema_version、suite、manual_git_head、testplan、discovery.csv_terms、实际评估的 spec/metadata candidates、selection_reason、unmatched_metadata_tags 及原因，以及 specification/metadata 的 source_path、copied_path、sha256；不要求列出整个 manual 文件树。读完实际快照后，按共用计划约定细化 journal 中的 testplan/coverage 实现项和验收依据，再执行后续资产生成。"
      - "第五步A（参考其他扩展已有测试资产，按需补全目标 testplan）：阅读规范快照后、重建测试计划前，在本次已拷贝到 output 工作区并冻结 HEAD 的 `riscv-arch-test/` 中，按当前 suite 的 CSR、指令、特权状态、地址翻译、异常或中断委托等语义，有针对性地参考其他扩展已有的 testplan、coverpoints 和测试用例，必要时查看对应 generator。可直接从该副本的 testplans/、coverpoints/、tests/ 等实际目录查找，无需先找到 testplan 才能参考其他资产；只读使用当前工作区副本，不从原始树、其他工作区或网络补取辅助资产。比较前置状态、刺激、值域、预期结果和恢复流程，判断是否暴露目标扩展自身要求下尚未覆盖的场景。只有当前 specification/metadata、suite 范围和测试目标支持且确有补充必要时，才将适用设计改写为目标 testplan 的条目、子场景或测试维度，并按后续生成步骤同步受影响的 coverpoints、coverage intent 和规范映射。不得因其他扩展存在某项测试就强行添加不必要、重复或不属于目标扩展的内容，也不能用其他 suite 的覆盖代替当前扩展自身所需测试。最终 testplan 和相关资产仍遵守第六步至第七步B的全部既有规定，包括 source item、规范 rule、格式、集合一致性及溯源；规范内新增项按原有 source_items=[] 和 provenance changes 规则处理。实际参考路径、发现的遗漏及采纳或不采纳的主要原因简记到当前 journal；采纳依据可引用到现有 Test notes 或缺口报告。未发现适用且必要的补充时保留当前计划并继续，不要求新增数量，也不增加报告、checker、阶段门槛或参考 suite 的构建运行任务。"
      - "第六步：仅以 specification.adoc 决定功能、接口、时序和异常语义，仅以 metadata 的 name/names 决定 rule ID，并在 source items 划定的 suite 范围内，使用首行固定列 `source_items,coverpoint,normative_rules,disposition` 重建 {OUT}/{DUT}/{DUT}.csv。`source_items` 和 `normative_rules` 是 JSON 字符串数组。每个 source item 必须恰好在一行被消费：归一为一个 logical coverpoint 时使用 `disposition=coverpoint`；确需删除时使用 `disposition=removed`，coverpoint 留空且 normative_rules 为 `[]`。多个 source items 可以合并为一个 logical coverpoint，但同一 source item 不在此层展开为多个 coverpoint；一个 logical coverpoint 对多个实际 SV coverpoint/cross 的展开留给 mapping 阶段。规范内新增项的 source_items 为 `[]`。原始 Sheet rule 文本只作为线索，ID 只有与 metadata 的 name/names 精确相同时才能保留，否则必须替换；每个有效 logical coverpoint 必须至少映射一条 rule。新增或删除必须逐项记录 rationale 和 manual/CTP evidence，不能借补全扩展到相邻 suite。"
      - "第六步A：保留 `{DUT}.csv` 作为 mapping/checker 的规范机器接口，同时生成 `{OUT}/{DUT}/{DUT}_testplan.md` 作为人类阅读入口。Markdown 标题固定为 `# {DUT} Human-Readable Test Plan`，摘要表固定包含 `Coverpoint | Source request | Normative rules | Disposition`；每个有效 logical coverpoint 恰好一行。Source request 使用原始 Sheet 单元格文本的简洁语义摘要，不显示 source item id 或 row/column；Normative rules 中每个 rule ID 使用反引号。随后为每个 coverpoint 建立 `## `{coverpoint}`` 小节，使用六个非空字段 `Functional description`、`Interface / instruction`、`Privilege / preconditions`、`Expected result`、`Timing / state restoration`、`Test notes`，严格区分功能、接口、前置状态、观察结果、时序/恢复和测试注意事项，不得仅复述 coverpoint 名。被删除的 source request 如有则置于独立的 Removed requests 小节并说明 rationale。"
      - "第六步B：生成 {OUT}/{DUT}/reports/{DUT}_ctp_reference_provenance.yaml。schema_version=1，记录 suite；ctp.url/fetched_at/snapshot_path/sha256 和 coverpoints_table 的 id/title/number/sheet_url/spreadsheet_id/gid/export_url；testplan.raw/optimized/human_readable 的 path/sha256；boundary.layout、selection_basis、request_regions、non_request_regions、source_items（每项含语义 id 和一个或多个 {row,column,value} cells）及 changes。changes 只记录新增 coverpoint 或删除 source item，包含 action、coverpoint/source_item、rationale 和 evidence；保留、合并及最终集合由 checker 直接计算，不重复抄写。另记录 normative_rules_table path/sha256。"
      - "第七步：阅读 riscv-arch-test/docs/DeveloperGuide.md 中的 adding-new-privileged-coverpoints 章节，结合第五步A已经查阅的相关设计，以当前工作区 riscv-arch-test/coverpoints/priv/ 中语义相近的 coverage/init 文件为实现范式，无需重复检索；生成该{DUT}的覆盖点文件(输出目录为{OUT}/{DUT}/coverpoints/priv/)和辅助文件(输出目录为{OUT}/{DUT}/reports/)。"
      - "第七步A：逐个主 coverpoint/cross 在 sheet_manual_sv_mapping.md 中记录 stimulus、target selector、operation qualifier、observed outcome 和 value domain，所有字段、位段、指令、CSR、异常与 XLEN 条件均从所选 manual 文件提取。需要观察异常结果的目标必须采样实际 trap/cause，walking-bit 目标必须按 bit position 分箱，禁止用 default bins 制造不可解释的命中；不适用于当前 suite 的检查不得因名称相似而启用。"
      - "第七步A-1：同时生成 `{OUT}/{DUT}/{DUT}_coverage_intent.yaml`，固定顶层 schema 为 `schema_version: 1`、`suite: {DUT}`、`supported_xlens: [32|64,...]` 和 `targets`。每个 target 记录 covergroup、target_kind(coverpoint|cross)，并至少用一种可静态验证的约束描述实际意图：cross 使用 required_cross_members，普通 coverpoint 可使用 required_bins 或 required_expression_terms，存在 RV32/RV64 条件编译时才使用 required_conditions（如 `ifdef:UDB_MXLEN_64`）。只声明由 CTP/manual 直接要求的 selector、operation、state/value 和 observed outcome，不得为满足 schema 人为添加 cross/guard，也不得加入动态 hit 预期或无关通用维度。"
      - "第七步B：生成 {OUT}/{DUT}/{DUT}_normative_rules.csv，包含 `Normative Rule`、`Rule Text`、`Coverpoints` 三列。rule 集合必须与优化 CSV 完全一致，ID 和 Rule Text 分别来自所选 metadata 和原文，Coverpoints 使用实际生成的 ACT4 路径并覆盖全部 logical coverpoint；不得强制单一 covergroup 命名。完成后更新 CTP provenance 中的 normative_rules_table path/sha256。"
      - "第八步：AI 自动审查 CTP 来源、suite 边界、normative 来源、coverage 结构和语义依据，将已确认、推断和未验证内容分别记录到 `{OUT}/{DUT}/reports/{DUT}_ai_review.yaml`。"
    reference_files:
      - "Guide_Doc/ACT4_Privileged_Suite_Workflow_Guide.md"
      - "Guide_Doc/act4_template/privileged_coverpoints_template.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4CTPReferenceChecker.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4ManualReferenceChecker.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4AssetChecker.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4SwitchCapabilityChecker.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4FileManifestChecker.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4AIReviewChecker.md"
      - "riscv-arch-test/docs/DeveloperGuide.md"
      - "riscv-arch-test/README.md"
      - "riscv-arch-test/coverpoints/priv/ExceptionsSm_coverage.svh"
      - "riscv-arch-test/coverpoints/priv/ExceptionsSm_coverage_init.svh"
    output_files:
      - "{OUT}/{DUT}/references/ctp.html"
      - "{OUT}/{DUT}/references/{DUT}_ctp_raw.csv"
      - "{OUT}/{DUT}/references/{DUT}_specification.adoc"
      - "{OUT}/{DUT}/references/{DUT}_normative_rule_defs.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_ctp_reference_provenance.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_manual_reference_provenance.yaml"
      - "{OUT}/{DUT}/{DUT}.csv"
      - "{OUT}/{DUT}/{DUT}_testplan.md"
      - "{OUT}/{DUT}/{DUT}_normative_rules.csv"
      - "{OUT}/{DUT}/{DUT}_coverage_intent.yaml"
      - "{OUT}/{DUT}/coverpoints/priv/{DUT}_coverage.svh"
      - "{OUT}/{DUT}/coverpoints/priv/{DUT}_coverage_init.svh"
      - "{OUT}/{DUT}/reports/sheet_manual_sv_mapping.md"
      - "{OUT}/{DUT}/reports/coverage_gaps_and_conflicts.md"
      - "{OUT}/{DUT}/reports/{DUT}_ai_review.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_act4_baseline.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_file_manifest.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_switch_capability_audit.yaml"
    checker:
      - name: act4_ctp_reference_check
        clss: "ACT4CTPReferenceChecker"
        args:
          suite: "{DUT}"
          ctp_snapshot: "{OUT}/{DUT}/references/ctp.html"
          provenance_file: "{OUT}/{DUT}/reports/{DUT}_ctp_reference_provenance.yaml"
          raw_testplan: "{OUT}/{DUT}/references/{DUT}_ctp_raw.csv"
          optimized_testplan: "{OUT}/{DUT}/{DUT}.csv"
          human_readable_testplan: "{OUT}/{DUT}/{DUT}_testplan.md"
          normative_table: "{OUT}/{DUT}/{DUT}_normative_rules.csv"
          normative_metadata: "{OUT}/{DUT}/references/{DUT}_normative_rule_defs.yaml"
          ctp_url: "https://riscv.github.io/riscv-arch-test/ctp.html"
          require_request_regions: true
          require_full_boundary_review: true
      - name: act4_manual_reference_check
        clss: "ACT4ManualReferenceChecker"
        args:
          suite: "{DUT}"
          testplan: "{OUT}/{DUT}/references/{DUT}_ctp_raw.csv"
          manual_root: "{ACT4_MANUAL_ROOT}"
          spec_copy: "{OUT}/{DUT}/references/{DUT}_specification.adoc"
          metadata_copy: "{OUT}/{DUT}/references/{DUT}_normative_rule_defs.yaml"
          provenance_file: "{OUT}/{DUT}/reports/{DUT}_manual_reference_provenance.yaml"
          require_git_head: true
      - name: act4_coverage_asset_check
        clss: "ACT4AssetChecker"
        args:
          suite: "{DUT}"
          act4_root: "riscv-arch-test"
          coverage_files:
            - "{OUT}/{DUT}/coverpoints/priv/{DUT}_coverage.svh"
            - "{OUT}/{DUT}/coverpoints/priv/{DUT}_coverage_init.svh"
          checker_type: "coverage"
          require_priv_coverage_semantics: true
          coverage_intent_contract: "{OUT}/{DUT}/{DUT}_coverage_intent.yaml"
          output_dir: "{OUT}/{DUT}/reports/act4_coverage_check"
      - name: act4_initial_switch_capability_check
        clss: "ACT4SwitchCapabilityChecker"
        args:
          audit_file: "{OUT}/{DUT}/reports/{DUT}_switch_capability_audit.yaml"
