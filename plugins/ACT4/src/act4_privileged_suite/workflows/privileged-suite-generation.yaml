      - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.results"
      - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.sig.log"
      - "riscv-arch-test/work_itgen_{DUT}/**/elfs/**/*.elf"
      - "{OUT}/{DUT}/{DUT}_vm_resource_contract.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_validation_state.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_ai_review.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_act4_baseline.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_file_manifest.yaml"
      - "{OUT}/{DUT}/reports/{DUT}_switch_capability_audit.yaml"
    checker:
      - name: act4_contribution_readiness_check
        clss: "ACT4TestAssetChecker"
        args:
          source_files:
            - "riscv-arch-test/tests/priv/{DUT}/*.S"
          elf_files:
            - "riscv-arch-test/work_itgen_{DUT}/**/elfs/**/*.elf"
          act4_root: "riscv-arch-test"
          signature_files:
            - "work_itgen_{DUT}/**/*.sig"
          result_files:
            - "work_itgen_{DUT}/**/*.results"
          reference_model_log_files:
            - "work_itgen_{DUT}/**/*.sig.log"
          validation_state: "{OUT}/{DUT}/reports/{DUT}_validation_state.yaml"
          require_self_checking_status: true
          require_contribution_ready: true
          require_reference_model_evaluation: true
          vm_resource_contract: "{OUT}/{DUT}/{DUT}_vm_resource_contract.yaml"
          validate_vm_contract: true
          require_scoped_vm_contract: true
          require_generation_scope: true
          experimental_manifest: "{OUT}/{DUT}/experimental/{DUT}_experimental_assets.yaml"
          validate_experimental_assets: true
          allow_sail_coverage_blocked: true
          require_signature: true
          require_results: true
          require_reference_model_logs: true
          require_signature_completeness: true
          signature_progress_mode: warning
          derive_priv_testcase_limit: true
          check_testcase_reachability: true
          require_matching_xlen: true
      - name: act4_contribution_ai_review
        clss: "ACT4AIReviewChecker"
        args:
          review_file: "{OUT}/{DUT}/reports/{DUT}_ai_review.yaml"
          expected_stage: "06_contribution"
          required_check_names: [artifact_inventory, prior_reviews, contribution_state, local_ci_reproduction, limitations_summary, switch_capability_consistency, file_manifest_completeness, framework_integrity]
          required_artifacts:
            - "riscv-arch-test/coverpoints/priv/{DUT}_coverage.svh"
            - "riscv-arch-test/coverpoints/priv/{DUT}_coverage_init.svh"
            - "riscv-arch-test/coverpoints/norm/{DUT}.yaml"
            - "riscv-arch-test/generators/testgen/src/testgen/priv/extensions/{DUT}.py"
            - "{OUT}/{DUT}/reports/{DUT}_file_manifest.yaml"
            - "{OUT}/{DUT}/reports/{DUT}_switch_capability_audit.yaml"
            - "riscv-arch-test/tests/priv/{DUT}/*.S"
            - "riscv-arch-test/work_itgen_{DUT}/**/elfs/**/*.elf"
            - "{OUT}/{DUT}/reports/{DUT}_validation_state.yaml"
