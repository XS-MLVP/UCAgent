          verify_audited_source_paths: true
      - name: act4_initial_protected_baseline_check
        clss: "ACT4FileManifestChecker"
        args:
          manifest_file: "{OUT}/{DUT}/reports/{DUT}_file_manifest.yaml"
          expected_suite: "{DUT}"
          act4_root: "riscv-arch-test"
          integrity_only: true
      - name: act4_coverpoints_ai_review
        clss: "ACT4AIReviewChecker"
        args:
