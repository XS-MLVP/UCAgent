            - "{OUT}/{DUT}/*.yaml"
            - "{OUT}/{DUT}/coverpoints/**/*"
            - "{OUT}/{DUT}/reports/**/*"
            - "{OUT}/{DUT}/experimental/**/*"
            - "riscv-arch-test/coverpoints/priv/{DUT}_coverage.svh"
            - "riscv-arch-test/coverpoints/priv/{DUT}_coverage_init.svh"
            - "riscv-arch-test/coverpoints/norm/{DUT}.yaml"
            - "riscv-arch-test/generators/testgen/src/testgen/priv/extensions/{DUT}.py"
            - "riscv-arch-test/tests/priv/{DUT}/**/*"
            - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.sig"
            - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.results"
            - "riscv-arch-test/work_itgen_{DUT}/**/build/**/*.sig.log"
            - "riscv-arch-test/work_itgen_{DUT}/**/elfs/**/*.elf"
          require_contribution_set: true
  - name: generate_final_human_report
    desc: "生成供检查人员阅读的最终入口报告"
    task:
      - "目标：在所有生成、构建、coverage 复评和贡献检查完成后，生成唯一的人类审查入口 `{OUT}/{DUT}/reports/{DUT}_final_summary_report.md`。报告必须引用并解释权威状态、provenance、contract、manifest 和 machine-readable checker 结果；不要求重复索引同一 checker 的 Markdown 副本、临时辅助脚本或其他中间文件。"
      - "第1步：在 Report index 中索引 validation state、AI review、file manifest、switch audit、CTP/manual provenance、VM resource contract、experimental assets manifest，以及 `reports/act4_*_check/*.json` 的 machine-readable checker 结果。每项使用可点击的相对 Markdown 链接，写明用途、生成阶段和当前权威性。其他辅助材料可按审查价值选择性链接，不得为满足数量要求重复列出等价输出。"
      - "第2步：从 validation state 提取 contribution_ready、self-checking、generation_scope 和 Sail/RVVI 状态作为最终权威结论。明确区分源码/构建/Spike self-checking、Sail trace/RVVI 管线可用性，以及 UCDB/VDB coverage database 是否实际生成；不得把 trace 生成或 Spike 通过表述为 UCDB/VDB coverage 通过。"
      - "第3步：读取 AllStageJournal，并对照当前阶段 journal，在既有 Workflow summary 中按阶段简述计划目标、实际完成结果、主要偏差及遗留限制；引用工作项 ID 和已有证据路径，不复制所有日志或另建计划台账。增加 Evidence chronology，按阶段解释证据的时间关系，保留重要方案调整的原因和处置；仅汇总已实际执行的内容，不预写本阶段 Complete 通过。旧报告与最终状态冲突时标记 historical 或 superseded，并指向取代它的报告；不得静默选择有利结论。任务完成后出现的 stage index out of range 只可在确有日志证据时说明为生命周期提示，不得当作 checker 通过证据。"
      - "第4步：使用以下稳定标题：Executive conclusion、Final validation state、Workflow summary、Report index、Coverage scope、Evidence chronology、Limitations and non-claims、Human inspector checklist、Reproduction。正文可使用 {DOC_GEN_LANG}，但这些标题必须保留以便 checker 定位。Final validation state 小节必须包含一个 fenced YAML block，至少精确记录 `source_contribution_ready: <bool>` 和 `generation_scope_status: complete|partial`，值必须来自 validation state；结构性阻塞以 contribution_ready=false、partial scope、blocking issue 和 limitation 表达。该结构化块用于 checker 比对，不能只在叙述中出现关键词。"
      - "第4A步：在既有结果与限制章节引用 test-assets checker 的 testcase_reachability，分别列出静态描述符、不可达用例、所选目标已编译用例及空测试文件；实际运行证据和功能覆盖率另行说明。不得用文件通过率掩盖条件排除或空执行；未确认的计数必须明确为 unverified。"
      - "第5步：Human inspector checklist 必须给出建议阅读顺序、需要人工确认的边界及复现入口；Limitations and non-claims 必须列出未运行、未证明、partial/blocked/experimental 范围。不得声称人工审批、完整 suite coverage、外部 DUT execution 或未生成的 coverage database。"
      - "第5A步：引用 06_contribution.local_ci_reproduction，区分已通过的本地相关 CI 步骤、未运行/失败配置以及远程 Actions 状态。未使用 CI 固定工具版本、仅跑部分配置或使用替代模型时必须明确说明；contribution_ready 表示既定范围内的资产可审查，不等于 CI 全绿。"
      - "第6步：在 AI review 的 stages 下新增 07_final_report，检查 report_index、state_consistency、evidence_chronology、limitations_and_nonclaims、human_review_entrypoint、file_manifest_update 和 framework_integrity；不得改写 01-06 已完成阶段。"
      - "第7步：把最终报告以及本阶段更新的 AI review、file manifest 记录为 07_final_report。manifest 自身保持 sha256_after=null 并注明 self-referential；最终报告必须记录稳定 SHA-256。"
      - "第8步：最终报告 checker、AI review checker 和 manifest completeness checker 全部通过后，本阶段才完成；completeness checker 同时复核 protected framework integrity。"
    reference_files:
      - "Guide_Doc/act4_template/privileged_validation_handoff_template.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4FinalReportChecker.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4FileManifestChecker.md"
      - "Guide_Doc/ACT4_Checker_Guide/ACT4AIReviewChecker.md"
    output_files:
