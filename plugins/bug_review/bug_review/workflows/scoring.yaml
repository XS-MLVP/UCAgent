template: ""
template_overwrite:
  OUT: "results"
skill:
  general_skill_list: []
guide_doc:
  core_copy_policy:
    default_action: ignore
    retain: []
    override: []
    ignore: []
un_write_dirs:
  - "BugReview/"
  - "Guide_Doc/"
  - "benchmark_job.json"
# Only immutable inputs receive OS read-only permissions. Mutable artifacts are
# protected from generic file tools by this allowlist, so resume remains writable.
write_dirs:
  - "notes/"
tools:
  ignore_tools: ["WorkDiff", "WorkCommit", "RunBashCommand", "RunTestCases"]
ex_tools: []
mcp_server:
  init_prompt: "先调用 RoleInfo 和 CurrentTips，按当前 benchmark 工作流推进。"
mission:
  name: "BugReview v6 指标评分"
  prompt:
    tips:
      always:
        - "所有指标通过 BugReviewRunStage 确定性计算；Check 通过后记录日志并 Complete。"
      random: []
    system: |
      你负责执行 BugReview scoring 工作流。当前被评估对象是已有模型运行产物，不是新建 DUT 测试。
      先调用 CurrentTips，阅读 reference_files，使用 BugReviewRunStage 执行当前阶段。
      返回 awaiting_judgments 时调用 BugReviewTasks，逐一阅读 messages 的证据及 JSON 格式要求，
      通过 BugReviewSubmitResponse 提交 task_id、input_hash、round_index、request_hash 和 response。
      每轮必须基于证据重新判断，引用真实字段。下一轮可以是申诉、投票或格式修复；不得跳过。
      没有待办后再次调用 BugReviewRunStage 收尾，再调用 Check。
      通过后调用 SetCurrentStageJournal 记录阶段日志，再调用 Complete，直到全部阶段完成。
      所有解析、任务状态、GT、回放、指标和报告由工具维护。不要手工修改生成数据或运行 shell。
      分析阶段不计算模型得分，评分阶段不调用 LLM 服务、不执行 replay；沿用已有 v6 规则。
      恢复时调用 BugReviewStatus 和 CurrentTips，复用完成结果。
      若 Check 失败，按 error_code 和具体文件/任务修复；不能忽略依赖或伪造完成状态。
stage:
  - name: score_inputs
    desc: "评分输入与策略冻结"
    task:
      - "验证显式分析版本清单，并固定 GT、公共功能契约和 v6 策略。"
      - "调用 BugReviewRunStage(stage=\"score_inputs\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/scoring.md"
      - "benchmark_job.json"
    output_files:
      - "score_inputs.json"
    checker:
      - name: benchmark_score_inputs
        clss: BugReviewStageChecker
        args:
          stage: score_inputs
  - name: dut_metrics
    desc: "单 DUT 指标计算"
    task:
      - "由 Python 计算现有 v6 八维指标，记录分子分母和缺失证据；不修改公式。"
      - "调用 BugReviewRunStage(stage=\"dut_metrics\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/scoring.md"
      - "benchmark_job.json"
    output_files:
      - "dut_metrics.json"
    checker:
      - name: benchmark_dut_metrics
        clss: BugReviewStageChecker
        args:
          stage: dut_metrics
  - name: aggregate
    desc: "跨 DUT 汇总"
    task:
      - "由 Python 执行现有聚合、权重、归一化和排名规则。"
      - "调用 BugReviewRunStage(stage=\"aggregate\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/scoring.md"
      - "benchmark_job.json"
    output_files:
      - "overall_model_score.json"
    checker:
      - name: benchmark_aggregate
        clss: BugReviewStageChecker
        args:
          stage: aggregate
  - name: publish_scores
    desc: "评分报告发布"
    task:
      - "发布指标明细、总分 JSON、Markdown 和 HTML；核对数据可用性诊断。"
      - "调用 BugReviewRunStage(stage=\"publish_scores\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/scoring.md"
      - "benchmark_job.json"
    output_files:
      - "scores/index.html"
    checker:
      - name: benchmark_publish_scores
        clss: BugReviewStageChecker
        args:
          stage: publish_scores
