template: ""
template_overwrite:
  OUT: "results"
skill:
  general_skill_list: []
guide_doc:
  core_copy_policy:
    default_action: ignore
    retain: []
    override: []
    ignore: []
un_write_dirs:
  - "BugReview/"
  - "Guide_Doc/"
  - "benchmark_job.json"
# Only immutable inputs receive OS read-only permissions. Mutable artifacts are
# protected from generic file tools by this allowlist, so resume remains writable.
write_dirs:
  - "notes/"
tools:
  ignore_tools: ["WorkDiff", "WorkCommit", "RunBashCommand", "RunTestCases"]
ex_tools: []
mcp_server:
  init_prompt: "先调用 RoleInfo 和 CurrentTips，按当前 benchmark 工作流推进。"
mission:
  name: "BugReview 证据分析"
  prompt:
    tips:
      always:
        - "先阅读 CurrentTips 和参考文档，调用 BugReviewRunStage，处理待办后 Check，通过后记录日志并 Complete。"
      random: []
    system: |
      你负责执行 BugReview analysis 工作流。当前被评估对象是已有模型运行产物，不是新建 DUT 测试。
      先调用 CurrentTips，阅读 reference_files，使用 BugReviewRunStage 执行当前阶段。
      返回 awaiting_judgments 时调用 BugReviewTasks，逐一阅读 messages 的证据及 JSON 格式要求，
      通过 BugReviewSubmitResponse 提交 task_id、input_hash、round_index、request_hash 和 response。
      每轮必须基于证据重新判断，引用真实字段。下一轮可以是申诉、投票或格式修复；不得跳过。
      没有待办后再次调用 BugReviewRunStage 收尾，再调用 Check。
      通过后调用 SetCurrentStageJournal 记录阶段日志，再调用 Complete，直到全部阶段完成。
      所有解析、任务状态、GT、回放、指标和报告由工具维护。不要手工修改生成数据或运行 shell。
      回放审查必须覆盖原始报告全部失败用例，包括未关联模型声明的失败和 setup/teardown 错误。
      先核对规格预期、测试预期、实际输入输出和驱动时序，区分 DUT、理解、测试实现、环境和证据不足。
      波形阶段调用 BugReviewWaveInfo 获取真实证据；提交 evidence_id，不得编造 receipt 或波形。
      分析阶段不计算模型得分，评分阶段不调用 LLM 服务、不执行 replay；沿用已有 v6 规则。
      恢复时调用 BugReviewStatus 和 CurrentTips，复用完成结果。
      若 Check 失败，按 error_code 和具体文件/任务修复；不能忽略依赖或伪造完成状态。
stage:
  - name: inputs
    desc: "输入发现与分析范围确定"
    task:
      - "根据实际输入发现 DUT 与运行，冻结 analysis_scope.json；分析范围不使用 bug_review.toml 的 DUT 列表。"
      - "分析必须在当前工作区副本中重新执行全部已有 UnityTest 用例；历史报告、历史失败和历史波形只能作为参考，不能替代本次执行。"
      - "Make 前置步骤不解析 .dat 或转换 FST；parse 只索引原始产物并读取 JSON 汇总，逐用例覆盖率与波形信号留给对应失败的后续按需复核。"
      - "核对每个运行的完成状态和缺失证据。未完成运行仍分析已有证据；缺失测试报告不能解释为测试全部通过。"
      - "调用 BugReviewRunStage(stage=\"inputs\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "input_inventory.json"
      - "analysis_scope.json"
    checker:
      - name: benchmark_inputs
        clss: BugReviewStageChecker
        args:
          stage: inputs
  - name: parse
    desc: "解析与证据构建"
    task:
      - "解析测试、声明、覆盖率、规格和 RTL 关联，建立每个 DUT 的完整失败用例清单；保留具体参数化实例和失败阶段。"
      - "调用 BugReviewRunStage(stage=\"parse\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "parsed_inputs.json"
    checker:
      - name: benchmark_parse
        clss: BugReviewStageChecker
        args:
          stage: parse
  - name: replay
    desc: "全量失败用例回放与归因"
    task:
      - "调用 BugReviewRunStage(stage=\"replay\")，先在独立副本中通过 UCAgent 测试工具运行全部已有 pytest 用例，生成报告和波形，再审查原始与新报告中的全部失败；禁用回放时仍逐项分析原始证据。"
      - "缺失原始报告不是跳过执行的理由；pytest 无用例、收集/环境错误、超时或报告缺失会阻止完成。不得把工具失败解释成零失败。"
      - "通过 BugReviewTasks 逐项核对精确输入、规格预期、测试预期、实际结果，以及驱动、复位、握手、采样和响应延迟。"
      - "区分 suspected_dut_bug、spec_misunderstanding、testbench_issue、environment_issue、inconclusive。未复现是执行状态，不能直接判定环境错误。"
      - "原模型未报告的失败也必须分析；不得修改原始测试或为模型补写 bug 声明。所有判断通过 BugReviewSubmitResponse 提交。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "所有待办完成后再次 BugReviewRunStage 收尾；Check 通过后记录日志，再 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "tasks/*/replay/reviews.json"
    checker:
      - name: benchmark_replay
        clss: BugReviewStageChecker
        args:
          stage: replay
  - name: waveform
    desc: "失败用例波形分析与归因复核"
    task:
      - "调用 BugReviewRunStage(stage=\"waveform\")，获取本次重跑后全部失败用例的任务；只有有明确 setup/teardown/collection 诊断的环境失败可免波形。"
      - "调用 BugReviewWaveInfo(task_id=当前任务, query={}) 查看可用波形；使用返回的精确 test_case_name。"
      - "最终取证必须指定 pattern、完整 signal_groups，以及 start_step/end_step 或 logged_cycle/clock_signal。"
      - "结合规格和 driver 确认事务接受、输出有效、响应延迟、Step 顺序和事务归属，不得仅按数据单点不一致确认 Bug。"
      - "通过 BugReviewSubmitResponse 提交工具返回的 evidence_id 和归因复核。dut_bug 必须有完整签名证据；缺失波形要保留工具错误并提交 inconclusive。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "所有待办完成后再次 BugReviewRunStage 收尾；Check 通过后记录日志，再 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "tasks/*/waveform/reviews.json"
    checker:
      - name: benchmark_waveform
        clss: BugReviewStageChecker
        args:
          stage: waveform
  - name: semantic
    desc: "语义比较"
    task:
      - "逐任务阅读证据，判断候选等价性。需要申诉时完成下一轮独立审查。"
      - "调用 BugReviewRunStage(stage=\"semantic\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "tasks/*/semantic/comparison_result.json"
    checker:
      - name: benchmark_semantic
        clss: BugReviewStageChecker
        args:
          stage: semantic
  - name: failure_mode
    desc: "根因失效模式审查"
    task:
      - "每轮重新审查事实，提交失效模式判断。程序要求两票，冲突时第三票；不得复制回复冒充多次判断。"
      - "调用 BugReviewRunStage(stage=\"failure_mode\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "tasks/*/failure_mode_complete.json"
    checker:
      - name: benchmark_failure_mode
        clss: BugReviewStageChecker
        args:
          stage: failure_mode
  - name: root_appeal
    desc: "RTL 根因申诉与聚类"
    task:
      - "结合完整证据审查是否应合并根因，程序校验后完成根因图。"
      - "调用 BugReviewRunStage(stage=\"root_appeal\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "tasks/*/root_review/result.json"
    checker:
      - name: benchmark_root_appeal
        clss: BugReviewStageChecker
        args:
          stage: root_appeal
  - name: alignment
    desc: "报告根因与 GT 对齐"
    task:
      - "以最终证据审查归因对应关系，不能把未命中的 GT 归给模型。"
      - "调用 BugReviewRunStage(stage=\"alignment\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "tasks/*/analysis.json"
    checker:
      - name: benchmark_alignment
        clss: BugReviewStageChecker
        args:
          stage: alignment
  - name: publish_analysis
    desc: "分析报告发布"
    task:
      - "从 analysis.json、final_bug_analysis.json、逐用例复核和波形证据构造 benchmark_report_data.v1；发布不含模型评分的证据 JSON、分析 HTML 和分析清单。报告统一展示疑似 Bug，并按置信度分层。"
      - "report_data.json 必须包含验证状态与覆盖率、按高/中/低置信度分层的疑似 Bug、每个 Bug 的详情、关联 Case/RTL/Spec/波形、波形简析、完整波形入口、Oracle、修复建议、证据边界、失败用例最终归因和展示顺序。"
      - "发布页面只接受 rtl_root_bugs 与疑似 Bug 证据；rtl_root_bugs 是疑似 Bug 根因聚类，没有 ground_truth_rtl_defects.defects 时不得标记为 GT 或最终确认缺陷。"
      - "每个疑似 Bug 必须有独立详情页面，页面首屏包含验证场景、验证目标、预期、实际、关联测试和波形状态；测试、Spec、RTL 原文等扩展证据默认折叠。"
      - "发布前校验每个疑似 Bug 的 bug_id 唯一、关联现象属于当前 root、详情入口存在；波形只能引用 BugReviewWaveInfo 返回的证据 ID/FST，不得根据文件名自行生成裁决结论。"
      - "可计算的计数、用例、GT 身份和波形元数据必须来自流水线证据；不能自动推导的裁决说明从 bug_review/configs/report_profiles/<DUT>.json 读取并纳入发布版本摘要。HTML 只负责展示，不得自行发明或改写报告事实。"
      - "同一用例存在多个波形时只发布 latest session 中按 FST、数字后缀和 mtime 规则选出的最新波形；报告发布完成后只保留当前活动报告版本。"
      - "suspected_dut_bug 是报告中的疑似 Bug 分类；根据证据完整度标记 high/medium/low 置信度。置信度不是测试失败数，也不能替代 Case、RTL、Spec 和波形证据。"
      - "调用 BugReviewRunStage(stage=\"publish_analysis\")；完成所有待办后再次调用此工具收尾。"
      - "当前批次：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录阶段日志，再调用 Complete。"
    reference_files:
      - "Guide_Doc/analysis.md"
      - "benchmark_job.json"
    output_files:
      - "analysis/analysis_manifest.json"
      - "analysis/dut_*/report_data.json"
      - "analysis/dut_*/data/report_data.json"
      - "analysis/dut_*/index.html"
      - "analysis/dut_*/gt_defect_details.html"
      - "analysis/dut_*/bug_evidence_details.html"
      - "analysis/dut_*/suspected_bug_RTLBUG-*.html"
    checker:
      - name: benchmark_publish_analysis
        clss: BugReviewStageChecker
        args:
          stage: publish_analysis
