template: analysis
template_overwrite:
  OUT: "results"
skill:
  general_skill_list: ["ext/bug_review/review-notes"]
guide_doc:
  core_copy_policy:
    default_action: ignore
    retain: []
    override: []
    ignore: []
un_write_dirs:
  - "Guide_Doc/"
  - "review_job.json"
write_dirs:
  - "notes/"
tools:
  ignore_tools: ["WorkDiff", "WorkCommit", "RunBashCommand", "RunTestCases"]
mcp_server:
  init_prompt: "先调用 CurrentTips，阅读 Guide_Doc/analysis.md，再推进当前复核阶段。"
mission:
  name: "Bug Review 证据复核"
  prompt:
    tips:
      always:
        - "调用 BugReviewRunStage；若有待办，使用 BugReviewTasks 和 BugReviewSubmitResponse 完成；Check 通过后记录日志并 Complete。"
      random: []
    system: |
      复核现有 Bug 声明，并分析本次重跑发现的新失败。
      输入工作区中的测试、fixture、规格和 RTL 只能阅读，不能修改。
      阅读 Guide_Doc/analysis.md 和当前阶段输入。按顺序调用 BugReviewRunStage，
      对待办阅读真实证据并按要求提交判断；任务清空后再次运行本阶段。
      测试再次失败与 DUT Bug 裁决是不同结论。排除 DUT Bug 时保留原声明，
      将复核置信度设为 0；证据不足时保持未定。相同 RTL 首错和因果链的
      Bug 归入一个根因组，但保留每个原声明、CK、TC 与证据。
      波形证据仅接受 BugReviewWaveInfo 返回的真实证据 ID。不得编造收据、
      viewer、信号路径或测试结果。
      阶段产物完成后，如 CurrentTips 列出 ext/bug_review/review-notes，可读取其
      SKILL.md 并刷新 notes/bug_review_notes.md；未列出时直接阅读阶段产物，
      可用普通文件工具记录笔记。笔记不是 Bug 证据或阶段完成条件。
      Check 通过后调用 SetCurrentStageJournal，再调用 Complete。
stage:
  - name: inventory
    desc: "确定输入并建立逐 Bug 复核骨架"
    task:
      - "阅读 Guide_Doc/analysis.md。调用 BugReviewRunStage(stage=\"inventory\")，核对每个输入工作区的 Bug、TC、Spec/RTL 候选和缺失引用。"
      - "原报告声明必须全部保留；一个 Bug 可关联多个 CK 和 TC。"
      - "当前进度：{BUG_REVIEW_PROGRESS}"
      - "Check 通过后记录日志并 Complete。"
    reference_files: ["Guide_Doc/analysis.md", "review_job.json"]
    output_files:
      - "{OUT}/input_inventory.json"
      - "{OUT}/workspaces/*/bug_inventory.json"
      - "{OUT}/workspaces/*/bug_outline.md"
    checker:
      - name: review_inventory
        clss: BugReviewStageChecker
        args: {stage: inventory}
  - name: replay
    desc: "重跑原有测试并审查失败"
    task:
      - "调用 BugReviewRunStage(stage=\"replay\")；本次真实报告是复现状态的依据。"
      - "调用 BugReviewTasks，逐例核对规格预期、测试断言、实际输入输出、driver/fixture、复位和采样时序；不能改写输入测试。"
      - "失败、通过、未收集和执行错误分别记录；新失败也进入复核。"
      - "完成待办后重调 BugReviewRunStage，再 Check、记录日志、Complete。"
      - "当前进度：{BUG_REVIEW_PROGRESS}"
    reference_files: ["Guide_Doc/analysis.md", "{OUT}/input_inventory.json", "{OUT}/workspaces/*/bug_inventory.json"]
    output_files:
      - "{OUT}/workspaces/*/replay_results.json"
      - "{OUT}/workspaces/*/case_reviews.json"
    checker:
      - name: review_replay
        clss: BugReviewStageChecker
        args: {stage: replay}
  - name: waveform
    desc: "核对失败事务和真实波形"
    task:
      - "调用 BugReviewRunStage(stage=\"waveform\")，使用 BugReviewTasks 获取需要波形复核的失败用例。"
      - "先核对测试正确性，再用 BugReviewWaveInfo 查看真实波形；最终证据包含实际信号组和时钟或 step 窗口。"
      - "核对请求接受、响应有效、延迟和事务归属；单点数据不一致不能直接判 Bug。"
      - "提交工具返回的 evidence_id；完成待办后重调本阶段，再 Check、记录日志、Complete。"
      - "当前进度：{BUG_REVIEW_PROGRESS}"
    reference_files: ["Guide_Doc/analysis.md", "{OUT}/workspaces/*/case_reviews.json"]
    output_files:
      - "{OUT}/workspaces/*/waveform_reviews.json"
      - "{OUT}/workspaces/*/waveform_evidence.json"
    checker:
      - name: review_waveform
        clss: BugReviewStageChecker
        args: {stage: waveform}
  - name: correlate
    desc: "逐 Bug 裁决并合并相同根因"
    task:
      - "调用 BugReviewRunStage(stage=\"correlate\")，逐个阅读 BugReviewTasks 返回的原声明、新失败、回放和波形证据。"
      - "提交 confirmed、refuted 或 inconclusive 裁决，分别使用正数、0 或 null 复核置信度；保留原报告置信度。"
      - "同一 RTL 首错与失效机制使用一致的 rtl_ref、first_error 和 causal_chain，以便合并根因；各 Bug 的测试与证据仍独立保留。"
      - "完成待办后重调本阶段，再 Check、记录日志、Complete。"
      - "当前进度：{BUG_REVIEW_PROGRESS}"
    reference_files: ["Guide_Doc/analysis.md", "{OUT}/workspaces/*/bug_inventory.json", "{OUT}/workspaces/*/case_reviews.json", "{OUT}/workspaces/*/waveform_reviews.json"]
    output_files:
      - "{OUT}/workspaces/*/bug_reviews.json"
      - "{OUT}/workspaces/*/root_groups.json"
    checker:
      - name: review_correlate
        clss: BugReviewStageChecker
        args: {stage: correlate}
  - name: publish
    desc: "发布结构化报告与 HTML"
    task:
      - "调用 BugReviewRunStage(stage=\"publish\")，核对每个输入工作区的确认、排除、未定条目及根因组。"
      - "检查 Bug 详情能追溯到测试、波形、Spec 和 RTL；总索引须列出全部工作区。"
      - "Check 通过后记录日志并 Complete。"
      - "当前进度：{BUG_REVIEW_PROGRESS}"
    reference_files: ["Guide_Doc/analysis.md", "{OUT}/workspaces/*/bug_reviews.json", "{OUT}/workspaces/*/root_groups.json"]
    output_files:
      - "{OUT}/workspaces/*/report_data.json"
      - "{OUT}/workspaces/*/index.html"
      - "{OUT}/index.html"
    checker:
      - name: review_publish
        clss: BugReviewStageChecker
        args: {stage: publish}
