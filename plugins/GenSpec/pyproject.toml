[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucagent-gen-spec"
version = "0.1.0"
description = "Deprecated specification generation plugin; use SpecGenerator (xiangshan-spec-generator) instead"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["UCAgent>=26.9.2.dev14"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.entry-points."ucagent.plugins"]
gen-spec = "gen_spec.plugin:get_plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gen_spec*"]

[tool.setuptools.package-data]
gen_spec = ["workflows/*.yaml", "Guide_Doc/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
