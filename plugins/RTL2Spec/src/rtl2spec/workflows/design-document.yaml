template: null

template_overwrite:
  XS_CONFIG: "$(XIANGSHAN_CONFIG: DefaultConfig)"

# Long RTL elaboration reports progress through RTL2SpecCommand.
call_time_out: 3660
tools:
  selected_tools:
    - RoleInfo
    - CurrentTips
    - Status
    - Detail
    - StageJournal
    - AllStageJournal
    - SetCurrentStageJournal
    - Check
    - Complete
    - KillCheck
    - Exit
    - PathList
    - GetFileInfo
    - FindFiles
    - SearchText
    - ReadTextFile
    - CreateDirectory
    - EditTextFile
    - ReplaceStringInFile
    - DeleteTextLines
    - RTL2SpecCommand
write_dirs:
  - "{OUT}"
  - "outputs/{DUT}"
  - "reports/{DUT}"
  - "evidence/{DUT}"
  - ".cache"
  - "third_party/XiangShan/out"
  - "third_party/XiangShan/build"
  - "third_party/XiangShan/src/main/resources/espresso"
un_write_dirs:
  - "{GUIDE_DOC}"
  - "inputs"
  - ".ucagent/.rtl2spec_receipt_key"
  - "third_party/XiangShan/src/main/scala"

guide_doc:
  enable: true
  core_copy_policy:
    default_action: ignore
    retain: []
    override: []
    ignore: []
  plugin_copy_policy:
    default_action: retain
    retain: []
    ignore: []

skill:
  general_skill_list: []

mission:
  name: "{DUT} XiangShan 设计文档生成"
  prompt:
    system: |
      你负责为 {DUT} 生成配置 {XS_CONFIG} 的中文设计与功能检测点文档。
      工作区提供 third_party/XiangShan 源码和文档产物。正式文档必须严格遵循 Guide_Doc/chip_design_document_template_zh.md 的固定输出顺序；完整写作方法见 Guide_Doc/generation-guide.md。
      使用相同 commit 和配置生成的 RTL、端口清单及 Chisel/Scala 建立事实证据。可选 spec 只表达设计意图；不确定项登记为 OPEN-*。
      先通过 CurrentTips 获取当前任务。使用 PathList、SearchText 定位相关源码，用 ReadTextFile 读取文件，用 EditTextFile、ReplaceStringInFile 写入文档。
      使用 RTL2SpecCommand 完成 preflight、evidence、related_sources、metadata、validate、lint 操作；按工具诊断修复问题。
      模块名使用 {DUT}，配置使用 {XS_CONFIG}。开始前必须确认 outputs/{DUT}、reports/{DUT} 和 evidence/{DUT} 没有旧的 RTL2Spec 产物；如果存在，先提醒用户自行打包旧产物并清理这些目录，再重新启动。先生成 RTL evidence，再写正文；写完草稿后 metadata，最后 validate/lint 并 Check。Mermaid 图直接保留在 Markdown 源码中，不生成 SVG 或其他图片文件。
      不得修改 DUT 源码、检查脚本或 Guide_Doc。发现已有产物时终止并警告用户，由用户自行打包和清理，禁止自动打包、删除或覆盖。同一次运行中可继续修订本次草稿、同步 metadata 和验收。
      每个阶段记录 SetCurrentStageJournal 后调用 Complete。每个阶段的 Check 都会核验实际证据和产物完整性；检查失败时按诊断修复后再试。
    skill_system: ""

stage:
  - name: inspect_and_generate_evidence
    desc: "核验模块和 RTL 证据"
    task:
      - "读取 Guide_Doc/generation-guide.md；核验 {DUT} 顶层 class、{XS_CONFIG} 配置及可选 inputs/{DUT}/"
      - "确认 outputs/{DUT}、reports/{DUT} 和 evidence/{DUT} 没有旧的 RTL2Spec 产物；若发现旧产物，停止并要求用户先打包后清理"
      - "定位并读取 third_party/XiangShan 中当前模块及其行为、接口、参数或配置依赖的相关模块源码；记录每个实际参考模块的类名、精确 source:line 和用途"
      - "执行 RTL2SpecCommand(action='preflight', module='{DUT}', config='{XS_CONFIG}') 并修复环境问题"
      - "执行 RTL2SpecCommand(action='evidence', module='{DUT}', config='{XS_CONFIG}')"
      - "读取 evidence/{DUT}/manifest.json、ports.csv 和生成的 RTL；确认模块、配置、commit 与当前源码匹配"
      - "对本次确实参考过的相关 Scala 模块执行 RTL2SpecCommand(action='related_sources', module='{DUT}', config='{XS_CONFIG}', related_modules=[...])；不把未读取或无关的模块列入清单"
    reference_files:
      - "Guide_Doc/generation-guide.md"
      - "Guide_Doc/chip_design_document_template_zh.md"
    output_files:
      - "evidence/{DUT}/manifest.json"
      - "evidence/{DUT}/ports.csv"
      - "evidence/{DUT}/{DUT}.sv"
    checker:
      - name: evidence_integrity_check
        clss: RTL2SpecArtifactsChecker
        args:
          module: "{DUT}"
          config: "{XS_CONFIG}"
          phase: evidence

  - name: draft_design_document
    desc: "编写设计文档和质量报告"
    task:
      - "读取 Guide_Doc/generation-guide.md 和 Guide_Doc/chip_design_document_template_zh.md，严格按文档摘要、设计概览、功能行为、验证策略与 Testplan、形式化属性契约、Sign-off 与开放项、附录 A 至附录 E 的顺序写作；P-* 与 CASE-* 仅在模板指定位置重复"
      - "正文按职责与边界、事务模型、数据/控制通路、关键资源与冲突、时序与状态、验证策略组织；每个 P-* 写激励、处理、结果、时延/顺序、边界、取消/恢复和 disabled 无副作用"
      - "在验证策略中填写验证架构与采样点；在形式化属性契约中填写时钟复位、X 态、公平性/等待界限和 harness 边界；Sign-off 使用开放项表与签核状态表；仅为实际存在或本次覆盖的场景创建 CASE-*，每个 CASE-* 填写参与者、前置条件、输入、预期输出和 FC/CK"
      - "生成 outputs/{DUT}/{DUT}_design_document_zh.md，删除模板 HTML 注释、生成过程说明和占位符；正文只使用逻辑接口名，完整扁平 RTL 端口、Scala 路径、参数和证据放到规定附录"
      - "基于已核验的 RTL/Scala 完成 FG/FC/CK、P-*、E-*、逻辑接口、ready/valid 接受条件、backpressure、Coverage、场景和 OPEN-*；不能推断精确 Verilog 名称或伪造验证结果"
      - "生成 reports/{DUT}/{DUT}_document_quality_review.md，记录证据来源、实际检查结果、参考的相关模块、正文引用位置和未完成的签核项"
      - "执行 RTL2SpecCommand(action='metadata', module='{DUT}', config='{XS_CONFIG}') 同步事实元数据"
    reference_files:
      - "Guide_Doc/generation-guide.md"
      - "Guide_Doc/chip_design_document_template_zh.md"
      - "evidence/{DUT}/manifest.json"
      - "evidence/{DUT}/ports.csv"
    output_files:
      - "outputs/{DUT}/{DUT}_design_document_zh.md"
      - "reports/{DUT}/{DUT}_document_quality_review.md"

    checker:
      - name: draft_artifacts_check
        clss: RTL2SpecArtifactsChecker
        args:
          module: "{DUT}"
          config: "{XS_CONFIG}"
          phase: draft

  - name: validate_and_finalize
    desc: "核验并完成最终产物"
    task:
      - "执行 RTL2SpecCommand(action='metadata', module='{DUT}', config='{XS_CONFIG}')"
      - "复核文档、报告与 evidence 的 commit、配置、端口数和相关模块清单一致；正文凡依据相关模块的结论必须引用对应 E-REL-*，附录 C 给出路径、行号和 SHA-256"
      - "运行 RTL2SpecCommand(action='validate', module='{DUT}', config='{XS_CONFIG}') 和 RTL2SpecCommand(action='lint', module='{DUT}', config='{XS_CONFIG}')，再运行 Check，按诊断修复文档、端口、链接或 Mermaid 源码问题；事实字段变化时重新 metadata"
      - "将实际验证结果记录进质量报告；未运行 SVA 编译或 formal 的项目保持未签核，禁止虚构通过；最后调用 Complete"
    reference_files:
      - "Guide_Doc/generation-guide.md"
      - "Guide_Doc/chip_design_document_template_zh.md"
      - "outputs/{DUT}/{DUT}_design_document_zh.md"
    output_files:
      - "outputs/{DUT}/{DUT}_design_document_zh.md"
      - "reports/{DUT}/{DUT}_document_quality_review.md"
    checker:
      - name: final_artifacts_check
        clss: RTL2SpecArtifactsChecker
        args:
          module: "{DUT}"
          config: "{XS_CONFIG}"
          phase: final
