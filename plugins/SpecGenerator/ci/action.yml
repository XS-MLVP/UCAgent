name: Validate Spec Generator
description: Check optional installation, source behavior, resources and built distributions against the installed UCAgent.

runs:
  using: composite
  steps:
    - name: Verify the core installation keeps the plugin optional
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: |
        python -I - <<'PY'
        from importlib.metadata import distribution, entry_points
        from importlib.util import find_spec

        core = distribution("UCAgent")
        assert not any("spec_generator" in str(path) for path in core.files)
        assert not any(ep.name == "xiangshan-spec-generator" for ep in entry_points(group="ucagent.plugins"))
        assert find_spec("spec_generator_plugin") is None
        PY
    - name: Install plugin and test tools
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: python -m pip install -e '.[dev]'
    - name: Validate repository-owned files
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: make repo-lint
    - name: Validate source plugin and runtime
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: |
        make plugin-check
        make test
    - name: Render template diagrams
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: make template-check
    - name: Build distributions and validate installed plugin
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: |
        python -m build
        python -m pip install --force-reinstall --no-deps dist/*.whl
        ucagent --validate-plugin xiangshan-spec-generator
        python -I -m pytest -q --import-mode=append -o pythonpath=''
