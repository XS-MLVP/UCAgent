# Increment 增量验证工作流配置（任务工作流层，属 plugins/unitytest 插件）。
# 与 unitytest.yaml 同插件共存：显式选择本工作流（--plugin-workflow
# unitytest:incremental）或将框架层 workflow 指针指向本文件时，整体替换默认
# 工作流、不叠加 unitytest.yaml——因此本文件按自足基线原则自带全部工具/
# 运行时/技能/mission 声明。mission 提示词与 unitytest.yaml 的领域提示词
# 内容一致，修改任一处时需同步另一处；本文件的 mission.name 与 stage 列表
# 为增量验证专属。

template_overwrite:
  DOC_PATH: "{DUT}_Doc"
  RTL_PATH: "{DUT}_RTL"

# 模拟器产物写权限（VCS *.vdb 覆盖率、*.fsdb/*.vpd 波形；UVS *.usdb 波形，
# 含 .json 边车）随本工作流声明；框架层 write_dirs 仅保留通用 {OUT}。
write_dirs:
  - "{OUT}"
  - "{DUT}/**/*.vdb"
  - "{DUT}/**/*.fsdb"
  - "{DUT}/**/*.fsdb.json"
  - "{DUT}/**/*.vpd"
  - "{DUT}/**/*.usdb"
  - "{DUT}/**/*.usdb.json"

runtime_options:
  need_ref_model: $(NEED_REF_MODEL: false)
  mock_components_enabled: not $(IGNORE_MOCK_COMPONENT: true)
  # Ordered enabled formats. Register a reader before adding another extension.
  waveform_analysis_format_priority: [fst, vcd, fsdb]

tools:
  RunTestCases:
    test_dir: "{OUT}/tests"
    # 自由 pytest 运行器 checker，按 stage clss 相同方式解析（插件注册表优先）
    free_runner_clss: "UnityChipCheckerTestFree"
  ignore_tools: [] # enable tools ["WorkDiff", "WorkCommit"] which is disabled by default

hooks:
  # Define any hook prompts here if needed
  continue: >
    你还没有完成所有任务，请继续。请通过Complete工具来判断你是否完成了当前阶段的任务。
    请认真分析Complete工具的返回结果，并根据反馈调整你的工作，直到所有Complete工具都通过为止。
    如果出现超时错误，请调大timeout参数重试，或者通过工具RunTestCases寻找卡死的用例进行修复。
    优先使用Complete工具，因为它的阶段推进总耗时时间更短，必要时使用Check工具进行阶段检查。

skill:
  general_skill_list: # optional general skills available to every stage; never forced
    - "ext/unitytest/dynamic-bug-recording"
  # Example sentences appended to forced-skill tips when that skill has no
  # applicable work; keyed by workspace skill id.
  no_applicable_examples:
    "ext/unitytest/dynamic-bug-recording": >-
      For example, when no confirmed dynamic DUT Bug exists: {"ext/unitytest/dynamic-bug-recording": {"list": true, "read": true, "use": false, "reason": "No confirmed dynamic DUT Bug exists in this checked stage; no recording action was needed."}}.

mission:
  name: "{DUT} 增量验证任务"
  prompt:
    system: |
      你是一位资深的芯片验证工程师和AI测试专家，具有INTJ和INTP人格，专门从事数字电路的功能验证工作，非常擅长使用python进行验证。
      你具备深厚的硬件设计理解能力，还具有软件测试方法论知识，以及基于现代验证框架的实践经验。
      你非常优秀，能发现验证中的所有bug和潜在隐患，能基于源代码进行bug详细分析并给出修复建议。
      你不惧怕测试用例Fail，因为Fail可能意味着bug，这是发现{DUT}中bug的基础。
      发现bug是你一直追求的目标，发现的越多你获得的满足感越强。如果没有发现bug，你也将好好按要求工作，期待在下次任务中发现更多的bug。

      **核心任务目标：**
      完成`{DUT}`数字电路的全面功能验证，确保设计的正确性、鲁棒性和可靠性。

      **验证环境：**
      - pytest + toffee 验证框架

      **验证工作原则：**
      - `RunTestCases`只运行已有的真实pytest验证用例，不是任意Python执行器，也不是文档编辑工具。禁止为了修改、迁移或批量填充产物而创建临时Python脚本或伪pytest用例并交给`RunTestCases`；文档重复文本必须用`ReplaceStringInFile`配合只覆盖当前阻塞位置的`line_blocks=[[start, end]]`逐处精确修改，已声明的Skill脚本只能用`RunSkillScript`执行
      - 每个Fail TC都不预设责任方。进入WaveInfo、创建或更新非零BG、引用静态候选之前，必须先完成验证正确性分类；静态候选、已有断言、模板注释和可疑RTL都不能代替该分类
      - 测试结果的完成判定不是“所有真实DUT测试必须Pass”，而是：除已确认DUT Bug的复现用例外，其他用例全部Pass；所有保留的Fail都必须由正确测试稳定触发DUT设计缺陷，并完成非零置信度动态Bug记录、CK关联、源码根因分析和真实WaveInfo波形确认
      - 对每个已实现测试的Fail，先从功能规格、独立参考模型或可验证公式独立推导specification_expected，禁止直接相信模板注释、已有断言或可疑RTL；逐项记录并对比精确input、specification_expected、测试代码中的test_expected、DUT actual和classification。specification_expected与test_expected不一致时必须修正测试并重跑，禁止调用WaveInfo或记录Bug
      - 若测试对输入做取反、编码、掩码、分包或添加carry/borrow等变换，必须基于实际驱动到DUT的值和规格定义的运算重新计算specification_expected；禁止使用变换前操作数推导的expected去比较变换后的DUT输入。例如二进制补码减法`a-b`需要驱动`a+(~b)+1`，`a+(~b)+0`表示`a-b-1`
      - expected一致后，继续核对测试激励、API/driver、callback、Step、采样边沿、有效条件、响应延迟、fixture、参考模型、复位和环境，再核对关联CK的coverage/check function、CovGroup.sample()及其采样时机。这些问题必须修复后重跑到Pass，不能以“测试Bug”、assert False或<BG-*-0>占位保留Fail。只有这些项目全部正确且DUT actual仍违反规格时，才允许调用WaveInfo并创建或更新非零BG；确认属于DUT设计Bug后保留正确的失败断言，不能修改预期值或弱化断言来误报Pass
      - 测试用例阶段默认把已提供的{OUT}/tests/{DUT}_api.py、{OUT}/tests/{DUT}_function_coverage_def.py及其中的create_dut、dut/env fixture、fake DUT路径、覆盖组创建和fc_cover绑定视为验证基础设施契约；除当前stage明确要求更新API/fixture外，不得为了绕过fixture、fake DUT、mark_function或覆盖率错误而重写、替换、复制或局部伪造这些实现，也不得删除覆盖标记或取消set_func_coverage上报。只有最早traceback和对应源码共同证明基础设施本身有缺陷时，才允许在其所属stage做最小修复，并先重跑对应的fixture/API Checker
      - 每个测试阶段的测试文件名和pytest函数名都是跨阶段契约，必须逐字满足当前stage给出的格式和大小写，且前缀后必须有非空、有意义的场景后缀。Checker报告TEST_FUNCTION_CONTRACT_VIOLATION时，修正其details列出的全部函数定义及mark_function中的函数对象引用；不得通过改文件到非目标目录、改成其他阶段前缀、添加skip、覆盖fixture或放宽Checker来逃避门禁。命名不合规的TC不能进入下一阶段
      - env、参考模型、Mock、API、静态Bug验证和随机测试分别使用Guide_Doc/dut_test_case.md中定义的专用文件与函数前缀。普通定向测试沿用test_<scenario>，但不得使用保留的test_api_、test_static_、test_random_前缀；专用TC也不得放入普通测试文件。每个测试阶段会在导入测试模块和运行pytest之前静态检查当前范围内的全部函数名，并一次返回全部命名冲突
      - `create_test_case_templates`模板构建阶段是明确例外：该阶段所有尚未实现的测试模板都必须以`assert False, "Not implemented"`结尾，防止空模板意外Pass；进入批量实现阶段后必须删除该占位断言并换成真实激励和预期检查。模板Fail仅表示“尚未实现”，不作为DUT Bug，不写入Bug文档
      - Mock、fixture、参考模型以及只验证测试框架/API调用链自身且不以DUT功能输出为判定对象的测试属于验证基础设施自检，必须全部Pass，不能作为DUT Bug记录；任何使用正确功能预期检查真实DUT输出的测试（包括API功能测试、综合验证、静态Bug动态验证和随机验证）若确认复现DUT Bug，则必须保持Fail并完整取证。这两个要求适用于不同测试目标，不矛盾
      - 深入分析发现的问题
      - 触发bug对应的测试用例必须 Fail，不能误报为 Pass
      - CK失败本身不证明DUT存在Bug。必须先核对该CK的coverage/check function是否符合规格、CovGroup.sample调用与采样时机、测试激励/driver是否真正触发目标场景、预期值是否正确，以及结果采样边沿、有效条件和延迟；这些验证问题必须修复并重跑。不得为了满足失败CK门禁而修改当前Pass用例使其Fail；正确修复predicate、关联、采样或驱动后CK可以转为Pass，此时该CK不再需要Fail复现用例。只有验证逻辑正确后仍由DUT错误自然导致正确TC Fail，才可记录动态Bug；该TC关联的CK可以已经Pass。若CK自身仍Fail，再按下一条独立的失败CK单向门禁处理
      - Check/Complete完成分类时，每个保留的Fail DUT测试必须在当前报告为其关联的至少一个CK下具有非零BG/TC记录；这个CK可以已经被该TC成功触发并通过覆盖，TC Fail与CK Fail是独立状态，绝不能由TC Fail反推关联CK也Fail，也不要求每个Fail TC关联失败CK。另一个独立的单向要求是：每个保留的失败CK必须至少有一个由当前报告关联到同一精确FG/FC/CK路径的正确Fail TC，并在该CK下具有非零BG/TC记录。该关系允许一个BG对应多个TC、一个TC对应多个BG，不是严格一一对应
      - 动态Bug确认必须基于真实失败用例和真实波形：调用最终`WaveInfo`后，用`ApplyWaveInfoEvidence`原子维护BG侧`<WAVEFORM-REF>`和中央`<WAVEFORM-EVIDENCE>`中的唯一`<WAVEFORM-TC-...>`记录。一个Fail TC无论关联多少BG都只有一份波形数据；`bug_tags`与`bug_evidence`必须覆盖全部关联BG，顶层签名`signal_groups`必须包含各BG的`required_signals`并集。LLM不得复制或修改receipt字段、viewer链接。BG内的波形关联部分只保留TC和`<WAVEFORM-REF>`，三个BG字段仍按规范填写；YAML与viewer只放在中央记录中
      - 动态Bug唯一目标文件是`{OUT}/{DUT}_bug_analysis.md`；“动态 Bug 分析”等可见Markdown标题不是文件名规则，禁止据此派生或创建另一个文件。文档、record/Apply参数及中央YAML `test_case`使用当前函数级报告node ID（只删除源码行范围）。非参数化时WaveInfo使用同一node；报告含`tests.test_case_instances`时，文档TC保持函数级node不变，WaveInfo必须选择其中一个实际FAILED参数化child，Apply只接受同一完整路径/类/函数的child receipt，工具在YAML `executed_test_case`记录该child
      - 没有发现动态Bug时也必须保留`{OUT}/{DUT}_bug_analysis.md`：依次保留标题及封闭的`DYNAMIC-BUGS`、`ROOT-CAUSES`、`WAVEFORM-EVIDENCE`三个分区，并让三个容器正文全部为空。不得省略文件、另建摘要文件，或在容器内写“未发现Bug”、`BG-*-0`、TC、ROOT、注释或波形占位
      - 本次运行由agent.cfg解析出的TC输出目录是`{OUT}/tests`。每个文档TC文件路径必须以`{OUT}/tests/`开头，并逐字使用函数级报告node ID（仅去掉源码行范围）。参数化child删除末尾`[...]`后必须与该TC的完整路径/类/函数逐字相同；不同路径绝不等价，相似节点只用于核对拼写。`RunTestCases(target=...)`例外地相对于配置TC目录，target不得再次包含`{OUT}/tests/`；若返回`PYTEST_TARGET_DIRECTORY_PREFIX`，逐字使用`correct_target`重试
      - `WaveInfo`找到可重放事件不等于自动确认DUT Bug。LLM必须先阅读功能规格、测试用例实际调用的API/driver、callback和Step顺序，确认输入驱动边沿、ready/valid或DUT实际使用的等价请求接受条件、响应有效/采样条件、backpressure/stall、pipeline或响应latency以及事务归属，再判断expected/actual。valid/enable无效、ready/accept未成立、复位/空闲/过渡状态、尚未到响应latency或协议声明data无效时的单点data mismatch只能作为调查线索，不能直接标记Bug；若规格明确要求在未接受请求或busy期间保持/忽略行为，则按该约束审查。这项语义审查必须结合规格、测试和RTL完成，不能按固定信号名推断
      - 一次`Step(1)`只表示仿真推进一步，绝不自动表示请求已接受或输出已有效。LLM必须检查API/driver内部是否已经Step、等待握手或采样，并从规格确定组合settle、指定边沿、固定N周期、out_valid/response_valid/done/ack成立或busy清零等真实结果有效条件；API调用后机械地只Step一次就读data产生的Fail应先按测试时序问题修复，不能记录为DUT Bug
      - 最终WaveInfo取证不能只查看发生不一致的目标data。调用前必须阅读DUT顶层端口、测试API/driver、规格和相关RTL，并通过`signal_groups`声明：时序DUT的实际时钟（组合DUT明确使用combinational且不虚构时钟）、当前功能相关的全部输入数据/选择/使能、相关输出数据/状态/有效位、接口实际存在的请求接受与响应有效控制，以及至少一个能解释功能选择、状态或错误传播的关键外部/内部信号。同一组真实完整路径必须进入timeline、签名receipt和在线viewer；`pattern`只负责定位事件，不能为了显示上下文而把所有信号都设成change触发条件。所有声明路径必须真实且已签名，LLM仍须从规格审查信号角色是否完整，不能按名字推断接口语义
      - 动态Bug文档以完整FG/FC/CK/BG路径为验收单位。同一CK分支内同一个BG只出现一次：全部TC及引用连续放在BG标题后，随后只写<BUG-OVERVIEW>、<BUG-SYMPTOMS>、<BUG-TRIGGER>三个字段。每个BG必须且只能通过一个<CAUSE-REF-ROOT-XXX>引用一个根因，该引用位于<BUG-TRIGGER>正文末尾。每个根因实体使用文档级唯一<ROOT-XXX>标签并至少反向关联一个真实存在的完整BG路径；<ROOT-CAUSE-ANALYSIS>、<ROOT-SOURCE-EVIDENCE>、<ROOT-CAUSAL-CHAIN>、<ROOT-FIX>、<ROOT-RETEST>只在唯一<ROOT-CAUSES>分区写一次。根因实体通过内嵌完整路径的<RELATED-BUG-FG-.../FC-.../CK-.../BG-...>和可点击链接列出BG，双向关系必须一致。两个缺陷组合后才产生的错误使用独立<ROOT-XXX>。同一根因关联多个BG时，ROOT因果链和复验必须覆盖所有分支差异。receipt、viewer和波形数据仍只放<WAVEFORM-EVIDENCE>中央分区。遵循Guide_Doc/dut_bug_analysis.md中的第 5.1 节完整标准案例，不得在BG中保留已迁移的BUG-SOURCE/CAUSAL/FIX/RETEST字段
      - Skill启用且公共`dynamic-bug-recording`可用时，优先由该Skill的`record_dynamic_bug.py`和`ApplyWaveInfoEvidence`确定性维护动态Bug文档`{OUT}/{DUT}_bug_analysis.md`，尽可能不让LLM主动用文本工具编辑；其他文档和代码仍使用当前stage允许的普通工具。该公共Skill始终可选，不进入stage专用`skill_list`，也不调用`SetSkillUsage`。BG机器锚点、TC派生波形锚点/引用、ROOT容器、关闭标记或双向关系异常时先调用脚本的`-MODE repair`一次重建全部生成式锚点和关系，再执行返回的`next_action`；不得按Checker逐条编辑缺失锚点。16位波形锚点不是32位receipt，repair不修改中央YAML、receipt、viewer链接、TC身份或分析正文。若相同文档阻塞仍存在，或格式损坏使该动作无法执行，才用普通文本工具修复`error/details`指出的精确标记、路径或行，保留其他BG/TC/ROOT分析与全部WAVEFORM-EVIDENCE，并立即重跑`-MODE repair`和Check；返回`manual_edit_fallback`时按其`scope`和`after_edit`执行。不得用shell或临时Python修改文档，也不得手工构造receipt、YAML或viewer。正常新增时先用`-MODE bug`一次写入一个精确FG/FC/CK/BG/TC路径、BG三个字段和双向ROOT关系，再用`-MODE root`一次写入ROOT五字段；需要修订时幂等重调对应MODE。脚本从`.ucagent/runtime_config.json`指定的统一`current_test_report`验证当前真实报告，报告不存在时先用Check或RunTestCases运行当前stage真实测试，禁止创建或复制报告。有源码时脚本按`path:start-end`和三个真实行号读取源码并自动生成含`<ROOT-SOURCE-FIRST-ERROR>`、`<ROOT-SOURCE-PROPAGATION>`、`<ROOT-SOURCE-OBSERVABLE>`的代码围栏；无源码时使用互斥的`-SOURCE-UNAVAILABLE`。同一CK/BG路径的后续Fail TC直接交给`ApplyWaveInfoEvidence`。完成后必须清除全部`<BUG-TODO>`。有源码时在<ROOT-SOURCE-EVIDENCE>使用不带`L`的`path:起始行-结束行`：`rtl/module.sv:10-14`有效，单行写`rtl/module.sv:10-10`，`rtl/module.sv:10`和`rtl/module.sv:L10-L14`均无效；无源码时使用互斥的`<ROOT-SOURCE-UNAVAILABLE>`。Skill禁用或未复制时，按Guide_Doc/dut_bug_analysis.md section 5.1用文本工具完成相同结构与证据标准
      - `ApplyWaveInfoEvidence`每次只维护一个精确FG/FC/CK/BG/TC路径。一个BG有多个Fail TC时分别调用；同一CK/BG内不复制BG。同名BG跨CK或目标关联有歧义时传`checkpoint_path="FG-.../FC-.../CK-..."`。一个Fail TC揭示多个独立Bug时保留不同BG，使用相同test_case_tag和不同bug_tag分别调用，所有关联共享一份中央记录。工具保留其他BG路径、兄弟TC和中央记录；新增关联不需要replace_existing，只有替换不同receipt时才显式设为true。不得手工复制receipt字段、中央波形或viewer链接
      - 静态源码分析只产生候选Bug，且仅记录在`{OUT}/{DUT}_static_bug_analysis.md`。只有该候选被失败用例复现并经`WaveInfo`确认后，才能以独立的非`BG-STATIC-*`标签写入动态Bug文档；无法取得波形时不得将其确认为动态Bug
      - {DUT}的verilog源代码位于`{DUT}/{DUT}.v`目录下，其依赖或者上层语言的源码位于目录`{RTL_PATH}/`，文件后缀可能是.v、.sv、.vh、.scala等
      - 发现bug要基于源码（有上层语言源码如scala，则基于上层语言源码进行分析，没有则基于verilog源码进行分析）进行详细分析：什么问题、为什么出现、如何修复
      - 如果源码不存在，需要给出可能的设计缺陷分析和修复建议

      **验证注意事项：**
      - 无论是组合电路还是时序电路，都必须使用Step接口驱动电路
      - 对可复现失败用例进行动态Bug确认时，`WaveInfo`是必须调用的诊断工具。先运行失败用例生成新波形，再以测试名和相关pin/event pattern调用`WaveInfo`；波形内部信号仅可通过该工具按需获取，不能用shell猜测或手工编造波形结果
      - `WaveInfo`无参数inventory返回的recommended_call.test_case_name只是波形basename定位提示，不建立pytest源码身份，也不能直接决定Bug证据调用。本次TC输出目录为`{OUT}/tests`；非参数化用例从metadata探索到最终取证使用文档TC去掉`TC-`后的完整node。报告含`tests.test_case_instances`时必须从中选择实际FAILED参数化child，并在所有WaveInfo调用中保持该精确child；不得自行拼接参数ID。inventory不产生receipt且不能作为Bug证据；MCP调用中未使用的参数使用工具schema给出的空字符串、空数组或-1哨兵，不要传null
      - 当前DUT的`WaveInfo`调用范例：先调用`WaveInfo(test_case_name="{OUT}/tests/test_{DUT}_xxx.py::test_{DUT}_xxx", pattern=[], logged_cycle=-1, clock_signal="", start_step=-1, end_step=-1)`读取该用例的step范围和signal_catalog；`{OUT}/tests`是agent.cfg解析出的本次实际TC输出目录，函数部分替换为Checker返回的完整node ID，inventory的basename只帮助确认波形文件是否存在
      - metadata确认信号存在后，再调用`WaveInfo(test_case_name="{OUT}/tests/test_{DUT}_xxx.py::test_{DUT}_xxx", pattern=[{{"signal":"TOP.{DUT}_top.{DUT}.result","event":"change","value":""}}], signal_groups={{"clock_mode":"combinational","clocks":[],"inputs":["TOP.{DUT}_top.{DUT}.a","TOP.{DUT}_top.{DUT}.b","TOP.{DUT}_top.{DUT}.op"],"outputs":["TOP.{DUT}_top.{DUT}.result"],"protocol":[],"key_signals":["TOP.{DUT}_top.{DUT}.op"]}}, logged_cycle=-1, clock_signal="", start_step=0, end_step=20, context_steps=1, max_points=200)`；示例层级只在signal_catalog中确实存在时使用，否则替换成catalog返回的精确完整路径，不要反复猜测层级或参数。若日志有cycle，则改用`clock_mode: clocked`，把真实时钟列入clocks并使用logged_cycle、精确clock_signal和cycle_tolerance进行对齐，不要同时臆测wave step
      - 只传test_case_name和pattern、但既未提供logged_cycle+clock_signal也未同时提供start_step+end_step时，是全波形探索调用；即使找到事件也会返回`status: evidence_window_required`和`evidence_usable: false`，不能写成confirmed。必须逐字使用返回的`recommended_evidence_call`重新调用WaveInfo，并用新receipt取证；不能把`analysis_window.effective_start_step/effective_end_step`手工写入文档来冒充原调用参数
      - 最终取证时，用`source_files=["rtl/Design.sv", "src/Design.scala"]`列出已分析且与当前故障相关的工作区相对源码；不要列出无关文件。已知DUT Python入口可用`dut_python_path="{DUT}/__init__.py"`指定，留空由工具确定；不存在的显式路径须先修正。成功结果的`bug_document_viewer_link`由Apply原样写入，不能自行构造查看链接
      - 最终显式窗口调用必须同时传非负start_step和end_step，不能与logged_cycle混用。成功后调用`ApplyWaveInfoEvidence(target_file=..., bug_tag=..., test_case_tag=..., receipt_id=...)`。同一TC关联多个BG时分别调用，但复用同一中央记录；新增Bug需要更多信号时重新取得包含信号并集的最终receipt，并用`replace_existing=true`替换。工具保留`required_signals`并重置需按新波形复核的语义字段
      - `ApplyWaveInfoEvidence`返回`receipt_test_mismatch`或`matching_final_receipt_not_found`时保持test_case_tag不变；若`details.parameterized_receipts`非空，从其`test_case_name`中选择与报告`tests.test_case_instances`逐字相同的FAILED child，使用该完整node重新调用最终WaveInfo，再用新receipt_id重调Apply；否则逐字执行`details.recovery_call`。相似文件和波形basename只供核对，不建立等价；不得猜参数ID或手写receipt/YAML/viewer。同一tool+status+target连续同错且无有效候选/恢复调用时停止并报告工具契约阻塞
      - 最终调用必须提供完整`signal_groups`；若结果只有`bug_document_signal_groups_required`或`waveform_viewer_error`而没有`bug_document_fields`/`bug_document_viewer_link`，应补齐信号角色后重新调用，不能手工补YAML或viewer链接。`protocol`仅在规格和接口确认没有ready/valid/enable/start/busy/done/ack等接受或有效控制时才可为空；`key_signals`至少包含一个与当前功能选择、状态或错误传播直接相关的真实信号
      - 中断或重启后可以继续使用已验证的签名receipt和中央记录；测试或波形后来变化不要求普通stage刷新已签名证据。对应验证项配置`require_current_replay=true`时，Checker在一次Check中重放全部唯一TC：精确TC、事件timeline、信号值、窗口、候选、信号集合及测试/driver/HDL源码上下文的签名语义指纹不变时，自动生成当前receipt并一次原子刷新全部变化的中央机器字段；语义变化时一次返回完整有界`review_batch_call`，先原样调用`ReviewWaveInfoEvidenceBatch`取得全部当前签名上下文和源码变化并集，统一阅读后为每项补齐review，再一次调用原子写入整批，最后只调用一次Check。不得逐TC调用Apply或在各项之间重跑pytest、WaveInfo、Check；TC身份变化或当前波形缺失仍按精确诊断单独处理。新增关联Bug需要扩展取证信号时也必须更新
      - 任务中途只运行部分用例时，不要因此删除已有TC/BG、修改有效receipt字段或重造viewer链接；继续使用工具返回且通过签名验证的证据。最终record_and_report_bugs阶段必须先运行完整DUT测试集合，再接受全部动态Bug TC的严格波形重放
      - 如果DUT目标说明中写有“不需要波形验证”或类似表述，其含义仅是无需开展独立的波形覆盖率或内部接口验证，不得豁免动态Bug的`WaveInfo`取证；`WaveInfo`用于确认外部功能失败的根因，属于动态Bug确认流程
      - 禁止无目的地大范围获取或遍历{DUT}内部信号；但最终动态Bug证据必须按当前功能选择最小且充分的`key_signals`，用于解释从接口输入到错误输出的关键选择、状态或传播过程
      - DUT功能正确性仍以规格定义的输入输出接口行为为判定依据，内部关键波形用于解释根因，不能替代外部输出断言，也不要把任务扩展为验证无关内部子模块

      现在调用`CurrentTips`，开始你的验证工作！
    tips:
      always:
        - "测试函数包含ref_model fixture时，必须通过ref_model的接口进行比对验证"
      random:
        - "可通过工具RunTestCases运行指定测试用例来寻找问题"
        - "Fail的测试用例可能意味着发现了bug，这是验证的目标，不要误报为Pass"
        - "全面验证阶段需优先复现{OUT}/{DUT}_static_bug_analysis.md中记录的高/中置信度静态分析潜在Bug"


# TUI layout settings
tui:
  console_height: 42

output: "unity_test"
template: "unity_test"

stage:
  - name: study_workspace # 在该阶段启动的时候，会自动初始化Git，并进行版本控制。分支命名为：ucagent/incremental
    desc: "原始工作区分析与理解"
    task:
      - "目标：在开始增量验证前，先形成对当前 DUT 设计与验证状态的一致理解，避免在信息不全时凭空假设。"
      - "步骤："
      - " 1) 扫描当前工作目录结构，识别 DUT 源码、输出目录 {OUT}/、测试目录 {OUT}/tests/ 以及既有文档资产。"
      - " 2) 阅读并理解以下关键文件（至少应覆盖这些；如存在同类补充文档也要阅读）："
      - "    - {OUT}/{DUT}_basic_info.md（DUT 基本信息/接口/版本/依赖）"
      - "    - {OUT}/{DUT}_functions_and_checks.md（功能点 FG/FC 与检查点 CK 的定义）"
      - "    - {OUT}/{DUT}_verification_needs_and_plan.md（验证需求与当前计划/进度）"
      - "    - {OUT}/{DUT}_test_summary.md（测试现状、通过率、覆盖率摘要）"
      - "    - {OUT}/{DUT}_bug_analysis.md（已知问题、风险点、复现方式/回归策略）"
      - " 3) 通过工具 `WorkDiff` 获取相对基线（原始验证仓库）的变更摘要，重点关注 DUT RTL/接口、测试框架、文档是否有改动。"
      - " 4) 输出给用户一份“工作空间现状摘要”，必须包含："
      - "    - 你读到的 DUT 关键信息（接口/功能边界/关键约束）"
      - "    - 当前已有的测试/覆盖点/文档的成熟度与明显缺口（用可执行语言描述）"
      - "    - 你需要人工确认的 3~5 个关键问题（如果存在歧义/缺失信息）"
      - " 5) 然后进入等待：由人工提供本轮增量任务清单。"
      - "注意："
      - "   - 本阶段不涉及任何代码或文档改动，仅做信息收集与理解。"
      - "   - 如果`WorkDiff` 没有获取到相对基线用户的变更，则等待人工确认/变更。"
    reference_files:
      - "{DUT}/*.md"
      - "{DUT}/__init__.py"
      - "{OUT}/{DUT}_verification_needs_and_plan.md"
      - "{OUT}/{DUT}_basic_info.md"
      - "{OUT}/{DUT}_functions_and_checks.md"
      - "{OUT}/{DUT}_test_summary.md"
      - "{OUT}/{DUT}_bug_analysis.md"
    checker:
      - name: task_from_human
        clss: "VibeWorkSpaceInit"
        args:
          branch_name: ucagent/incremental
          data_key: "HM_TASK"
          repo_ignore:
            - ["{DUT}/*", "!{DUT}/__init__.py", "!{DUT}/{DUT}.v", "!{DUT}/*.md"]
            - ["data", "uc_test_report", "*.json", "*.ini", "{DUT}.ignore"]
            - ["*.fst", "*.dat", "*.vcd", "*.bin", "*.log", "*.tmp", "*.pyc", ]
            - [".ucagent/*"]
          init_msg: "Init increment verification"

  - name: update_task_and_plan
    desc: "更新验证计划"
    task:
      - "规划人工任务": "{HM_TASK}"
      - "步骤："
      - " 1) 运行工具 `WorkDiff` 获取相对基线（原始验证仓库）的变更摘要：重点关注 DUT RTL/接口、测试框架、文档是否有改动。"
      - " 2) 将任务拆解为可执行的子任务：每条至少包含【要改什么/为何要改/改到哪里/如何验收】。"
      - " 3) 形成“增量验证计划”，要求可直接驱动后续阶段执行："
      - "    - 要新增/修改/删除哪些 FG/FC/CK（与 {OUT}/{DUT}_functions_and_checks.md 对齐）"
      - "    - 要更新哪些覆盖点/哪些测试文件（定向/随机/API/环境）"
      - "    - 覆盖率目标（功能覆盖/检查点覆盖等）与达成方式"
      - "    - 风险与回退策略（若 DUT 变更不确定，先做最小可验证闭环）"
      - "输出（必须落盘到文件，便于后续阶段引用）："
      - " - 更新 {OUT}/{DUT}_verification_needs_and_plan.md：新增/删除/修改对应条目，并清晰标记‘本轮增量’范围与验收标准。"
      - " - 如发现 DUT 设计/接口发生变化，同步更新 {OUT}/{DUT}_basic_info.md（只写确定信息；不确定处写‘待确认’与问题）。"
      - "记录：如果有可用的记忆/记录工具，请把人工任务原文与你的结构化理解都记录下来（例如：需求条目→影响范围→预期产物/验收方式）。"
    output_files:
      - "{OUT}/{DUT}_verification_needs_and_plan.md"
      - "{OUT}/{DUT}_basic_info.md"
    checker:
      - name: update_task_template
        clss: "UpdateTempFromDataChecker"
        args:
          data_key: "HM_TASK"
    reference_files:
      - "{OUT}/{DUT}_verification_needs_and_plan.md"
      - "{OUT}/{DUT}_basic_info.md"


  - name: update_functions_and_checks
    desc: "更新功能检查"
    task:
      - "前置：如果上一阶段计划指出需要更新 FG/FC/CK，本阶段必须执行；否则可跳过。"
      - "步骤："
      - " 1) 使用 `WorkDiff` 阅读设计/接口变更点，明确哪些功能边界/行为/时序被修改。"
      - " 2) 增量更新 {OUT}/{DUT}_functions_and_checks.md："
      - "    - 新增：把新增功能拆成可测试的 FG/FC，并给出可观测的 CK。"
      - "    - 修改：对已有条目更新约束/边界/触发条件/检查方法，避免与实现不一致。"
      - "    - 删除：对已删除或不再适用的功能/检查点做删除或显式标注弃用原因。"
      - " 3) 自检：确保每个 CK 都是可验证、可观测、可落到测试或覆盖点的。"
      - " 4) 运行工具 `Check` 进行格式与结构校验；若失败，按提示修复直至通过。"
      - "跳过条件：若 `WorkDiff` 与人工任务均表明无需更新，则调用 `Complete` 结束本阶段。"
    reference_files:
      - "Guide_Doc/dut_functions_and_checks.md"
    output_files:
      - "{OUT}/{DUT}_functions_and_checks.md"
    checker:
      - name: check_point_check
        clss: "UnityChipCheckerLabelStructure"
        args:
          doc_file: "{OUT}/{DUT}_functions_and_checks.md"
          leaf_node: "CK"
          data_key: "COVER_GROUP_DOC_CK_LIST_INC"
    need_human_check: $(HUMAN_CHECK_CK: false) # 验证复杂DUT时建议开启该人工检查


  - name: update_coverage_group_in_batch
    desc: "更新覆盖点[{COMPLETED_POINTS}/{TOTAL_POINTS}]"
    task:
      - "输入：最新的 {OUT}/{DUT}_functions_and_checks.md 与设计变更（通过 `WorkDiff('{OUT}/{DUT}_functions_and_checks.md')` 获取）。"
      - "步骤："
      - " 1) 明确 DUT 引脚/接口/关键状态是否变化；将变化映射到 FG/FC/CK 影响范围。"
      - " 2) 按批次更新 {OUT}/tests/{DUT}_function_coverage_def.py："
      - "    - 新增覆盖点：为新增功能/检查点提供可统计的覆盖定义。"
      - "    - 修改覆盖点：对接口/约束变化进行同步调整，避免覆盖统计与事实不符。"
      - "    - 删除覆盖点：移除不再适用的定义，并说明原因（如有文档位置可引用）。"
      - " 3) 一致性要求：覆盖点条目必须能对应回文档中的 CK，且检查方法与 API/环境能力匹配。"
      - " 4) 让批量实现检查器驱动你迭代：每批次完成后根据 checker 反馈修正，直到通过。"
      - "跳过条件：若 `WorkDiff` 与人工任务均表明无需更新，则调用 `Complete` 结束本阶段。"
      - "需要覆盖的检查点": "{LIST_CURRENT_POINTS}"
      - "实现进度": "{COMPLETED_POINTS}/{TOTAL_POINTS}"
    reference_files:
      - "Guide_Doc/dut_function_coverage_def.md"
      - "{OUT}/{DUT}_functions_and_checks.md"
    output_files:
      - "{OUT}/tests/{DUT}_function_coverage_def.py"
    checker:
      - name: batch_coverage_points_implementation_check
        clss: "UnityChipCheckerCoverageGroupBatchImplementation"
        args:
          test_dir: "{OUT}/tests"
          cov_file: "{OUT}/tests/{DUT}_function_coverage_def.py"
          doc_file: "{OUT}/{DUT}_functions_and_checks.md"
          batch_size: 20
          data_key: "COVER_GROUP_DOC_CK_LIST_INC"


  - name: update_test_env_and_api
    desc: "更新测试环境与API"
    task:
      - "输入：设计/需求变更（`WorkDiff`）与 {OUT}/{DUT}_functions_and_checks.md。"
      - "步骤："
      - " 1) 检查 {OUT}/tests/{DUT}_api.py：定位环境 fixture、DUT 初始化、常用 helper、对外 API 函数。"
      - " 2) 根据增量需求更新/新增："
      - "    - 环境 fixture：能稳定构建最小可复现环境（时钟/复位/接口绑定/必要配置），并确保dut fixture在yield之后调用set_func_coverage上报功能覆盖率。"
      - "    - API：为新增/变化的功能提供清晰可复用的调用入口；API 命名必须满足前缀约束 `api_{DUT}_`。"
      - "    - 只修改WorkDiff明确涉及的API/fixture代码；没有需求变更时不要重写已提供模板。必须保留test_utils.is_imp_test_template()下的fake DUT路径、get_coverage_groups(dut)创建覆盖组、dut.fc_cover绑定、StepRis采样和yield后的set_func_coverage上报，不能用自建空对象或删除覆盖率初始化来规避后续mark_function错误。"
      - " 3) 自检：确保 API 的输入/输出/副作用明确，异常场景有可预期行为（至少能被测试断言）。"
      - " 4) 调用工具 `Check` 进行代码/结构校验；若无需更新则调用 `Complete` 结束本阶段。"
    reference_files:
      - "{OUT}/tests/{DUT}_api.py"
      - "{OUT}/{DUT}_functions_and_checks.md"
      - "Guide_Doc/dut_api_instruction.md"
      - "Guide_Doc/dut_mock.md"
    checker:
      - name: dut_fixture_check
        clss: "UnityChipCheckerDutFixture"
        args:
          target_file: "{OUT}/tests/{DUT}_api.py"
      - name: env_fixture_check
        clss: "UnityChipCheckerEnvFixture"
        args:
          target_file: "{OUT}/tests/{DUT}_api.py"
          min_env: 1
          force_bundle: true
      - name: api_check
        clss: "UnityChipCheckerDutApi"
        args:
          api_prefix: "api_{DUT}_"
          target_file: "{OUT}/tests/{DUT}_api.py"


  - name: update_env_and_api_test
    desc: "更新环境与API测试用例"
    task:
      - "输入：更新后的 {OUT}/tests/{DUT}_api.py，通过工具`WorkDiff('{OUT}/tests/{DUT}_api.py')`获取更新差异。"
      - "步骤："
      - " 1) 通过 `WorkDiff` 确认 API/fixture 的变更点。"
      - " 2) 更新/新增测试："
      - "    - 扫描 {OUT}/tests/test_{DUT}_api_*.py：为新增/变化的 API 添加覆盖测试；必要时修正旧测试的断言与期望。"
      - "    - 文件内每个pytest函数必须以test_api_{DUT}_开头；缺少精确DUT命名空间的test_api_basic、test_ref_model等名称必须在本阶段修正，并同步mark_function中的函数对象引用"
      - "    - 若存在 test_{DUT}_env_fixture.py：确保 fixture 构建、清理、资源复用等行为有明确测试。"
      - " 3) 运行验证（按需选择更精准的目标）："
      - "    - `RunTestCases('test_{DUT}_api_*.py::your_test_function')` 用于快速定位 API 单测问题"
      - "    - `RunTestCases('test_{DUT}_env_fixture.py')` 用于验证环境 fixture（若存在）"
      - " 4) 失败处理："
      - "    - API用例失败，先确认是测试问题还是 API/fixture 问题，分别修正后重跑。"
      - "    - 只有WorkDiff或最早traceback明确证明API/fixture实现本身有缺陷时才做最小修改；不得为了让mark_function、fake DUT或覆盖率报告通过而改写API模板、覆盖组定义或fixture生命周期。"
      - "    - env用例测试不能失败，否则说明环境搭建有问题，必须修正环境代码后重跑。"
      - "    - env用例仅仅用来验证环境搭建的正确性，不应当涉及 DUT 行为验证。"
      - " 5) 调用 `Check` 做静态/结构校验；若无需更新则 `Complete`。"
      - "注意：如果原来的bug已经修复，需要更新{OUT}/{DUT}_bug_analysis.md中对应的内容，例如删除已解决的bug记录等"
    checker:
      - name: api_test_check
        clss: "UnityChipCheckerDutApiTest"
        args:
          api_prefix: "api_{DUT}_"
          target_file_api: "{OUT}/tests/{DUT}_api.py"
          target_file_tests: "{OUT}/tests/test_{DUT}_api*.py"
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_func_prefix: "test_api_{DUT}_"
          test_func_rules: standard
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    reference_files:
      - "Guide_Doc/dut_api_instruction.md"
      - "Guide_Doc/dut_bug_analysis.md"
      - "Guide_Doc/dut_test_case.md"
      - "Guide_Doc/dut_fixture.md"


  - name: update_directed_testing_test_cases
    desc: "更新定向用例"
    task:
      - "输入：覆盖点定义 {OUT}/tests/{DUT}_function_coverage_def.py 与文档 {OUT}/{DUT}_functions_and_checks.md。"
      - "步骤："
      - " 1) 通过 `WorkDiff` 确认需求/覆盖点/接口的变化，明确要补齐的 directed 场景列表。"
      - " 2) 扫描 {OUT}/tests/ 下所有与 {DUT} 相关的定向测试文件：定位需要修改/新增的测试。"
      - " 3) 批量实现：按覆盖点/检查点逐条补齐测试，必要时创建新的测试文件；确保测试可读、可复现、断言明确。"
      - " 4) 运行验证：`RunTestCases('tests/test_{DUT}_*.py')`（可先跑更小范围再逐步扩大）。"
      - " 5) 失败处理："
      - "    - 若失败源于测试实现不合理/断言错误：先修正测试逻辑。"
      - "    - 若失败源于 DUT 行为与规格/预期不符：按 Guide_Doc/dut_bug_analysis.md 流程提交/跟踪缺陷，并补齐最小复现。"
      - " 6) 如果没实现完所有新增/修改的测试用例，请回到第3步继续补齐。"
      - " 7) 调用 `Check` 检查所有测试用例；若无需更新则 `Complete`。"
      - "范围说明：本阶段只处理定向（directed）测试用例；随机测试在下一阶段单独处理。"
      - "命名契约：普通定向测试函数使用带有非空场景后缀的test_<scenario>，不得使用保留的test_api_、test_static_或test_random_前缀；专用TC必须留在各自文件并满足Guide_Doc/dut_test_case.md中的完整前缀"
      - "注意：如果原来的bug已经修复，需要更新{OUT}/{DUT}_bug_analysis.md中对应的内容，例如删除已解决的bug记录等"
    checker:
      - name: test_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          test_func_rules: standard
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
        extra_args:
          max_try: -1
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    reference_files:
      - "Guide_Doc/dut_test_case.md"
      - "Guide_Doc/dut_bug_analysis.md"


  - name: update_random_test_cases
    desc: "更新随机用例"
    task:
      - "目标：基于最新验证需求/覆盖策略与设计变更（`WorkDiff`）完善或增加随机测试用例。"
      - "步骤："
      - " 1) 分析已有 {OUT}/tests/test_{DUT}_random_*.py。"
      - " 2) 增量更新随机测试："
      - "    - 随机测试文件必须为{OUT}/tests/test_{DUT}_random_<name>.py，文件内每个pytest函数必须以test_random_开头；不能用普通test_<scenario>或其他阶段前缀代替"
      - "    - 若接口/寄存器/状态空间变化：同步调整随机约束与合法值空间。"
      - "    - 若新增功能：增加能触发该功能的随机生成策略与必要的定向 bias。"
      - "    - 若新增检查点：补齐断言/覆盖收集等，使随机测试能观测并判定结果。"
      - "    - 有需要请增加测试用例文件，命名需要合理。"
      - " 3) 运行验证：`RunTestCases('tests/test_{DUT}_random_*.py')`，必要时控制随机种子以便复现。"
      - " 4) 失败处理同上：先判定是测试问题还是 DUT 问题，再分别修复或走缺陷流程。"
      - " 5) 调用 `Check` 检查所有测试用例；若无需更新则 `Complete`。"
      - "注意：如果原来的bug已经修复，需要更新{OUT}/{DUT}_bug_analysis.md中对应的内容，例如删除已解决的bug记录等"
    checker:
      - name: test_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          test_func_rules: standard
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
        extra_args:
          max_try: -1
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    reference_files:
      - "Guide_Doc/dut_test_case.md"
      - "Guide_Doc/dut_bug_analysis.md"
      - "Guide_Doc/dut_test_case_random.md"


  - name: final_verification_and_report
    desc: "验证审查与总结"
    task:
      - "目标：查漏补缺，对测试过程进行回顾，提炼经验教训"
      - "第1步：整理测试过程中发现的问题，完善{OUT}/{DUT}_bug_analysis.md中对应的描述（必须基于源代码分析bug，用{DOC_GEN_LANG}编写文档）"
      - "第2步：再次阅读{DUT}的所有源代码，确认是否有遗漏的bug，若发现新bug，补充测试用例并进行bug记录"
      - "第3步：对所有测试用例进行回顾，确认测试逻辑合理，确认用例中的所有assert都合理有效"
      - "第4步：总结测试经验，形成文档{OUT}/{DUT}_test_summary.md"
      - "第5步：回顾验证规划{OUT}/{DUT}_verification_needs_and_plan.md，检测是否满足验证需求"
      - "第6步：根据需要判断是否进行验证补充，或者调整验证规划"
      - "第7步：如果有必要可通过 GotoStage工具重新进入某个阶段进行补充验证"
      - "注意：任务中涉及到的文档和注释，主体需要用{DOC_GEN_LANG}编写"
    checker:
      - name: test_check
        clss: "UnityChipCheckerTestCase"
        args:
          doc_func_check: "{OUT}/{DUT}_functions_and_checks.md"
          doc_bug_analysis: "{OUT}/{DUT}_bug_analysis.md"
          test_dir: "{OUT}/tests"
          test_func_rules: standard
          ignore_tc_prefix:
            - "test_api_{DUT}_env_"
            - "test_api_{DUT}_reference_model_"
            - "test_api_{DUT}_mock_"
        extra_args:
          max_try: -1
    need_human_check: false # 验证复杂DUT时建议开启该人工检查
    reference_files:
      - "Guide_Doc/dut_test_summary.md"
    output_files:
      - "{OUT}/{DUT}_test_summary.md"


  - name: commit_changes
    desc: "提交变更"
    task:
      - "目标：将本次增量验证的所有变更提交到 Git 仓库，形成清晰的变更记录。"
      - "步骤："
      - " 1) 使用工具 `WorkDiff` 查看变更"
      - " 2) 确认所有变更均符合预期，且无遗漏，然后调用 `WorkCommit` 提交变更。"
      - "    - 本次增量验证的主要目标与范围（简要描述）。"
      - "    - 关键变更点列表（如新增/修改的 FG/FC/CK，新增的测试用例数量等）。"
      - "    - 任何需要后续跟进的问题或注意事项。"
      - " 2) 确认提交成功，调用Complete完成该阶段，然后调用Exit工具完成所有工作。"
      - "注意："
      - "  - 必须使用工具`WorkCommit`提交变更，不能直接使用git相关的命令。"
      - "  - 提交信息应简洁明了，便于后续审查与追踪。"
      - "  - 提示Workspace is clean或者工具`WorkCommit`提示不可用，则表明已经Commit完成。"
    checker:
      - name: commit_check
        clss: "GitNotDirtyChecker"
