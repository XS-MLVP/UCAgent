# config4.yaml - workflow_builder self-build workflow

ex_tools:
- examples.workflow_builder.workflow_builder.uc_tools.WorkflowBuilder
- examples.workflow_builder.workflow_builder.uc_tools.WorkflowCommandRunner
- examples.workflow_builder.workflow_builder.uc_tools.WorkflowArtifactInspector
- examples.workflow_builder.workflow_builder.uc_tools.WorkflowEnvironmentPreflight
- examples.workflow_builder.workflow_builder.uc_tools.WorkflowPlanAppender
- examples.workflow_builder.workflow_tool_generator.uc_tools.WorkflowToolGenerator
- examples.workflow_builder.workflow_config_generator.uc_tools.WorkflowConfigGenerator
- examples.workflow_builder.workflow_guidedoc_generator.uc_tools.WorkflowGuideDocGenerator
- examples.workflow_builder.workflow_child_supervisor.uc_tools.ChildWorkflowSupervisor
tools:
  RunTestCases:
    test_dir: .workflow/tool_tests/cases
template_overwrite:
  OUT: output
  WFGEN_DIR: wfgen
  TEST_WORKFLOW: workflow
  TEST_WORKFLOW_ROOT: "workflow"
  BUILD_CONFIG: wfgen/workflow_build.yaml
  DESC_FILE: input/guide.md
  TEST_INPUT_DIR: input/test_input
un_write_dirs:
- Guide_Doc/
- config.yaml
- Makefile
write_dirs:
- wfgen
- "{OUT}"
- "{TEST_WORKFLOW}"
mission:
  name: Workflow Builder 完整工作流构建与发布流程
  prompt:
    system: |
      你是一位 UCAgent 工作流工程师。你的任务是根据需求文档交付完整、经过全量确定性测试且可迁移的工作流构建候选；完整运行验收由外层独立 eval_run.yaml 负责。
      所有面向用户或开发者的表述性文字必须使用中文，包括文档标题与正文、阶段说明、分析、结论、影响、建议和证据说明；规则 ID、配置字段、文件路径、命令、类名、函数名、库名以及真实源码保持原文，不得为中文化而改写机器契约。

      主线分为五个里程碑：
        1. 提取完整需求清单并建立初步工程模板。
        2. 初次构建直接生成并验证全部预规划业务 Checker，再用代表性工具完成真实 smoke 测试，冻结可运行基线。
        3. 在 smoke 基线上补齐全部业务阶段、工具、Guide_Doc、模板和配置；Checker、引用文件与输出契约不得二次设计。
        4. 执行全量静态、direct、MCP 和最终需求覆盖测试；完整 default/inc 运行交由外层独立 eval_run.yaml 评估工作流。
        5. 清理运行产物，生成并验证不包含历史、缓存、运行日志和测试输出的迁移包，同时保留必需空目录与测试夹具。

      工作原则：
        0. 当前 Agent 是工作流构建与验证责任主体；不能把工具验证留给未来运行生成工作流的下一层 Agent，也不能只相信 checker 的布尔结果，必须读取测试结果和服务日志。
        1. 所有路径都相对于当前 UCAgent workspace。
        2. 不要修改工作区中不属于本次构建目标的现有文件或目录。
        3. 所有生成产物必须在 {OUT} 或 {WFGEN_DIR} 下面。
        4. 调用 WorkflowBuilder 时必须传 base_dir="{OUT}"。
        5. 如果 {TEST_WORKFLOW_ROOT}/ 已存在且 root.overwrite=false，先报告该问题，不要手动删除。
        6. smoke_ready 只代表基础架构可运行；只有 feature_complete 和 release_ready 均通过需求覆盖检查，才允许迁移。
        7. 每个阶段完成前必须使用 SetCurrentStageJournal 记录阶段结果，再使用 Complete。
        8. 按文件所有权和副作用安排并发：互不依赖的只读操作，以及分别只写入不同工具源码、不同测试夹具、不同文档 spec 或不同 Markdown 的生成操作，允许在同一 assistant 回复中并行调用工具。发起前必须确认每个调用的输入和输出路径互不重叠，并在回复中列出本批次的文件集合。禁止并发修改或同时由多个调用修改 config.yaml、config/inc.yaml、eval.yaml、workflow_spec.yaml、requirements_manifest.yaml、workflow_implementation_plan.md、同一个注册表、同一份 spec、同一测试日志或同一目录的聚合索引。会更新注册表的 WorkflowToolGenerator/WorkflowGuideDocGenerator 必须每个批次只调用一次，并传入该批次全部 spec_paths；全量检查、WorkflowPlanAppender、SetCurrentStageJournal、Check 和 Complete 是必须等待前序并行任务全部结束后的串行收敛点。若后端报告 missing tool responses，立即停止并改为较小批次或单调用恢复，不得重放可能已部分写入的整批操作。
        9. 主工作流不得运行生成工作流的完整 default/inc 子流程；需要运行时评估时使用外层独立 eval_run.yaml，其子流程必须通过 ChildWorkflowSupervisor 启动和观察。
        10. 每个阶段的 reference_files 都是必须读取的输入证据；必须逐项用 ReadTextFile 精确读取配置中声明的路径，不能用搜索、替代路径、复制文件或产物字段代替。
        11. 生成或修改子工作流 config.yaml、config/inc.yaml 或可选 eval.yaml 时，每个阶段 task 至少包含 100 个有效中英文或数字字符；标点、空白、Markdown、YAML 和路径符号不计入。禁止生成重复的 config/default.yaml 或 config/empty.yaml。reference_files、output_files 和 Checker 注册必须来自 workflow_spec，不得在 config spec 中另行设计。
        12. workflow_spec 与运行配置中的 reference_files、output_files 只能声明具体文件，禁止目录和目录形状路径；reference_files 还必须能够证明是固定交付文件、用户明确必需的输入文件或前序阶段已经生成的文件，不确定是否存在的路径不得填写。
        13. 需要运行子工作流内的 make、pytest 或批处理验证时，必须调用 WorkflowCommandRunner。只允许执行其白名单目标；Python/Shell 临时脚本必须创建在 {TEST_WORKFLOW_ROOT}/tmp/ 下，验证后删除。禁止在 wfgen、子工作流根目录、.workflow 或迁移包中创建临时脚本，也禁止用 RunTestCases 冒充子工作流 Make 验证。
        14. `.ucagent/` 是外层运行时私有状态，运行 Agent 禁止使用 PathList、ReadTextFile、EditTextFile、DeleteFile 或其他工具读取、修改、删除其中任何内容。历史权限、恢复和清理由父 Makefile 管理；`Complete` 报历史权限错误时不得自行修理 `.ucagent/history`，应保留业务产物并等待外层监督者重启。
        15. 需要判断 YAML 根类型、阶段容器、发布树洁净度或迁移 manifest 与真实包目录是否一致时，优先调用只读 WorkflowArtifactInspector；已有 inspector 或 WorkflowCommandRunner 白名单目标能够取证时，禁止另写一次性 Python/Shell 审查脚本。
        16. `.workflow/acceptance_rules.yaml` 是公开交付文件和目录的唯一权威清单。迁移、洁净度和临时部署审查必须读取该文件，不得在临时脚本、install.py 或阶段记录中另写一套必需文件清单；full/partial 的工具与 Checker 排除边界属于迁移模式安全策略，不得用 acceptance 放宽。
template: ''
stage:
- name: extract_requirements_and_plan
  desc: 提取完整需求清单、输入示例契约和工作流实现计划
  task:
  - 第1步（必须首先执行）：只调用 ReadTextFile 读取 {DESC_FILE}；它是唯一需求入口。在成功读取前禁止读取其他参考文档、搜索、测试或 Check。
  - 第2步：读取 Guide_Doc/stages/00_extract_requirements_and_plan.md，严格按其中的最小通过版本、完整示例、输入路径规则和常见问题处理流程执行；随后用 PathList(path='{TEST_INPUT_DIR}', depth=-1) 枚举示例输入并用 GetFileInfo 建立完整路径、类型和大小清单。只全文读取运行契约要求的文本文件、示例入口和直接引用文件；知识库、大型文本、素材说明和代码按相关性每批最多 2 个文件读取并立即记录摘要，禁止为建立清单而全文读取全部输入。
  - 第3步：创建 {WFGEN_DIR}/requirements_manifest.yaml、{WFGEN_DIR}/input_example_manifest.yaml 和 {WFGEN_DIR}/workflow_implementation_plan.md。requirements_manifest 的每个 required_stages 条目必须同时写精确 name、非空 label 和具体 config；标准、评估、增量阶段分别绑定 config.yaml、config/eval.yaml、config/inc.yaml，config 必须逐字匹配 required_configs 中已声明的具体文件，禁止省略后依赖 config.yaml 默认值。计划必须把用户需求扩展成可实施的工程设计而不是复述原文：每个 required_stage 使用精确英文名三级标题并至少写 200 个有效字符；每个 required_tool、固定基础设施 run_command_tool 与 required_checker 使用精确名称三级标题并至少 300 个有效正文字符。组件正文内部禁止再使用二级至六级标题，解析器从当前组件标题读取到下一个二级至六级标题为止，否则会在子标题处截断；内部结构统一使用加粗行内标记。Checker 正文必须逐字出现“使用阶段、检查对象、检查内容或验证内容、通过条件、失败条件、实现文件或入口类或 do_check、关键分支或判定流程或检查流程、异常或错误处理或失败传播、测试或 fixture 或回归、扩展点或调整方式或可配置”。“关键判定分支”不等于连续的“关键分支”，不得用它替代必需标记。Python 标准库不得列入 required_python_dependencies；禁止生成 quickstart.md、config/default.yaml 或 config/empty.yaml。
  - 第4步：严格仿照阶段指导中的 workflow_implementation_plan.md 最小可通过示例，对每个 manifest 阶段、工具和 Checker 逐项完成标题边界、有效字符数和精确标记自审；全部架构正文最终定稿后，才调用 WorkflowPlanAppender 为 extract_requirements_and_plan 追加包含五个必需三级标题的 Stage 00 记录。Appender 生成的 SHA256 覆盖此前全部字节，追加后禁止修改记录之前的任何正文，也禁止手填或替换摘要。在三份产物齐全且追加成功前禁止 Check，也不得创建 workflow_build.yaml 或 Checker 源码。
  - 第5步：运行本阶段 Check，读取并处理全部结构化结果；通过后用 SetCurrentStageJournal 记录需求数量、输入语义、示例来源、规划路径和 Checker 证据，再 Complete。
  reference_files:
  - Guide_Doc/stages/00_extract_requirements_and_plan.md
  - '{DESC_FILE}'
  output_files:
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{WFGEN_DIR}/input_example_manifest.yaml'
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: extract_requirements_and_plan
  - name: requirements_manifest_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowRequirementCoverageChecker
    args:
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      mode: manifest
  - name: workflow_implementation_plan_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowImplementationPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
  - name: input_example_manifest_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowInputExampleManifestChecker
    args:
      manifest_path: '{WFGEN_DIR}/input_example_manifest.yaml'
- name: design_workflow_build_config
  desc: 根据已冻结的需求计划生成并交叉验证 WorkflowBuilder 配置
  task:
  - 第1步：依次读取 Guide_Doc/stages/01_design_workflow_build_config.md 和全部 reference_files；前三份规划产物是冻结基线，schema 与模板指南定义构建格式，禁止静默扩充、重命名或删除 manifest 组件。
  - 第2步：严格按阶段指导中的最小通过版本和完整示例创建 {BUILD_CONFIG}。root.path 必须精确写成 {TEST_WORKFLOW_ROOT}，禁止添加 ./，禁止使用 workflow.name 作为目录名。必须一次性规划全部业务阶段、中心 Checker、reference/output 契约、Checker 源码、方法 docstring、正反 fixture、测试、交付文件、runtime_contract 和 acceptance；禁止使用未知模板或空文件占位。
  - 第3步：用 YAML parser 和 schema 预检 {BUILD_CONFIG}，核对 required_stages、required_checkers、GuideDoc、用户文档、主配置与增量配置、环境配置、迁移设施及示例输入全部覆盖；eval.yaml 仅在工作流确有独立评估需求时加入，发现需求遗漏时不得单方面修改冻结规划。
  - 第4步：预检成功后调用 WorkflowPlanAppender 为 design_workflow_build_config 追加包含五个必需三级标题的 Stage 01 记录，再运行本阶段 Check 并读取完整返回信息。
  - 第5步：Checker 全部通过后，用 SetCurrentStageJournal 记录阶段数、Checker 数、文件数、schema 与覆盖结果、规划追加结果，再 Complete。
  reference_files:
  - Guide_Doc/stages/01_design_workflow_build_config.md
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{WFGEN_DIR}/input_example_manifest.yaml'
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/workflow_build_schema.yaml'
  - Guide_Doc/workflow_build_yaml_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{BUILD_CONFIG}'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: design_workflow_build_config
  - name: workflow_build_config_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowBuildConfigChecker
    args:
      build_config_path: '{BUILD_CONFIG}'
      expected_root: '{TEST_WORKFLOW_ROOT}'
      run_planned_checker_tests: true
  - name: initial_build_requirement_coverage
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowRequirementCoverageChecker
    args:
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      build_config_path: '{BUILD_CONFIG}'
      mode: build
- name: build_initial_template
  desc: 调用 WorkflowBuilder 建立工程骨架，然后从 test_input 复制真实示例覆盖占位文件
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 第1步：使用 ReadTextFile 读取 {BUILD_CONFIG} 和 {WFGEN_DIR}/input_example_manifest.yaml，再用 PathList 与 GetFileInfo 建立 {TEST_INPUT_DIR} 的完整清单。只读取 runtime_contract.required_input 中的文本文件和直接引用；二进制、大型文件及无关知识材料只核验路径、类型、大小和复制摘要，禁止为复制验证而全文读取全部输入。
  - 第2步：调用 WorkflowBuilder(build_config_path='{BUILD_CONFIG}', base_dir='{OUT}',
    input_example_manifest_path='{WFGEN_DIR}/input_example_manifest.yaml')。Builder 先创建结构骨架，
    再根据 copy_tree 规则执行二进制原样复制；禁止用 ReadTextFile 加 EditTextFile 重建源文件，
    否则会改变末尾换行或其他字节。
  - 第2.1步（关键）：检查 WorkflowBuilder 返回的 copied_example_files 数量，并逐项核对
    {TEST_INPUT_DIR}/ 中全部源文件在 {TEST_WORKFLOW_ROOT}/input/example/ 保持相对路径和字节内容完全一致。
    resource_paths 只决定文件落点，不允许改写正文。源目录对应位置不得残留空 JSON、占位文字、
    示例提示或 rtl/README.md。
  - 第2.2步（关键）：覆盖完成后，读取 {TEST_WORKFLOW_ROOT}/input/example/ 下的每个
    runtime_contract.required_input 文件。如果其中任何文件内部引用了其他文件路径（例如 JSON 中的
    path/image 字段、Markdown 中的相对链接），必须逐一核对被引用的路径在 input/example/ 下
    真实存在且不逃逸目录。如果不对应，回到 input_example_manifest 的 resource_paths 修正复制落点并
    重新调用 Builder，禁止修改复制后的用户源文件。
  - 第3步：检查 WorkflowBuilder 工具返回信息，确认 root 为 {TEST_WORKFLOW_ROOT}。
  - 第4步：确认 {TEST_WORKFLOW_ROOT}/Makefile、docs/01快速启动.md、requirements.txt、config.yaml、Guide_Doc/overview.md、
    Guide_Doc/operation.md、input/example/README.md 和 .workflow/build_report.md 已生成；
    逐项确认 runtime_contract.required_input 中声明的每个文件和目录在 input/example/ 下
    真实存在；逐项确认 workflow_spec.checkers 已生成对应 `.workflow/checker_specs/*.yaml`、
    `checkers/*.py` 和显式正反 fixture；然后运行 make check_example、make check_checker_specs、
    make check_checkers 和 make test_checkers 验证。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='build_initial_template', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 第5步：使用 SetCurrentStageJournal 记录 WorkflowBuilder 返回信息、test_input 复制结果、
    required_input 文件路径核对结果和 make check_example 的输出。
  - 第6步：使用 Complete 工具完成阶段。
  reference_files:
  - Guide_Doc/stages/02_build_initial_template.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{BUILD_CONFIG}'
  - '{WFGEN_DIR}/input_example_manifest.yaml'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/Makefile'
  - '{TEST_WORKFLOW_ROOT}/docs/01快速启动.md'
  - '{TEST_WORKFLOW_ROOT}/requirements.txt'
  - '{TEST_WORKFLOW_ROOT}/input/example/README.md'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - '{TEST_WORKFLOW_ROOT}/Guide_Doc/overview.md'
  - '{TEST_WORKFLOW_ROOT}/README.md'
  - '{TEST_WORKFLOW_ROOT}/.workflow/workflow_spec.yaml'
  - '{TEST_WORKFLOW_ROOT}/.workflow/build_report.md'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/tool_spec_checker.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/tool_static_checker.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/tool_direct_runner.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/checker_spec_checker.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/checker_static_checker.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/checker_direct_runner.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/tool_tests/run_mcp_tests.py'
  - '{TEST_WORKFLOW_ROOT}/tools/mcp_adapters.py'
  - '{TEST_WORKFLOW_ROOT}/install.py'
  - '{TEST_WORKFLOW_ROOT}/.install/README.md'
  - '{TEST_WORKFLOW_ROOT}/.install/manifest.json'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: build_initial_template
  - name: workflow_builder_output_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowBuildOutputChecker
    args:
      build_config_path: '{BUILD_CONFIG}'
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      input_example_manifest_path: '{WFGEN_DIR}/input_example_manifest.yaml'
      run_make_check: false
  - name: initial_template_requirement_coverage
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowRequirementCoverageChecker
    args:
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      build_config_path: '{BUILD_CONFIG}'
      mode: build
- name: verify_tool_generation_loop
  desc: 验证工具生成基础设施，不默认生成无关通用工具
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 第1步：调用 WorkflowToolGenerator(mode='base', tools=['run_command_tool'], existing_policy='create_only') 固定生成受限批处理工具并注册。它属于工作流基础设施，不计入 requirements_manifest.required_tools：只能在工作流根目录或其子目录作为 cwd，以 shell=False 执行命令白名单；Python/Shell batch 必须引用工作流根级 tmp/ 内的单个 .py/.sh 文件，禁止 python -c、shell 拼接、绝对路径、..、额外解释器参数、任意 make 目标和危险参数。read_text_file_tool、write_text_file_tool 仍只在业务需求明确声明时生成。
  - 第2步：使用 ReadTextFile 读取 {TEST_WORKFLOW_ROOT}/.workflow/checkers/tool_spec_checker.py、tool_static_checker.py、tool_direct_runner.py、.workflow/tool_tests/run_mcp_tests.py
    和 tools/mcp_adapters.py。
  - 第2.1步：确认 tools/mcp_adapters.py 的动态 adapter 只实现 _run，不得定义 def run(self,
    tool_input...)，也不得在动态类字典中注册 run 函数覆盖项；必须让 BaseTool.run 负责把 _run 返回内容包装成
    ToolMessage。否则生成工作流直接 make run 时会报工具返回裸字符串类型错误。
    adapter 的 args_schema 字段类型必须使用 Any，避免 MCP/FastMCP 将 JSON 字符串预解析成 list/dict 后被
    Pydantic 提前拒绝。
  - 第3步：确认 Makefile 包含 check_tool_specs、check_tools、test_tools、test_mcp，且 make check
    会包含这些目标。
  - 第4步：确认 config.yaml 中 tools 是 mapping，包含 tools.RunTestCases.test_dir；GeneratedTools
    可以为空，后续 smoke 和全量业务工具阶段会按 requirements_manifest.required_tools 注册真实工具。
  - 第5步：使用 Check 验证 run_command_tool 的 spec、实现、注册、正常 pwd 用例和拒绝 inline Python 的失败用例；缺少该基础设施工具必须失败，但不得因为缺少 read_text_file_tool/write_text_file_tool 失败。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='verify_tool_generation_loop', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 第6步：使用 SetCurrentStageJournal 记录工具基础设施检查结果。
  - 第7步：使用 Complete 工具完成阶段。
  reference_files:
  - Guide_Doc/stages/03_verify_tool_generation_loop.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/tool_spec_checker.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/tool_static_checker.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/checkers/tool_direct_runner.py'
  - '{TEST_WORKFLOW_ROOT}/.workflow/tool_tests/run_mcp_tests.py'
  - '{TEST_WORKFLOW_ROOT}/tools/mcp_adapters.py'
  - '{TEST_WORKFLOW_ROOT}/Makefile'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - Guide_Doc/tool_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/.workflow/tool_generation_state.yaml'
  - '{TEST_WORKFLOW_ROOT}/.workflow/tool_specs/run_command_tool.yaml'
  - '{TEST_WORKFLOW_ROOT}/tools/run_command_tool.py'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: verify_tool_generation_loop
  - name: workflow_tool_generation_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowToolGenerationChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      run_make_targets: true
- name: design_smoke_business_tool_spec
  desc: 为 smoke 基线设计代表性业务工具规格
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 第1步：读取 {WFGEN_DIR}/requirements_manifest.yaml、Guide_Doc/tool_generation_guide.md、{TEST_WORKFLOW_ROOT}/.workflow/workflow_spec.yaml
    和 {TEST_WORKFLOW_ROOT}/config.yaml。
  - 第2步：从 requirements_manifest.required_tools 中选择一个非基础业务工具作为 smoke 工具；不得假定工具名称、输入类型或输出字段。
  - 第3步：创建 {WFGEN_DIR}/smoke_tool_selection.yaml，根级字段必须为 name、spec_path、fixture_paths。name
    是所选工具名；spec_path 必须是 .workflow/tool_specs/<name>.yaml；fixture_paths 是当前已创建测试夹具的相对路径列表。
    每个路径可以是普通文件，也可以是包含至少一个实际文件的非空目录；目录型输入（例如 RTL 源码树）应直接声明目录，
    Checker 会递归确认其中存在文件，不要为了通过检查而把目录替换成任意单个文件。
  - 第4步：按选择文件中的实际路径创建至少一个稳定测试夹具和 tool_spec，不要先写工具代码。夹具必须位于 .workflow/tool_tests/cases/
    下；禁止创建根目录 examples/。
  - 第5步：tool_spec 的 entry.file 必须是 tools/<name>.py，class_name 根据工具名生成合法 Python 类名，method
    必须是 run；inputs、outputs 和 data_required_keys 必须来自该工具的真实职责。
  - 第6步：tool_spec 必须包含 basic_test，expected.ok=true，并引用 fixture_paths 中的夹具；不得硬编码 PPT、RTL
    或其他特定领域字段。
  - 第7步：使用 Check 运行动态 spec checker，确认所选工具属于 manifest、选择文件路径安全、夹具存在且 make
    check_tool_specs 通过。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='design_smoke_business_tool_spec', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 第8步：记录选择文件、实际工具名、spec 和夹具路径，然后 Complete。
  reference_files:
  - Guide_Doc/stages/04_design_smoke_business_tool_spec.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/.workflow/workflow_spec.yaml'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - Guide_Doc/tool_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/smoke_tool_selection.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: design_smoke_business_tool_spec
  - name: workflow_business_tool_spec_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowGeneratedToolChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      tool_selection_file: '{WFGEN_DIR}/smoke_tool_selection.yaml'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      required_fixture_count: 1
      spec_only: true
      required_test_names:
      - basic_test
      run_make_targets: true
- name: implement_smoke_business_tool
  desc: 调用工具生成器实现、注册并验证代表性 smoke 工具
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 第1步：读取 {WFGEN_DIR}/smoke_tool_selection.yaml，再按其中 spec_path 和 fixture_paths 读取实际 spec 与测试夹具。
  - 第2步：调用 WorkflowToolGenerator(workflow_root='{TEST_WORKFLOW_ROOT}', mode='from_spec',
    spec_paths=[选择文件中的 spec_path], existing_policy='create_only', update_config=true)。必须先由生成器创建并注册工具，禁止绕过生成器从零创建源码；若工具文件已经存在，生成器必须保留源码并报告 skipped，禁止改用 force_replace 规避冲突。
  - 第2.1步：from_spec 只负责生成符合 spec 的安全框架。读取生成源码后，如果 data_required_keys 仍由
    _default_value 或其他空默认值填充，必须在当前阶段使用 EditTextFile/ReplaceStringInFile 完善该已生成文件的真实业务逻辑；
    补全不得修改 spec 的 expected.ok、删除失败用例或降低输出契约来迁就空壳。
  - 第3步：从 spec.entry.file 读取生成的工具，确认它是普通 Python 类，不绑定 MCP、LangChain 或 UCAgent。
  - 第4步：确认 run(path) 安全解析相对路径，禁止绝对路径和 ..，并返回统一结构 ok/data/errors/warnings/meta。
  - 第5步：确认工具正确实现了 spec 中声明的业务逻辑。
  - 第6步：确认 {TEST_WORKFLOW_ROOT}/config.yaml 已把选择文件中的工具注册到 tools.GeneratedTools，且保留
    tools.RunTestCases.test_dir。
  - 第7步：使用 Check 验证业务工具完整生成，确认 make check_tool_specs、make check_tools、make test_tools、make
    check 全部通过。
  - 第8步：使用 ReadTextFile 查看 .workflow/logs/tool_direct_run.log，确认 basic_test 为 PASS。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='implement_smoke_business_tool', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 第9步：使用 SetCurrentStageJournal 记录工具生成器返回信息、业务工具实现、注册和测试结果。
  - 第10步：使用 Complete 工具完成阶段。
  reference_files:
  - Guide_Doc/stages/05_implement_smoke_business_tool.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/smoke_tool_selection.yaml'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - Guide_Doc/tool_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: implement_smoke_business_tool
  - name: workflow_generated_tool_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowGeneratedToolChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      tool_selection_file: '{WFGEN_DIR}/smoke_tool_selection.yaml'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      required_fixture_count: 1
      spec_only: false
      required_test_names:
      - basic_test
      run_make_targets: true
- name: strengthen_smoke_business_tool_tests
  desc: 增强代表性 smoke 工具测试并重新验证
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 第1步：读取 {WFGEN_DIR}/smoke_tool_selection.yaml，并按其中路径读取实际 spec、工具和 direct runner 日志。
  - 第2步：根据所选工具的真实职责创建第二个边界测试夹具，不得假定输入是 Verilog、图片或文本。
  - 第3步：把第二个夹具路径追加到选择文件的 fixture_paths，并更新实际 tool_spec，新增 edge_case_test，expected.ok=true。
  - 第4步：更新 spec 后必须再次调用 WorkflowToolGenerator(existing_policy='create_only')，确认源码返回
    skipped，并让生成状态只追加冻结 edge_case_test；生成器若报告既有测试 missing/changed，必须恢复原测试。
    随后重新读取原工具，根据新增 edge_case_test
    直接增强真实业务逻辑。
    只有生成状态证明源码仍是未修改骨架时，才允许显式使用 refresh_scaffold；业务源码一旦人工实现，禁止
    force_replace。basic_test 与 edge_case_test 的成功结果都必须包含符合 spec 的有意义业务数据，禁止降低
    expected.ok、删除既有失败用例、放宽断言或用默认空值冒充增强完成。
  - 第5步：使用 Check 运行通用 generated tool checker，确认 basic_test 和 edge_case_test 两个测试都存在，并确认
    make check_tool_specs、make check_tools、make test_tools、make check 全部通过。
  - 第6步：读取 .workflow/logs/tool_direct_run.log，确认 basic_test 和 edge_case_test 均为 PASS。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='strengthen_smoke_business_tool_tests', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 第7步：使用 SetCurrentStageJournal 记录增强测试、源码保护策略和验证结果。
  - 第8步：使用 Complete 工具完成阶段。
  reference_files:
  - Guide_Doc/stages/06_strengthen_smoke_business_tool_tests.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/smoke_tool_selection.yaml'
  - Guide_Doc/tool_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/smoke_tool_selection.yaml'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: strengthen_smoke_business_tool_tests
  - name: workflow_generated_tool_strengthened_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowGeneratedToolChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      tool_selection_file: '{WFGEN_DIR}/smoke_tool_selection.yaml'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      required_fixture_count: 2
      spec_only: false
      required_test_names:
      - basic_test
      - edge_case_test
      run_make_targets: true
- name: initialize_smoke_workflow
  desc: 初始化 smoke workflow 并尝试启动 UCAgent
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 第1步：使用 ReadTextFile 读取 {TEST_WORKFLOW_ROOT}/Makefile、{TEST_WORKFLOW_ROOT}/config.yaml、{TEST_WORKFLOW_ROOT}/README.md、{TEST_WORKFLOW_ROOT}/docs/01快速启动.md、{TEST_WORKFLOW_ROOT}/Guide_Doc/overview.md。
  - 第2步：确认 {TEST_WORKFLOW_ROOT}/setup.py、config/environment.schema.yaml 和 ucagent_setup.sh 已由 Builder 创建。setup.py
    必须支持交互配置以及 --set、--config、--check、--dry-run、--non-interactive，并把非敏感本机值保存到
    .workflow/local/environment.yaml；Makefile 与 ucagent_setup.sh 必须各包含唯一的 setup.py 受控环境区块。
    schema 内置 UCAgent、Python、代理、tmux 基础项，并允许按目标工作流增加 Verilator、Yosys 等业务系统工具。
  - 第2.1步：调用 WorkflowEnvironmentPreflight(workflow_root='{TEST_WORKFLOW_ROOT}', include_tmux=true)，核对当前 Python、UCAGENT_HOME、UCAGENT_VENV、进程代理和 tmux 全局代理。发现 socks:// ALL_PROXY、缺失环境文件或解释器路径失效时，先修正 setup.py/ucagent_setup.sh 的通用配置逻辑并重新预检；禁止只在当前 shell 临时 unset 后宣称环境可迁移。
  - 第3步：修改 {TEST_WORKFLOW_ROOT}/Makefile，保留 configure/configure-check/check/check_config/check_inc_config/check_layout/check_docs/clean，
    并新增真正可用的 run、session、tmux 目标；禁止删除或手工改写 setup.py 管理的受控区块。
  - 第3.1步：Makefile 必须提供 check_target、prepare_input 和 prepare_runtime。prepare_input 只校验
    runtime_contract.required_input；prepare_runtime 在 output/.runtime_targets/<TARGET>/ 创建 UCAgent 所需的隐藏
    __init__.py；该隐藏路径只能供运行时包初始化使用，禁止作为 UCAgent 的 workspace 或 DUT 参数。Makefile 必须定义
    WORKFLOW_WORKSPACE ?= $(CURDIR)，并让 run/run_inc/run_tui/smoke 使用 $(UCAGENT) $(WORKFLOW_WORKSPACE) $(TARGET)
    启动 UCAgent。不得写成 $(UCAGENT) ./ $(TARGET)，不得建立根目录 TARGET 软链接，不得要求用户输入包含
    data/__init__.py 或 Python/DUT 包。run、run_inc 和 run_tui 必须依赖 prepare_runtime。
  - 第4步：修改 {TEST_WORKFLOW_ROOT}/config.yaml，保留 workflow/paths/model/loop_settings/checkers/guide_docs
    等骨架元数据，并补充 UCAgent 可运行的 mission、template、stage、write_dirs、un_write_dirs、tools.RunTestCases。
    tools 顶层必须是 mapping，但 tools.GeneratedTools 必须是由 name/spec/file/enabled 记录组成的 list，禁止改成以工具名为键的
    mapping；该列表由 WorkflowToolGenerator(update_config=true) 维护。
    un_write_dirs 必须设为空列表 []。生成的工作流不得设置任何写保护目录（子工作流被强制停止时权限无法恢复，
    会导致后续 make check/smoke/package 全部失败）；写保护由最终用户自行配置。注意 tools 必须是
    mapping，不能是 list；工具注册放在 tools.GeneratedTools。
  - 第5步：确认 Makefile 的 run 目标会先 source ./ucagent_setup.sh，再执行 ucagent_env 和 proxy_on，然后通过
    $(UCAGENT) $(WORKFLOW_WORKSPACE) $(TARGET) 启动 UCAgent，且 --output 指向 output。run/run_inc/run_tui/smoke
    必须从 tools.mcp_adapters.ADAPTER_CLASS_NAMES
    动态生成 --ex-tools 参数，确保 config.tools.GeneratedTools 在真实运行 Agent 中可见；不得只在 make test_mcp 中注册工具。
  - 第6步：仅在 {TEST_WORKFLOW_ROOT} 目录内运行 make check 和 make check_example，确认 bundled example
    输入与基础检查通过。禁止在当前外层 workspace 根目录直接执行 make run TARGET=example，以免递归启动 workflow_build
    自身。阻塞式运行验证统一放到后续 ChildWorkflowSupervisor 步骤。该阶段只验证基础架构，不能标记 feature_complete。
  - 第7步：调用 ChildWorkflowSupervisor(action='start', workflow_root='{TEST_WORKFLOW_ROOT}',
    target='example', make_target='run_tui', auto_loop=true) 启动生成工作流，记录 run_id、observe_command
    和 terminal_log。注意 target 是运行时输入目录名，必须是 example；禁止把 make 目标 check_example 当作 target。
  - 第8步：启动后使用 ChildWorkflowSupervisor(action='status' 或 'capture') 进行简要观察；总观察时间控制在
    60 秒左右，只验证工作流能启动、进入阶段并持续运行，不要求完整跑完。
  - 第9步：约 60 秒后调用 ChildWorkflowSupervisor(action='stop', workflow_root='{TEST_WORKFLOW_ROOT}',
    run_id='<前一步返回的 run_id>') 主动停止子工作流，确认权限恢复。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='initialize_smoke_workflow', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 第10步：如果 UCAgent 已启动，手动读取 README.md 和 Guide_Doc/overview.md，设置阶段日志并 Complete；退出时先
    Ctrl+C 再 q。
  - 第11步：使用 SetCurrentStageJournal 记录初始化结果、运行命令、ChildWorkflowSupervisor 观察结果和是否成功启动。
  - 第12步：使用 Complete 工具完成阶段。
  reference_files:
  - Guide_Doc/stages/07_initialize_smoke_workflow.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/Makefile'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - '{TEST_WORKFLOW_ROOT}/README.md'
  - '{TEST_WORKFLOW_ROOT}/docs/01快速启动.md'
  - '{TEST_WORKFLOW_ROOT}/Guide_Doc/overview.md'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/setup.py'
  - '{TEST_WORKFLOW_ROOT}/config/environment.schema.yaml'
  - '{TEST_WORKFLOW_ROOT}/ucagent_setup.sh'
  - '{TEST_WORKFLOW_ROOT}/Makefile'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: initialize_smoke_workflow
  - name: workflow_minimal_init_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowMinimalInitChecker
