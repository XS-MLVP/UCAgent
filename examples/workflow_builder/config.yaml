- name: verify_generated_tools_through_mcp
  desc: 由当前构建 Agent 启动子 UCAgent，并通过真实 MCP 调用验证基础生成工具
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 第1步：使用 ReadTextFile 读取 Guide_Doc/tool_generation_guide.md 中的 MCP
    集成测试操作协议，以及 {TEST_WORKFLOW_ROOT}/.workflow/tool_tests/run_mcp_tests.py 和 {TEST_WORKFLOW_ROOT}/tools/mcp_adapters.py。
  - 第1.1步：复查 tools/mcp_adapters.py 的返回协议。只允许 _run 返回 JSON 字符串，禁止覆盖 BaseTool.run；
    直接 UCAgent 运行依赖 BaseTool.run 自动生成 ToolMessage，MCP 测试依赖该 ToolMessage 的 text 内容解析 JSON。
  - 第2步：确认测试职责属于当前构建 Agent：必须验证工具后再交付给未来运行生成工作流的 Agent，不能把验证责任留给下一层。
  - 第2.1步【硬性约束】：本阶段严禁在 {TEST_WORKFLOW_ROOT} 下启动任何 TUI 会话（禁止 make run_tui、make run、make tmux
    或任何 --tui 参数）。子 UCAgent 必须由 Check 工具或 make test_mcp 以 headless 模式启动。在子工作流中开
    TUI 会导致 Ctrl+C 冲突和文件权限残留，直接造成 checker 失败。
  - 第3步：使用 Check 工具触发本阶段的 checker（checker 内部会自动执行 make test_mcp，启动子 UCAgent MCP Server
    并完成 list_tools 和 call_tool 验证）。如果 Check 不可用，才允许手动运行 make test_mcp，但仍禁止 TUI。
  - 第4步：使用 ReadTextFile 读取 {TEST_WORKFLOW_ROOT}/output/mcp_test_result.log，确认 list_tools 以及 config.yaml 中当前所有启用的
    GeneratedTools 均有对应的 MCP call PASS；不得写死工具数量或适配器类名。
  - 第3.1步：读取 checker 返回的 direct/MCP 结果和真实日志后，创建 {WFGEN_DIR}/mcp_baseline_evidence.yaml，记录已测工具名、direct 结果、MCP 结果、日志路径、失败摘要和生成时间；该文件是后续 smoke 基线阶段的确定引用，不能只写 passed 布尔值。
  - 第5步：使用 ReadTextFile 读取 {TEST_WORKFLOW_ROOT}/.workflow/logs/tool_mcp_run.log，确认请求确实进入子
    UCAgent，并确认子 UCAgent 通过 q 正常退出且恢复文件权限。
  - 第6步：MCP 测试完成后再次运行 make check，确认没有残留只读权限、端口占用或运行中子 UCAgent。
  - 第7步：如果测试失败，必须根据两个日志修复 adapter、注册、启动参数或工具实现，然后重新运行 Check（或 make test_mcp）和 make check，直到通过。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='verify_generated_tools_through_mcp', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 第8步：使用 SetCurrentStageJournal 记录 MCP 工具发现、全部当前启用工具调用、退出清理和测试后 make check 的结果。
  - 第9步：使用 Complete 工具完成阶段。
  reference_files:
  - Guide_Doc/stages/08_verify_generated_tools_through_mcp.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - Guide_Doc/tool_generation_guide.md
  - '{TEST_WORKFLOW_ROOT}/.workflow/tool_tests/run_mcp_tests.py'
  - '{TEST_WORKFLOW_ROOT}/tools/mcp_adapters.py'
  - '{TEST_WORKFLOW_ROOT}/Makefile'
  # The checker creates and then validates the MCP logs. Declaring either log as
  # a stage output would block the checker before it can run make test_mcp.
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/mcp_baseline_evidence.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: verify_generated_tools_through_mcp
  - name: workflow_mcp_tool_integration_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowMCPToolIntegrationChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      run_test: true
