- name: design_complete_runtime_configs
  desc: 根据需求清单设计主流程、增量流程和可选评估配置
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 读取 requirements_manifest、原始需求和 .workflow/workflow_spec.yaml。
  - 对每个业务输入区分“用户提供的原始输入”和“工作流生成的派生信息”。阶段 task 必须明确如何从原始输入提取、归纳、规划或设计派生结果；禁止假设用户已经提供最终结构、逐项方案、分析结果或设计配置。
  - 生成 config.yaml、config/inc.yaml 以及按需生成的 eval.yaml 时，每个阶段的 task 合计至少包含 100 个有效正文字符，并具体说明输入、操作顺序、调用工具、生成产物、Checker 检查内容和失败处理。禁止为了兼容旧结构再生成 config/default.yaml 或 config/empty.yaml。
  - 如果输入包含可用资源清单，配置必须把它描述为候选资源而非强制使用清单；资源选择、处理方式和新增图形需求由业务阶段决定，除非原始需求明确规定。
  - '创建 .workflow/config_specs/main.yaml 和 inc.yaml；main 声明 mode: default 并直接生成根级 config.yaml，inc 声明 mode: inc 并生成 config/inc.yaml。只有需求确实需要独立评估流程时才增加 .workflow/config_specs/eval.yaml 和根级 eval.yaml，并在 manifest、Makefile 与文档中同步登记。最终配置的阶段必须位于 YAML 根级 stage，禁止写成 workflow.stages。'
  - 配置中的 UCAgent 变量必须使用单层花括号语法；目标名只能使用 {DUT}，输出根目录只能使用 {OUT}，禁止使用未定义的
    {TARGET} 或双层花括号。阶段 task、reference_files、output_files 和 checker 参数中的路径必须统一写成
    input/{DUT}/... 与 {OUT}/{DUT}/...；需要的附加路径变量通过 template_overwrite 声明。
  - 子工作流配置中的所有路径都以生成后的 {TEST_WORKFLOW_ROOT} 自身为根。内部静态文件必须写成
    .workflow/workflow_spec.yaml、Guide_Doc/... 或 config/...，严禁把 Builder 访问候选目录时使用的
    {TEST_WORKFLOW_ROOT}/ 前缀复制进 config spec；尤其禁止 .//workflow/、./workflow/ 和 workflow/。
    例如外层读取 {TEST_WORKFLOW_ROOT}/.workflow/workflow_spec.yaml，写入子工作流 reference_files 时必须转换为
    .workflow/workflow_spec.yaml。
  - 禁止把当前 WFB/MWF 的运行时值写入 CWF 配置 spec；不得出现 output/workflow_build、input/workflow_build
    或 output/workflow_build。write_dirs 必须且只能是 ['{OUT}/{DUT}']，不得写成 [output]。
  - main/inc 以及可选 eval spec 必须包含明确且足够详细的 task，但不得重新发明 Checker、reference_files 或 output_files。
    这些字段由 `.workflow/workflow_spec.yaml` 的同名阶段权威注入；若 spec 显式提供，内容必须完全一致，否则生成器拒绝。
    inc 覆盖增量验证流程，eval 仅用于需求明确的独立评估。
  - reference_files 和 output_files 都只能列出具体文件，禁止目录或没有文件名后缀的目录形状路径。reference_files 还必须来自固定交付文件、runtime_contract 明确要求的用户输入文件或前序阶段的具体 output_files；无法确认必然存在的文件不要写入。目录在 task 中使用 PathList，目录型成果用 manifest、summary 或 report 文件作为输出证据，二进制产物由业务工具或 checker 验证。
  - 在写入 config spec 前，必须为 main、inc 和可选 eval 的每个 reference_files 建立逐项来源记录：标明它属于固定交付文件、runtime_contract 中 type=file 的用户输入，还是权威 workflow_spec 中严格前序阶段的 output_files，并记录具体声明位置和生产阶段。按 main、inc、eval 顺序单独处理；每批只读取当前 spec 与 workflow_spec 中相关阶段，完成后立即记录来源摘要，后续批次不得重新全文读取已完成 spec。不能写出来源、只有目录输入声明、由当前或后续阶段生成、或仅“预计会存在”的引用必须删除或改成真实证据文件。
  - 业务阶段必须直接调用已注册工具完成产物和审查。禁止创建 output/*.py 或其他临时脚本绕过业务工具，禁止用
    RunTestCases 代替业务阶段执行；需要复合审查时应扩展正式 inspector/checker 工具接口。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='design_complete_runtime_configs', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 记录主配置、增量配置以及可选评估配置的阶段数量和差异，然后 Complete。
  reference_files:
  - Guide_Doc/stages/10_design_complete_runtime_configs.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/.workflow/workflow_spec.yaml'
  - Guide_Doc/config_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/.workflow/config_specs/main.yaml'
  - '{TEST_WORKFLOW_ROOT}/.workflow/config_specs/inc.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: design_complete_runtime_configs
- name: generate_complete_runtime_configs
  desc: 生成并检查主流程、增量流程和可选评估配置
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 分别调用 WorkflowConfigGenerator，并明确传入 workflow_spec_path='.workflow/workflow_spec.yaml'，由 main spec 直接生成 config.yaml，由 inc spec 生成 config/inc.yaml；仅在 manifest 明确登记时才生成 eval.yaml。禁止先生成 config/default.yaml 再复制，也禁止生成 config/empty.yaml。
  - 确认主配置和增量配置均使用根级 stage，并分别覆盖 manifest 中对应 config 路径的阶段；main/inc 每个 task 的有效正文长度必须至少 100，Checker、
    reference_files、output_files 必须与 workflow_spec 的同名阶段完全一致；工具注册和 template_overwrite 仍由 config spec 提供。
  - 搜索全部生成配置，确认不存在 {TARGET}；使用 example 作为示例目标实际启动时，所有输入路径必须展开到 input/example/，所有输出与
    checker 路径必须展开到 output/example/。
  - 搜索全部生成配置的 task、reference_files、output_files 和 checker 参数，确认不存在 .//workflow/、./workflow/
    或 workflow/ 父目录前缀；内部文件必须相对子工作流根目录引用。发现泄漏时回到 .workflow/config_specs 修正后重新调用生成器，
    不得只手工修改最终 config.yaml。
  - 分别调用 WorkflowArtifactInspector(action='yaml_summary', path='config.yaml') 和 path='config/inc.yaml'，以解析结果确认根类型为 mapping、stage 容器为 list、阶段数量和名称符合 workflow_spec；禁止为判断 YAML list/dict 另写临时脚本或基于文本缩进猜测。
  - 调用 Check 前按 config.yaml、config/inc.yaml、可选 eval.yaml 的顺序逐个审查；每批使用 WorkflowArtifactInspector 的 YAML 摘要和当前配置中必要的阶段片段，逐阶段审查 reference_files。静态引用必须是已存在文件或 manifest 中明确规划的固定交付文件；运行时输入必须与 runtime_contract 中 type=file 的精确相对路径一致；派生引用必须能在 .workflow/workflow_spec.yaml 中定位到严格前序阶段的同名 output_files。将“引用、类别、声明位置或生产阶段、审查结论”写入本阶段规划记录；后续配置只读取此前审查记录摘要，发现目录、未知占位符、当前/后续阶段产物、拼错路径或无法证明的引用时，必须先修正权威 workflow_spec/config spec 并重新生成。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='generate_complete_runtime_configs', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 运行配置语法检查并记录结果，然后 Complete。
  reference_files:
  - Guide_Doc/stages/11_generate_complete_runtime_configs.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/.workflow/config_specs/main.yaml'
  - '{TEST_WORKFLOW_ROOT}/.workflow/config_specs/inc.yaml'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - Guide_Doc/config_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - '{TEST_WORKFLOW_ROOT}/config/inc.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: generate_complete_runtime_configs
  - name: runtime_config_reference_audit
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowRuntimeConfigAuditChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
- name: design_all_business_tool_specs
  desc: 为需求清单中的全部业务工具设计 specs 和测试
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 读取 requirements_manifest.required_tools 和每个业务阶段的输入输出，建立按依赖排序的单工具队列。每批默认只处理一个工具，只读取当前工具直接相关的阶段输入输出和需求片段；完成 spec、fixture 与简短摘要后再处理下一工具，禁止一次读取全部工具的细节、fixture 或未来源码。
  - 为当前批 required_tool 创建 .workflow/tool_specs/<name>.yaml；每个 spec 必须包含正向、边界和失败测试，禁止只保留
    <smoke_tool>。expected.ok=true 的测试输入夹具必须放在 .workflow/tool_tests/cases/，禁止创建根目录 examples/，禁止依赖会在发布清理中删除的
    output/、reports/ 或 .workflow/logs/。
  - 路径必须按调用边界区分：写入子工作流 spec/config 的路径保持 .workflow/... 或 output/...，但当前外层 Builder Agent
    调用 ReadTextFile、PathList、GetFileInfo、RunTestCases 等工具时，必须使用 {TEST_WORKFLOW_ROOT}/.workflow/... 或
    {TEST_WORKFLOW_ROOT}/output/...；禁止把子工作流相对路径直接交给外层工具。
  - 业务工具测试由 .workflow/tool_specs/*.yaml 驱动，必须在 {TEST_WORKFLOW_ROOT} 内运行 make check_tool_specs 和 make test_tools；只在全部 spec 写完后各运行一次，并只读取汇总、失败工具名和必要失败片段，禁止逐份预读全部 fixture。不得虚构 test_tool_checks.py，也不得用外层 RunTestCases/pytest 代替 tool_direct_runner。
  - 会创建或修改文件的测试，其输出路径必须放在 output/tool_tests/ 下；不得把输出写回只读的 docs/、tools/ 或
    .workflow/tool_tests/cases/ 输入夹具目录，以保证 direct 和 MCP 两种运行方式一致。
  - 每个业务工具的正向测试必须覆盖需求中声明的核心能力，而不是只验证返回结构。例如声明支持图片、表格、页码、格式转换或协议解析时，spec
    必须提供包含这些特性的夹具，并在 data_required_keys 或后续 inspector 中验证真实产物。
  - 工具至少覆盖需求解析中要求的 为 requirements_manifest.required_tools 中列出的全部业务工具设计 specs能力。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='design_all_business_tool_specs', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 运行 make check_tool_specs，修复全部协议错误后 Complete。
  reference_files:
  - Guide_Doc/stages/12_design_all_business_tool_specs.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - Guide_Doc/tool_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: design_all_business_tool_specs
- name: generate_all_business_tools
  desc: 批量生成、注册全部业务工具
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 用 PathList 仅枚举 .workflow/tool_specs 的文件名，并按依赖关系将工具拆为每批一个工具的顺序队列；不得在同一轮读取全部
    spec、源码、fixture、测试 runner、Makefile、output 或旧日志。每批只读取该工具的 spec、生成源码和最多一个正例及一个反例
    fixture；其余 fixture 由后续 make test_tools 执行，不得逐份全文读取。
  - 对当前批次调用一次 WorkflowToolGenerator(existing_policy='create_only') 根据尚无实现的业务 spec 生成工具，不得覆盖 smoke
    阶段已经实现的源码；生成器出现 skipped 时必须读取当前工具的现有实现并继续使用，不得改用 force_replace。只有带生成状态且
    摘要未变化的纯骨架才允许 refresh_scaffold。每个批次完成真实业务实现、专属 fixture 调整和简短完成摘要后，再开始下一工具；
    后续批次禁止重新读取已完成工具的源码或 fixture。
  - 确认当前批次工具具有实现、spec 和 config 注册；读取生成代码检查路径安全、统一返回结构以及需求声明的领域库调用和核心行为。
    如果 from_spec 仅生成通用骨架，必须在当前批次补齐实际业务逻辑，并同步增强该工具测试后再继续。tool_direct_runner.py、
    tool_static_checker.py、Makefile、output 目录和任何旧测试日志只能在下一阶段的全量测试中按需读取。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='generate_all_business_tools', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 运行 make check_tools 和 make test_tools，修复后 Complete。
  reference_files:
  - Guide_Doc/stages/13_generate_all_business_tools.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: generate_all_business_tools
- name: run_full_tool_test_suite
  desc: 执行全部工具静态、direct 和真实 MCP 测试
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 运行 make check_tool_specs、make check_tools、make test_tools 和 make test_mcp。
  - 【硬性约束】本阶段严禁在 {TEST_WORKFLOW_ROOT} 下启动任何 TUI 会话（禁止 make run_tui、make run、make tmux
    或任何 --tui 参数）。子 UCAgent 必须由 make test_mcp 以 headless 模式启动。TUI 会造成 Ctrl+C 冲突和文件权限残留。
  - 禁止重写、替换或手写 {TEST_WORKFLOW_ROOT}/.workflow/tool_tests/run_mcp_tests.py；该文件必须保持由 WFB
    mcp_tool_test_runner 模板生成的 streamable HTTP 客户端实现，必须使用 mcp.client.streamable_http.streamablehttp_client
    和 mcp.ClientSession。若 make test_mcp 失败，只能修工具 spec、工具实现、adapter 注册或环境端口问题；不得改成
    urllib、JSON-RPC POST /mcp、SSE 或自建 mcp_sse_server.py。
  - 读取 direct 和 MCP 日志的汇总、每个工具的 PASS/FAIL 行及必要失败片段，逐个确认 requirements_manifest.required_tools 被发现并真实调用成功；不能只看命令退出码，也不得为了复核通过项全文读取 fixture、工具源码、runner 或旧日志。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='run_full_tool_test_suite', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 确认没有残留子 UCAgent、端口占用和只读权限，然后 Complete。
  reference_files:
  - Guide_Doc/stages/14_run_full_tool_test_suite.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  # WorkflowMCPToolIntegrationChecker generates the MCP evidence itself.
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: run_full_tool_test_suite
  - name: full_mcp_tool_integration_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowMCPToolIntegrationChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      required_tools_file: '{WFGEN_DIR}/requirements_manifest.yaml'
      run_test: true
- name: design_all_document_specs
  desc: 为全部业务阶段设计 GuideDoc 与用户文档 specs
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 先读取 requirements_manifest.required_guidedocs、required_user_docs、required_tools、required_checkers、config.yaml 和 {WFGEN_DIR}/guidedoc_spec_schema.yaml，建立每批最多 3 份文档的队列；当前批只读取对应阶段名称、注册摘要和输出契约，完成 spec 与覆盖摘要后再进入下一批，禁止重复全文读取已完成文档的设计信息。
  - 为当前批 required_guidedoc 和 required_user_doc 创建单一 YAML 文档 spec；使用 document_type、title、output、sections 和可选 operation_contract。guide_doc 输出到 Guide_Doc/ 并注册，user_doc 输出到 docs/ 且不得注册。
  - required_guidedoc 中的 stage/stages/scope 是文档覆盖契约。每个非豁免业务阶段必须被至少一份 GuideDoc 覆盖；
    对复杂步骤要生成独立的阶段文档，例如 Guide_Doc/<stage_name>.md，而不是把所有步骤塞进 operation.md。
  - 每份 GuideDoc 必须包含 Purpose、Inputs、Outputs、Usage、Execution、Checks、Failure Recovery。只有 operation_contract=true 的操作文档强制包含 TARGET、input/<TARGET>/、input/example、output/、make check_example 和 make run，技术文档不得机械重复快速启动内容。
  - 固定生成 docs/README.md、docs/01快速启动.md、docs/02输入输出.md、docs/03步骤及检查.md、docs/04开发者文档-tools.md、docs/05开发者文档-checkers.md，并按需求增加其他用户文档。快速启动和输入输出文档必须说明 make configure、make configure-check、setup.py 非交互参数、本机配置位置及敏感值不落盘规则。每份 docs 文档至少 200 个有效正文字符。
  - 本阶段只设计开发者文档的覆盖结构和源码映射。docs/04开发者文档-tools.md 必须覆盖 manifest 业务工具与 config.tools.GeneratedTools 中全部启用工具（包括 run_command_tool），docs/05开发者文档-checkers.md 必须覆盖 manifest.required_checkers 与 .workflow/workflow_spec.yaml.checkers 实际注册项的并集。按每批最多 3 个组件建立准确名称的独立标题和至少 100 个有效正文字符的设计摘要；本阶段只读注册摘要和 spec，不读取全部实现源码、fixture 或 runner，真实代码分析留给下一阶段。
  - 每个组件设计摘要必须基于实际注册信息，原样写出实现相对路径、class_name 和 method，并规划下一阶段需要说明的关键逻辑、输入输出、主要分支、异常处理、扩展点、测试和修改影响。本阶段不要求逐字源码代码块，也不要求把最终每组件 300 字正文全部提前写入 spec；这些硬约束在下一阶段读取最终源码、完善 spec 并生成 Markdown 后统一验收。
  - 调用 Check 前按设计结构自审。guidedoc_spec_check 只验证文档覆盖、组件独立章节、至少 100 个有效正文字符以及准确的实现路径/class_name/method 映射；不得在本阶段重复执行最终文档的逐字源码、十类标签和每组件 300 字验收。
  - Inputs 必须准确区分原始输入、可选资源和工作流派生信息。不得要求用户填写应由阶段生成的结构、分析结果、设计参数或中间产物；Execution 必须说明工作流如何从原始输入产生这些结果。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='design_all_document_specs', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 确认每个业务阶段引用对应 GuideDoc，不得只生成 overview.md/operation.md，然后 Complete。
  reference_files:
  - Guide_Doc/stages/15_design_all_document_specs.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{WFGEN_DIR}/guidedoc_spec_schema.yaml'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  - Guide_Doc/guidedoc_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: design_all_document_specs
  - name: guidedoc_spec_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowGuideDocSpecChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
- name: generate_all_documentation_and_dependencies
  desc: 批量生成、注册和验证全部文档与依赖清单
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 先建立组件完成清单，并按每批不超过 3-4 个工具或 Checker 的小批次处理。每批只读取本批组件的真实注册信息、实现源码和测试 fixture，立即把该批的完整章节写入对应的 `user_dev_tools.yaml` 或 `user_dev_checkers.yaml`；下一批开始前只读取 spec 中的标题和完成状态，不得重新读取已完成批次的源码。
  - 每个组件章节必须包含准确 manifest 名称、实现相对路径、class_name、method、关键代码分析、调用路径、字段、分支、异常、扩展点和测试分析；正文以至少 500 个有效中文字符为目标并满足 300 个有效正文字符硬下限。代码围栏必须逐字复制真实实现中连续 2-6 行非注释有效源码，去除空白后不少于 40 字符；围栏内部不得跳过任何方法、装饰器、注释或语句。不允许伪代码、省略号、凭 spec 猜测、改写源码或跨不相邻行拼接。
  - 只有在两个开发者文档 spec 的全部组件章节都写完并从 spec 自身核对完成清单后，才允许调用一次 `WorkflowGuideDocGenerator(workflow_root='{TEST_WORKFLOW_ROOT}', spec_paths=[全部受影响 spec], update_config=true)` 生成全部 Guide_Doc 和 docs 文档；禁止按组件或按单份文档调用生成器。生成器会写入 `GENERATED-FROM` 和 `SPEC-SHA256`，只把 Guide_Doc 注册进 config。
  - 根据 required_python_dependencies 生成 requirements.txt；required_system_dependencies 以注释写明用途、版本要求和安装命令，UCAgent 等非 PyPI 前提也用注释说明。同步生成环境配置 GuideDoc，逐项解释 schema 扩展、setup.py 参数、受控区块、跨系统重新配置和故障恢复。
  - 首次生成完成后只运行一次 `make check_docs` 并读取完整结构化结果；不得在正常生成过程中按 spec 或按组件运行 Check。随后通过 WorkflowPlanAppender 追加本阶段记录，再调用 Check、记录 journal 和 Complete。若 Check 返回 `source_evidence_errors`、`stale_generated_documents` 或其他文档错误，只修正对应 spec，重新调用一次生成器，再重新运行一次 `make check_docs`；不得直接修改生成后的 Markdown，也不得重读和重写无关组件。
  reference_files:
  - Guide_Doc/stages/16_generate_all_documentation_and_dependencies.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - Guide_Doc/guidedoc_generation_guide.md
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/requirements.txt'
  - '{TEST_WORKFLOW_ROOT}/docs/04开发者文档-tools.md'
  - '{TEST_WORKFLOW_ROOT}/docs/05开发者文档-checkers.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: generate_all_documentation_and_dependencies
  - name: generated_guidedoc_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowGeneratedGuideDocChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      required_headings:
      - '## Purpose'
      - '## Inputs'
      - '## Outputs'
      - '## Usage'
      - '## Execution'
      - '## Checks'
      - '## Failure Recovery'
  - name: generated_user_docs_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowUserDocsChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
  - name: generated_dependency_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowDependencyChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
- name: generate_all_reusable_templates
  desc: 生成需求要求的全部可复用模板
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 读取 requirements_manifest.required_templates 和原始需求。
  - 为 requirements_manifest.required_templates 中列出的全部用户可复用模板路径生成文件；该列表为空时记录“需求未要求用户模板”并直接完成。禁止把 readme_basic、config_basic、guidedoc_operation 等 WorkflowBuilder 内部渲染标识符当成用户模板。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='generate_all_reusable_templates', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 模板使用需求规定的 DUT 占位符，内容必须可读且非空。模板只示范用户真正需要提供的原始输入，不得加入应由工作流生成的页数、逐项计划、分析结论、字体、配色、布局、资源绑定或其他派生字段；运行语法与结构检查后 Complete。
  reference_files:
  - Guide_Doc/stages/17_generate_all_reusable_templates.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: generate_all_reusable_templates
- name: complete_readme_and_makefile
  desc: 完善最终 README、Makefile 和运行脚本
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 根据 runtime_contract、需求和最终组件更新 README，必须说明如何通过 TARGET 选择具体目标、input/<TARGET>/ 必需文件、input/example/
    示例、output/ 输出、变量替换、主流程与增量流程、可选评估模式、测试、报告、故障恢复和迁移。
  - README 和 docs/01快速启动.md 必须明确每个输入是原始材料、可选资源还是配置，并说明哪些结构、分析和设计由工作流自动产生。不得通过示例或模板暗示用户需要预先完成工作流本身的职责。
  - 生成并完善 docs/01快速启动.md；内容必须以 input/example/ 为唯一快速开始示例，按顺序给出 make check、make check_example、make
    run TARGET=example，并明确输出位于 output/。禁止写入无法直接执行的占位命令。
  - 完善 Makefile，TARGET 默认值必须为空，必须保留 configure、configure-check 和 setup.py 受控环境区块，并包含 check_target、prepare_input、prepare_runtime 和 check_input；
    run/run_inc/run_tui 必须依赖 prepare_runtime；check_example 必须逐项校验 runtime_contract.required_input
    并验证 JSON 等结构化输入。用户输入不得被要求包含 data/__init__.py；UCAgent 运行包只能位于
    output/.runtime_targets/。Makefile 必须定义 WORKFLOW_WORKSPACE ?= $(CURDIR)，所有 UCAgent 启动命令必须使用
    $(UCAGENT) $(WORKFLOW_WORKSPACE) $(TARGET)，禁止使用 $(UCAGENT) ./ $(TARGET)。smoke 必须使用独立
    SMOKE_TARGET；requirements_manifest.required_make_targets 全部可用。
  - 确认 run/run_inc/run_tui/smoke 均通过 tools.mcp_adapters 动态传入 --ex-tools；运行结束时若
    .ucagent/ucagent_info.json 的 all_completed=true，Makefile 必须返回 0，即使 UCAgent 的 Exit 路径返回了中断状态。
  - 确认 tools/mcp_adapters.py 保持 WFB 模板契约。不能覆盖 BaseTool.run，不能注册 run 函数覆盖项；_run
    返回 json.dumps(result, ensure_ascii=False, sort_keys=True)，让 BaseTool 在直接 UCAgent 运行时包装成
    ToolMessage。
  - make check、test_tools 和 test_checkers 只能依赖源码、spec 以及 .workflow/*_tests/cases/
    下的持久测试夹具；禁止依赖会在发布清理中删除的 tmp、output、reports 或运行日志。所有临时脚本、run_checks 辅助文件和一次性中间结果只能放在根级 tmp/，禁止散落在工作流根目录、wfgen、tools 或 .workflow/。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='complete_readme_and_makefile', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 严格按照 docs/01快速启动.md 运行 bundled example，再运行 make help、make check 和安装检查，修复后 Complete。
  reference_files:
  - Guide_Doc/stages/18_complete_readme_and_makefile.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/README.md'
  - '{TEST_WORKFLOW_ROOT}/docs/01快速启动.md'
  - '{TEST_WORKFLOW_ROOT}/Makefile'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/README.md'
  - '{TEST_WORKFLOW_ROOT}/docs/01快速启动.md'
  - '{TEST_WORKFLOW_ROOT}/Makefile'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: complete_readme_and_makefile
- name: mark_feature_complete
  desc: 完成组件覆盖审查并标记 feature_complete
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 逐项比较 requirements_manifest 与阶段、工具、checker、Guide_Doc、模板、配置和 Makefile。
  - 只有全部组件已生成且确定性检查通过，才将 manifest.milestones.feature_complete 更新为 true。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='mark_feature_complete', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - release_ready 必须保持 false；记录剩余全量测试项后 Complete。
  reference_files:
  - Guide_Doc/stages/19_mark_feature_complete.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: mark_feature_complete
- name: verify_final_requirement_coverage
  desc: 执行最终需求覆盖检查并标记 release_ready
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 读取 requirements_manifest、确定性 checker 汇总和各测试命令的 PASS/FAIL 摘要，确认 smoke_ready、feature_complete 已为 true；不得全文读取全部 fixture、工具源码或完整历史日志。只有失败项才读取对应失败片段，并按组件小批次修复。
  - 运行最终需求覆盖检查；缺失阶段以 config/path.yaml:stage_name 报告，必须在对应配置的根级 stage 中修复。修复任何缺失 checker
    spec、工具、文档、模板、配置、Makefile 目标或交付物。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='verify_final_requirement_coverage', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 全部确定性覆盖检查通过后将 manifest.milestones.release_ready 更新为 true；该标记表示构建候选可迁移，不代替外层独立运行评估
    的完整运行验收。再次执行 Check 并 Complete。
  reference_files:
  - Guide_Doc/stages/20_verify_final_requirement_coverage.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/config.yaml'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: verify_final_requirement_coverage
  - name: final_requirement_coverage
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowRequirementCoverageChecker
    args:
      manifest_path: '{WFGEN_DIR}/requirements_manifest.yaml'
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      mode: final
- name: clean_release_candidate
  desc: 清理运行历史、缓存、日志和无效重复文件
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 在不删除最终源文件、spec、测试和交付模板的前提下，清理 .ucagent、__pycache__、.pytest_cache、.workflow/logs、output/
    下的运行产物以及错误重复的文档目录；使用 make clean 清空根级 tmp/ 的全部普通与隐藏内容，但必须保留空的 tmp/、output/、requirements.txt、完整 docs/ 和可运行的 input/example/。临时脚本和一次性检查文件不得进入迁移包。
  - 确认最终工程不包含绝对路径、临时迁移部署目录、本次测试产生的运行日志和根目录 examples/；不得删除 .workflow/*_tests/cases 下作为测试输入的夹具日志。
  - 清理后调用 WorkflowArtifactInspector(action='release_tree')，按 acceptance_rules.yaml 核对必需公开文件、目录和运行产物；若报告缺失或残留，修正源工程后重新检查，禁止复制一份硬编码清单到临时脚本。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='clean_release_candidate', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 重新运行静态 make check 和最终需求覆盖检查，确认清理没有破坏 input/output 运行契约与发布候选，然后 Complete。
  reference_files:
  - Guide_Doc/stages/21_clean_release_candidate.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/.install/README.md'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: clean_release_candidate
- name: prepare_and_verify_migration_packages
  desc: 准备并验证洁净的全量与部分迁移包
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 确认 requirements_manifest.milestones.release_ready=true 后，运行 python install.py
    --prepare both 和 python install.py --check。
  - 确认 full 包包含最终工具、checker、spec、测试、Guide_Doc、模板和配置；partial 包排除工具/checker及其 spec/test。
  - 确认两种包都不包含 .ucagent、.git、缓存、运行日志、output/ 和 reports/ 下的运行文件、旧 GuideDocs、.install/packages
    嵌套内容；同时确认 requirements.txt、完整 docs/、可运行 input/example/、acceptance_rules 要求的空 output/ 等目录和测试夹具日志被保留。
  - 调用 WorkflowArtifactInspector(action='migration_manifest') 比对 manifest 声明与 full/partial 真实文件树；再以 acceptance_rules.yaml 核对两种模式的必需公开文件和目录。禁止复制 checker 的文件清单编写一次性比较脚本。
  - 在生成包后立即完成 full/partial 边界预检：partial 不得包含 PARTIAL_EXCLUDES 中的 tools、checkers、tool_specs、tool_tests、checker_specs、checker_tests；full/partial 都必须包含 acceptance_rules 声明的必需文件和目录。若预检失败，先修正本阶段的打包逻辑并重新 package/check_package，禁止把问题拖到下一阶段。
  - 诊断材料和部署试验只能暂存于工作区根级 tmp/；诊断完成后必须删除本阶段创建的全部临时脚本、日志和部署目录，并在首次调用 Check 前用 PathList(tmp) 确认 tmp/ 为空。失败重试必须复用或覆盖已有诊断材料，不得不断累积未清理的临时文件；禁止让任何临时文件进入 workflow、.install 或迁移包。
  - 分别部署 full 和 partial 到临时目录并进行文件级验证；本阶段不要启动 UCAgent。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='prepare_and_verify_migration_packages', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 记录包文件数量和洁净度结果，然后 Complete。
  reference_files:
  - Guide_Doc/stages/22_prepare_and_verify_migration_packages.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{WFGEN_DIR}/requirements_manifest.yaml'
  - '{TEST_WORKFLOW_ROOT}/install.py'
  - '{TEST_WORKFLOW_ROOT}/.install/README.md'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/.install/manifest.json'
  - '{TEST_WORKFLOW_ROOT}/.install/packages/full/install.py'
  - '{TEST_WORKFLOW_ROOT}/.install/packages/partial/install.py'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: prepare_and_verify_migration_packages
  - name: generated_migration_package_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowMigrationPackageChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      run_deploy_test: false
- name: verify_migrated_release
  desc: 验证迁移后的发布包仍满足交付边界
  task:
  - 第0步：读取本阶段静态指导文档和配置列出的全部 reference_files；该指导文档由维护者维护，运行中禁止修改。
  - 读取 .install/manifest.json，确认 full/partial 包边界和洁净度。
  - 调用 WorkflowArtifactInspector(action='migration_manifest') 获取声明与真实包树一致性的结构化证据；YAML 或 manifest 类型判断必须使用解析结果，禁止用子串、缩进或临时脚本猜测。
  - 在临时 full 和 partial 部署目录执行 make check_example，并核对 docs/01快速启动.md 与 requirements.txt；full 还必须执行 make
    check、静态安装检查、需求文件检查和 input/output 运行契约检查；partial 不启动 UCAgent。
  - 本阶段是只读验收阶段：不得修改 install.py、.install/README.md、acceptance_rules.yaml、迁移包或前序阶段产物；发现边界或契约问题时记录结构化失败证据，返回 Stage 22 修复后重跑。
  - 在首次调用 Check 之前，必须先完成本阶段业务工作并通过独立命令取得真实验证证据，再调用 WorkflowPlanAppender(plan_path='{WFGEN_DIR}/workflow_implementation_plan.md', stage_name='verify_migrated_release', stage_record='<包含五个必需三级标题且正文充分的本阶段记录>') 追加规划；追加成功后禁止再修改前序记录或当前记录，随后才允许调用 Check。禁止用 EditTextFile 的 write/replace 模式覆盖规划。
  - 确认源工程和迁移包均无运行中子 UCAgent，记录最终交付路径并 Complete。
  reference_files:
  - Guide_Doc/stages/23_verify_migrated_release.md
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  - '{TEST_WORKFLOW_ROOT}/.install/manifest.json'
  output_files:
  - '{WFGEN_DIR}/workflow_implementation_plan.md'
  checker:
  - name: living_plan_update_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowLivingPlanChecker
    args:
      plan_path: '{WFGEN_DIR}/workflow_implementation_plan.md'
      current_stage: verify_migrated_release
  - name: final_migration_package_check
    clss: examples.workflow_builder.workflow_builder.uc_checkers.WorkflowMigrationPackageChecker
    args:
      workflow_root: '{TEST_WORKFLOW_ROOT}'
      run_deploy_test: true
