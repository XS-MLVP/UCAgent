<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作流构建与评估控制台</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">WB</div>
      <div>
        <h1>工作流构建与评估控制台</h1>
        <p id="generatedAt">正在读取评估状态</p>
      </div>
    </div>
    <nav class="global-tabs" aria-label="控制台模块" role="tablist">
      <button class="global-tab active" id="reviewTab" data-system-mode="review" role="tab" aria-selected="true" aria-controls="reviewSystem"><i data-lucide="clipboard-check"></i>评估与审批</button>
      <button class="global-tab" id="designTab" data-system-mode="planning" role="tab" aria-selected="false" aria-controls="planningSystem"><i data-lucide="notebook-tabs"></i>构建设计</button>
    </nav>
    <div class="top-actions">
      <button class="icon-button" id="refreshButton" title="刷新报告" aria-label="刷新报告">
        <i data-lucide="refresh-cw"></i>
      </button>
      <button class="primary-button" id="newSuggestionButton">
        <i data-lucide="message-square-plus"></i>
        新建
      </button>
    </div>
  </header>

  <main class="console-main">
  <section class="app-shell" id="reviewSystem" role="tabpanel" aria-labelledby="reviewTab">
    <aside class="sidebar">
      <nav aria-label="报告筛选">
        <button class="nav-item active" data-report="all">
          <i data-lucide="layout-list"></i><span>全部问题</span><strong id="countAll">0</strong>
        </button>
        <button class="nav-item" data-report="tools">
          <i data-lucide="wrench"></i><span>工具</span><strong id="countTools">0</strong>
        </button>
        <button class="nav-item" data-report="checkers">
          <i data-lucide="shield-check"></i><span>Checker</span><strong id="countCheckers">0</strong>
        </button>
        <button class="nav-item" data-report="flow">
          <i data-lucide="git-branch"></i><span>流程</span><strong id="countFlow">0</strong>
        </button>
        <button class="nav-item" data-report="env">
          <i data-lucide="terminal"></i><span>环境</span><strong id="countEnv">0</strong>
        </button>
        <button class="nav-item" data-report="run">
          <i data-lucide="activity"></i><span>运行</span><strong id="countRun">0</strong>
        </button>
        <button class="nav-item" data-report="user">
          <i data-lucide="messages-square"></i><span>用户条目</span><strong id="countUser">0</strong>
        </button>
        <button class="nav-item" data-report="repairs">
          <i data-lucide="history"></i><span>版本管理</span><strong id="countRepairs">0</strong>
        </button>
      </nav>
      <section class="severity-filter">
        <h2>严重程度</h2>
        <label><input type="checkbox" value="critical" checked><span class="severity-dot critical"></span>Critical</label>
        <label><input type="checkbox" value="high" checked><span class="severity-dot high"></span>High</label>
        <label><input type="checkbox" value="medium" checked><span class="severity-dot medium"></span>Medium</label>
        <label><input type="checkbox" value="low" checked><span class="severity-dot low"></span>Low</label>
        <label><input type="checkbox" value="info" checked><span class="severity-dot info"></span>Info</label>
        <label><input type="checkbox" value="user" checked><span class="severity-dot user"></span>用户条目</label>
      </section>
    </aside>

    <section class="workspace">
      <div class="summary-strip" id="summaryStrip"></div>
      <div class="report-status-strip" id="reportStatus" aria-label="最新评估运行状态"></div>
      <div class="list-toolbar">
        <div>
          <h2 id="viewTitle">全部开放问题</h2>
          <p id="viewSubtitle">按严重程度排序，选择一项查看证据</p>
        </div>
        <div class="search-wrap">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="搜索标题、目标文件或ID">
        </div>
        <label class="decision-filter">
          <span>审批状态</span>
          <select id="decisionFilter" aria-label="按审批状态筛选">
            <option value="all">全部</option>
            <option value="unapproved">未审批</option>
            <option value="decided">已审批</option>
            <option value="approved">已批准</option>
            <option value="deferred">已暂缓</option>
            <option value="rejected">已拒绝</option>
          </select>
        </label>
      </div>
      <div class="batch-toolbar" id="batchToolbar">
        <label><input type="checkbox" id="selectVisible">选择当前筛选结果</label>
        <span id="selectedCount">已选择 0 项</span>
        <button class="text-button" id="clearSelectionButton" disabled>清除选择</button>
        <button class="secondary-button" id="bulkDecisionButton" disabled>
          <i data-lucide="list-checks"></i>批量审批
        </button>
        <button class="danger-button" id="bulkDeleteButton" disabled>
          <i data-lucide="trash-2"></i><span id="bulkDeleteLabel">批量删除</span>
        </button>
      </div>
      <div class="content-grid">
        <div class="issue-list" id="issueList" role="list"></div>
        <article class="detail-panel" id="detailPanel">
          <div class="empty-state">
            <i data-lucide="mouse-pointer-2"></i>
          <h3>选择一个条目</h3>
          <p>查看问题证据或增量部署版本。</p>
          </div>
        </article>
      </div>
    </section>
  </section>

  <section class="planning-system" id="planningSystem" role="tabpanel" aria-labelledby="designTab" hidden>
    <header class="planning-header">
      <div>
        <span class="eyebrow">构建设计</span>
        <h2>规划、需求与构建产物</h2>
        <p>监控构建规划、增量修复记录、<code>workflow/</code> 文件结构和根 UCAgent 进度。</p>
      </div>
      <div class="planning-header-actions">
        <span class="draft-count" id="designDraftCount" hidden>0 个草稿</span>
        <button class="secondary-button" id="cancelDesignEditsButton" hidden><i data-lucide="x"></i>取消修改</button>
        <button class="secondary-button" id="validateDesignEditsButton" hidden><i data-lucide="shield-check"></i>校验草稿</button>
        <button class="primary-button" id="saveDesignEditsButton" hidden><i data-lucide="save"></i>保存修改</button>
        <label class="planning-search"><i data-lucide="search"></i><input id="planningSearchInput" type="search" placeholder="筛选监控文件"></label>
        <button class="icon-button planning-refresh" id="refreshPlanningButton" title="刷新设计监控" aria-label="刷新设计监控"><i data-lucide="refresh-cw"></i></button>
      </div>
    </header>
    <div class="planning-layout">
      <aside class="planning-sidebar">
        <p class="planning-nav-title">构建规划</p>
        <nav id="planningFileNav" aria-label="构建规划文件"></nav>
        <p class="planning-nav-title">增量修复</p>
        <nav id="incrementalFileNav" aria-label="增量修复文件"></nav>
        <p class="planning-nav-title">workflow 结构</p>
        <nav id="workflowTreeNav" class="workflow-tree" aria-label="workflow 文件结构"></nav>
      </aside>
      <section class="planning-content" id="planningContent" aria-live="polite"></section>
      <aside class="ucagent-progress" id="ucagentProgress" aria-label="UCAgent 当前进度"></aside>
    </div>
  </section>
  </main>

  <dialog id="decisionDialog">
    <form method="dialog" id="decisionForm">
      <div class="dialog-header">
        <div>
          <span class="eyebrow">记录用户决定</span>
          <h2 id="decisionTitle">审批问题</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <input type="hidden" id="decisionItemId">
      <fieldset class="segmented">
        <label><input type="radio" name="decision" value="approved"><span>批准</span></label>
        <label><input type="radio" name="decision" value="rejected"><span>拒绝</span></label>
        <label><input type="radio" name="decision" value="deferred"><span>暂缓</span></label>
      </fieldset>
      <label class="field">
        <span>理由</span>
        <textarea id="decisionReason" rows="5" required placeholder="说明批准范围、拒绝依据或暂缓原因"></textarea>
      </label>
      <p class="form-error" id="decisionError"></p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">取消</button>
        <button class="primary-button" id="saveDecisionButton" value="default">
          <i data-lucide="save"></i>保存决定
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="bulkDecisionDialog">
    <form method="dialog" id="bulkDecisionForm">
      <div class="dialog-header">
        <div>
          <span class="eyebrow">批量记录用户决定</span>
          <h2 id="bulkDecisionTitle">审批所选问题</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <fieldset class="segmented">
        <label><input type="radio" name="bulkDecision" value="approved" checked><span>批准</span></label>
        <label><input type="radio" name="bulkDecision" value="rejected"><span>拒绝</span></label>
        <label><input type="radio" name="bulkDecision" value="deferred"><span>暂缓</span></label>
      </fieldset>
      <label class="field">
        <span>共同理由</span>
        <textarea id="bulkDecisionReason" rows="5" required></textarea>
      </label>
      <p class="form-error" id="bulkDecisionError"></p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">取消</button>
        <button class="primary-button" id="saveBulkDecisionButton" value="default">
          <i data-lucide="save"></i>保存批量决定
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="suggestionDialog">
    <form method="dialog" id="suggestionForm">
      <div class="dialog-header">
        <div>
          <span class="eyebrow">用户输入</span>
          <h2>添加用户条目</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <label class="field">
        <span>条目类型</span>
        <select id="suggestionKind">
          <option value="issue">问题说明</option>
          <option value="suggestion" selected>改进建议</option>
          <option value="context">补充信息</option>
        </select>
      </label>
      <label class="field"><span>标题</span><input id="suggestionTitle" required maxlength="160"></label>
      <label class="field">
        <span>优先级</span>
        <select id="suggestionPriority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
          <option value="critical">Critical</option>
        </select>
      </label>
      <label class="field">
        <span>建议内容</span>
        <textarea id="suggestionDescription" rows="7" required placeholder="描述问题现象、改进建议、依据或期望结果"></textarea>
      </label>
      <p class="form-error" id="suggestionError"></p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">取消</button>
        <button class="primary-button" id="saveSuggestionButton" value="default">
          <i data-lucide="plus"></i>添加条目
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDialog">
    <form method="dialog" id="historyForm">
      <div class="dialog-header">
        <div>
          <span class="eyebrow">历史版本管理</span>
          <h2 id="historyTitle">恢复历史版本</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <input type="hidden" id="historyRepairId">
      <input type="hidden" id="historyAction">
      <p class="dialog-note" id="historyDescription"></p>
      <label class="field">
        <span>操作理由</span>
        <textarea id="historyReason" rows="5" required></textarea>
      </label>
      <p class="form-error" id="historyError"></p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">取消</button>
        <button class="primary-button" id="saveHistoryButton" value="default">
          <i data-lucide="save"></i><span id="historySubmitLabel">确认恢复</span>
        </button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
