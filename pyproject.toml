[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "UCAgent"
description = "UnityChip Verification Agent - AI-powered hardware verification tool"
authors = [
    {name = "XS-MLVP", email = "unitychip@bosc.ac.cn"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
readme = "README.en.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "langchain>=1.2.15",
    "langchain_community>=0.3.31",
    "openai>=1.109.1",
    "langgraph>=1.0.5",
    "langchain_openai>=1.1.6",
    "mem0ai>=0.1.118",
    "mcp>=2.3.0,<3.0",
    "psutil>=7.1.0",
    "langfuse>=3.9.1",
    "gitpython>=3.1.43",
    # UnityTest default-workflow runtime dependencies: the plugin ships as
    # framework package data, so its toffee test substrate installs with the
    # framework itself (装框架=能跑默认工作流).
    "pytoffee@git+https://gitlink.org.cn/XS-MLVP/toffee@master",
    "toffee-test@git+https://gitlink.org.cn/XS-MLVP/toffee-test@master",
    "textual>=7.3.0",
    "Jinja2>=3.1.6",
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    "aiohttp>=3.13.5,<4",
    "docker>=7.1.0",
    "kubernetes>=33.1.0",
    # UnityTest default-workflow waveform-analysis reader (see above).
    "wavekit>=0.7.0,<0.8.0",
    "pywellen>=0.25.7,<0.26",
    "pylibfst>=0.2.1,<0.3",
    "packaging>=24,<27",
    "PyYAML>=6.0,<7.0",
    "regex>=2024.11.6",
]
dynamic = ["version"]

[project.scripts]
ucagent = "ucagent.application.entry:main"

[project.urls]
Homepage = "https://github.com/XS-MLVP/UCAgent"

[tool.setuptools_scm]
fallback_version = "0.9.1"
version_file = "ucagent/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ucagent*"]
# The bundled workflow-plugin projects under ucagent/plugins/ carry their own
# src layouts and must never be discovered as ucagent subpackages (their code
# imports through the plugin manifest roots, not as ucagent.plugins.<P>.src.*).
exclude = [
    "ucagent.plugins.UnityTest*",
    "ucagent.plugins.Formal*",
    "ucagent.plugins.DesignWithPPA*",
    "ucagent.plugins.RTL2Spec*",
    "ucagent.plugins.ACT4*",
]

[tool.setuptools.package-data]
ucagent = [
    "**/*.bak",
    "**/*.css",
    "**/*.html",
    "**/*.ignore",
    "**/*.ini",
    "**/*.j2",
    "**/*.js",
    "**/*.json",
    "**/*.lock",
    "**/*.md",
    "**/*.patch",
    "**/*.rs",
    "scripts/surfer/LICENSE-EUPL-1.2.txt",
    "**/*.sucl",
    "**/*.sv",
    "**/*.svg",
    "**/*.tcl",
    "**/*.tcss",
    "**/*.toml",
    "**/*.wasm",
    "**/*.yaml",
]
# Built-in workflow bundled with the framework distribution: UnityTest. The
# project manifest and the full src tree (workflows, presets, templates,
# skills, docs) ship as package data; tests do not. The other plugin projects
# stay source-tree only and are distributed as their own packages. The key is quoted because the package name contains a
# dot; an unquoted `ucagent.plugins` would try to mutate the plain `ucagent`
# array above, which TOML forbids.
"ucagent.plugins" = [
    "UnityTest/ucagent-plugin.toml",
    "UnityTest/src/**/*",
]
