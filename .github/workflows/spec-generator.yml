name: spec-generator

on:
  pull_request:
    paths:
      - 'plugins/SpecGenerator/**'
      - 'ucagent/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/spec-generator.yml'
  push:
    paths:
      - 'plugins/SpecGenerator/**'
      - 'ucagent/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/spec-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the native architecture for macOS builds
        if: runner.os == 'macOS'
        # wavekit uses -march=native, which cannot target both universal2 architectures.
        run: printf 'ARCHFLAGS=-arch %s\n' "$(uname -m)" >> "$GITHUB_ENV"
      - name: Install UCAgent from this checkout
        working-directory: .
        run: python -m pip install .
      - name: Validate Spec Generator
        uses: ./plugins/SpecGenerator/ci
